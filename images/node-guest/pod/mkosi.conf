# Profile: pod
#
# Pod CVM image for C8s: an overlay on the worker profile that boots from a
# signed pod launch document and runs one assigned pod under a standalone
# kubelet, with no cluster to join. images/node-guest/build stacks it after
# the worker profile when C8S_PROFILE=pod; the worker's runtime, NRI plugin,
# boot gates and floor are reused, and this profile replaces what staging and
# starts them.
#
# Launch requirements: ../README.md, "Pod CVM image".
