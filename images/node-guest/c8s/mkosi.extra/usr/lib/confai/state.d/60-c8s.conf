# Directories this profile writes at runtime under confos's immutable root.
# Each is baked (the initrd only overlays directories that exist).
#
# rke2 writes its kubeconfig (rke2.yaml) and node/password here, and the
# pre-start units drop fragments into config.yaml.d (see the header of
# etc/rancher/rke2/config.yaml). The overlay also makes the baked
# config.yaml / psa-config.yaml / audit-policy.yaml root-shadowable, which
# changes nothing: a fragment in config.yaml.d already overrides them.
etc/rancher
# rke2 keeps containerd on the default CNI dirs and the bundled Cilium chart
# hostPath-mounts and populates both (conflist + plugin binaries); the dirs
# themselves are created by mkosi.sync.
etc/cni
opt/cni
# Authenticated launch staging writes the CDS endpoint and full server pins
# before containerd starts. The measured binary under /opt/nri stays read-only.
etc/nri
