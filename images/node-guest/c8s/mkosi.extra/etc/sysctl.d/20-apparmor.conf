# Overrides the apparmor package's /usr/lib/sysctl.d/10-apparmor.conf, which
# turns this on. With it on, the profile a runtime sets at exec is stacked
# with unconfined once the task has dropped CAP_MAC_OVERRIDE (Linux 6.18.60,
# upstream 08c2f7c8d4b1), so every RuntimeDefault container runs as
# cri-containerd.apparmor.d//&unconfined and containerd's peer= rules stop
# matching the container's own processes. The restriction only guards an
# unconfined, unprivileged task against switching into a more permissive
# loaded profile; this image loads no such profile (README, "AppArmor").
# apparmor-enforce.sh refuses to start RKE2 unless this value is in effect.
# The user-namespace restriction from 10-apparmor.conf stays on.
kernel.apparmor_restrict_unprivileged_unconfined = 0
