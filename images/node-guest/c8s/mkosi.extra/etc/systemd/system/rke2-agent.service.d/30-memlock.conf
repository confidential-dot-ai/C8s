# containerd runs as a child of rke2, and CRI pods get no process.rlimits,
# so every container inherits this unit's RLIMIT_MEMLOCK (systemd's default
# is 8M). Lift it so a workload can mlock its model weights; the pod's memory
# cgroup still bounds what it can pin.
[Service]
LimitMEMLOCK=infinity
