# The node image's launch staging: rke2-role.service authenticates the launch
# document and stages its role verdict, and nri-node-ip.service publishes the
# node address it names.
[Unit]
ConditionPathExists=|/run/confos/role-server
ConditionPathExists=|/run/confos/role-agent
Requires=rke2-role.service
After=rke2-role.service nri-node-ip.service
