# NVIDIA device plugin — makes passed-through GPUs schedulable as
# `nvidia.com/gpu` on the inner cluster. CDI end to end: the plugin discovers
# the driver files under CONTAINER_DRIVER_ROOT, writes its own CDI spec
# (k8s.device-plugin.nvidia.com/gpu) to /var/run/cdi, advertises the GPUs, and
# annotates each allocation with those devices; containerd 2.x (CDI on by
# default) injects them at pod creation — no nvidia-container-runtime wrapper
# anywhere. Pods never use the nvidia.com/gpu spec in /var/run/cdi/nvidia.yaml.
# So the mounts a GPU workload's allowlist entry pins are the ones this
# plugin's spec lists.
#
# kube-system placement is deliberate: PSA-exempt (privileged + hostPath to
# reach the driver root and /dev) and NRI-allowlist-exempt, so the plugin can
# start before CDS is up. Digest-pinned like every other baked component.
#
# The plugin discovers NVML/libcuda + the CDI hooks from the measured root's
# /usr and /etc, mounted at /driver-root/{usr,etc}. It MUST NOT put the guest
# lib dir on LD_LIBRARY_PATH — /usr/lib/x86_64-linux-gnu holds the guest's
# libc/libpthread, which would shadow the container's own and crash the Go
# runtime with
# "pthread_create failed: Invalid argument". Instead NVIDIA_DRIVER_ROOT=/ +
# CONTAINER_DRIVER_ROOT=/driver-root let the plugin's own resolver find the libs.
#
# DEVICE_LIST_STRATEGY=cdi-annotations (v0.19.3 does NOT accept cdi-cri).
# FAIL_ON_INIT_ERROR=false keeps GPU-less boots degraded-nothing.
#
# The GSP firmware mounts follow /sys/module/firmware_class/parameters/path,
# which nvcdi searches first. The c8s profile sets
# firmware_class.path=/usr/lib/firmware on the measured cmdline, so those mounts
# avoid the usrmerge /lib symlink that the node-root proof refuses.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: nvidia-device-plugin
    app.kubernetes.io/part-of: c8s-node-image
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-device-plugin
    spec:
      # Set by gpu-node-label.service only when an NVIDIA function is on the
      # PCI bus: FAIL_ON_INIT_ERROR cannot rescue a GPU-less node — the
      # cdi-annotations strategy still hard-fails CDI spec generation with no
      # driver, and the pod crashloops.
      nodeSelector:
        confidential.ai/gpu: "true"
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      # The measured base pins this container's whole launch, environment
      # included (c8s/image-policy.yaml.in), so of the Service variables it
      # takes only the kubernetes Service's.
      enableServiceLinks: false
      containers:
        - name: nvidia-device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.19.3@sha256:25cc340fe6fd53c101e16fc452f503e7a92c219c64a80ed5381784b522dbbf77
          # The image's entrypoint, spelled out because the measured base pins it.
          command: [nvidia-device-plugin]
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
            - name: DEVICE_LIST_STRATEGY
              value: cdi-annotations
            - name: DEVICE_ID_STRATEGY
              value: uuid
            - name: NVIDIA_DRIVER_ROOT
              value: /
            - name: CONTAINER_DRIVER_ROOT
              value: /driver-root
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            # No IPC discoverer, so no writable persistenced/fabric-manager
            # socket or /tmp/nvidia-mps mount. A secrets grant admits only
            # read-only files on the measured root (c8s #873, #935).
            - name: CDI_FEATURE_FLAGS
              value: disable-ipc-discoverer
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdi-dir
              mountPath: /var/run/cdi
            # The driver root is /usr + /etc only, with no usrmerge /lib
            # symlink. nvcdi mounts every firmware match across its search
            # paths, and anything reached through /lib/firmware can never be
            # a symlink-free node-root file for nri-image-policy.
            - name: driver-root-usr
              mountPath: /driver-root/usr
              readOnly: true
            - name: driver-root-etc
              mountPath: /driver-root/etc
              readOnly: true
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: cdi-dir
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: driver-root-usr
          hostPath:
            path: /usr
        - name: driver-root-etc
          hostPath:
            path: /etc
        - name: dev
          hostPath:
            path: /dev
