# Closes `kubectl exec`, `attach`, `port-forward` and ephemeral (debug)
# containers at the apiserver for every principal, the operator included.
# The kubelet's debugging handlers stay on (config.yaml) because they also
# back `kubectl logs`, which the log-reader credential exists for, and the
# kubelet has no logs-only switch. Admission runs after authorization, so no
# RBAC grant (short of system:masters, which cred-release never issues)
# reaches these subresources. No released credential can delete this
# policy: the operator role has no admission writes and confos-operator-scope
# denies them for every c8s:* group (see cred-release-rbac.yaml). The C8S_DEV=1
# build skips this AddOn via a `.skip` marker rendered by mkosi.sync, which
# changes the measurement. cred-release.service waits for both objects
# before it serves (psa-ready.sh).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: confos-pod-exec
spec:
  # Fail closed: an evaluation error denies the request. The constant
  # expression below cannot error.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  validations:
    - expression: "false"
      message: "pod exec, attach, port-forward and ephemeral containers are disabled on this node"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: confos-pod-exec
spec:
  policyName: confos-pod-exec
  validationActions:
    - Deny
