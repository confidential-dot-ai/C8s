# Baked into server/manifests so RKE2 grants the log-reader group
# cred-release.service issues (--log-cert-org) read access to pod logs and
# nothing else. `c8s get-kubeconfig --role log-reader` mints a credential in
# this group for someone who should see what runs on the node without holding
# the operator role. The built-in `view` role is not used: it also reads
# ConfigMaps. cred-release.service waits for this AddOn (mkosi.sync stages
# it as a guard reference copy) and requires the live objects to match it
# before it serves. RKE2 reapplies the AddOn on every boot (the cluster
# state is ephemeral); revocation is a launch-time decision, see
# docs/operator.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c8s-log-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-log-readers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c8s-log-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: c8s:log-readers
