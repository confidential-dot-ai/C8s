# Keeps the baked guards out of reach of every credential cred-release issues.
# Any principal in a `c8s:` group (c8s:node-operators, c8s:log-readers) is
# denied, in admission and regardless of RBAC, every write that could disable
# a guard or reach the host:
#   - anything in the privileged namespaces: kube-system and
#     c8s-system (labelled
#     privileged for the baked operator) and c8s-router (labelled privileged
#     for the router role, whose pods may serve ports of their own), where a
#     pod, a HelmChart, a service-account token secret or an edited DaemonSet
#     is root on the node; operators may delete core router Pods, write the
#     Opaque Secret c8s-system/pod-cvm-provider (the Pod CVM provider's
#     configuration) and delete the c8s-operator Pods so they restart on it;
#   - cluster-scoped RBAC, admission policies and webhooks, HelmChart/Addon
#     CRs (helm-controller applies them with full authority),
#     CustomResourceDefinitions (deleting one cascade-deletes every object of
#     that kind, the HelmCharts and Cilium policies included), storage
#     classes and PersistentVolumes (a hostPath or nodePath volume escapes
#     restricted PodSecurity through a PVC), API registration, CSR approval,
#     Node objects;
#   - the kubelet-proxy subresources (nodes/proxy, pods/proxy,
#     services/proxy) that reach the kubelet's exec endpoint without a
#     pods/exec admission check;
#   - Services that would take over a platform address that member pods'
#     packet filters let through by IP (the resolver 10.53.0.10, the
#     kube-state-metrics exit 10.53.0.11): spec.externalIPs, which kube-proxy
#     routes beside the real ClusterIP (CVE-2020-8554), and a ClusterIP in
#     10.53.0.0/24, the static band where the platform pins its addresses.
#     The apiserver allocates before admission and a server-side dry-run
#     presents the range's network address, 10.53.0.0, so that one stays
#     admitted (it is never a real ClusterIP).
# cred-release-rbac.yaml already omits all of this from the operator role;
# this policy is the second, independent layer so neither an RBAC mistake
# nor a tenant RoleBinding the operator writes can widen it. The match
# condition selects c8s:* principals once: every other principal (system
# components, the rke2 admin kubeconfig) leaves before any validation runs,
# and no validation can forget the principal test. Total by construction:
# every optional field read is guarded with has(), so failurePolicy Fail
# cannot deny on an evaluation error (a match-condition error would deny
# too). cred-release.service waits for both objects and proves the deny path
# with a server-side dry-run before it serves (psa-ready.sh).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: confos-operator-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE", "CONNECT"]
        resources: ["*/*"]
  matchConditions:
    - name: from-cred-release
      expression: "(has(request.userInfo.groups) ? request.userInfo.groups : []).exists(g, g.startsWith('c8s:'))"
  variables:
    - name: ns
      expression: "has(request.namespace) ? request.namespace : ''"
    - name: sub
      expression: "has(request.subResource) ? request.subResource : ''"
    - name: routerPodDeletion
      expression: >-
        has(request.userInfo.groups) && 'c8s:node-operators' in request.userInfo.groups &&
        has(request.operation) && request.operation == 'DELETE' &&
        variables.ns == 'c8s-router' && request.resource.group == '' &&
        request.resource.resource == 'pods' && variables.sub == '' &&
        oldObject != null && has(oldObject.metadata) && oldObject.metadata != null &&
        has(oldObject.metadata.namespace) && oldObject.metadata.namespace == 'c8s-router' &&
        has(oldObject.metadata.name) && oldObject.metadata.name != null && oldObject.metadata.name != ''
    # The Pod CVM provider's configuration, which an administrator supplies
    # after boot. Only the Opaque core Secret of that one name: a typed one,
    # such as a service-account token, would mint a credential.
    - name: providerSecretWrite
      expression: >-
        has(request.userInfo.groups) && 'c8s:node-operators' in request.userInfo.groups &&
        has(request.operation) && variables.ns == 'c8s-system' && request.resource.group == '' &&
        request.resource.resource == 'secrets' && variables.sub == '' &&
        ((request.operation == 'DELETE' && request.name == 'pod-cvm-provider') ||
        (request.operation in ['CREATE', 'UPDATE'] && object != null && has(object.metadata) && object.metadata != null &&
        has(object.metadata.name) && object.metadata.name == 'pod-cvm-provider' &&
        (request.operation == 'CREATE' || request.name == 'pod-cvm-provider') &&
        (!has(object.type) || object.type == 'Opaque')))
    # Deleting the operator's Pod makes its Deployment start one that reads
    # the provider configuration.
    - name: operatorPodDeletion
      expression: >-
        has(request.userInfo.groups) && 'c8s:node-operators' in request.userInfo.groups &&
        has(request.operation) && request.operation == 'DELETE' &&
        variables.ns == 'c8s-system' && request.resource.group == '' &&
        request.resource.resource == 'pods' && variables.sub == '' &&
        oldObject != null && has(oldObject.metadata) && oldObject.metadata != null &&
        has(oldObject.metadata.namespace) && oldObject.metadata.namespace == 'c8s-system' &&
        has(oldObject.metadata.labels) && oldObject.metadata.labels != null &&
        'app.kubernetes.io/name' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/name'] == 'c8s-operator' &&
        'app.kubernetes.io/instance' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/instance'] == 'c8s' &&
        'app.kubernetes.io/component' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/component'] == 'operator'
  validations:
    - expression: >-
        !(variables.ns in ['kube-system', 'c8s-system', 'c8s-router']) || variables.routerPodDeletion ||
        variables.providerSecretWrite || variables.operatorPodDeletion
      message: "c8s credentials may not write in privileged namespaces except operator deletion of core Pods in c8s-router, the pod-cvm-provider Secret and the operator's Pods in c8s-system"
    - expression: >-
        !(request.resource.group in ['admissionregistration.k8s.io', 'apiextensions.k8s.io', 'helm.cattle.io', 'k3s.cattle.io', 'storage.k8s.io', 'apiregistration.k8s.io', 'certificates.k8s.io'])
      message: "c8s credentials may not write admission policies, CustomResourceDefinitions, HelmCharts, storage classes, API registrations or certificate requests"
    - expression: "!(request.resource.group == 'rbac.authorization.k8s.io' && request.resource.resource in ['clusterroles', 'clusterrolebindings'])"
      message: "c8s credentials may not write cluster-scoped RBAC"
    - expression: "!(request.resource.group == '' && request.resource.resource in ['persistentvolumes', 'nodes'])"
      message: "c8s credentials may not write PersistentVolumes or Nodes"
    - expression: "!(request.resource.group == '' && request.resource.resource in ['nodes', 'pods', 'services'] && variables.sub == 'proxy')"
      message: "c8s credentials may not use the proxy subresources"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'services' && object != null &&
        has(object.spec) && has(object.spec.externalIPs) && size(object.spec.externalIPs) > 0)
      message: "c8s credentials may not set Service externalIPs"
    - expression: >-
        !(request.resource.group == '' && request.resource.resource == 'services' && object != null && has(object.spec) &&
        ((has(object.spec.clusterIP) && object.spec.clusterIP.startsWith('10.53.0.') && object.spec.clusterIP != '10.53.0.0') ||
        (has(object.spec.clusterIPs) && object.spec.clusterIPs.exists(ip, ip.startsWith('10.53.0.') && ip != '10.53.0.0'))))
      message: "c8s credentials may not claim a ClusterIP in the platform's static band (10.53.0.0/24)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: confos-operator-scope
spec:
  policyName: confos-operator-scope
  validationActions:
    - Deny
