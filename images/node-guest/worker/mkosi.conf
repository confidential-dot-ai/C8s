# Profile: worker
#
# Measured CVM worker image for C8s: kubelet and containerd join a Kubernetes
# control plane that runs outside every TEE. images/node-guest/build builds it
# with the kernel, GPU staging and module signing beside this profile.
#
# Launch requirements: ../README.md, with a worker document as the launch
# file.

[Content]
Packages=
    # The portmap CNI plugin execs iptables from the host for the router's
    # host ports.
    iptables
    # containerd-data-disk.sh.
    cryptsetup-bin
    e2fsprogs
    # apparmor-enforce.sh; containerd loads its container profile with it.
    apparmor
    # gpu-cc-enforce.service orders after time-sync.target.
    systemd-timesyncd
# firmware_class.path: the GSP firmware mounts real files on the measured root
# rather than paths through the usrmerge /lib symlink.
#
# snp_measurement_registers=off: the pinned attestation-rs verifies the raw SNP
# REPORT_DATA, and confos's kernel otherwise replaces it with its
# measurement-register commitment, so every SNP self-report fails with
# "report_data mismatch" and worker staging never completes. Drop it once
# attestation-rs checks the commitment (snp-kmr-v1).
KernelCommandLine=firmware_class.path=/usr/lib/firmware snp_measurement_registers=off

[Build]
# mkosi.sync: oras resolves image digests, curl fetches the pinned RKE2
# bundle and Helm, zstd unpacks the bundle.
ToolsTreePackages=oras,jq,curl,ca-certificates,zstd
