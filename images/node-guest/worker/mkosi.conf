# Profile: worker
#
# Measured CVM worker image for C8s: kubelet and containerd join a Kubernetes
# control plane that runs outside every TEE. images/node-guest/build builds it
# with C8S_PROFILE=worker on the node image's kernel, GPU staging and module
# signing, and pre-stages the c8s profile's host scripts it shares.
#
# Launch requirements: ../README.md, as for the node image, with a worker
# document as the launch file.

[Content]
Packages=
    # The portmap CNI plugin execs iptables from the host for the router's
    # host ports.
    iptables
    # containerd-data-disk.sh.
    cryptsetup-bin
    e2fsprogs
    # apparmor-enforce.sh; containerd loads its container profile with it.
    apparmor
    # gpu-cc-enforce.service orders after time-sync.target.
    systemd-timesyncd
# As the c8s profile's (its mkosi.conf says why).
KernelCommandLine=firmware_class.path=/usr/lib/firmware snp_measurement_registers=off

[Build]
# mkosi.sync: oras resolves image digests, curl fetches the pinned RKE2
# bundle and Helm, zstd unpacks the bundle.
ToolsTreePackages=oras,jq,curl,ca-certificates,zstd
