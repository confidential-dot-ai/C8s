# Sysctls a worker's kubelet and pod networking need.

# A Kubernetes node's panic and overcommit settings, in effect from boot. The
# kubelet writes the same values when it starts, so these hold before the
# first pod rather than from the kubelet's first second.
vm.panic_on_oom=0
vm.overcommit_memory=1
kernel.panic=10
kernel.panic_on_oops=1

# Generic k8s node tuning — bump inotify watches so kubelet/cilium/
# observability stacks don't run into "too many open files" errors at
# moderate pod counts.
fs.inotify.max_user_instances=8192
fs.inotify.max_user_watches=1048576

# Required for k8s pod networking with bridges (CNI bridge plugin).
net.bridge.bridge-nf-call-iptables=1
net.bridge.bridge-nf-call-ip6tables=1
net.ipv4.ip_forward=1
