# Overrides the apparmor package's /usr/lib/sysctl.d/10-apparmor.conf. On, a
# RuntimeDefault container runs as cri-containerd.apparmor.d//&unconfined and
# containerd's peer= rules stop matching it; images/node-guest/README.md,
# "Workload isolation", says why off is safe here. apparmor-enforce.sh refuses
# to start containerd unless this value is in effect. The user-namespace restriction
# from 10-apparmor.conf stays on.
kernel.apparmor_restrict_unprivileged_unconfined = 0
