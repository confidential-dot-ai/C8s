# Profile: cds
#
# Measured CVM image for the C8s trust root: the c8s binary, the attester
# composed from the attest profile around the attestation-api mkosi.sync
# stages, and nothing else — no RKE2, kubelet, container runtime or SSH server.
#
# The image holds no cluster-specific bytes. Every setting that varies per
# cluster reaches the CDS through the launch file the confos initrd binds to
# this VM's attestation and stages read-only, so one build serves every
# cluster on either TEE family (../README.md).
#
# The canonical entrypoint is images/cds-guest/build, which composes this
# profile with attest; mkosi.sync uses that profile's oras and jq.

[Content]
# snp_measurement_registers=off: the pinned attestation-rs verifies the raw SNP
# REPORT_DATA, and confos's kernel otherwise replaces it with its
# measurement-register commitment, so every SNP self-report fails with
# "report_data mismatch" and the boot self-check never passes. Drop it once
# attestation-rs checks the commitment (snp-kmr-v1).
KernelCommandLine=snp_measurement_registers=off
