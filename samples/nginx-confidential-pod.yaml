apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
      annotations:
        confidential.ai/cw: demo-nginx
    spec:
      # The node image enforces restricted PodSecurity in every tenant
      # namespace, `default` included. nginx-unprivileged runs non-root and
      # listens on 8080. In bare-metal mode the injected sidecar still mounts the
      # node's inventory socket as a hostPath, so deploy into a namespace the
      # operator has labelled privileged. The chart's deny-host-namespaces policy
      # restores Restricted semantics there and admits only that exact
      # read-only sidecar mount (docs/DEMO.md).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Confidential workloads reference images by digest: the guest pulls
          # this reference and admits it against the allowlist, and a tag names
          # whatever the registry serves at pull time. Bump with
          # `c8s allowlist inspect-image nginxinc/nginx-unprivileged:<tag>`.
          image: nginxinc/nginx-unprivileged@sha256:3af0c10d960cc2502427fe1219c52989d309e7d65596869c60a34fd2fa2406f0 # 1.30.5-alpine-slim
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
