# Applied after the pinned release's staging values. It keeps the gateway
# (pepper secret, gwstate volume, claims socket), one simulator worker and
# the router, and drops what the single test node cannot or need not run.
stagingValidation:
  enabled: false

# The release-selection and runtime ConfigMaps come from the operator's
# deployment tooling, not the chart.
runtimeConfig:
  enabled: false

scheduling:
  gatewayNodeName: c8s-node
  inferenceNodeName: c8s-node
  inferenceNodeNames: [c8s-node]
  routerNodeName: c8s-node

attestationReceipts:
  evidenceBaseUrl: https://c8s.local
  evidenceConnectHost: c8s-router.c8s-system.svc.cluster.local
  targets:
    - {target: gateway, workload: gateway, identity: gateway, url: http://127.0.0.1:8800}
    # The operator's headless Service: armtls-mesh does not intercept the
    # chart's sglang-router ClusterIP (C8s#933).
    - {target: sglang-router, workload: sglang-router, identity: sglang-router, url: http://c8s-sglang-router.confidential-inference.svc.cluster.local:8801}
    - {target: inference-worker-0, workload: inference-worker-0, identity: inference-worker-0, url: http://inference-worker-0-0.inference-workers:8802}

gateway:
  usage:
    enabled: false
  # Keys are minted through the signed admin API, with no admin VM.
  keyRegistry:
    mode: local

inference:
  replicas: 1
  attestedWorkloads: [inference-worker-0]
  resources:
    cpu: "1"
    memory: 4Gi
  model:
    volumeNames: [dsv4]
  # No model volume: the node has one volume disk, for gwstate.
  simulator:
    validateModelMount: false

router:
  resources:
    cpu: 250m
    memory: 512Mi

metricsCollector:
  enabled: false

kubeStateMetrics:
  enabled: false
