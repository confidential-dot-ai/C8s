# A plain workload with no C8s opt-in, adopted into the mesh by
# `c8s install --workload-ref web=adopted/deployment/web:8080 --upstream web`
# during the harness's upgrade step.
apiVersion: v1
kind: Namespace
metadata:
  name: adopted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: adopted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged@sha256:3af0c10d960cc2502427fe1219c52989d309e7d65596869c60a34fd2fa2406f0 # 1.30.5-alpine-slim
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
