# A plain workload with no C8s opt-in, adopted into the mesh by
# `c8s install --workload-ref web=adopted/deployment/web:8443 --upstream web`
# during the harness's upgrade step. The router reaches a workload backend only
# over TLS on its get-cert leaf (route policy B1), so once adopted the pod
# serves TLS on 8443 with the injected /etc/c8s/certs/tls.crt and tls.key.
# Before adoption there is no leaf, and it serves plaintext on 8080.
apiVersion: v1
kind: Namespace
metadata:
  name: adopted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: adopted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      # No c8s annotations: the webhook refuses injection detail annotations
      # without confidential.ai/cw, so the harness adds them after install
      # stamps the template (run.sh, "Workload adoption").
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged@sha256:3af0c10d960cc2502427fe1219c52989d309e7d65596869c60a34fd2fa2406f0 # 1.30.5-alpine-slim
          # Adoption injects c8s-cert-wait, which holds this container until
          # the leaf exists, so the leaf's presence selects TLS. The config is
          # written to /tmp rather than mounted: the only mount install's
          # allowlist entry admits is the injected cert volume.
          command: ["/bin/sh", "-c"]
          args:
            - |
              listen='listen 8080;'
              if [ -s /etc/c8s/certs/tls.crt ]; then
                listen='listen 8443 ssl; ssl_certificate /etc/c8s/certs/tls.crt; ssl_certificate_key /etc/c8s/certs/tls.key;'
              fi
              cat > /tmp/nginx.conf <<EOF
              pid /tmp/nginx.pid;
              events {}
              http {
                  include /etc/nginx/mime.types;
                  client_body_temp_path /tmp/client_temp;
                  proxy_temp_path /tmp/proxy_temp;
                  fastcgi_temp_path /tmp/fastcgi_temp;
                  uwsgi_temp_path /tmp/uwsgi_temp;
                  scgi_temp_path /tmp/scgi_temp;
                  server { $listen root /usr/share/nginx/html; }
              }
              EOF
              exec nginx -c /tmp/nginx.conf -g 'daemon off;'
          ports:
            - containerPort: 8080
            - containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
