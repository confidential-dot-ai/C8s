# Standalone kubelet for the pod role: no API server, one static pod.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
staticPodPath: /run/c8s-pod/manifests
fileCheckFrequency: 2s
syncFrequency: 10s
# Loopback only: pod-status (:8443, armTLS) is the one external reader of
# /pods. Anonymous AlwaysAllow is reachable from the root netns only; the pod
# netns has no route to the VM's loopback. That holds only while the CNI
# portmap keeps snat off: snat sets route_localnet on the pod bridge.
address: 127.0.0.1
port: 10250
readOnlyPort: 0
enableDebuggingHandlers: false
authentication: {anonymous: {enabled: true}, webhook: {enabled: false}}
authorization: {mode: AlwaysAllow}
cgroupDriver: systemd
containerRuntimeEndpoint: unix:///run/k3s/containerd/containerd.sock
clusterDNS: [10.53.0.10]
clusterDomain: cluster.local
maxPods: 1
failSwapOn: false
serializeImagePulls: false
