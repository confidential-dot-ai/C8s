# Separate from rke2-canal-config.yaml: this CRD arrives with the chart.
apiVersion: crd.projectcalico.org/v1
kind: FelixConfiguration
metadata:
  name: default
spec:
  # INVARIANT: Felix appends its hooks, so the node's own chain order is the
  # one the measured image set. A member pod's rules are in its own network
  # namespace, where the enforcer installs and verifies them.
  chainInsertMode: Append
  nftablesMode: Disabled
