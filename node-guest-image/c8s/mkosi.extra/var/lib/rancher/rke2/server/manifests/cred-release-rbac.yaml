# Baked into server/manifests so RKE2 grants the group cred-release.service
# issues (--cert-org) a bounded operator role through an ordinary, revocable
# RBAC binding. Never cluster-admin and never system:masters: the baked
# guards (confos-psa-level, confos-pod-exec, confos-operator-scope) exist to
# hold against the credential holder, so the holder must not be able to edit
# RBAC, admission policies, the privileged namespaces, or anything
# else that reaches the host. The role is an enumerated allowlist with no
# wildcards: a wildcard resource would match subresources such as
# nodes/proxy, which reach the kubelet's exec endpoint without passing the
# pods/exec admission check. confos-operator-scope (operator-scope-policy.yaml)
# re-checks the same exclusions in admission for every c8s:* group, so a
# mistake here does not become a hole. cred-release.service waits for this
# AddOn (mkosi.sync stages it as a guard reference copy) and requires the
# live objects to match it before it serves. RKE2 reapplies the AddOn on
# every boot (the cluster state is ephemeral); revocation is a launch-time
# decision, see docs/operator.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c8s-node-operator
rules:
  # Tenant workloads and their plumbing, cluster-wide; confos-operator-scope
  # denies every write in the privileged namespaces (kube-system,
  # local-path-storage, c8s-system).
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/eviction
      - services
      - endpoints
      - configmaps
      - secrets
      - serviceaccounts
      - namespaces
      - events
      - persistentvolumeclaims
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - podtemplates
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["confidential.ai"]
    resources: ["confidentialworkloads", "confidentialworkloads/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  # Namespaced RBAC for tenants. Without the bind and escalate verbs the
  # apiserver refuses any Role or RoleBinding that exceeds the operator's own
  # permissions, and cluster-scoped RBAC is read-only below.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  # Read-only views of the control plane and the guards themselves. CRDs are
  # baked at image build and deleting one cascade-deletes every object of
  # that kind (HelmCharts, Calico policies, ConfidentialWorkloads). No
  # nodes/proxy, nodes/log, pods/proxy or services/proxy; no exec, attach,
  # port-forward or ephemeral containers; no serviceaccounts/token; no
  # impersonation; no CSR approval; no podsecurityexemptions grant.
  - apiGroups: [""]
    resources: ["nodes", "nodes/status", "persistentvolumes", "componentstatuses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["helm.cattle.io"]
    resources: ["helmcharts", "helmchartconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-node-operators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c8s-node-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: c8s:node-operators
