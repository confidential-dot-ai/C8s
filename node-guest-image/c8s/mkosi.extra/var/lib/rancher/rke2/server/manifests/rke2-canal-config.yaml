# Canal overrides for RKE2's bundled chart (`rke2-canal`). Felix settings
# the chart has no values for live in canal-felix-config.yaml; Felix gives env
# vars precedence over FelixConfiguration, so each setting lives in one file.

apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-canal
  namespace: kube-system
spec:
  valuesContent: |-
    flannel:
      # Nested C8s guests run on outer hosts whose own CNI (Cilium/flannel)
      # already uses VXLAN UDP/8472; the inner overlay on 8472 is dropped on
      # the outer path. Use 8473 for the inner flannel VXLAN.
      backendPort: 8473
    calico:
      # One backend for the node's rules, so there is a single ruleset and
      # chain order to read.
      felixIptablesBackend: nft
      # A pod reaches node-local services (the resolver, the node's own
      # listeners) through its own ruleset's exceptions.
      felixDefaultEndpointToHostAction: ACCEPT
      # Felix would serve metrics on every interface, the host-facing NIC included.
      felixPrometheusMetricsEnabled: false
      # The sealed image denies every runc exec, so exec probes always fail
      # (the chart's preStop exec fails only at shutdown). Values merge into
      # the chart default; null drops its exec handler.
      livenessProbe:
        exec: null
        httpGet:
          path: /liveness
          port: 9099
          host: localhost
        periodSeconds: 10
        initialDelaySeconds: 10
        failureThreshold: 6
        timeoutSeconds: 10
