# Dev-ssh builds only (this branch). confos's ssh profile strips the host keys
# at build time but, unlike its general-purpose profile, never regenerates
# them, so sshd fails "no hostkeys available". /etc/ssh is a writable state
# overlay on the per-boot scratch disk: fresh host keys every boot.
# Inert without the ssh profile (no ssh.service to extend).
[Service]
ExecStartPre=/usr/bin/ssh-keygen -A
