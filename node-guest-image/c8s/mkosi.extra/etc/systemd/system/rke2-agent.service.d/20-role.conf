# Agent role only. rke2-role.service stages the token and config fragment
# from the authenticated launch document before the agent may start.
[Unit]
ConditionPathExists=/run/confos/role-agent
Requires=rke2-role.service
# A managed launch gets its role from enrollment, which runs only after a
# v2 launch is staged and writes the role marker last.
Wants=c8s-enroll.service
After=rke2-role.service c8s-enroll.service
