# Replaces the ExecStart list of confos's nvidia-cdi-generate.service so that
# every host mount in the GPU container spec is a read-only file on the
# measured root. A secrets grant admits only such mounts (c8s #873, #935).
#
# --feature-flag=disable-ipc-discoverer (nvidia-container-toolkit
# pkg/nvcdi/api.go) drops the IPC discoverer: the writable
# /run/nvidia-persistenced/socket, the fabric manager socket and
# /tmp/nvidia-mps. GPU pods only query NVML; persistenced keeps the driver
# attached on the node through its own device opens.
#
# The GSP firmware discoverer searches /lib/firmware, which reaches the
# measured root through the usrmerge /lib -> usr/lib symlink, and the node-root
# proof opens sources with RESOLVE_NO_SYMLINKS. The toolkit has no option to
# omit those mounts, so `cdi transform root --relative-to=host` rewrites only
# their host paths to /usr/lib/firmware. The container paths stay the same.
#
# The transform runs before the IMEX fold. Both commands write the spec through
# the same CDI cache writer, so the fold sees nvidia-ctk's layout.
[Service]
ExecStart=
ExecStart=/usr/bin/nvidia-ctk cdi generate --mode=nvml --feature-flag=disable-ipc-discoverer --output=/var/run/cdi/nvidia.yaml
ExecStart=/usr/bin/nvidia-ctk cdi transform root --from=/lib/firmware --to=/usr/lib/firmware --relative-to=host --input=/var/run/cdi/nvidia.yaml --output=/var/run/cdi/nvidia.yaml
ExecStart=/bin/sh /usr/local/bin/nvidia-cdi-add-imex.sh /var/run/cdi/nvidia.yaml
