# PodSecurity admission config applied via
# /etc/rancher/rke2/config.yaml: pod-security-admission-config-file=...
#
# Restricted enforcement by default. kube-system is exempt for privileged daemonsets; add more
# namespaces here for any privileged platform component you deploy. Every
# other namespace, `default` included, inherits restricted. The baked
# ../../../var/lib/rancher/rke2/server/manifests/psa-level-policy.yaml stops
# a namespace label from lowering that level unless the caller may grant
# PodSecurity exemptions. Confidential workloads remain Restricted: NRI
# supplies the credential sidecars' inventory socket below the Pod spec,
# without a hostPath volume. The chart also enforces Restricted-equivalent
# checks and denies all workload hostPaths. See node-guest-image/README.md,
# "Workload isolation".
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: "restricted"
        enforce-version: "latest"
        audit: "restricted"
        audit-version: "latest"
        warn: "restricted"
        warn-version: "latest"
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces:
          - kube-system
