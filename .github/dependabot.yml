# Bump PRs for action sha-pins (c8s#264 pinning-review follow-up); component
# and image pins are deliberate measurement changes: pin-watch
# (confos-pin-watch.yml) proposes them as PRs a human merges, and Dependabot
# never touches them. The image
# repro gate gives every image-relevant PR a throwaway module-signing key; never
# copy the production MODULE_SIG_KEY_PEM into Dependabot secrets.
#
# "Image pins" above means the measured component digests in
# charts/lib/files/components.yaml, charts/cloud/values.yaml and
# images/node-guest/worker/mkosi.sync.
# No ecosystem below reads them: docker covers Dockerfile FROM bases only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories:
      - /
      - /test/conformance/steps
      - /test/mock-attestation
      - /test/mock-cds
      - /test/mock-inventory
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The runtime bases of attestation-gated components: nri-image-policy's image
  # is in the measured allowlist floor, so a repointed base must not go
  # unnoticed.
  - package-ecosystem: docker
    directories:
      - /cmd/c8s
      - /cmd/cds
      - /cmd/get-cert
      - /cmd/nri-image-policy
      - /cmd/armtls-mesh
      - /cmd/volumed
      - /test/mock-attestation
      - /test/mock-cloud
      - /test/mock-cds
      - /test/mock-inventory
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
