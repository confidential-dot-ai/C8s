name: Meat

# Abridges each PR's diff for faster reading, via meat (github.com/boldsoftware/meat).

on:
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: meat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Small PRs are quicker to read whole than abridged. Expressions can't add,
  # so the count lives in its own job, ahead of the environment approval gate.
  size:
    name: Measure PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      large: ${{ steps.count.outputs.large }}
    steps:
      - id: count
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: echo "large=$(( ADDITIONS + DELETIONS > 700 ))" >> "$GITHUB_OUTPUT"

  # meat is the costliest advisory check, so it waits for the cheap ones to
  # pass first: no point abridging a diff whose build is already red. `needs`
  # can't cross workflow files, so this polls the Actions API for the sibling
  # runs on the same head sha instead.
  gate:
    name: Wait for basic checks
    needs: size
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && needs.size.outputs.large == '1'
    steps:
      - name: Wait for CI, actionlint, signed-commits, image repro gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const WANTED = ['CI', 'actionlint', 'signed-commits', 'image repro gate'];
            const sha = context.payload.pull_request.head.sha;

            // Latest run per workflow name for this sha (a name can have
            // several runs after a rerun).
            const latestRuns = async () => {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: sha, event: 'pull_request', per_page: 100,
              });
              const byName = new Map();
              for (const run of data.workflow_runs) {
                const prev = byName.get(run.name);
                if (!prev || run.run_number > prev.run_number) byName.set(run.name, run);
              }
              return byName;
            };

            // All of WANTED trigger on the same pull_request event as this
            // workflow, so their runs are already registered (queued, at
            // worst) by the time this first poll fires a few seconds in. A
            // name still absent here never ran for this PR (e.g. CI's Go
            // paths filter didn't match) — don't wait on it.
            const firstRuns = await latestRuns();
            const names = WANTED.filter(name => firstRuns.has(name));
            if (names.length === 0) {
              core.info('none of the basic checks run on this PR; nothing to wait for');
              return;
            }
            core.info(`waiting for: ${names.join(', ')}`);

            const deadline = Date.now() + 40 * 60_000;
            let runs;
            for (;;) {
              runs = await latestRuns();
              const pending = names.filter(n => runs.get(n).status !== 'completed');
              if (pending.length === 0) break;
              if (Date.now() > deadline) {
                core.setFailed(`timed out waiting for: ${pending.join(', ')}`);
                return;
              }
              await new Promise(r => setTimeout(r, 20_000));
            }

            const failed = names
              .map(n => runs.get(n))
              .filter(r => !['success', 'neutral', 'skipped'].includes(r.conclusion));
            if (failed.length) {
              core.setFailed(failed.map(r => `${r.name}: ${r.conclusion}`).join(', '));
            }

  meat:
    name: Reading diff (advisory)
    needs: [size, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: meat-review
    # Fork PRs can't post comments (read-only token) and must not touch secrets.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && needs.size.outputs.large == '1'
      && needs.gate.result == 'success'
    # Advisory: a flaky LLM run never blocks the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The staging step reads only the PR merge commit and its parents.
          fetch-depth: 2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore meat cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.meat
          # The unique key never hits, so the save step below always uploads a
          # fresh accumulated snapshot; restore-keys picks the newest one.
          key: meat-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            meat-

      - name: Install meat (digest-pinned)
        env:
          MEAT_VER: v0.0.0-20260803201634-f39f41dfe7b5
          MEAT_SUM: h1:DGi7NSbQm8PUF/2qFXoclFJ6Or3CO+WbbIS32+KoNDI=
        run: |
          set -euo pipefail
          sum="$(go mod download -json "meat.dev@${MEAT_VER}" 2>/dev/null | jq -r '.Sum')"
          test "$sum" = "$MEAT_SUM"
          go install "meat.dev/cmd/meat@${MEAT_VER}"

      # meat has no pathspec filter, so hand it a pre-filtered index instead:
      # index := head tree, HEAD := base, tests unstaged. The worktree stays at
      # head so meat's read-only tools still see the real source.
      # HEAD is GitHub's PR merge commit; its first parent is the base it was
      # built on. The event's base sha can move past it (base force-pushed
      # after the merge was cached) and would stage the base's gains too.
      - name: Stage the PR diff without tests
        run: |
          set -euo pipefail
          git rev-parse --verify -q HEAD^2 >/dev/null
          git reset -q --soft HEAD^1
          git restore --staged -- ':(glob)**/*_test.go' ':(glob)**/testdata/**'

      - name: Abridge the PR diff
        id: meat
        env:
          # Provided via the `meat-review` environment (required approval).
          # A missing LLM degrades the advisory to a skip (with a notice), not a red row.
          OPENAI_API_KEY: ${{ secrets.OPENAI_MEATTY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if "$(go env GOPATH)/bin/meat" -json -staged > meat.json 2> meat.err; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "::notice::meat advisory skipped: $(head -c 300 meat.err)"
          fi

      - name: Save meat cache
        if: steps.meat.outputs.ran == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.meat
          key: meat-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Post reading diff
        if: steps.meat.outputs.ran == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const res = JSON.parse(fs.readFileSync('meat.json', 'utf8'));
            const marker = '<!-- meat-reading-diff -->';
            const diff = (res.smart_diff || '').replace(/\s+$/, '');

            // A fence longer than any backtick run inside the diff keeps the
            // ```diff block intact even when the diff itself contains fences.
            let tick = 3;
            for (const m of diff.matchAll(/`{3,}/g)) tick = Math.max(tick, m[0].length + 1);
            const fence = '`'.repeat(tick);

            // GitHub caps comments at 65536 chars; cut at a line boundary.
            const limit = 60000;
            let shown = diff, note = '';
            if (shown.length > limit) {
              shown = shown.slice(0, shown.lastIndexOf('\n', limit));
              note = '\n\n_Truncated to fit the comment size limit._';
            }

            const pr = context.payload.pull_request;
            const body = [
              marker,
              '## 🥩 Reading diff',
              '',
              `**${res.summary || 'No summary produced.'}**`,
              '',
              diff ? `${fence}diff\n${shown}\n${fence}${note}` : '_Nothing left to read after abridging._',
              '',
              `<sub>${res.elision || ''} — [meat](https://github.com/boldsoftware/meat) on ${pr.head.sha.slice(0, 7)}</sub>`,
            ].join('\n');

            await core.summary.addRaw(body).write();

            // Defense-in-depth: the job-level if: already skips fork PRs.
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;

            const {data: comments} = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({...context.repo, comment_id: prev.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
