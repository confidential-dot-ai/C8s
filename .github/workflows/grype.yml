name: Scan for vulnerabilities

on:
  workflow_dispatch:
  # Weekly so a fresh advisory against a pin surfaces as a red run instead of
  # at the next audit.
  schedule:
    - cron: "17 6 * * 1"
  # No push trigger: a fresh advisory against an unchanged pin would paint
  # main red without any commit to blame; PRs and the weekly run cover it.
  pull_request:
    branches: [main, beta]
  merge_group:
    types: [checks_requested]
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-grype
  cancel-in-progress: true

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/relevant-changes
        with:
          filters: |
            relevant:
              - ".github/actions/relevant-changes/**"
              - "**.go"
              - "go.mod"
              - "go.sum"
              - "go.work"
              - "go.work.sum"
              - "charts/lib/files/components.yaml"
              - ".github/workflows/grype.yml"
              - ".grype.yaml"

  linux:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: ./.github/actions/setup-go-c8s

    - uses: ./.github/actions/setup-grype

    - name: Scan for vulnerabilities
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        path: "."
        fail-build: false
        output-format: table
        severity-cutoff: critical

    - name: Generate job summary
      id: job-summary
      run: |
        {
          IFS=$'\n'
          echo "## Grype Report Summary"
          echo '```'
          cat ${{ steps.scan.outputs.table }}
          echo '```'
        } >> $GITHUB_STEP_SUMMARY

  # The router nginx image is a third-party pin (c8s-lib components.yaml routerNginx.image)
  # that never goes through the scans of our own images.
  router-image:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Resolve pinned image
      id: image
      run: |
        set -euo pipefail
        repo=$(yq -r '.routerNginx.image.repository' charts/lib/files/components.yaml)
        digest=$(yq -r '.routerNginx.image.digest' charts/lib/files/components.yaml)
        if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error file=charts/lib/files/components.yaml::routerNginx.image.digest must be a sha256 pin, got '$digest'"; exit 1
        fi
        echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

    - uses: ./.github/actions/setup-grype

    - name: Scan for High/Critical vulnerabilities
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ steps.image.outputs.ref }}
        fail-build: true
        output-format: table
        severity-cutoff: high

    - name: Generate job summary
      if: always()
      run: |
        {
          echo "## router nginx image: ${{ steps.image.outputs.ref }}"
          echo '```'
          cat "${{ steps.scan.outputs.table }}" 2>/dev/null || echo "(no report)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  result:
    name: Scan for vulnerabilities result
    runs-on: ubuntu-latest
    needs: [changes, linux, router-image]
    if: always()
    steps:
      # A job skipped by a failed dependency also reports skipped, so the changes job is read on its own.
      - name: Require every job to have succeeded or skipped
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
