name: Scan for vulnerabilities

on:
  workflow_dispatch:
  # Weekly so a fresh advisory against a pin surfaces as a red run instead of
  # at the next audit.
  schedule:
    - cron: "17 6 * * 1"
  # No push trigger: a fresh advisory against an unchanged pin would paint
  # main red without any commit to blame; PRs and the weekly run cover it.
  pull_request:
    branches: [main, beta]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "internal/helmchart/c8s/values.yaml"
      - ".github/workflows/grype.yml"
      - ".grype.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-grype
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: ./.github/actions/setup-go-c8s

    - name: Scan for vulnerabilities
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        path: "."
        fail-build: false
        output-format: table
        severity-cutoff: critical

    - name: Generate job summary
      id: job-summary
      run: |
        {
          IFS=$'\n'
          echo "## Grype Report Summary"
          echo '```'
          cat ${{ steps.scan.outputs.table }}
          echo '```'
        } >> $GITHUB_STEP_SUMMARY

  # The router nginx image is a third-party pin (chart values router.nginx.image)
  # that never goes through the scans of our own images.
  router-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Resolve pinned image
      id: image
      run: |
        set -euo pipefail
        repo=$(yq -r '.router.nginx.image.repository' internal/helmchart/c8s/values.yaml)
        digest=$(yq -r '.router.nginx.image.digest' internal/helmchart/c8s/values.yaml)
        if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "::error file=internal/helmchart/c8s/values.yaml::router.nginx.image.digest must be a sha256 pin, got '$digest'"; exit 1
        fi
        echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"

    - name: Scan for High/Critical vulnerabilities
      id: scan
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        image: ${{ steps.image.outputs.ref }}
        fail-build: true
        output-format: table
        severity-cutoff: high

    - name: Generate job summary
      if: always()
      run: |
        {
          echo "## router nginx image: ${{ steps.image.outputs.ref }}"
          echo '```'
          cat "${{ steps.scan.outputs.table }}" 2>/dev/null || echo "(no report)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
