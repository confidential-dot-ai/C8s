# PERMANENT lint for images/node-guest/ and images/cds-guest/ — the invariants
# that moved here with the measured profiles from confos bin/lint (c8s#264),
# plus the cloud-init disable gate. These jobs lint content this repo owns. The
# fragment superset check compares against confos's gpu fragment at the pinned
# CONFOS_REF — the exact tree the image builds with.
#
# Every job that reads the profiles runs a Makefile target, so a PR that moves
# a profile file updates the Makefile and nothing here.
name: node-guest-image lint

on:
  pull_request:
    paths:
      - "images/node-guest/**"
      - "images/cds-guest/**"
      - "test/e2e/**"
      - "test/conformance/**"
      - ".github/workflows/node-guest-image-lint.yml"
      - ".github/build-pins.json"
      - ".github/scripts/pin-manifest.sh"
      # Every job here runs via make; a broken or renamed target must fail
      # here, not on the next images/node-guest change.
      - "Makefile"
      # The invariants gate body; a script-only change must run the gate.
      - ".github/scripts/cds-guest-image-invariants.sh"
      - ".github/scripts/tests/test-cds-guest-image-invariants.sh"
      - ".github/workflows/c8s-image.yml"
      - ".github/workflows/c8s-image-publish.yml"
      - ".github/workflows/c8s-image-manual.yml"
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: worker-image invariants
    runs-on: ubuntu-latest
    outputs:
      confos-release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve node-image pins
        id: pins
        run: |
          bash .github/scripts/pin-manifest.sh export \
            --manifest .github/build-pins.json \
            --domain node-image \
            --format github-output >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: confidential-dot-ai/confidential-os-builder
          ref: ${{ steps.pins.outputs.confos }}
          path: confos

      - uses: ./.github/actions/setup-go-c8s

      - name: The worker image's kernel, runtime wrapper and unit ordering
        env:
          CONFOS_DIR: ${{ github.workspace }}/confos
        run: make test-node-guest-image-invariants

      - name: Each image narrows its attester to a loopback bind
        env:
          CONFOS_DIR: ${{ github.workspace }}/confos
        run: make test-node-guest-image-attester-finalize

      - name: Resolve the confos base release
        id: release
        run: |
          set -euo pipefail
          conf=confos/mkosi/base/mkosi.conf
          rel=$(sed -n 's/^Release=[[:space:]]*//p' "$conf" | head -1)
          [ -n "$rel" ] || { echo "::error::no Release= in $conf"; exit 1; }
          echo "release=$rel" >> "$GITHUB_OUTPUT"

  systemd:
    name: worker host units under systemd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the systemd-level harness
        run: make test-node-guest-image-systemd

  containerd:
    name: every pod runtime reaches the measured wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-c8s

      - name: Check the baked containerd configuration's handlers
        run: make test-node-guest-image-containerd

  cds-image:
    name: cds-guest-image invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve this checkout's node-image pin
        id: pins
        run: |
          bash .github/scripts/pin-manifest.sh export \
            --manifest .github/build-pins.json \
            --domain node-image \
            --format github-output >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: confidential-dot-ai/confidential-os-builder
          ref: ${{ steps.pins.outputs.confos }}
          path: confos
          persist-credentials: false

      - name: cds-guest-image invariants
        run: |
          .github/scripts/cds-guest-image-invariants.sh
          bash .github/scripts/tests/test-cds-guest-image-invariants.sh

      - uses: ./.github/actions/setup-go-c8s

      - name: The unit's arguments are the ones `c8s cds` accepts
        # ci.yml is gated on Go paths, so a unit-only change reaches this
        # check here.
        run: go test -count=1 -run TestCDSImageServiceArguments ./internal/cmds/cds

      - name: Shellcheck the CDS image scripts
        run: |
          shellcheck images/cds-guest/build \
            images/cds-guest/cds/mkosi.sync \
            images/cds-guest/cds/mkosi.finalize \
            .github/scripts/cds-guest-image-invariants.sh \
            .github/scripts/tests/test-cds-guest-image-invariants.sh

  immutable-root:
    name: immutable root and c8s writable state
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve this checkout's node-image pin
        id: pins
        run: |
          bash .github/scripts/pin-manifest.sh export \
            --manifest .github/build-pins.json \
            --domain node-image \
            --format github-output >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: confidential-dot-ai/confidential-os-builder
          ref: ${{ steps.pins.outputs.confos }}
          path: confos
          persist-credentials: false

      - name: Exercise the pinned initrd with the c8s state declarations
        # Real mounts in a private namespace and disposable chroot; the
        # production init is unchanged, with hardware setup and handoff shimmed.
        run: sudo make test-node-guest-image-immutable-root

      - name: Check the immutable-root harness
        run: shellcheck images/node-guest/tests/immutable-root-test.sh

  cloud-init-disabled:
    name: cloud-init cannot run in the worker image
    # Runs as root, so it gets its own job: no privileged step shares a
    # workspace with the confos checkout. The gate needs the release, not
    # the tree.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the gate
        # Root: mounts a private /etc/cloud to place the marker where
        # ds-identify and the units read it; the runner VM is disposable.
        env:
          CONFOS_RELEASE: ${{ needs.lint.outputs.confos-release }}
        run: sudo CONFOS_RELEASE="$CONFOS_RELEASE" make test-node-guest-image-cloud-init

  gpu-cc:
    name: gpu-cc-enforce logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the gpu-cc-enforce unit test
        run: make test-node-guest-image-gpu-cc

  scratch:
    name: scratch-enforce logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the scratch-enforce unit test
        run: make test-node-guest-image-scratch

  apparmor:
    name: AppArmor config and boot gate
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run AppArmor regression tests
        env:
          CONFOS_RELEASE: ${{ needs.lint.outputs.confos-release }}
        run: make test-node-guest-image-apparmor

      - name: Check the CDS replica launch binding and Service ports
        run: bash test/e2e/cds-ha-vms-test.sh

      - name: Shellcheck the AppArmor and end-to-end scripts
        run: |
          shellcheck -x -P SCRIPTDIR images/node-guest/check-apparmor-config.sh \
            images/node-guest/tests/apparmor-{config,enforce,kernel}-test.sh
          shellcheck -x -P SCRIPTDIR test/e2e/lib{,-test}.sh
          shellcheck -x -P SCRIPTDIR test/e2e/cds-ha-vms{,-test}.sh
          shellcheck -x -P SCRIPTDIR test/conformance/run.sh test/conformance/backends/*.sh

      - name: Exercise the real AppArmor kernel and parser
        env:
          CONFOS_RELEASE: ${{ needs.lint.outputs.confos-release }}
        run: bash images/node-guest/tests/apparmor-kernel-test.sh
