# PERMANENT lint for node-guest-image/ — the invariants that moved here with
# the c8s profile from confos bin/lint (c8s#264), plus the cloud-init
# disable gate. These jobs lint content this repo owns. The fragment superset
# checks compare against confos's gpu/dev fragments at the pinned
# CONFOS_REF — the exact tree the image builds with.
#
# The rke2-role jobs run the role-dispatch tests (script and systemd level)
# from node-guest-image/tests/.
name: node-guest-image lint

on:
  pull_request:
    paths:
      - "node-guest-image/**"
      - "internal/cmds/launchconfig/**"
      - "internal/cmds/join/**"
      - "cmd/c8s/join*.go"
      - "internal/cmds/nodeservices/**"
      - "cmd/c8s/node_image*.go"
      - "cmd/c8s/node_services*.go"
      - "internal/helmchart/**"
      - "test/e2e/**"
      - ".github/workflows/node-guest-image-lint.yml"
      - ".github/build-pins.json"
      - ".github/scripts/pin-manifest.sh"
      # The rke2-role job runs via make; a broken/renamed target must fail
      # here, not on the next node-guest-image change.
      - "Makefile"
      # The lint guards this vendored file's c8s-local bait/tripwire markers;
      # a re-vendor PR touches nothing else and must fail here.
      - ".github/workflows/tdx-metal-e2e.yml"
      - ".github/workflows/snp-metal-e2e.yml"
      - ".github/workflows/tdx-image-acceptance.yml"
      - ".github/actions/tdx-metal-e2e/**"
      # The invariants gate body; a script-only change must run the gate.
      - ".github/scripts/node-guest-image-invariants.sh"
      - ".github/scripts/tests/test-node-guest-image-invariants.sh"
      - ".github/scripts/tdx-image-acceptance.sh"
      - ".github/scripts/tests/test-tdx-image-acceptance.sh"
      - ".github/workflows/c8s-image.yml"
      - ".github/workflows/c8s-image-publish.yml"
      - ".github/workflows/c8s-image-manual.yml"
      # The runtime wrapper the image's containerd config names: the gate
      # pins its real-runtime path against mkosi.sync.
      - "internal/cmds/c8srunc/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containerd:
    name: pinned RKE2 containerd config
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check RKE2-generated config with bundled containerd
        env:
          GH_TOKEN: ${{ github.token }}
          CONFOS_RELEASE: ${{ needs.lint.outputs.confos-release }}
        run: bash node-guest-image/tests/containerd-test.sh

  lint:
    name: node-guest-image invariants
    runs-on: ubuntu-latest
    outputs:
      confos-release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve node-image pins
        id: pins
        run: |
          bash .github/scripts/pin-manifest.sh export \
            --manifest .github/build-pins.json \
            --domain node-image \
            --format github-output >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: confidential-dot-ai/confidential-os-builder
          ref: ${{ steps.pins.outputs.confos }}
          path: confos

      - name: node-guest-image invariants
        env:
          # The node-image pin must support the measured writable-state list.
          EXPECT_IMMUTABLE_ROOT: "1"
          CONFOS_REF: ${{ steps.pins.outputs.confos }}
        run: |
          .github/scripts/node-guest-image-invariants.sh
          bash .github/scripts/tests/test-node-guest-image-invariants.sh

      - name: Preserve the selected attester configuration with a loopback bind
        run: ./node-guest-image/tests/attester-finalize-test.sh

      - name: Resolve the confos base release
        id: release
        run: |
          set -euo pipefail
          conf=confos/mkosi/base/mkosi.conf
          rel=$(sed -n 's/^Release=[[:space:]]*//p' "$conf" | head -1)
          [ -n "$rel" ] || { echo "::error::no Release= in $conf"; exit 1; }
          echo "release=$rel" >> "$GITHUB_OUTPUT"

  immutable-root:
    name: immutable root and c8s writable state
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve this checkout's node-image pin
        id: pins
        run: |
          bash .github/scripts/pin-manifest.sh export \
            --manifest .github/build-pins.json \
            --domain node-image \
            --format github-output >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: confidential-dot-ai/confidential-os-builder
          ref: ${{ steps.pins.outputs.confos }}
          path: confos
          persist-credentials: false

      - name: Exercise the pinned initrd with the c8s state declarations
        # Real mounts in a private namespace and disposable chroot; the
        # production init is unchanged, with hardware setup and handoff shimmed.
        run: sudo make test-node-guest-image-immutable-root

      - name: Check the immutable-root harness
        run: shellcheck node-guest-image/tests/immutable-root-test.sh

  cloud-init-disabled:
    name: cloud-init cannot run in the node image
    # Runs as root, so it gets its own job: no privileged step shares a
    # workspace with the confos checkout. The gate needs the release, not
    # the tree.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the gate
        # Root: mounts a private /etc/cloud to place the marker where
        # ds-identify and the units read it; the runner VM is disposable.
        env:
          CONFOS_RELEASE: ${{ needs.lint.outputs.confos-release }}
        run: sudo CONFOS_RELEASE="$CONFOS_RELEASE" make test-node-guest-image-cloud-init

  system-floor:
    name: system floor lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - name: Read the RKE2 bundle pins
        id: pins
        run: |
          set -euo pipefail
          sync=node-guest-image/c8s/mkosi.sync
          version=$(sed -n 's/^RKE2_VERSION="\(.*\)"$/\1/p' "$sync")
          core=$(sed -n 's/^RKE2_IMAGES_CORE_SHA256="\(.*\)"$/\1/p' "$sync")
          cilium=$(sed -n 's/^RKE2_IMAGES_CILIUM_SHA256="\(.*\)"$/\1/p' "$sync")
          for v in "$version" "$core" "$cilium"; do
            [ -n "$v" ] || { echo "::error::could not read the RKE2 pins from $sync"; exit 1; }
          done
          {
            echo "version=$version"
            echo "core=$core"
            echo "cilium=$cilium"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned airgap bundles
        env:
          RKE2_VERSION: ${{ steps.pins.outputs.version }}
          CORE_SHA256: ${{ steps.pins.outputs.core }}
          CILIUM_SHA256: ${{ steps.pins.outputs.cilium }}
        run: |
          set -euo pipefail
          # '+' is %2B in a release URL, as mkosi.sync does.
          base="https://github.com/rancher/rke2/releases/download/${RKE2_VERSION//+/%2B}"
          curl -fL --retry 3 --retry-delay 5 -o core.tar.zst "$base/rke2-images-core.linux-amd64.tar.zst"
          curl -fL --retry 3 --retry-delay 5 -o cilium.tar.zst "$base/rke2-images-cilium.linux-amd64.tar.zst"
          echo "$CORE_SHA256  core.tar.zst" | sha256sum -c -
          echo "$CILIUM_SHA256  cilium.tar.zst" | sha256sum -c -

      - name: The baked base allowlist matches the pinned bundles
        # systemfloor re-derives the system block from the pinned
        # bundles; -check fails when image-policy.yaml.in is stale, so an RKE2
        # pin bump without a regen cannot merge and wedge node boot.
        run: |
          set -euo pipefail
          manifests=node-guest-image/c8s/mkosi.extra/var/lib/rancher/rke2/server/manifests
          go run ./node-guest-image/c8s/systemfloor -check \
            -template node-guest-image/c8s/image-policy.yaml.in \
            -bundle core.tar.zst \
            -bundle cilium.tar.zst \
            -manifest "$manifests/local-path-storage.yaml" \
            -manifest "$manifests/nvidia-device-plugin.yaml" \
            -exclude-ref busybox

  containerd-runtime-handlers:
    name: every pod runtime reaches the measured wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - name: Render the effective containerd config and check its handlers
        # containerdcheck renders RKE2's own base template and merges the
        # drop-ins containerd imports, so a handler
        # that would reach an unwrapped runc fails here instead of shipping an
        # image where `kubectl exec` works.
        run: |
          set -euo pipefail
          dir=node-guest-image/c8s/mkosi.extra/var/lib/rancher/rke2/agent/etc/containerd
          go run ./node-guest-image/c8s/containerdcheck -config-dir "$dir"
          # The same check must fail when RKE2's runtime auto-detection finds
          # another runtime on the node's PATH.
          if go run ./node-guest-image/c8s/containerdcheck -config-dir "$dir" \
               -extra-runtime crun=/usr/bin/crun 2>/dev/null; then
            echo "::error::containerdcheck accepted an unwrapped auto-detected runtime"
            exit 1
          fi

  gpu-label:
    name: gpu-node-label logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the gpu-node-label unit test
        run: make test-node-guest-image-gpu-label

  gpu-cc:
    name: gpu-cc-enforce logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the gpu-cc-enforce unit test
        run: make test-node-guest-image-gpu-cc

  scratch:
    name: scratch-enforce logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the scratch-enforce unit test
        run: make test-node-guest-image-scratch

  apparmor:
    name: AppArmor config and boot gate
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run AppArmor regression tests
        env:
          CONFOS_RELEASE: ${{ needs.lint.outputs.confos-release }}
        run: make test-node-guest-image-apparmor

      - name: Check exact-image acceptance evidence and lifecycle
        run: bash .github/scripts/tests/test-tdx-image-acceptance.sh

      - name: Check AppArmor scripts
        run: |
          shellcheck -x -P SCRIPTDIR node-guest-image/check-apparmor-config.sh \
            node-guest-image/c8s/mkosi.extra/usr/local/bin/apparmor-enforce.sh \
            node-guest-image/tests/apparmor-{config,enforce,kernel,runtime}-test.sh \
            .github/scripts/tdx-image-acceptance.sh \
            .github/scripts/tests/test-tdx-image-acceptance.sh
          shellcheck -x -P SCRIPTDIR test/e2e/lib{,-test}.sh

      - name: Exercise the real AppArmor kernel and parser
        env:
          CONFOS_RELEASE: ${{ needs.lint.outputs.confos-release }}
        run: bash node-guest-image/tests/apparmor-kernel-test.sh

  psa-ready:
    name: PodSecurity credential-release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the exact production-script harness
        run: make test-node-guest-image-psa-ready

  rke2-role:
    name: rke2-role dispatch (script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the script-level harness
        # The production script runs unchanged in an unprivileged container.
        run: make test-node-guest-image-role

  rke2-role-systemd:
    name: rke2-role dispatch (systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the systemd-level harness
        run: make test-node-guest-image-role-systemd

  baked-workloads:
    name: rendered workloads and measured image archives
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4

      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Check the image archiver and offline fixture
        run: shellcheck node-guest-image/c8s/airgap-images.sh node-guest-image/tests/airgap-images-test.sh

      - name: Validate complete workloads and preserved image pins
        run: |
          go test -count=1 ./cmd/c8s -run TestNodeImage
          make test-node-guest-image-airgap
