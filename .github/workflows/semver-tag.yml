name: SemVer release

on:
  workflow_call:
    inputs:
      target-sha:
        description: Commit whose Docker jobs passed and which the release must name
        required: true
        type: string

permissions: {}

env:
  CHART_DIR: charts/cloud
  CHART_IMAGE: ghcr.io/confidential-dot-ai/charts/c8s-cloud
  CHART_REPO: ghcr.io/confidential-dot-ai/charts
  COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
  COSIGN_VERSION: "3.1.3"
  GH_API_TIMEOUT: 30s
  GITHUB_API_VERSION: "2026-03-10"
  GIT_CLIFF_SHA256: 200d2535da6d9703f3bcc8a4d159c3b55eacdb01cf2148c55b3eee9dd04d5249
  GIT_CLIFF_VERSION: "2.13.1"
  ORAS_VERSION: "1.2.3"
  # Fulcio and GITHUB_REPOSITORY keep the case of the repository name, and
  # cosign compares the identity exactly.
  RELEASE_SIGNER_IDENTITY: https://github.com/confidential-dot-ai/C8s/.github/workflows/semver-tag.yml@refs/heads/main
  # The protected beta branch signs prereleases under its own identity, so a
  # verifier that pins the main identity never accepts a beta.
  RELEASE_BETA_SIGNER_IDENTITY: https://github.com/confidential-dot-ai/C8s/.github/workflows/semver-tag.yml@refs/heads/beta
  RELEASE_SIGNER_ISSUER: https://token.actions.githubusercontent.com
  # A release asset moves more bytes than an API call does.
  RELEASE_ASSET_TIMEOUT: 10m
  # Platforms whose CLI binary is a release asset, each as <os>-<arch>.
  RELEASE_CLI_PLATFORMS: linux-amd64 darwin-arm64
  RELEASE_MAJOR: "0"
  RELEASE_WAIT_ATTEMPTS: "60"
  RELEASE_WAIT_INTERVAL: 15s

jobs:
  calculate:
    name: Calculate release version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      image-matrix: ${{ steps.release-images.outputs.matrix }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      update-latest: ${{ steps.version.outputs.update-latest }}
      update-series: ${{ steps.version.outputs.update-series }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != push ] || \
             { [ "$EVENT_REF" != refs/heads/main ] && [ "$EVENT_REF" != refs/heads/beta ]; }; then
            echo "::error::releases may only originate from a push to main or beta"
            exit 1
          fi
          if [ "$TARGET_SHA" != "$EVENT_SHA" ] || [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release target must equal the caller event's full commit SHA"
            exit 1
          fi

      # Repository-monotonic run IDs serialize release calculation without
      # dropping a middle merge from the Docker -> e2e workflow chain. Each
      # release branch serializes only against its own pushes.
      - name: Wait for older Docker runs on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          github_api() {
            timeout --kill-after=5s "$GH_API_TIMEOUT" \
              gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" "$@"
          }

          older=0
          for ((attempt = 1; attempt <= RELEASE_WAIT_ATTEMPTS; attempt++)); do
            if ! older="$(
              github_api "/repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/runs?event=push&branch=$GITHUB_REF_NAME&per_page=100" \
                --jq '.workflow_runs[] | select(.status != "completed") | .id' \
                | awk -v current="$GITHUB_RUN_ID" 'NF && $1+0 < current+0' \
                | wc -l \
                | tr -d ' '
            )"; then
              echo "::error::could not query older Docker runs"
              exit 1
            fi

            if [ "$older" = "0" ]; then
              echo "no older in-flight Docker run on $GITHUB_REF_NAME"
              break
            fi

            echo "waiting on $older older Docker run(s) ($attempt/$RELEASE_WAIT_ATTEMPTS)"
            sleep "$RELEASE_WAIT_INTERVAL"
          done

          if [ "$older" != "0" ]; then
            echo "::error::older Docker runs exceeded the release wait budget"
            exit 1
          fi

      # Fetch only after serialization: an older run may create the baseline
      # tag while this run is waiting.
      - name: Checkout current release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.target-sha }}

      - name: Load complete release image matrix
        id: release-images
        env:
          C8S: "false"
          CDS: "false"
          GET_CERT: "false"
          NRI_IMAGE_POLICY: "false"
          ARMTLS_MESH: "false"
          SHARED: "true"
          VOLUMED: "false"
        run: .github/scripts/docker-build-matrix.sh

      - name: Install pinned git-cliff
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/git-cliff-$GIT_CLIFF_VERSION-x86_64-unknown-linux-musl.tar.gz"
          .github/scripts/fetch-release.sh orhun/git-cliff "v$GIT_CLIFF_VERSION" "$(basename "$archive")" "$archive"
          printf '%s  %s\n' "$GIT_CLIFF_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"

          binary="$RUNNER_TEMP/git-cliff-$GIT_CLIFF_VERSION/git-cliff"
          test -x "$binary"
          test "$("$binary" --version)" = "git-cliff $GIT_CLIFF_VERSION"
          echo "GIT_CLIFF_BIN=$binary" >> "$GITHUB_ENV"

      - name: Calculate pre-1.0 SemVer
        id: version
        env:
          RELEASE_CHANNEL: ${{ github.ref == 'refs/heads/beta' && 'beta' || 'stable' }}
          TARGET_SHA: ${{ inputs.target-sha }}
        run: .github/scripts/calculate-release-version.sh

  images:
    name: Build release image (${{ matrix.binary }})
    needs: calculate
    if: needs.calculate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.calculate.outputs.image-matrix) }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}

      - uses: ./.github/actions/setup-go-c8s

      # Rebuild every release image instead of trusting a mutable :main alias.
      # This preserves the old tag-triggered release integrity while avoiding a
      # second workflow run. VERSION stamps the SemVer into the c8s binary even
      # though the Git tag is reserved only after all staging builds succeed.
      - name: Build release binary
        env:
          RELEASE_TAG: ${{ needs.calculate.outputs.tag }}
        run: make build-c8s VERSION="$RELEASE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ env.ORAS_VERSION }}

      # Preserve a completed staging build across retries. Rebuilding it after
      # an upstream base image moves could produce a different digest and make
      # an otherwise repairable partial release impossible to finish.
      - name: Inspect commit-scoped staging image
        id: staging
        env:
          IMAGE: ${{ matrix.image }}
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          set -euo pipefail

          staging_tag="release-$TARGET_SHA"
          repo_tags="$(oras repo tags "$IMAGE")"
          if grep -Fxq -- "$staging_tag" <<< "$repo_tags"; then
            digest="$(oras resolve "$IMAGE:$staging_tag")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "reusing $IMAGE:$staging_tag at $digest"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push commit-scoped staging image
        id: build
        if: steps.staging.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:release-${{ inputs.target-sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.target-sha }}
            org.opencontainers.image.version=${{ needs.calculate.outputs.version }}
          # The apt layers come from the :main image CI built and scanned;
          # see docker.yml.
          cache-from: type=registry,ref=${{ matrix.image }}:main

      # The chart job stamps the digest this leg pushed or reused.
      - name: Validate and record commit-scoped staging image
        env:
          BINARY: ${{ matrix.binary }}
          IMAGE: ${{ matrix.image }}
          PUSHED_DIGEST: ${{ steps.build.outputs.digest || steps.staging.outputs.digest }}
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          set -euo pipefail

          [[ "$PUSHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(oras resolve "$IMAGE:release-$TARGET_SHA")" = "$PUSHED_DIGEST"
          mkdir -p release-digest
          printf '%s\t%s\n' "$IMAGE" "$PUSHED_DIGEST" > "release-digest/$BINARY.tsv"

      - name: Upload release image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-digest-${{ matrix.binary }}-${{ inputs.target-sha }}
          path: release-digest/${{ matrix.binary }}.tsv
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/setup-grype

      - name: Scan release image
        id: container-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ matrix.image }}:release-${{ inputs.target-sha }}
          fail-build: false

      - name: Inspect release image scan report
        env:
          SARIF_REPORT: ${{ steps.container-scan.outputs.sarif }}
        run: |
          set -euo pipefail

          test -s "$SARIF_REPORT"
          cat "$SARIF_REPORT"

  # The CLI binaries the release carries as assets. The sign job lists their
  # digests in the statement. The build is reproducible for a given toolchain;
  # see docs/releases.md.
  cli:
    name: Build release CLI
    needs: calculate
    if: needs.calculate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # calculate requires target-sha to equal github.sha. Naming github.sha
      # tells code scanning this unprivileged job builds the pushed commit.
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-go-c8s

      # A first run builds with the Go patch setup-go-c8s installed. A re-run
      # builds with the toolchain of a binary the first run published, so it
      # gives the same bytes after a newer patch appears. The sign job compares
      # the bytes, so a wrong choice here fails there.
      - name: Build release CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.calculate.outputs.tag }}
        run: |
          set -euo pipefail

          toolchain="$(GOTOOLCHAIN=local go env GOVERSION)"
          first="c8s-${RELEASE_CLI_PLATFORMS%% *}"
          if timeout --kill-after=5s "$RELEASE_ASSET_TIMEOUT" \
               gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
               --dir "$RUNNER_TEMP/published" --pattern "$first"; then
            toolchain="$(GOTOOLCHAIN=local go version "$RUNNER_TEMP/published/$first" | awk '{ print $NF }')"
            echo "release $RELEASE_TAG already has $first, built with $toolchain"
          fi

          # shellcheck disable=SC2086 # one argument per platform
          .github/scripts/release-cli.sh "$RELEASE_TAG" "$toolchain" dist $RELEASE_CLI_PLATFORMS
          GOTOOLCHAIN=local go version dist/c8s-*
          (cd dist && sha256sum c8s-*)
          test "$(dist/c8s-linux-amd64 --version)" = "c8s version $RELEASE_TAG"

      - name: Upload release CLI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c8s-release-cli-${{ inputs.target-sha }}
          path: dist/c8s-*
          if-no-files-found: error
          retention-days: 1

  chart:
    name: Build release chart
    needs: [calculate, images]
    if: needs.calculate.outputs.publish == 'true' && needs.images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.4

      - name: Lint and render chart
        run: .github/scripts/chart-verify.sh

      - name: Download release image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-digest-*-${{ inputs.target-sha }}
          path: ${{ runner.temp }}/release-digest
          merge-multiple: true

      - name: Install crane (checksum-pinned)
        env:
          VERSION: v0.21.6
          # SHA256 from the release's checksums.txt (Linux_x86_64).
          SHA256: 7ebbdcd05b652345c1f5105f8475e518534b90d66f3bdb50017be63f426ea435
        run: |
          set -euo pipefail
          dir=$(mktemp -d -- "$RUNNER_TEMP/crane.XXXXXX")
          curl -fsSL --retry 3 -o "$dir/crane.tar.gz" \
            "https://github.com/google/go-containerregistry/releases/download/$VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$SHA256  $dir/crane.tar.gz" | sha256sum -c -
          tar -xzf "$dir/crane.tar.gz" -C "$dir" crane
          echo "$dir" >>"$GITHUB_PATH"
          "$dir/crane" version

      - name: Stamp release image digests
        run: |
          set -euo pipefail

          cat "$RUNNER_TEMP"/release-digest/*.tsv > "$RUNNER_TEMP/release-image-digests"
          cp -rL "$CHART_DIR" "$RUNNER_TEMP/c8s-cloud"
          .github/scripts/chart-stamp.sh stamp "$RUNNER_TEMP/c8s-cloud" "$RUNNER_TEMP/release-image-digests"

      - name: Package deterministic release chart
        env:
          TARGET_SHA: ${{ inputs.target-sha }}
          VERSION: ${{ needs.calculate.outputs.version }}
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^0[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-beta[.][1-9][0-9]*)?$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          source_epoch="$(git show -s --format=%ct "$TARGET_SHA")"
          [[ "$source_epoch" =~ ^[0-9]+$ ]]

          raw="$RUNNER_TEMP/chart-raw"
          tree="$RUNNER_TEMP/chart-tree"
          mkdir -p "$raw" "$tree" dist
          helm package "$RUNNER_TEMP/c8s-cloud" \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination "$raw"
          tar -xzf "$raw/c8s-cloud-$VERSION.tgz" -C "$tree"
          if find "$tree" -mindepth 1 ! -type d ! -type f -print -quit | grep -q .; then
            echo "::error::chart package contains a non-regular entry"
            exit 1
          fi
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$source_epoch" -C "$tree" -cf - c8s-cloud \
            | gzip -n > "dist/c8s-cloud-$VERSION.tgz"
          (cd dist && sha256sum "c8s-cloud-$VERSION.tgz" > SHA256SUMS)
          helm show chart "dist/c8s-cloud-$VERSION.tgz" > /dev/null
          CHART_DIR="$tree/c8s-cloud" .github/scripts/chart-verify.sh

      - name: Upload release chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c8s-release-chart-${{ inputs.target-sha }}
          path: |
            dist/c8s-cloud-*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish release
    needs: [calculate, images, chart, cli]
    if: needs.calculate.outputs.publish == 'true' && needs.images.result == 'success' && needs.chart.result == 'success' && needs.cli.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      packages: write
    environment:
      name: release
      deployment: false
    outputs:
      chart-digest: ${{ steps.chart.outputs.digest }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}
          sparse-checkout: .github/scripts

      - name: Download release chart
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c8s-release-chart-${{ inputs.target-sha }}
          path: dist

      - name: Setup ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.4

      - name: Validate release inputs and payload
        env:
          CHANNEL: ${{ needs.calculate.outputs.channel }}
          RELEASE_MATRIX: ${{ needs.calculate.outputs.image-matrix }}
          RELEASE_TAG: ${{ needs.calculate.outputs.tag }}
          TARGET_SHA: ${{ inputs.target-sha }}
          VERSION: ${{ needs.calculate.outputs.version }}
        run: |
          set -euo pipefail

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$CHANNEL" in
            stable) [[ "$RELEASE_TAG" =~ ^v0[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]] ;;
            beta) [[ "$RELEASE_TAG" =~ ^v0[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)-beta[.][1-9][0-9]*$ ]] ;;
            *) exit 1 ;;
          esac
          test "$RELEASE_TAG" = "v$VERSION"

          mapfile -t payload < <(find dist -mindepth 1 -maxdepth 1 -type f -print | sort)
          test "${#payload[@]}" -eq 2
          test -f dist/SHA256SUMS
          test ! -L dist/SHA256SUMS
          if find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::release payload contains a non-regular entry"
            exit 1
          fi
          chart="dist/c8s-cloud-$VERSION.tgz"
          test -f "$chart"
          test ! -L "$chart"
          manifest_hash="$(
            awk -v file="c8s-cloud-$VERSION.tgz" \
              '$2 == file { count++; digest=$1 } END { if (count == 1) print digest; else exit 1 }' \
              dist/SHA256SUMS
          )"
          [[ "$manifest_hash" =~ ^[0-9a-f]{64}$ ]]
          actual_hash="$(sha256sum "$chart")"
          test "${actual_hash%% *}" = "$manifest_hash"

          if ! jq -e '
            type == "object" and
            keys == ["include"] and
            (.include | type == "array" and length > 0) and
            ([.include[].image] | length == (unique | length)) and
            all(.include[];
              type == "object" and
              keys == ["binary", "dockerfile", "image"] and
              (.binary | test("^[a-z0-9][a-z0-9-]*$")) and
              (.dockerfile | test("^cmd/[a-z0-9][a-z0-9-]*/Dockerfile$")) and
              (.image | test("^ghcr[.]io/confidential-dot-ai/[a-z0-9][a-z0-9-]*$"))
            )
          ' <<< "$RELEASE_MATRIX" > /dev/null; then
            echo "::error::release image matrix is malformed or unsafe"
            exit 1
          fi
          jq -r '.include[].image' <<< "$RELEASE_MATRIX" \
            | sort > "$RUNNER_TEMP/release-images"

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s' "$GH_TOKEN" | oras login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      # Reads must succeed before any tag or package is mutated. Existing exact
      # release aliases are accepted only when they resolve to this build.
      - name: Preflight image and chart destinations
        id: preflight
        env:
          TARGET_SHA: ${{ inputs.target-sha }}
          VERSION: ${{ needs.calculate.outputs.version }}
        run: |
          set -euo pipefail

          staging_tag="release-$TARGET_SHA"
          : > "$RUNNER_TEMP/release-image-digests"
          while IFS= read -r image; do
            source_digest="$(oras resolve "$image:$staging_tag")"
            [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            repo_tags="$(oras repo tags "$image")"
            for tag in "v$VERSION" "$VERSION"; do
              if grep -Fxq -- "$tag" <<< "$repo_tags"; then
                destination_digest="$(oras resolve "$image:$tag")"
                if [ "$destination_digest" != "$source_digest" ]; then
                  echo "::error::$image:$tag already names $destination_digest, expected $source_digest"
                  exit 1
                fi
              fi
            done
            printf '%s\t%s\n' "$image" "$source_digest" \
              >> "$RUNNER_TEMP/release-image-digests"
          done < "$RUNNER_TEMP/release-images"

          mkdir -p "$RUNNER_TEMP/stamped"
          tar -xzf "dist/c8s-cloud-$VERSION.tgz" -C "$RUNNER_TEMP/stamped"
          .github/scripts/chart-stamp.sh check "$RUNNER_TEMP/stamped/c8s-cloud" "$RUNNER_TEMP/release-image-digests"

          # Until the first release pushes it, the registry knows no chart repository.
          if ! chart_tags="$(oras repo tags "$CHART_IMAGE" 2>"$RUNNER_TEMP/chart-tags.err")"; then
            grep -q 'name unknown' "$RUNNER_TEMP/chart-tags.err" \
              || { cat "$RUNNER_TEMP/chart-tags.err" >&2; exit 1; }
            chart_tags=""
          fi
          chart_exists=false
          if grep -Fxq -- "$VERSION" <<< "$chart_tags"; then
            chart_exists=true
            mkdir -p "$RUNNER_TEMP/chart-preflight"
            helm pull "oci://$CHART_IMAGE" --version "$VERSION" \
              --destination "$RUNNER_TEMP/chart-preflight"
            cmp "dist/c8s-cloud-$VERSION.tgz" \
              "$RUNNER_TEMP/chart-preflight/c8s-cloud-$VERSION.tgz"
          fi
          echo "chart-exists=$chart_exists" >> "$GITHUB_OUTPUT"

      # The Git reference reserves the version before registry writes. A retry
      # verifies the exact target and repairs only missing registry aliases.
      - name: Create or verify annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.calculate.outputs.tag }}
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          set -euo pipefail

          github_api() {
            timeout --kill-after=5s "$GH_API_TIMEOUT" \
              gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" "$@"
          }

          refs="$(github_api "/repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG")"
          exact_ref="refs/tags/$RELEASE_TAG"
          exact_count="$(jq --arg ref "$exact_ref" '[.[] | select(.ref == $ref)] | length' <<< "$refs")"
          if [ "$exact_count" = "0" ]; then
            tagger_name="github-actions[bot]"
            tagger_id="$(github_api "/users/$tagger_name" --jq .id)"
            [[ "$tagger_id" =~ ^[0-9]+$ ]]
            tag_object_sha="$(
              github_api --method POST "/repos/$GITHUB_REPOSITORY/git/tags" \
                --raw-field tag="$RELEASE_TAG" \
                --raw-field message="Release $RELEASE_TAG from $TARGET_SHA" \
                --raw-field object="$TARGET_SHA" \
                --raw-field type=commit \
                --raw-field "tagger[name]=$tagger_name" \
                --raw-field "tagger[email]=$tagger_id+$tagger_name@users.noreply.github.com" \
                --jq .sha
            )"
            test -n "$tag_object_sha"
            github_api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="$exact_ref" \
              --raw-field sha="$tag_object_sha" > /dev/null
          elif [ "$exact_count" != "1" ]; then
            echo "::error::multiple exact refs returned for $RELEASE_TAG"
            exit 1
          fi

          IFS=$'\t' read -r ref_type ref_sha <<< "$(
            github_api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"
          test "$ref_type" = tag
          [[ "$ref_sha" =~ ^[0-9a-f]{40}$ ]]
          IFS=$'\t' read -r target_type target_sha <<< "$(
            github_api "/repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"
          test "$target_type" = commit
          test "$target_sha" = "$TARGET_SHA"

      - name: Publish or verify component image aliases
        env:
          RELEASE_TAG: ${{ needs.calculate.outputs.tag }}
          TARGET_SHA: ${{ inputs.target-sha }}
          UPDATE_LATEST: ${{ needs.calculate.outputs.update-latest }}
          UPDATE_SERIES: ${{ needs.calculate.outputs.update-series }}
          VERSION: ${{ needs.calculate.outputs.version }}
        run: |
          set -euo pipefail

          [[ "$UPDATE_LATEST" =~ ^(true|false)$ ]]
          [[ "$UPDATE_SERIES" =~ ^(true|false)$ ]]
          series="${VERSION%.*}"
          short_sha="${TARGET_SHA:0:7}"

          while IFS=$'\t' read -r image source_digest; do
            repo_tags="$(oras repo tags "$image")"
            new_tags=()
            for tag in "$RELEASE_TAG" "$VERSION"; do
              if grep -Fxq -- "$tag" <<< "$repo_tags"; then
                test "$(oras resolve "$image:$tag")" = "$source_digest"
              else
                new_tags+=("$tag")
              fi
            done
            if [ "$UPDATE_SERIES" = true ]; then
              if ! grep -Fxq -- "$series" <<< "$repo_tags" || \
                 [ "$(oras resolve "$image:$series")" != "$source_digest" ]; then
                new_tags+=("$series")
              fi
            fi
            if [ "$UPDATE_LATEST" = true ]; then
              if ! grep -Fxq -- latest <<< "$repo_tags" || \
                 [ "$(oras resolve "$image:latest")" != "$source_digest" ]; then
                new_tags+=(latest)
              fi
            fi
            # Point this commit tag at the canonical all-components release
            # rebuild before the parent Docker workflow completes.
            if ! grep -Fxq -- "$short_sha" <<< "$repo_tags" || \
               [ "$(oras resolve "$image:$short_sha")" != "$source_digest" ]; then
              new_tags+=("$short_sha")
            fi

            if [ "${#new_tags[@]}" -gt 0 ]; then
              oras tag "$image@$source_digest" "${new_tags[@]}"
            fi
            test "$(oras resolve "$image:$RELEASE_TAG")" = "$source_digest"
            test "$(oras resolve "$image:$VERSION")" = "$source_digest"
            test "$(oras resolve "$image:$short_sha")" = "$source_digest"
            if [ "$UPDATE_SERIES" = true ]; then
              test "$(oras resolve "$image:$series")" = "$source_digest"
            fi
            if [ "$UPDATE_LATEST" = true ]; then
              test "$(oras resolve "$image:latest")" = "$source_digest"
            fi
          done < "$RUNNER_TEMP/release-image-digests"

      - name: Publish or verify Helm chart
        id: chart
        env:
          CHART_EXISTS: ${{ steps.preflight.outputs.chart-exists }}
          VERSION: ${{ needs.calculate.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$CHART_EXISTS" = false ]; then
            helm push "dist/c8s-cloud-$VERSION.tgz" "oci://$CHART_REPO"
          fi
          mkdir -p "$RUNNER_TEMP/chart-verify"
          helm pull "oci://$CHART_IMAGE" --version "$VERSION" \
            --destination "$RUNNER_TEMP/chart-verify"
          cmp "dist/c8s-cloud-$VERSION.tgz" \
            "$RUNNER_TEMP/chart-verify/c8s-cloud-$VERSION.tgz"
          digest="$(oras resolve "$CHART_IMAGE:$VERSION")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # A keyless Sigstore signature over {repository, tag, commit, chart, cli}
  # lets downstream automation trust a tag, the chart manifest it names and
  # the CLI binaries it lists by sha256, without trusting everyone who can
  # push tags. Only this job holds an OIDC token. It neither checks out nor
  # runs repository source: it hashes and uploads the binaries the cli job
  # built.
  sign:
    name: Sign release tag
    needs: [calculate, publish, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
      deployment: false
    env:
      BUNDLE: release-statement.sigstore.json
      CHANNEL: ${{ needs.calculate.outputs.channel }}
      CHART_DIGEST: ${{ needs.publish.outputs.chart-digest }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.calculate.outputs.tag }}
      STATEMENT: release-statement.json
      TARGET_SHA: ${{ inputs.target-sha }}
      UPDATE_LATEST: ${{ needs.calculate.outputs.update-latest }}
    steps:
      - name: Install pinned cosign
        run: |
          set -euo pipefail

          binary="$RUNNER_TEMP/cosign"
          # The c8s mirror first, as in .github/scripts/fetch-release.sh, which
          # this job cannot use: it does not check out the repository.
          asset="sigstore/cosign/v$COSIGN_VERSION/cosign-linux-amd64"
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 20 --retry 3 \
            --output "$binary" "https://confosaptmirrorae526a.blob.core.windows.net/gh-releases/$asset" ||
            curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
              --retry 8 --retry-max-time 300 --retry-all-errors --connect-timeout 20 \
              --output "$binary" "https://github.com/sigstore/cosign/releases/download/v$COSIGN_VERSION/cosign-linux-amd64"
          printf '%s  %s\n' "$COSIGN_SHA256" "$binary" | sha256sum --check --status
          chmod +x "$binary"
          "$binary" version --json | jq -e --arg v "v$COSIGN_VERSION" '.gitVersion == $v' > /dev/null
          echo "COSIGN_BIN=$binary" >> "$GITHUB_ENV"

      - name: Download release CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c8s-release-cli-${{ inputs.target-sha }}
          path: cli

      # The statement names the commit that the published tag object points
      # at, read back from GitHub rather than taken from the caller. In a
      # called workflow GITHUB_REPOSITORY is the caller, so the identity check
      # also refuses to sign for any other repository.
      - name: Write release statement
        run: |
          set -euo pipefail

          github_api() {
            timeout --kill-after=5s "$GH_API_TIMEOUT" \
              gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" "$@"
          }

          case "$CHANNEL" in
            stable)
              [[ "$RELEASE_TAG" =~ ^v0[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
              signer_ref=refs/heads/main
              signer_identity="$RELEASE_SIGNER_IDENTITY"
              ;;
            beta)
              [[ "$RELEASE_TAG" =~ ^v0[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)-beta[.][1-9][0-9]*$ ]]
              signer_ref=refs/heads/beta
              signer_identity="$RELEASE_BETA_SIGNER_IDENTITY"
              ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REF" = "$signer_ref"
          if [ "https://github.com/$GITHUB_REPOSITORY/.github/workflows/semver-tag.yml@$signer_ref" \
               != "$signer_identity" ]; then
            echo "::error::$GITHUB_REPOSITORY does not match the $CHANNEL signer identity; if this repository was renamed, update it and docs/releases.md"
            exit 1
          fi
          echo "SIGNER_IDENTITY=$signer_identity" >> "$GITHUB_ENV"
          IFS=$'\t' read -r ref_type ref_sha <<< "$(
            github_api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"
          test "$ref_type" = tag
          [[ "$ref_sha" =~ ^[0-9a-f]{40}$ ]]
          IFS=$'\t' read -r target_type target_sha <<< "$(
            github_api "/repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" \
              --jq '[.object.type, .object.sha] | @tsv'
          )"
          test "$target_type" = commit
          test "$target_sha" = "$TARGET_SHA"
          [[ "$CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          # The artifact must hold exactly one regular file per platform.
          cli='{}'
          count=0
          for platform in $RELEASE_CLI_PLATFORMS; do
            asset="c8s-$platform"
            test -f "cli/$asset"
            test ! -L "cli/$asset"
            sha="$(sha256sum < "cli/$asset")"
            cli="$(jq -c --arg p "$platform" --arg a "$asset" --arg s "${sha%% *}" \
              '.[$p] = {asset: $a, sha256: $s}' <<< "$cli")"
            count=$((count + 1))
          done
          test "$count" -gt 0
          test "$(find cli -mindepth 1 | wc -l)" -eq "$count"

          jq -cnS \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$TARGET_SHA" \
            --arg chart "$CHART_IMAGE@$CHART_DIGEST" \
            --argjson cli "$cli" \
            '{repository: $repository, tag: $tag, commit: $commit, chart: $chart, cli: $cli}' \
            > "$STATEMENT"
          cat "$STATEMENT"

      # A retry verifies existing assets instead of replacing them: a published
      # binary must equal the rebuilt one, and a published statement must equal
      # the one written above, which lists the rebuilt digests. The release is
      # marked Latest only when this tag is the newest stable release, so a
      # repair run for an older tag cannot take Latest back. A beta is always a
      # GitHub prerelease and never Latest.
      - name: Sign and publish or verify release statement and CLI
        run: |
          set -euo pipefail

          [[ "$UPDATE_LATEST" =~ ^(true|false)$ ]]
          prerelease=false
          if [ "$CHANNEL" = beta ]; then
            prerelease=true
            test "$UPDATE_LATEST" = false
          fi

          gh_release() {
            timeout --kill-after=5s "$GH_API_TIMEOUT" \
              gh release "$@" --repo "$GITHUB_REPOSITORY"
          }
          gh_release_asset() { GH_API_TIMEOUT="$RELEASE_ASSET_TIMEOUT" gh_release "$@"; }
          verify() {
            "$COSIGN_BIN" verify-blob \
              --bundle "$BUNDLE" \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$RELEASE_SIGNER_ISSUER" \
              "$STATEMENT"
          }
          has_asset() { grep -Fxq -- "$1" <<< "$assets"; }

          # view also finds a draft, which a create that was stopped before it
          # published leaves behind.
          release_exists=false
          draft=false
          assets=""
          if release="$(gh_release view "$RELEASE_TAG" --json assets,isDraft)"; then
            release_exists=true
            draft="$(jq -r .isDraft <<< "$release")"
            assets="$(jq -r '.assets[].name' <<< "$release")"
          fi

          mkdir published
          missing=()
          for platform in $RELEASE_CLI_PLATFORMS; do
            asset="c8s-$platform"
            if has_asset "$asset"; then
              gh_release_asset download "$RELEASE_TAG" --dir published --pattern "$asset"
              if ! cmp "cli/$asset" "published/$asset"; then
                echo "::error::$asset on release $RELEASE_TAG is not the binary this run built; see Recovery in docs/releases.md"
                exit 1
              fi
            else
              missing+=("cli/$asset")
            fi
          done

          if has_asset "$STATEMENT" && has_asset "$BUNDLE"; then
            gh_release download "$RELEASE_TAG" --dir published \
              --pattern "$STATEMENT" --pattern "$BUNDLE"
            cmp "$STATEMENT" "published/$STATEMENT"
            cp "published/$BUNDLE" "$BUNDLE"
            verify
            echo "existing release statement for $RELEASE_TAG verified"
          elif has_asset "$STATEMENT" || has_asset "$BUNDLE"; then
            echo "::error::release $RELEASE_TAG carries a statement without its bundle or the reverse; delete that asset and rerun"
            exit 1
          else
            "$COSIGN_BIN" sign-blob --yes --bundle "$BUNDLE" "$STATEMENT"
            verify
            missing+=("$STATEMENT" "$BUNDLE")
          fi

          if [ "$release_exists" = false ]; then
            # gh publishes the release only after every asset is uploaded.
            gh_release_asset create "$RELEASE_TAG" \
              --verify-tag \
              --latest="$UPDATE_LATEST" \
              --prerelease="$prerelease" \
              --title "$RELEASE_TAG" \
              --notes "Release $RELEASE_TAG from $TARGET_SHA. See docs/releases.md to verify $STATEMENT and the c8s binaries it lists." \
              "${missing[@]}"
            exit 0
          fi
          # One asset at a time, binaries first, so a visible statement never
          # names a binary the release lacks.
          for asset in "${missing[@]}"; do
            gh_release_asset upload "$RELEASE_TAG" "$asset"
          done
          if [ "$draft" = true ]; then
            gh_release edit "$RELEASE_TAG" --draft=false \
              --latest="$UPDATE_LATEST" --prerelease="$prerelease"
          fi
