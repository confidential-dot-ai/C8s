name: CDS HA suite

on:
  pull_request:
    branches: [main, beta, "feat/**"]
  merge_group:
    types: [checks_requested]
    branches: [main, beta, "feat/**"]
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"

# A pull request's own runs supersede each other; a push run runs to the end.
concurrency:
  group: cdsha-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/relevant-changes
        with:
          filters: |
            relevant:
              # The packages and lane scripts these jobs run.
              - ".github/actions/relevant-changes/**"
              - "internal/cdsha/**"
              - "test/integration/cdsha/**"

  harness:
    name: Three replicas
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Longer than the harness's own timeout, so go test prints its goroutines
    # before the runner takes the job away.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - name: Run the -short subset
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: ./test/integration/cdsha/run.sh -short

      - name: Run every scenario
        if: (github.event_name == 'push' || github.event_name == 'schedule')
        run: ./test/integration/cdsha/run.sh

  result:
    name: CDS HA suite result
    runs-on: ubuntu-latest
    needs: [changes, harness]
    if: always()
    steps:
      # A job skipped by a failed dependency also reports skipped, so the changes job is read on its own.
      - name: Require every job to have succeeded or skipped
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
