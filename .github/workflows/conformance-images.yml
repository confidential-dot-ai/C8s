name: Conformance images

# The conformance suite's images (test/conformance/images): model-server with
# the reporter as its sleep, tenant-app with the programs the steps run in a
# tenant pod, and mesh-dialer with the mesh peer. Dispatched by hand when one of them or its base changes; the
# backends' CONFORMANCE_IMAGES pin the digests the summary prints.
on:
  workflow_dispatch:
    inputs:
      cds_metadata_only:
        description: Build only the isolated CDS transactional metadata helper
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ !inputs.cds_metadata_only }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: model-server
            context: test/conformance/images/reporter
            file: test/conformance/images/reporter/Dockerfile
          - image: tenant-app
            context: test/conformance/images/tenant-app
            file: test/conformance/images/tenant-app/Dockerfile
          - image: mesh-dialer
            context: .
            file: test/conformance/images/mesh-dialer/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/confidential-dot-ai/c8s-conformance-${{ matrix.image }}:${{ github.sha }}

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "$IMAGE: ghcr.io/confidential-dot-ai/c8s-conformance-$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  metadata:
    if: ${{ inputs.cds_metadata_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-c8s
      - name: Test and build the isolated helper
        run: |
          go test -race ./internal/metadatapilot ./internal/cdsconfig ./internal/cdsobject ./test/pilot/cds-load
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/cds-metadata-pilot ./cmd/cds-metadata-pilot
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          file: test/pilot/cds-metadata/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/confidential-dot-ai/cds-metadata-pilot:${{ github.sha }}
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Metadata helper ghcr.io/confidential-dot-ai/cds-metadata-pilot@$DIGEST from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
