# Reproducibility gates for measured images. Node-image changes build the image
# TWICE and require every measured value to match (c8s#264). This runs on every
# PR and decides relevance itself — a paths filter would leave the required
# `compare` check pending on unrelated PRs. Fork PRs are exempt
# (security-over-coverage); the post-merge builds remain the publication gates.
name: image repro gate
on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: image-repro-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # The gate build legs run on the-machine (self-hosted); never fork-trigger.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
      c8s_ref: ${{ steps.diff.outputs.c8s_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            image=true
          else
            base_manifest="$RUNNER_TEMP/base-build-pins.json"
            changed_paths="$RUNNER_TEMP/changed-paths"
            git cat-file -e "${BASE_SHA}^{commit}"
            git show "${BASE_SHA}:.github/build-pins.json" >"$base_manifest"
            git diff --name-only -z "$BASE_SHA" HEAD -- >"$changed_paths"
            result=$(bash .github/scripts/repro-gate-changes \
              .github/build-pins.json "$base_manifest" "$changed_paths")
            image=$(sed -n 's/^image=//p' <<<"$result")
            [[ "$image" =~ ^(true|false)$ ]]
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # Core container images come from the PR's base commit on main:
          # every main push publishes :<short-sha> (docker.yml), while PR
          # runs only load images locally, so the PR's own SHA is never in
          # GHCR. The gate therefore tests the PR's host binary and chart
          # against the containers main currently ships.
          ref="${BASE_SHA:-$GITHUB_SHA}"
          ref="${ref::7}"
          echo "c8s_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "node-image relevant: $image (c8s binary from this checkout, operator at \`$ref\`)" >> "$GITHUB_STEP_SUMMARY"

      # PR code must never run with the production module-signing key. This
      # keypair is shared by both legs, used only in unpublished gate images,
      # and has no authority after those images are discarded.
      - name: Generate gate-only module-signing key
        if: steps.diff.outputs.image == 'true'
        run: |
          set -euo pipefail
          install -d -m 0700 gate-signing
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -subj "/CN=c8s image reproducibility gate/" \
            -days 1 -set_serial 1 \
            -keyout gate-signing/module-signing.key \
            -out gate-signing/module-signing.crt
          chmod 0600 gate-signing/module-signing.key

      - name: Share gate-only module-signing key
        if: steps.diff.outputs.image == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-signing-${{ github.run_id }}
          path: gate-signing
          if-no-files-found: error
          retention-days: 1
          # Full reruns replace it; failed-job reruns reuse the prior artifact.
          overwrite: true

  build-a:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/c8s-image.yml
    with:
      gate: true
      leg: a
      c8s_ref: ${{ needs.changes.outputs.c8s_ref }}
      gate_signing_artifact: module-signing-${{ github.run_id }}

  build-b:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/c8s-image.yml
    with:
      gate: true
      leg: b
      c8s_ref: ${{ needs.changes.outputs.c8s_ref }}
      gate_signing_artifact: module-signing-${{ github.run_id }}

  compare:
    # The required check: green fast when the node-image domain is not relevant (and on
    # fork PRs, whose changes job is skipped); otherwise enforce every build
    # and comparison selected by the classifier.
    needs: [changes, build-a, build-b]
    # Superseded runs must not leave a failed comparison behind.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Change classification must have succeeded
        if: needs.changes.result != 'success' && needs.changes.result != 'skipped'
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          echo "change-classification result: $RESULT" >&2
          exit 1

      - name: Nothing measurement-gate-relevant changed
        if: needs.changes.outputs.image != 'true'
        run: echo "no gated measurement inputs changed — gate not applicable" >> "$GITHUB_STEP_SUMMARY"
      - name: Legs must have succeeded
        if: needs.changes.outputs.image == 'true'
        env:
          A: ${{ needs.build-a.result }}
          B: ${{ needs.build-b.result }}
        run: |
          set -euo pipefail
          test "$A" = success && test "$B" = success || { echo "leg results: a=$A b=$B" >&2; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.image == 'true'
        with:
          pattern: gate-*-${{ github.run_id }}-*
          path: evidence
      - name: Every measured value must match
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, os, sys
          run_id = os.environ["GITHUB_RUN_ID"]
          fail = False
          lines = ["### image repro gate", "", "| platform | field | verdict |", "|---|---|---|"]
          for plat in ("tdx", "snp"):
              legs = {}
              for leg in ("a", "b"):
                  d = f"evidence/gate-rke2-{plat}-{run_id}-{leg}"
                  m = json.load(open(f"{d}/manifest.json"))
                  # The report timestamp is metadata, not a baked byte.
                  m.get("build", {}).pop("timestamp", None)
                  legs[leg] = (m, open(f"{d}/roothash").read().strip())
              (ma, ra), (mb, rb) = legs["a"], legs["b"]
              fail = fail or ma != mb or ra != rb
              lines.append(f"| {plat} | manifest (sans timestamp) | {'identical' if ma == mb else '**DIFFERS**'} |")
              lines.append(f"| {plat} | roothash `{ra[:12]}…` | {'identical' if ra == rb else '**DIFFERS**'} |")
              if ma != mb:
                  a_flat = json.dumps(ma, sort_keys=True, indent=0).splitlines()
                  b_flat = json.dumps(mb, sort_keys=True, indent=0).splitlines()
                  for line in sorted(set(a_flat) ^ set(b_flat)):
                      print(f"{plat} manifest delta: {line.strip()}", file=sys.stderr)
              if ra != rb:
                  print(f"{plat} roothash delta: a={ra} b={rb}", file=sys.stderr)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          sys.exit(1 if fail else 0)
          EOF
