# Reproducibility gates for measured images. A change to the worker image's
# inputs builds it TWICE and requires every measured value to match (c8s#264).
# For main, the builds run in its merge queue, which blocks the merge on them;
# a pull request into main reports `compare` as passing without building. Pull
# requests into other branches, which have no queue, build. Each run decides
# relevance itself — a paths filter would leave the required `compare` check
# pending. Fork code is exempt (security-over-coverage); the post-merge builds
# remain the publication gates.
name: image repro gate
on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: image-repro-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # The gate build legs run on the-machine (self-hosted): never on fork code.
    # The diff step checks merge groups; fork pull requests skip here.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
      || (github.base_ref != 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.diff.outputs.image }}
      c8s_ref: ${{ steps.diff.outputs.c8s_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request diff reads only the merge commit and its parents.
          fetch-depth: 2
      - id: diff
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=true
          base=
          if [ -n "$BASE_SHA" ]; then
            # The group holds this queue entry's PR and every entry ahead of it.
            # Read them from the queue itself, not from commit messages, and only
            # while the entry still points at this commit.
            pr=$(sed -nE 's|^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<<"$GITHUB_REF")
            # shellcheck disable=SC2016 # GraphQL variables, not shell.
            query='query($owner: String!, $name: String!, $branch: String!) {
              repository(owner: $owner, name: $name) { mergeQueue(branch: $branch) {
                entries(first: 100) { nodes { position headCommit { oid } pullRequest { number isCrossRepository } } }
              } }
            }'
            entries=$(gh api graphql -f query="$query" -f owner="${GITHUB_REPOSITORY%/*}" \
              -f name="${GITHUB_REPOSITORY#*/}" -f branch="${BASE_REF#refs/heads/}" \
              --jq '.data.repository.mergeQueue.entries.nodes')
            position=$(jq -r --arg pr "$pr" --arg sha "$GITHUB_SHA" \
              '.[] | select(.pullRequest.number == ($pr | tonumber) and .headCommit.oid == $sha) | .position' <<<"$entries")
            if [ -z "$pr" ] || [ -z "$position" ]; then
              echo "::error::no merge queue entry for $GITHUB_REF at $GITHUB_SHA" >&2
              exit 1
            fi
            forks=$(jq -r --argjson pos "$position" \
              '.[] | select(.position <= $pos and .pullRequest.isCrossRepository) | "#\(.pullRequest.number)"' <<<"$entries")
            if [ -n "$forks" ]; then
              image=false
              echo "merge group carries fork PRs $forks: gate not applicable" >> "$GITHUB_STEP_SUMMARY"
            else
              git fetch --no-tags --depth=1 origin "$BASE_SHA"
              base=$BASE_SHA
            fi
          elif [ -n "$PR" ]; then
            # HEAD is GitHub's PR merge commit; diff against its first parent.
            # The event's base sha can move past it (base force-pushed after
            # the merge was cached) and would charge the PR with the base's gains.
            git rev-parse --verify -q HEAD^2 >/dev/null
            base=$(git rev-parse HEAD^1)
          fi
          if [ -n "$base" ]; then
            base_manifest="$RUNNER_TEMP/base-build-pins.json"
            changed_paths="$RUNNER_TEMP/changed-paths"
            git show "${base}:.github/build-pins.json" >"$base_manifest"
            git diff --name-only -z "$base" HEAD -- >"$changed_paths"
            result=$(bash .github/scripts/repro-gate-changes \
              .github/build-pins.json "$base_manifest" "$changed_paths")
            image=$(sed -n 's/^image=//p' <<<"$result")
            [[ "$image" =~ ^(true|false)$ ]]
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          ref=$(git rev-parse HEAD)
          echo "c8s_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "worker image relevant: $image (host binary and core containers from \`$ref\`)" >> "$GITHUB_STEP_SUMMARY"

      # PR code must never run with the production module-signing key. This
      # keypair is shared by both legs, used only in unpublished gate images,
      # and has no authority after those images are discarded.
      - name: Generate gate-only module-signing key
        if: steps.diff.outputs.image == 'true'
        run: |
          set -euo pipefail
          install -d -m 0700 gate-signing
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -subj "/CN=c8s image reproducibility gate/" \
            -days 1 -set_serial 1 \
            -keyout gate-signing/module-signing.key \
            -out gate-signing/module-signing.crt
          chmod 0600 gate-signing/module-signing.key

      - name: Share gate-only module-signing key
        if: steps.diff.outputs.image == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-signing-${{ github.run_id }}
          path: gate-signing
          if-no-files-found: error
          retention-days: 1
          # Full reruns replace it; failed-job reruns reuse the prior artifact.
          overwrite: true

  core-images:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go-c8s
      - run: make build-c8s
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Build unpublished core images
        run: bash .github/scripts/build-gate-images.sh gate-core-images.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-core-images-${{ github.run_id }}
          path: gate-core-images.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build-a:
    needs: [changes, core-images]
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/c8s-image.yml
    with:
      gate: true
      leg: a
      c8s_ref: ${{ needs.changes.outputs.c8s_ref }}
      gate_signing_artifact: module-signing-${{ github.run_id }}
      gate_images_artifact: gate-core-images-${{ github.run_id }}

  build-b:
    needs: [changes, core-images]
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/c8s-image.yml
    with:
      gate: true
      leg: b
      c8s_ref: ${{ needs.changes.outputs.c8s_ref }}
      gate_signing_artifact: module-signing-${{ github.run_id }}
      gate_images_artifact: gate-core-images-${{ github.run_id }}

  compare:
    # The required check: green on pull requests into main, on fork code and
    # when no measured input changed; otherwise enforce every build and comparison selected by the
    # classifier.
    needs: [changes, build-a, build-b]
    # Superseded runs must not leave a failed comparison behind.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Change classification must have succeeded
        if: needs.changes.result != 'success' && needs.changes.result != 'skipped'
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          echo "change-classification result: $RESULT" >&2
          exit 1

      - name: Builds run in the merge queue
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: echo "the reproducibility builds run in the merge queue" >> "$GITHUB_STEP_SUMMARY"
      - name: Nothing measurement-gate-relevant changed
        if: (github.event_name != 'pull_request' || github.base_ref != 'main') && needs.changes.outputs.image != 'true'
        run: echo "no gated measurement inputs changed — gate not applicable" >> "$GITHUB_STEP_SUMMARY"
      - name: Legs must have succeeded
        if: needs.changes.outputs.image == 'true'
        env:
          A: ${{ needs.build-a.result }}
          B: ${{ needs.build-b.result }}
        run: |
          set -euo pipefail
          test "$A" = success && test "$B" = success || { echo "leg results: a=$A b=$B" >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.image == 'true'
        with:
          pattern: gate-*-${{ github.run_id }}-*
          path: evidence
      - name: Every measured value must match
        if: needs.changes.outputs.image == 'true'
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob, json, os, sys
          run_id = os.environ["GITHUB_RUN_ID"]
          fail = False
          lines = ["### image repro gate", "", "| platform | field | verdict |", "|---|---|---|"]
          for plat in ("tdx", "snp"):
              legs = {}
              for leg in ("a", "b"):
                  # The builder names the directory after the variant it built.
                  found = glob.glob(f"evidence/gate-*-{plat}-{run_id}-{leg}")
                  if len(found) != 1:
                      sys.exit(f"want one evidence directory for {plat} leg {leg}, got {found}")
                  d = found[0]
                  m = json.load(open(f"{d}/manifest.json"))
                  # The report timestamp is metadata, not a baked byte.
                  m.get("build", {}).pop("timestamp", None)
                  legs[leg] = (m, open(f"{d}/roothash").read().strip())
              (ma, ra), (mb, rb) = legs["a"], legs["b"]
              fail = fail or ma != mb or ra != rb
              lines.append(f"| {plat} | manifest (sans timestamp) | {'identical' if ma == mb else '**DIFFERS**'} |")
              lines.append(f"| {plat} | roothash `{ra[:12]}…` | {'identical' if ra == rb else '**DIFFERS**'} |")
              if ma != mb:
                  a_flat = json.dumps(ma, sort_keys=True, indent=0).splitlines()
                  b_flat = json.dumps(mb, sort_keys=True, indent=0).splitlines()
                  for line in sorted(set(a_flat) ^ set(b_flat)):
                      print(f"{plat} manifest delta: {line.strip()}", file=sys.stderr)
              if ra != rb:
                  print(f"{plat} roothash delta: a={ra} b={rb}", file=sys.stderr)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(lines) + "\n")
          sys.exit(1 if fail else 0)
          EOF
