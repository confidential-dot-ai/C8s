# Staged-stack TDX regression, called after merge or dispatched manually.
# Exact-image acceptance has a separate automatic-only caller chain in
# tdx-image-acceptance.yml. Shared lifecycle: ../actions/tdx-metal-e2e/action.yml.
name: tdx-metal-e2e

on:
  workflow_call:
    inputs:
      c8s_ref:
        description: 'c8s ref to test, on the node image built from that exact commit. Empty = the checked-out HEAD.'
        required: false
        type: string
        default: ''
      keep_cvm:
        description: 'leave the CVM running for debugging instead of tearing it down'
        required: false
        type: boolean
        default: false
      suite_artifact:
        description: 'optional extra suite: an artifact of the calling run, see .github/actions/extra-suite'
        required: false
        type: string
        default: ''
      suite_run:
        description: 'command that runs the extra suite; empty skips it'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      c8s_ref:
        description: 'c8s ref for the CLI and tests, on the node image built from that exact commit (rke2-tdx-cdi-<sha> must be published). Empty = the checked-out HEAD.'
        required: false
        default: ''
      keep_cvm:
        description: 'Skip teardown to debug a failure. The reaper still clears it after 3h.'
        required: false
        type: boolean
        default: false
      pod_acceptance:
        description: 'Boot the pinned production server and two Pods for native TDX connectivity and 65-minute renewal; always clean up'
        required: false
        type: boolean
        default: false
      pod_runtime_diagnostic:
        description: 'Capture owned Pod guest runtime diagnostics with the paired development image; never production acceptance'
        required: false
        type: boolean
        default: false
      pod_diagnostic:
        description: 'Boot the paired rke2-tdx-dev image of pod_image_source and capture its serial log; always clean up'
        required: false
        type: boolean
        default: false
      pod_image_source:
        description: 'With pod_diagnostic: full SHA of the commit whose dev image to boot (rke2-tdx-dev-<sha7> must be published). Empty = this commit.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read # Safe orphan-run status checks.
  packages: read # The acme check reads the component images.

concurrency:
  # Preserve the shared-root lane; owned runtime diagnostics have their own fixed queue.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.pod_runtime_diagnostic && !inputs.pod_diagnostic && !inputs.pod_acceptance && 'tdx-pod-runtime-diagnostic' || 'tdx-metal-e2e' }}
  cancel-in-progress: false

env:
  NS: confai-images
  VM: c8s-tdx-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate-pod-mode:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject combined Pod modes before provisioning
        env:
          ACCEPTANCE: ${{ inputs.pod_acceptance }}
          HISTORICAL: ${{ inputs.pod_diagnostic }}
          RUNTIME: ${{ inputs.pod_runtime_diagnostic }}
        run: |
          set -euo pipefail
          selected=0
          for mode in "$ACCEPTANCE" "$HISTORICAL" "$RUNTIME"; do
            if [[ "$mode" == true ]]; then selected=$((selected + 1)); fi
          done
          if [[ "$selected" -gt 1 ]]; then echo "::error::Select only one Pod mode"; exit 1; fi

  e2e:
    if: ${{ !inputs.pod_diagnostic && !inputs.pod_acceptance && !inputs.pod_runtime_diagnostic }}
    name: cvm (tdx-metal/rke2-node)
    runs-on: cvm-launcher-tdx
    timeout-minutes: ${{ inputs.suite_run != '' && 115 || 95 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Test the staged stack
        uses: ./.github/actions/tdx-metal-e2e
        with:
          c8s_ref: ${{ inputs.c8s_ref }}
          keep_cvm: ${{ inputs.keep_cvm }}
          suite_artifact: ${{ inputs.suite_artifact }}
          suite_run: ${{ inputs.suite_run }}

  pod-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pod_diagnostic && !inputs.pod_acceptance && !inputs.pod_runtime_diagnostic }}
    name: Pod boot diagnostics (not image acceptance)
    runs-on: cvm-launcher-tdx
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select the diagnostic image's source commit
        id: source
        env:
          SOURCE_INPUT: ${{ inputs.pod_image_source }}
        run: |
          set -euo pipefail
          source=${SOURCE_INPUT:-$GITHUB_SHA}
          [[ "$source" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::pod_image_source must be a full 40-hex commit SHA"; exit 1; }
          echo "sha=$source" >> "$GITHUB_OUTPUT"
          echo "diagnostic image: rke2-tdx-dev-${source:0:7}, CLI from \`$source\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the CLI source paired with the diagnostic image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}
          path: diagnostic-source

      - uses: ./.github/actions/setup-go-c8s
        with:
          go-version-file: diagnostic-source/go.mod
          cache: 'false'

      - name: Prepare the paired CLI and launcher tools
        timeout-minutes: 10
        shell: bash
        env:
          POD_DIAGNOSTIC_SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          POD_DIAGNOSTIC_DIR="$RUNNER_TEMP/pod-diagnostic"
          mkdir -p "$POD_DIAGNOSTIC_DIR/private" "$POD_DIAGNOSTIC_DIR/evidence" "$RUNNER_TEMP/pod-diagnostic-bin"
          test "$(git -C diagnostic-source rev-parse HEAD)" = "$POD_DIAGNOSTIC_SOURCE"
          test -z "$(git -C diagnostic-source status --porcelain)"
          (cd diagnostic-source && go build -o "$POD_DIAGNOSTIC_DIR/private/c8s" ./cmd/c8s)
          if ! command -v kubectl >/dev/null; then
            version=$(curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL https://dl.k8s.io/release/stable.txt)
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" -o "$RUNNER_TEMP/pod-diagnostic-bin/kubectl"
            checksum=$(curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl.sha256")
            printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/pod-diagnostic-bin/kubectl" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/pod-diagnostic-bin/kubectl"
            echo "$RUNNER_TEMP/pod-diagnostic-bin" >> "$GITHUB_PATH"
          fi
          go test ./test/tdxpod/
          go build -o "$RUNNER_TEMP/pod-diagnostic-bin/tdxpod" ./test/tdxpod

      - name: Run the owned diagnostic VM
        timeout-minutes: 38
        env:
          GH_TOKEN: ${{ github.token }}
          POD_DIAGNOSTIC_SOURCE: ${{ steps.source.outputs.sha }}
        run: "\"$RUNNER_TEMP/pod-diagnostic-bin/tdxpod\" boot run"

      - name: Remove this run's VM, launch Secret and private import
        if: always()
        timeout-minutes: 10
        run: "\"$RUNNER_TEMP/pod-diagnostic-bin/tdxpod\" boot cleanup"

      - name: Retain bounded boot evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-boot-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pod-diagnostic/evidence
          if-no-files-found: warn
          retention-days: 7


  pod-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pod_acceptance && !inputs.pod_diagnostic && !inputs.pod_runtime_diagnostic }}
    name: Connected Pod acceptance (native TDX)
    runs-on: cvm-launcher-tdx
    timeout-minutes: 150
    env:
      POD_ACCEPTANCE_SOURCE: ${{ github.workspace }}/acceptance-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-go-c8s
        with:
          cache: 'false'

      - name: Build the lane tool and select the production image's paired source
        id: pins
        env:
          DIAGNOSTIC: ${{ inputs.pod_diagnostic }}
        run: |
          set -euo pipefail
          test "$DIAGNOSTIC" != true
          mkdir -p "$RUNNER_TEMP/pod-acceptance-bin"
          go build -o "$RUNNER_TEMP/pod-acceptance-bin/tdxpod" ./test/tdxpod
          "$RUNNER_TEMP/pod-acceptance-bin/tdxpod" pins production >> "$GITHUB_OUTPUT"

      - name: Check out the clean CLI source paired with the image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.pins.outputs.source }}
          path: acceptance-source

      - name: Prepare paired CLI, public certificate probe and native tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          ACCEPTANCE_DIR="$RUNNER_TEMP/pod-acceptance"
          mkdir -p "$ACCEPTANCE_DIR/private" "$ACCEPTANCE_DIR/evidence" "$RUNNER_TEMP/pod-acceptance-bin"
          (cd acceptance-source && go build -o "$ACCEPTANCE_DIR/private/c8s" ./cmd/c8s)
          go build -o "$ACCEPTANCE_DIR/private/pod-mesh-probe" ./.github/scripts/pod-mesh-probe
          if ! command -v kubectl >/dev/null; then
            version=$(curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL https://dl.k8s.io/release/stable.txt)
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" -o "$RUNNER_TEMP/pod-acceptance-bin/kubectl"
            checksum=$(curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl.sha256")
            printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/pod-acceptance-bin/kubectl" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/pod-acceptance-bin/kubectl"
          fi
          curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL https://github.com/kubevirt/kubevirt/releases/download/v1.7.0/virtctl-v1.7.0-linux-amd64 -o "$RUNNER_TEMP/pod-acceptance-bin/virtctl"
          printf '%s  %s\n' ec6ee5619290e19590f3f9cd8b8dfce1affe0380eaaca77b3784c7b1acea86a6 "$RUNNER_TEMP/pod-acceptance-bin/virtctl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/pod-acceptance-bin/virtctl"
          echo "$RUNNER_TEMP/pod-acceptance-bin" >> "$GITHUB_PATH"
          go test ./test/tdxpod/ ./.github/scripts/pod-mesh-probe
          python3 test/tdxpod/fixtures/pod-connected/test_app.py

      - name: Run server and two Pods through timed credential renewal
        timeout-minutes: 125
        env:
          GH_TOKEN: ${{ github.token }}
        run: "\"$RUNNER_TEMP/pod-acceptance-bin/tdxpod\" acceptance run"

      - name: Remove this run's VMs, Services, Secrets and private disks
        if: always()
        timeout-minutes: 10
        run: "\"$RUNNER_TEMP/pod-acceptance-bin/tdxpod\" acceptance cleanup"

      - name: Retain bounded public acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-connected-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pod-acceptance/evidence
          if-no-files-found: warn
          retention-days: 7

  pod-runtime-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pod_runtime_diagnostic && !inputs.pod_diagnostic && !inputs.pod_acceptance }}
    name: Pod runtime diagnostics (development image)
    needs: validate-pod-mode
    runs-on: cvm-launcher-tdx
    timeout-minutes: 75
    env:
      POD_ACCEPTANCE_SOURCE: ${{ github.workspace }}/runtime-diagnostic-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-go-c8s
        with:
          cache: 'false'

      - name: Build the lane tool and select the development image's paired source
        id: pins
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pod-runtime-diagnostic-bin"
          go build -o "$RUNNER_TEMP/pod-runtime-diagnostic-bin/tdxpod" ./test/tdxpod
          "$RUNNER_TEMP/pod-runtime-diagnostic-bin/tdxpod" pins development >> "$GITHUB_OUTPUT"

      - name: Check out the clean CLI source paired with the image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.pins.outputs.source }}
          path: runtime-diagnostic-source

      - name: Prepare paired CLI, PTY console and native tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          umask 077
          ACCEPTANCE_DIR="$RUNNER_TEMP/pod-runtime-diagnostic"
          mkdir -p "$ACCEPTANCE_DIR/private" "$ACCEPTANCE_DIR/evidence" "$RUNNER_TEMP/pod-runtime-diagnostic-bin"
          (cd runtime-diagnostic-source && go build -o "$ACCEPTANCE_DIR/private/c8s" ./cmd/c8s)
          if ! command -v kubectl >/dev/null; then
            version=$(curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL https://dl.k8s.io/release/stable.txt)
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl" -o "$RUNNER_TEMP/pod-runtime-diagnostic-bin/kubectl"
            checksum=$(curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL "https://dl.k8s.io/release/$version/bin/linux/amd64/kubectl.sha256")
            printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/pod-runtime-diagnostic-bin/kubectl" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/pod-runtime-diagnostic-bin/kubectl"
          fi
          curl --retry 3 --connect-timeout 10 --max-time 60 -fsSL https://github.com/kubevirt/kubevirt/releases/download/v1.7.0/virtctl-v1.7.0-linux-amd64 -o "$RUNNER_TEMP/pod-runtime-diagnostic-bin/virtctl"
          printf '%s  %s\n' ec6ee5619290e19590f3f9cd8b8dfce1affe0380eaaca77b3784c7b1acea86a6 "$RUNNER_TEMP/pod-runtime-diagnostic-bin/virtctl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/pod-runtime-diagnostic-bin/virtctl"
          echo "$RUNNER_TEMP/pod-runtime-diagnostic-bin" >> "$GITHUB_PATH"
          if ! command -v expect >/dev/null || ! command -v jq >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends expect jq
          fi
          go test ./test/tdxpod/
          python3 test/tdxpod/fixtures/pod-connected/test_app.py

      - name: Observe the owned server and two development Pod guests
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ github.token }}
        run: "\"$RUNNER_TEMP/pod-runtime-diagnostic-bin/tdxpod\" runtime run"

      - name: Remove this run's VMs, Services, Secrets and private disks
        if: always()
        timeout-minutes: 10
        run: "\"$RUNNER_TEMP/pod-runtime-diagnostic-bin/tdxpod\" runtime cleanup"

      - name: Retain projected runtime observations only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-runtime-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pod-runtime-diagnostic/evidence
          if-no-files-found: warn
          retention-days: 3
