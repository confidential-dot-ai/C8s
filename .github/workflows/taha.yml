name: Trust Authority HA suite

# The Raft replica harness this workflow ran is gone with the Raft backend.
# The workflow stays because branch protection requires its result check by
# name; remove the two together.
on:
  pull_request:
    branches: [main, beta, "feat/**", "refactor/**"]
  merge_group:
    types: [checks_requested]
    branches: [main, beta, "feat/**", "refactor/**"]

concurrency:
  group: taha-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  result:
    # GitHub branch protection requires this check name.
    name: CDS HA suite result
    runs-on: ubuntu-latest
    steps:
      - name: Nothing to run
        run: "true"
