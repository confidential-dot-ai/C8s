# Watches the confos / attestation-rs source pins the measured builds ride
# and opens bump PRs when upstream main moves — never merges: each bump
# rolls a measurement, so a human owns the merge. The mkosi ref is not
# watched independently: it is scraped from the target confos commit's own
# base.yml, which keeps MinimumVersion= and the installed mkosi in lockstep
# by construction. The canonical data lives in .github/build-pins.json;
# .github/scripts/pin-manifest.sh validates the full schema before updating it.
#
# The one measurement domain today is node-image (node rootfs / RTMR + SNP
# digests); each roll is its own PR.
#
# Authentication prefers a short-lived, repository-scoped GitHub App token.
# Checkout, push, and gh use one credential; an unconfigured App falls back to
# GITHUB_TOKEN, while invalid configured credentials fail before checkout.
name: confos pin watch

on:
  schedule:
    - cron: "23 6 * * 1" # weekly; a no-op while the pins match upstream main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: confos-pin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Create pin-watch GitHub App token
        id: pin-watch-app-token
        if: ${{ vars.PIN_WATCH_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PIN_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_WATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Persist the same token used by gh so App-created PR updates also
          # trigger CI automatically; github.token remains the fallback.
          token: ${{ steps.pin-watch-app-token.outputs.token || github.token }}
      - name: Bump stale pins and open the PR
        env:
          GH_TOKEN: ${{ steps.pin-watch-app-token.outputs.token || github.token }}
          DOMAIN: node-image
        run: |
          set -euo pipefail
          confos=$(gh api repos/confidential-dot-ai/confidential-os-builder/commits/main --jq .sha)
          attest=$(gh api repos/confidential-dot-ai/attestation-rs/commits/main --jq .sha)
          mapfile -t mkosi_lines < <(
            curl -fsSL --retry 3 \
              "https://raw.githubusercontent.com/confidential-dot-ai/confidential-os-builder/${confos}/.github/workflows/base.yml" |
              grep -oE 'systemd/mkosi@[0-9a-f]{40} # v[0-9.]+'
          )
          if (( ${#mkosi_lines[@]} != 1 )); then
            echo "::error::expected exactly one mkosi pin in confos base.yml; found ${#mkosi_lines[@]}"
            exit 1
          fi
          mkosi_line=${mkosi_lines[0]}
          out=$(bash .github/scripts/pin-manifest.sh update \
            --manifest .github/build-pins.json \
            --domain "$DOMAIN" \
            --confos "$confos" --attest "$attest" \
            --mkosi-sha "$(grep -oE '[0-9a-f]{40}' <<<"$mkosi_line")" \
            --mkosi-ver "$(grep -oE 'v[0-9.]+$' <<<"$mkosi_line")")
          echo "$out"
          grep -q '^no-drift$' <<<"$out" && exit 0
          changes=$(git status --short --untracked-files=all)
          if [ "$changes" != " M .github/build-pins.json" ]; then
            echo "::error::pin updater changed an unexpected path"
            printf '%s\n' "$changes"
            exit 1
          fi
          branch="pin-watch/${DOMAIN}-${confos:0:12}-${attest:0:12}"
          title="build(${DOMAIN}): pin-watch bump — confos ${confos:0:7}, attestation-rs ${attest:0:7}"
          open_pr=$(
            gh pr list --state open --limit 100 \
              --json headRefName,isCrossRepository,number |
              jq -r --arg prefix "pin-watch/${DOMAIN}-" \
                '[.[] | select(.isCrossRepository == false and (.headRefName | startswith($prefix)))][0].number // empty'
          )
          if [ -n "$open_pr" ]; then
            echo "pin-watch PR #$open_pr is already open; leaving its review branch untouched" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add -- .github/build-pins.json
          test "$(git diff --cached --name-only)" = ".github/build-pins.json"
          desired_tree=$(git write-tree)
          base_oid=$(git rev-parse HEAD)
          base_tree=$(git rev-parse 'HEAD^{tree}')

          remote_oid=
          remote_tree=
          if remote_ref=$(git ls-remote --exit-code --heads origin "refs/heads/$branch"); then
            remote_oid=${remote_ref%%[[:space:]]*}
            git fetch --no-tags origin \
              "+refs/heads/$branch:refs/remotes/origin/$branch"
            remote_tree=$(git rev-parse "${remote_oid}^{tree}")
          else
            remote_status=$?
            [ "$remote_status" -eq 2 ] || exit "$remote_status"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$base_oid" >/dev/null
            remote_oid=$base_oid
            remote_tree=$base_tree
          fi

          if [ "$remote_tree" = "$desired_tree" ]; then
            new_oid=$remote_oid
          else
            if [ "$remote_tree" != "$base_tree" ]; then
              # A branch left behind by a pin-watch PR closed without merging
              # differs from main only in the manifest; anything else on it
              # is someone's work and stays put.
              if [ "$(git diff-tree -r --name-only "$base_tree" "$remote_tree")" != ".github/build-pins.json" ]; then
                echo "::error::candidate branch $branch carries changes beyond .github/build-pins.json; refusing to overwrite it (delete the branch to let pin-watch recreate it)"
                exit 1
              fi
              echo "resetting stale pin-watch branch $branch to $base_oid" >> "$GITHUB_STEP_SUMMARY"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" \
                -f sha="$base_oid" -F force=true >/dev/null
              remote_oid=$base_oid
            fi
            mutation=$(cat <<'GRAPHQL'
          mutation($repository: String!, $branch: String!, $expected: GitObjectID!, $headline: String!, $path: String!, $contents: Base64String!) {
            createCommitOnBranch(input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch}
              expectedHeadOid: $expected
              message: {headline: $headline}
              fileChanges: {additions: [{path: $path, contents: $contents}]}
            }) {
              commit { oid }
            }
          }
          GRAPHQL
            )
            commit_json=$(gh api graphql \
              -f query="$mutation" \
              -f repository="$GITHUB_REPOSITORY" \
              -f branch="$branch" \
              -f expected="$remote_oid" \
              -f headline="$title" \
              -f path=.github/build-pins.json \
              -f contents="$(base64 -w0 .github/build-pins.json)")
            new_oid=$(jq -er '.data.createCommitOnBranch.commit.oid' <<<"$commit_json")
          fi

          verified=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${new_oid}" \
            --jq '.commit.verification.verified')
          if [ "$verified" != true ]; then
            echo "::error::GitHub did not verify pin-watch commit $new_oid; refusing to open the PR"
            exit 1
          fi
          gh pr create --head "$branch" --title "$title" --body "Automated \`${DOMAIN}\` pin-set bump in \`.github/build-pins.json\`: confos main \`${confos:0:9}\`, attestation-rs main \`${attest:0:9}\`, and mkosi \`${mkosi_line#systemd/mkosi@}\` from that confos commit's base workflow. This rolls the affected measurements; review the upstream logs and reproducibility gate before merging."
