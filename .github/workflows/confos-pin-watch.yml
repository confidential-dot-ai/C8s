# Watches the confos and attestation-rs source pins the measured builds ride
# and opens a bump PR when either repository publishes a new release — never
# merges: each bump rolls a measurement, so a human owns the merge. Releases,
# not main: images/node-guest/README.md, "Component pins". The mkosi ref is
# not watched independently: it is scraped from the target confos commit's own
# base.yml, which keeps MinimumVersion= and the installed mkosi in lockstep by
# construction. The canonical data lives in .github/build-pins.json;
# .github/scripts/pin-manifest.sh validates the full schema before updating it.
# An attestation-rs bump also resolves the release's attestation-api image to
# its digest (the CDS image's build input) and writes the same digest to the
# chart's attestationApi pinnedDigest, the host DaemonSet's copy that
# pin-hygiene holds equal to the manifest.
#
# The one measurement domain today is node-image (node rootfs / RTMR + SNP
# digests); each roll is its own PR.
#
# Authentication prefers a short-lived, repository-scoped GitHub App token.
# Checkout, push, and gh use one credential; an unconfigured App falls back to
# GITHUB_TOKEN, while invalid configured credentials fail before checkout.
name: confos pin watch

on:
  schedule:
    - cron: "23 6 * * 1" # weekly; a no-op while the pins match the latest releases
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: confos-pin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Create pin-watch GitHub App token
        id: pin-watch-app-token
        if: ${{ vars.PIN_WATCH_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PIN_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_WATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Persist the same token used by gh so App-created PR updates also
          # trigger CI automatically; github.token remains the fallback.
          token: ${{ steps.pin-watch-app-token.outputs.token || github.token }}
      - name: Bump stale pins and open the PR
        env:
          GH_TOKEN: ${{ steps.pin-watch-app-token.outputs.token || github.token }}
          DOMAIN: node-image
        run: |
          set -euo pipefail
          eval "$(bash .github/scripts/pin-manifest.sh export \
                    --manifest .github/build-pins.json --domain "$DOMAIN" --format github-env)"
          confos=$CONFOS_REF confos_tag=$CONFOS_TAG
          attest=$ATTESTATION_RS_REF attest_tag=$ATTESTATION_RS_TAG
          # Only a release newer than the pinned one moves a pin; the latest
          # release being an older line, or the pinned one, keeps it.
          newer=$(bash .github/scripts/release-pin.sh confidential-dot-ai/confidential-os-builder --floor "$confos_tag")
          [ -z "$newer" ] || read -r confos_tag confos <<<"$newer"
          newer=$(bash .github/scripts/release-pin.sh confidential-dot-ai/attestation-rs --floor "$attest_tag")
          # The digest follows the release, never a repointed tag: an unmoved
          # pin keeps the digest it was set with (pin-hygiene checks the tag
          # still names it). A release whose image attestation-rs has not
          # named yet fails here, so no manifest points at a missing image.
          attest_digest=$ATTESTATION_API_DIGEST
          if [ -n "$newer" ]; then
            read -r attest_tag attest <<<"$newer"
            attest_digest=$(bash .github/scripts/ghcr-digest.sh confidential-dot-ai/attestation-api "$attest_tag")
          fi
          read -r mkosi_sha mkosi_ver < <(bash .github/scripts/confos-mkosi-pin.sh "$confos")
          out=$(bash .github/scripts/pin-manifest.sh update \
            --manifest .github/build-pins.json \
            --domain "$DOMAIN" \
            --confos "$confos" --confos-tag "$confos_tag" \
            --attest "$attest" --attest-tag "$attest_tag" \
            --attest-digest "$attest_digest" \
            --mkosi-sha "$mkosi_sha" --mkosi-ver "$mkosi_ver")
          echo "$out"
          grep -q '^no-drift$' <<<"$out" && exit 0
          # The host DaemonSet's copy of the digest moves with the manifest (a
          # no-op when only confos moved). Both files are staged; the commit
          # below carries whatever changed, and nothing else may have.
          values=internal/helmchart/c8s/values.yaml
          bash .github/scripts/chart-attestation-api-digest.sh set "$attest_digest" "$values"
          git add -- .github/build-pins.json "$values"
          mapfile -t files < <(git diff --cached --name-only)
          if git status --porcelain --untracked-files=all | grep -qv '^M  '; then
            echo "::error::pin updater changed an unexpected path"
            git status --porcelain --untracked-files=all
            exit 1
          fi
          branch="pin-watch/${DOMAIN}-${confos:0:12}-${attest:0:12}"
          title="build(${DOMAIN}): pin-watch bump — confos ${confos_tag}, attestation-rs ${attest_tag}"
          open_pr=$(
            gh pr list --state open --limit 100 \
              --json headRefName,isCrossRepository,number |
              jq -r --arg prefix "pin-watch/${DOMAIN}-" \
                '[.[] | select(.isCrossRepository == false and (.headRefName | startswith($prefix)))][0].number // empty'
          )
          if [ -n "$open_pr" ]; then
            echo "pin-watch PR #$open_pr is already open; leaving its review branch untouched" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          desired_tree=$(git write-tree)
          base_oid=$(git rev-parse HEAD)
          base_tree=$(git rev-parse 'HEAD^{tree}')

          remote_oid=
          remote_tree=
          if remote_ref=$(git ls-remote --exit-code --heads origin "refs/heads/$branch"); then
            remote_oid=${remote_ref%%[[:space:]]*}
            git fetch --no-tags origin \
              "+refs/heads/$branch:refs/remotes/origin/$branch"
            remote_tree=$(git rev-parse "${remote_oid}^{tree}")
          else
            remote_status=$?
            [ "$remote_status" -eq 2 ] || exit "$remote_status"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$base_oid" >/dev/null
            remote_oid=$base_oid
            remote_tree=$base_tree
          fi

          if [ "$remote_tree" = "$desired_tree" ]; then
            new_oid=$remote_oid
          else
            if [ "$remote_tree" != "$base_tree" ]; then
              # A branch left behind by a pin-watch PR closed without merging
              # differs from main only in the manifest and the chart digest;
              # anything else on it is someone's work and stays put.
              if git diff-tree -r --name-only "$base_tree" "$remote_tree" | grep -qvxF -e .github/build-pins.json -e "$values"; then
                echo "::error::candidate branch $branch carries changes beyond .github/build-pins.json and $values; refusing to overwrite it (delete the branch to let pin-watch recreate it)"
                exit 1
              fi
              echo "resetting stale pin-watch branch $branch to $base_oid" >> "$GITHUB_STEP_SUMMARY"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" \
                -f sha="$base_oid" -F force=true >/dev/null
              remote_oid=$base_oid
            fi
            mutation=$(cat <<'GRAPHQL'
          mutation($repository: String!, $branch: String!, $expected: GitObjectID!, $headline: String!, $additions: [FileAddition!]!) {
            createCommitOnBranch(input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch}
              expectedHeadOid: $expected
              message: {headline: $headline}
              fileChanges: {additions: $additions}
            }) {
              commit { oid }
            }
          }
          GRAPHQL
            )
            additions=$(for f in "${files[@]}"; do
              jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path: $path, contents: $contents}'
            done | jq -s .)
            commit_json=$(jq -n \
              --arg query "$mutation" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg branch "$branch" \
              --arg expected "$remote_oid" \
              --arg headline "$title" \
              --argjson additions "$additions" \
              '{query: $query, variables: {repository: $repository, branch: $branch, expected: $expected, headline: $headline, additions: $additions}}' \
              | gh api graphql --input -)
            new_oid=$(jq -er '.data.createCommitOnBranch.commit.oid' <<<"$commit_json")
          fi

          verified=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${new_oid}" \
            --jq '.commit.verification.verified')
          if [ "$verified" != true ]; then
            echo "::error::GitHub did not verify pin-watch commit $new_oid; refusing to open the PR"
            exit 1
          fi
          gh pr create --head "$branch" --title "$title" --body "Automated \`${DOMAIN}\` pin-set bump in \`.github/build-pins.json\` to the latest releases: confos \`${confos_tag}\` (\`${confos:0:9}\`) with mkosi \`${mkosi_sha:0:9} ${mkosi_ver}\` from that confos commit's base workflow, and attestation-rs \`${attest_tag}\` (\`${attest:0:9}\`, image \`${attest_digest:0:19}…\`, also written to the chart's \`attestationApi\` \`pinnedDigest\`). This rolls the affected measurements; review the release notes and the reproducibility gate before merging. An attestation-rs release that changes the attestation-api config or /verify contract needs the c8s and confos ports added to this PR."
