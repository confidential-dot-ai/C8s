name: Docker

on:
  # Publish component images on EVERY push to main.
  #
  # NO paths filter on the push trigger, deliberately. This workflow is the head
  # of the post-merge chain: confidential-e2e fires off its completion via
  # workflow_run, so a path gate here does not just skip an image build, it
  # deletes that merge's SEV-SNP integration run. Its comment says "run the
  # c8s e2e ... for every main merge", which was silently false for 25 of the
  # last 100 merges. Verified: 0e3a876 and a7eb195 have ZERO Docker runs, their
  # confidential-e2e workflow_run instances were skipped, and the only green
  # runs on those shas came from a human pressing workflow_dispatch.
  #
  # A push that changes no buildable source is cheap AND is the correct thing to
  # publish: paths-filter reports every component unchanged, docker-build-matrix.sh
  # emits has_images=false with all five components in retag_matrix, `images`
  # skips, and retag-unchanged aliases each component's current :main manifest to
  # :<short-sha> (`oras tag` writes the registry tag index only, no layer upload).
  # That alias IS what the commit deploys, so e2e-c8s.yml's resolve_tag() hits
  # :<short-sha> on its first probe instead of walking ancestry. This exact shape
  # already runs green end to end: run 30024702633 (45cd7a0) took 18s, and its
  # cascade produced a successful SEV-SNP e2e (30024734575).
  #
  # The protected beta branch runs the same chain and publishes prereleases.
  push:
    branches: [main, beta]
  # PRs stay path-gated: a PR run builds and scans but publishes nothing (see the
  # push/dispatch gates on the login and build-push steps), so a docs-only PR has
  # nothing to gain from it. The list is inlined because the YAML anchor it used
  # to alias (&docker-paths) lived on the push trigger above.
  pull_request:
    branches: [main, beta]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "cmd/**/Dockerfile"
      - "cmd/nri-image-policy/enable-nri.sh"
      - "internal/helmchart/c8s/**"
      - "Makefile"
      - ".github/workflows/docker.yml"
  # Manual rebuild escape hatch, for a rebuild with NO new commit behind it: a
  # base-image refresh or a registry re-push. workflow_dispatch publishes EVERY
  # component image at this commit's tags (the matrix fans out to all of them,
  # see docker-build-matrix.sh). NOTE: dispatching this workflow just to give
  # a docs-only merge its images and its TEE run is no
  # longer necessary; the unfiltered push trigger above covers that.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read   # dorny/paths-filter calls the PR files API on PR events

env:
  REGISTRY: ghcr.io

jobs:
  # Per-image jobs run only when the component's own cmd/<X> or
  # internal/cmds/<X> changed (this applies to both PR events and
  # pushes to main). Shared code (pkg/**, root internal/** minus
  # cmds/helmchart, go.mod/sum, Makefile, this workflow) fans out to
  # every image. The final release job rebuilds the complete component set from
  # this exact revision before applying its SemVer aliases.
  #
  # On a push to main, unchanged components keep their existing `main` tag
  # pointing at the previous build's manifest —
  # which is the correct state, since nothing changed for them.
  # `latest` is reserved for the complete stable release rebuild below.
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.docker-matrix.outputs.matrix }}
      has_images: ${{ steps.docker-matrix.outputs.has_images }}
      # retag-unchanged gates on these. A step output that isn't mapped here
      # reads as empty downstream — `has_retag == 'true'` was silently false on
      # every push, so the retag job never ran and unchanged components got no
      # `:<short-sha>` tag.
      retag_matrix: ${{ steps.docker-matrix.outputs.retag_matrix }}
      has_retag: ${{ steps.docker-matrix.outputs.has_retag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A component filter that names a directory which does not exist matches
      # NOTHING, so paths-filter reports that component unchanged, the build is
      # skipped, and retag-unchanged aliases :main onto the new sha anyway. The
      # published tag then lies about its contents. That is not hypothetical:
      # this filter pointed at internal/cmds/nriimagepolicy, which was correct
      # when written, until the package dir was renamed to nri-image-policy and
      # the filter did not move with it. For two months plugin-only commits
      # never rebuilt the image and :main resolved to a stale binary. Nothing
      # failed loudly; it surfaced downstream as a cluster whose NRI plugin
      # would not start. A rename is the expected way to break these, so fail
      # closed here rather than trusting the glob to stay true.
      - name: paths-filter globs must reference real directories
        run: |
          set -euo pipefail
          missing=0
          for p in $(grep -oE '(cmd|internal/cmds)/[A-Za-z0-9_.-]+/\*\*' \
                       .github/workflows/docker.yml | sed 's|/\*\*$||' | sort -u); do
            if [ -d "$p" ]; then echo "ok      $p"; else echo "MISSING $p"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::docker.yml paths-filter references a directory that does not exist: the component would be classed unchanged and silently skip its image build"
            exit 1; }
      # Skip on workflow_dispatch: a manual run has no before/after diff base for
      # paths-filter to compute against, and we fan out to every component anyway
      # (docker-build-matrix.sh has an explicit dispatch fan-out). With
      # this step skipped its outputs read empty downstream, which the matrix
      # script correctly sees as "no per-component filter" before falling through
      # to the fan-out.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            shared-core:
              - '{pkg/**,internal/**}'
              - '!internal/cmds/**'
              - '!internal/helmchart/**'
              - '!**/*_test.go'
              - '!**/*.md'
              - '!**/testdata/**'
            shared-cmdsutil:
              # cmdsutil is shared across every component's main package
              - 'internal/cmds/cmdsutil/**'
              - '!**/*_test.go'
              - '!**/*.md'
              - '!**/testdata/**'
            shared-root:
              - '{go.mod,go.sum,go.work,go.work.sum,Makefile,.github/workflows/docker.yml}'
            c8s:
              # cmd/c8s is the multi-mode binary used by the operator image;
              # it imports every internal/cmds subcommand, including get-cert.
              # internal/helmchart/c8s is embedded into the binary (see
              # internal/helmchart's //go:embed), so a chart-only change must
              # rebuild it too.
              - '{cmd/c8s/**,internal/cmds/**,internal/helmchart/c8s/**}'
            cds:
              - '{cmd/cds/**,internal/cmds/cds/**}'
            get-cert:
              - '{cmd/get-cert/**,internal/cmds/getcert/**}'
            armtls-mesh:
              - '{cmd/armtls-mesh/**,internal/cmds/armtlsmesh/**}'
            nri-image-policy:
              - '{cmd/nri-image-policy/**,internal/cmds/nri-image-policy/**}'
            volumed:
              - '{cmd/volumed/**,internal/cmds/volumed/**}'
      - name: Build Docker matrix
        id: docker-matrix
        env:
          # A beta push rebuilds every component: retag-unchanged copies :main,
          # which does not describe a beta commit.
          SHARED: ${{ github.ref == 'refs/heads/beta' || steps.filter.outputs['shared-core'] == 'true' || steps.filter.outputs['shared-cmdsutil'] == 'true' || steps.filter.outputs['shared-root'] == 'true' }}
          C8S: ${{ steps.filter.outputs.c8s }}
          CDS: ${{ steps.filter.outputs.cds }}
          GET_CERT: ${{ steps.filter.outputs['get-cert'] }}
          ARMTLS_MESH: ${{ steps.filter.outputs['armtls-mesh'] }}
          NRI_IMAGE_POLICY: ${{ steps.filter.outputs['nri-image-policy'] }}
          VOLUMED: ${{ steps.filter.outputs.volumed }}
        run: .github/scripts/docker-build-matrix.sh

  go-modules:
    name: Cache Go Modules
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.has_images == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-c8s
      - name: Download Go modules
        run: go mod download

  images:
    name: Docker (${{ matrix.binary }})
    runs-on: ubuntu-latest
    # A build here is under a minute; a wedged registry or apt mirror
    # must not hold the job for hours.
    timeout-minutes: 30
    needs: [changes, go-modules]
    if: needs.changes.outputs.has_images == 'true'
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - name: Build Go binary
        run: make build-c8s

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Publish on push AND on workflow_dispatch (the manual rebuild path).
          # PR runs still only `load` for the scan.
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          load: ${{ !(github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          # Apply ALL computed tags, not just tags[0]. metadata-action emits
          # `type=sha,prefix=` (the 7-char short SHA). tags[0] is the
          # highest-priority *human* tag (main), so with the old single-tag push
          # the short-SHA tag never reached GHCR. A later release job performs the separate,
          # version-stamped all-component build and is the only writer of
          # `latest`.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache rides inside the pushed :main image (inline), not
          # the Actions cache: exporting every layer there filled a third
          # of the repository's 10 GB cap and evicted the small caches
          # image builds depend on (c8s-image.yml, apt-debs). The only
          # layers that can hit are the apt-get installs that precede the
          # binary COPY, and sharing those is what matters: the release
          # rebuild in semver-tag.yml resolves the same packages as the
          # image CI scanned instead of whatever the mirror holds later.
          # PR runs read :main and, not pushing, write nothing.
          cache-from: type=registry,ref=${{ matrix.image }}:main
          cache-to: type=inline

      - name: Scan Docker image
        id: container-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.meta.outputs.json != '' && fromJSON(steps.meta.outputs.json).tags[0] || format('{0}:ci', matrix.image) }}
          fail-build: false
      - name: Inspect action SARIF report
        run: cat ${{ steps.container-scan.outputs.sarif }}

  # For each component image NOT in this run's build matrix, copy the
  # `:main` tag's manifest under `:<short-sha>`. Without this job, a push that
  # only touched one component (say cmd/c8s/**) leaves cds, get-cert,
  # armtls-mesh, nri-image-policy with no `:<short-sha>` tag at all.
  #
  # Source = `:main` always: the manifest just (or previously) published
  # for an unchanged component. `oras tag` only mutates the registry's tag
  # index — no layer upload, no manifest rewrite — so the digest of
  # `:<short-sha>` is identical to whatever `:main` currently points at.
  retag-unchanged:
    name: Retag unchanged (${{ matrix.binary }})
    runs-on: ubuntu-latest
    needs: [changes, images]
    # Run when `images` either succeeded or was skipped (has_images=false
    # means nothing was rebuilt this run, so every component needs
    # retagging). `always()` is required so the job isn't auto-skipped
    # when `images` was skipped.
    if: |
      always()
      && github.event_name == 'push'
      && needs.changes.result == 'success'
      && (needs.images.result == 'success' || needs.images.result == 'skipped')
      && needs.changes.outputs.has_retag == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.retag_matrix) }}
    # Job-level permissions REPLACE the workflow-level block for this job, so
    # packages: write has to be restated here or `oras tag` loses its push scope.
    # actions: read is new, for the in-flight query in the first step.
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      # `oras tag IMAGE:main IMAGE:<short-sha>` copies whatever :main points at
      # RIGHT NOW, and this workflow has no concurrency group, so runs overlap.
      # Burst: source merge A lands (its build takes ~3m45s), non-source merge B
      # lands a minute later, B's retag finishes in ~20s and stamps the PRE-A
      # manifest onto sha_b. B's e2e then boots a CVM on binaries that predate
      # its own tree and reports GREEN. Measured on the last 100 merges: 3 such
      # pairs (bfe81c9 -> 8e49fb4, 0.4 min; f8dc9a1 -> 637da51, 1.1 min;
      # 56d38bd -> 567019e, 0.3 min). Run ids increase monotonically per repo,
      # so "id < ours" means "queued earlier". Bounded wait, then warn and go.
      #
      # Do NOT swap this for a workflow-level `concurrency:`: GitHub cancels the
      # PENDING run when a newer one queues into the same group, so a 3-merge
      # burst would drop the middle merge's Docker run entirely, taking its
      # images and its e2e with it.
      - name: Wait out older in-flight Docker runs on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          busy=0
          for i in $(seq 1 60); do
            if ! busy=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/docker.yml/runs?event=push&branch=main&per_page=50" \
                          --jq '.workflow_runs[] | select(.status != "completed") | .id' \
                        | awk -v me="$GITHUB_RUN_ID" 'NF && $1+0 < me+0' | wc -l | tr -d ' '); then
              echo "::warning::could not query in-flight Docker runs; proceeding without the ordering guard"
              busy=0
              break
            fi
            if [ "$busy" = "0" ]; then
              echo "no older in-flight Docker run on main"
              break
            fi
            echo "waiting on ${busy} older Docker run(s) on main (${i}/60)"
            sleep 15
          done
          if [ "$busy" != "0" ]; then
            echo "::warning::proceeding after a 15m wait; :main may lag an older in-flight build"
          fi
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Retag :main -> :${{ github.sha }} (short)
        env:
          IMAGE: ${{ matrix.image }}
          # github.sha is the 40-char commit SHA; metadata-action's
          # `type=sha,prefix=` emits the 7-char prefix. Match it.
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${FULL_SHA:0:7}"
          # A component in retag_matrix that has never been built on main has no
          # :main to copy. Warn and skip rather than fail: failing this leg fails
          # the whole Docker run, which blocks the TEE e2e for
          # a commit whose other four images are fine. A genuinely missing image
          # still surfaces loudly downstream as ImagePullBackOff.
          if ! oras manifest fetch "${IMAGE}:main" > /dev/null 2>&1; then
            echo "::warning::${IMAGE}:main does not exist; skipping retag for ${IMAGE}"
            exit 0
          fi
          echo "==> oras tag ${IMAGE}:main ${SHORT_SHA}"
          # Idempotent: re-runs of the same commit are no-ops if the
          # tag already points at the same manifest.
          oras tag "${IMAGE}:main" "${SHORT_SHA}"

  # Release publication is the final main-push stage: every build/retag leg must
  # succeed first. The called workflow rebuilds every component under a
  # commit-scoped staging tag, promotes the verified digests, and pushes the
  # chart before this Docker run completes. Its GITHUB_TOKEN-created Git tag
  # therefore does not need to trigger another workflow.
  release-tag:
    name: Publish SemVer release
    needs: [changes, go-modules, images, retag-unchanged]
    if: |
      always()
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
      && needs.changes.result == 'success'
      && (needs.go-modules.result == 'success' || needs.go-modules.result == 'skipped')
      && (needs.images.result == 'success' || needs.images.result == 'skipped')
      && (needs.retag-unchanged.result == 'success' || needs.retag-unchanged.result == 'skipped')
    uses: ./.github/workflows/semver-tag.yml
    permissions:
      actions: read # The called workflow serializes against older Docker runs.
      contents: write # Create the annotated release tag and its GitHub release.
      id-token: write # Sign the release statement keyless with Sigstore.
      packages: write # Alias component images and publish the Helm chart.
    with:
      target-sha: ${{ github.sha }}
