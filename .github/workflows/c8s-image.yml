# Build + publish the c8s confidential node image (TDX-measured RKE2 + NRI +
# attestation-api + NVIDIA stack in the verity rootfs). confos is the build
# tree (pinned CONFOS_REF); callers select the baked commit and publish policy.
# Output: ghcr.io/confidential-dot-ai/node-guest-base, one image per TEE:
# tags :rke2-{tdx,snp}[-cdi] / :rke2-{tdx,snp}[-cdi]-<sha>. Stable releases
# also receive :rke2-{tdx,snp}[-cdi]-vX.Y.Z in c8s-image-publish.yml. The
# pre-matrix :rke2[-cdi]* tags are frozen (TDX builds up to the rename).
# (pre-flip images stay frozen under c8s-base)
# (CDI image) + :rke2 / :rke2-<sha> (oras artifact). dev=true -> :rke2-dev-*.

on:
  workflow_call:
    inputs:
      dev:
        required: false
        type: boolean
        default: false
      c8s_ref:
        required: false
        type: string
        default: ""
      confos_ref:
        required: false
        type: string
        default: ""
      release_tag:
        description: "Canonical stable tag for this automatic build; forces exact artifacts before downstream promotion."
        required: false
        type: string
        default: ""
      gate:
        required: false
        type: boolean
        default: false
      leg:
        description: "Distinguishes gate artifacts when one caller runs several legs."
        required: false
        type: string
        default: ""
      gate_signing_artifact:
        description: "Artifact containing the throwaway keypair shared by gate legs."
        required: false
        type: string
        default: ""
    secrets:
      MODULE_SIG_KEY_PEM:
        description: "Production module-signing key; omitted by repro-gate callers."
        required: false

# The caller owns token permissions: c8s-image-publish.yml and
# c8s-image-manual.yml grant package write to trusted production/manual builds;
# image-repro-gate.yml grants read only to PR code.

concurrency:
  # Per triggering commit, not per ref (workflow_run's ref is always main).
  #
  # The inputs are part of the identity, not decoration. A workflow_dispatch has
  # no workflow_run event, so the commit term falls through to github.sha —
  # main's head — which is the SAME value for every dispatch between two pushes.
  # Without the inputs, two c8s_ref rebuilds, or a dev and a non-dev build, share
  # a group and queue behind each other (cancel-in-progress is false) despite
  # producing different images. Nothing about them needs serializing: a c8s_ref
  # rebuild pushes only :<variant>[-cdi]-<ref>, which is distinct per ref, and
  # dev builds carry their own -dev tags. They are empty on the workflow_run
  # path, so the auto path groups exactly as before.
  group: >-
    ${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.sha
    }}-${{ inputs.c8s_ref }}-${{ inputs.dev
    }}-${{ inputs.confos_ref }}-${{ inputs.release_tag }}-${{ inputs.gate
    }}-${{ inputs.leg }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  host-deps:
    name: Seed build-dep debs
    # One cold apt install per run instead of one per platform leg: the
    # legs otherwise fetch the same set concurrently from a mirror whose
    # throughput is the scarce resource. Warm runs cost a checkout and a
    # cache lookup. Same runner as the legs: the cache key carries the
    # runner image.
    if: |
      inputs.gate == true ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: the-machine
    timeout-minutes: 45
    steps:
      - name: Checkout c8s
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: c8s
          sparse-checkout: .github

      - name: Load measured-build pins
        id: pins
        env:
          CONFOS_REF_OVERRIDE: ${{ inputs.confos_ref }}
        run: |
          set -euo pipefail
          bash c8s/.github/scripts/pin-manifest.sh export \
            --manifest c8s/.github/build-pins.json \
            --domain node-image \
            --format github-output \
            --confos-override "$CONFOS_REF_OVERRIDE" >> "$GITHUB_OUTPUT"

      - name: Checkout confidential-os-builder (host-deps and its sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: confidential-dot-ai/confidential-os-builder
          ref: ${{ steps.pins.outputs.confos }}
          path: confidential-os-builder

      - name: Compute runner-image cache term
        id: image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Look up build-dep debs
        id: apt-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apt-debs
          key: apt-debs-${{ steps.image.outputs.key }}-${{ hashFiles('confidential-os-builder/bin/host-deps', 'confidential-os-builder/mkosi/base/mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources') }}
          lookup-only: true

      - name: Install build deps
        # See the legs' step of the same name for the bound.
        if: steps.apt-debs.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: bash c8s/.github/scripts/host-deps.sh --cache-dir apt-debs

      - name: Save build-dep debs
        if: steps.apt-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apt-debs
          key: apt-debs-${{ steps.image.outputs.key }}-${{ hashFiles('confidential-os-builder/bin/host-deps', 'confidential-os-builder/mkosi/base/mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources') }}

  build-and-push:
    name: Build c8s node image (${{ matrix.platform }})
    needs: host-deps
    # Auto path: Docker succeeded on main (its PR runs don't publish components).
    # Gate legs arrive via workflow_call, where event_name is the caller's.
    if: |
      inputs.gate == true ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main')
    # 16-core hosted larger runner;
    # scales to 100 concurrent jobs, 600G disk.
    runs-on: the-machine
    timeout-minutes: 180
    strategy:
      # One image per TEE. fail-fast off: a platform-specific failure must not
      # cancel the other platform's publish.
      fail-fast: false
      matrix:
        platform: [tdx, snp]
    steps:
      - name: Keep gate-only signing material out of published images
        if: inputs.gate_signing_artifact != '' && inputs.gate != true
        run: |
          echo "::error::gate_signing_artifact requires gate=true"
          exit 1

      # Layout: ./c8s ./attestation-rs ./confidential-os-builder (sibling repos).
      - name: Checkout c8s
        # head_sha, not the default (workflow_run's ref is main).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: c8s

      - name: Load measured-build pins
        id: pins
        env:
          CONFOS_REF_OVERRIDE: ${{ inputs.confos_ref }}
        run: |
          set -euo pipefail
          bash c8s/.github/scripts/pin-manifest.sh export \
            --manifest c8s/.github/build-pins.json \
            --domain node-image \
            --format github-env \
            --confos-override "$CONFOS_REF_OVERRIDE" >> "$GITHUB_ENV"
          bash c8s/.github/scripts/pin-manifest.sh export \
            --manifest c8s/.github/build-pins.json \
            --domain node-image \
            --format github-output \
            --confos-override "$CONFOS_REF_OVERRIDE" >> "$GITHUB_OUTPUT"

      - name: Download gate-only module-signing key
        if: inputs.gate_signing_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.gate_signing_artifact }}
          path: gate-signing

      - name: Stage gate-only module-signing keypair
        if: inputs.gate_signing_artifact != ''
        run: |
          chmod 0600 gate-signing/module-signing.key
          install -m 0644 gate-signing/module-signing.crt \
            c8s/node-guest-image/module-signing.crt

      # The gate bakes the c8s binary built from the gated checkout, so a PR
      # that changes the baked binary or its `node-image render` command is
      # gated on its own code rather than on the last published C8S_REF.
      # Both legs build the same commit with the same toolchain; -trimpath
      # removes the workspace path so the bytes do not depend on the runner.
      - name: Setup Go (gate)
        if: inputs.gate == true
        uses: ./c8s/.github/actions/setup-go-c8s
        with:
          go-version-file: c8s/go.mod
          cache-dependency-path: c8s/go.sum

      - name: Build c8s from the gated checkout
        if: inputs.gate == true
        working-directory: c8s
        env:
          GOFLAGS: -trimpath
        run: make build-c8s

      - name: Checkout attestation-rs (for the gpu-attest binary)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: confidential-dot-ai/attestation-rs
          ref: ${{ steps.pins.outputs.attest }}
          path: attestation-rs
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout confidential-os-builder (build tree)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: confidential-dot-ai/confidential-os-builder
          ref: ${{ steps.pins.outputs.confos }}
          path: confidential-os-builder

      - name: Set image ref and variant
        # VARIANT drives C8S_NAME (-> output/$VARIANT/) and the push tags.
        run: |
          echo "IMAGE=${REGISTRY}/confidential-dot-ai/node-guest-base" >> "$GITHUB_ENV"
          if [ "${{ inputs.dev }}" = "true" ]; then
            echo "VARIANT=rke2-${{ matrix.platform }}-dev" >> "$GITHUB_ENV"
            echo "KERNEL_FLAVOR=rke2-dev" >> "$GITHUB_ENV"
            echo "C8S_DEV=1" >> "$GITHUB_ENV"
          else
            echo "VARIANT=rke2-${{ matrix.platform }}" >> "$GITHUB_ENV"
            echo "KERNEL_FLAVOR=rke2" >> "$GITHUB_ENV"
            echo "C8S_DEV=0" >> "$GITHUB_ENV"
          fi

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Pinned: rustc compiles attestation-api, whose bytes ship in the
          # measured rootfs — "stable" drifts between legs across a Rust
          # release (a c8s#392 divergence candidate). Bumping this can move
          # measurements.
          toolchain: "1.98.0"
          # Both cargo workspaces this job compiles; the default "." caches neither.
          cache-workspaces: |
            attestation-rs
            confidential-os-builder

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup mkosi
        # Local action (repo is checked out under c8s/): pinned mkosi without
        # the upstream action's codeload fetch or foreign-distro installs.
        uses: ./c8s/.github/actions/setup-mkosi
        with:
          ref: ${{ steps.pins.outputs.mkosi }}

      - name: Compute runner-image cache term
        # ImageOS/ImageVersion are runner-process env vars, not workflow env
        # context — ${{ env.ImageOS }} silently renders empty in a key.
        id: image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore build-dep debs
        # Keyed on the runner-image release and the host-deps pin (script +
        # the base mkosi.sources it reads): the resolved deb set is a
        # function of confos's committed snapshot and the preinstalled
        # package state. Seeded by the host-deps job, so a miss here is a
        # race with eviction and the install below falls back to the
        # mirror. Warm runs never touch it. No restore-keys:
        # host-deps only uses a cache whose snapshot and package set match
        # its manifest exactly, so a prefix candidate from another pin is a
        # download it would discard.
        id: apt-debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apt-debs
          key: apt-debs-${{ steps.image.outputs.key }}-${{ hashFiles('confidential-os-builder/bin/host-deps', 'confidential-os-builder/mkosi/base/mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources') }}

      - name: Install build deps
        # The package set and why it is snapshot-pinned: host-deps.sh.
        # With a warm apt-debs this reinstalls fully offline. Bounded so
        # a wedged mirror cannot hold the job to its 3h limit: host-deps
        # bounds each file fetch (see its apt_snapshot), not the
        # transaction, and a cold install is ~30 debs plus indexes,
        # ~85 MB, which a degraded snapshot.ubuntu.com has served at tens
        # of KB/s, so 10 minutes is not enough and 30 is. The script
        # retries the transaction within a 25 minute budget under it.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bash c8s/.github/scripts/host-deps.sh --cache-dir apt-debs
          # The exact host set, for auditing a published measurement's toolchain.
          { echo "### host build-dep debs"; find apt-debs -maxdepth 1 -name '*.deb' -printf '- %f\n' | sort; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save build-dep debs
        # Inline: runs only when the install above succeeded.
        if: steps.apt-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apt-debs
          key: apt-debs-${{ steps.image.outputs.key }}-${{ hashFiles('confidential-os-builder/bin/host-deps', 'confidential-os-builder/mkosi/base/mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources') }}

      # Caches: confos c8s.yml's keys/paths, scoped to the confos checkout dir.
      - name: Cache staged GPU tree
        # Mirror + stamp written by the build script (confos build wipes the
        # live mkosi.local staging, so only the mirror survives to save). A
        # hit makes the driver downloads unnecessary, so that restore gates
        # on it; the tools tree still restores unconditionally because the
        # fallback path (stamp mismatch) needs it.
        id: gpu-staged
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            confidential-os-builder/output/gpu/staged
            confidential-os-builder/output/gpu/stage.stamp
          key: ${{ runner.os }}-gpu-staged-${{ env.KERNEL_FLAVOR }}-mkosi-${{ steps.pins.outputs.mkosi }}-${{ hashFiles('confidential-os-builder/mkosi/kernel-builder/mkosi.conf','confidential-os-builder/mkosi/kernel-builder/mkosi.sandbox/**','c8s/node-guest-image/kernel/c8s.config','c8s/node-guest-image/kernel/c8s-dev.config','confidential-os-builder/kernel/required.config','confidential-os-builder/kernel/hardening.config','confidential-os-builder/kernel/confidential.config','c8s/node-guest-image/kernel/config-x86_64-*.snapshot','confidential-os-builder/kernel/randstruct.seed','confidential-os-builder/kernel/version','c8s/node-guest-image/build','c8s/node-guest-image/module-signing.crt','confidential-os-builder/bin/confos-fetch-gpu') }}

      - name: Cache kernel-builder tools tree
        # mkosi.output (image + stamp) is what the kernel short-circuit path
        # still needs: confos-fetch-gpu compiles modules inside it. mkosi.tools
        # is only an intermediate for building it, so it isn't cached.
        # restore/save split: the built-in post-job save runs even after a
        # failed build and archives partial trees under a stable key that is
        # then never re-saved (the #408 gate poisoning).
        id: tools-tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: confidential-os-builder/mkosi/kernel-builder/mkosi.output
          key: ${{ runner.os }}-tools-v2-mkosi-${{ steps.pins.outputs.mkosi }}-${{ hashFiles('confidential-os-builder/mkosi/kernel-builder/mkosi.conf','confidential-os-builder/mkosi/kernel-builder/mkosi.sandbox/**') }}

      - name: Cache kernel
        # Every input of confos's kernel fingerprint, or the cache is rejected
        # and rebuilt (hashFiles has no brace expansion). The lineage snapshot
        # lockfiles (written beside the fragments here since confos v0.4.3)
        # ride the cache until they are committed in this repo, at which point
        # the cached copy becomes redundant.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            confidential-os-builder/output/kernel
            c8s/node-guest-image/kernel/config-x86_64-*.snapshot
          key: ${{ runner.os }}-kernel-v3-${{ env.KERNEL_FLAVOR }}-mkosi-${{ steps.pins.outputs.mkosi }}-${{ hashFiles('confidential-os-builder/mkosi/kernel-builder/mkosi.conf','confidential-os-builder/mkosi/kernel-builder/mkosi.sandbox/**','c8s/node-guest-image/kernel/c8s.config','c8s/node-guest-image/kernel/c8s-dev.config','confidential-os-builder/kernel/required.config','confidential-os-builder/kernel/hardening.config','confidential-os-builder/kernel/confidential.config','c8s/node-guest-image/kernel/config-x86_64-*.snapshot','confidential-os-builder/kernel/randstruct.seed','confidential-os-builder/kernel/version','c8s/node-guest-image/build','c8s/node-guest-image/module-signing.crt') }}

      - name: Rebuild the kernel when its toolchain is gone
        # confos kernel short-circuits on the manifest before it ensures the
        # tools tree that confos-fetch-gpu compiles the modules in; dropping
        # the manifest takes the full path, which rebuilds both.
        if: steps.tools-tree.outputs.cache-hit != 'true'
        run: rm -f confidential-os-builder/output/kernel/manifest.json

      - name: Cache base image tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            confidential-os-builder/mkosi/base/mkosi.tools
            confidential-os-builder/mkosi/base/mkosi.tools.manifest
          key: ${{ runner.os }}-c8s-tools-mkosi-${{ steps.pins.outputs.mkosi }}-${{ hashFiles('confidential-os-builder/mkosi/base/mkosi.conf.d/tools.conf','confidential-os-builder/mkosi/base/mkosi.profiles/*/mkosi.conf','c8s/node-guest-image/c8s/mkosi.conf') }}

      - name: Cache apt package cache
        # mkosi's package cache for every subimage (initrd, base, main). Keeps
        # assembly off snapshot.ubuntu.com, whose fetch latency varies by
        # runner. restore-keys tolerates partial staleness: apt re-fetches
        # only what's missing, and the mirror guard still polices the source.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            confidential-os-builder/mkosi/base/mkosi.pkgcache
            !confidential-os-builder/mkosi/base/mkosi.pkgcache/c8s
          # conf-only globs: profile mkosi.extra trees carry dangling systemd
          # enablement symlinks, which hashFiles refuses to hash.
          key: ${{ runner.os }}-pkgcache-${{ hashFiles('confidential-os-builder/mkosi/base/mkosi.conf','confidential-os-builder/mkosi/base/mkosi.conf.d/*.conf','confidential-os-builder/mkosi/base/mkosi.profiles/*/mkosi.conf','confidential-os-builder/mkosi/base/mkosi.sandbox/**','c8s/node-guest-image/c8s/mkosi.conf') }}
          restore-keys: |
            ${{ runner.os }}-pkgcache-

      - name: Cache c8s artifact downloads
        # ~3.5G rke2 tarball + airgap bundles, sha256-verified on reuse.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: confidential-os-builder/mkosi/base/mkosi.pkgcache/c8s
          key: ${{ runner.os }}-c8s-artifacts-${{ hashFiles('c8s/node-guest-image/c8s/mkosi.sync') }}
          restore-keys: |
            ${{ runner.os }}-c8s-artifacts-

      - name: Cache NVIDIA driver downloads
        # ~500MB, sha-verified; keyed on the script that carries the pins.
        if: steps.gpu-staged.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: confidential-os-builder/output/gpu/cache
          key: ${{ runner.os }}-gpu-artifacts-${{ hashFiles('confidential-os-builder/bin/confos-fetch-gpu') }}

      - name: Attestation binary key
        id: attest-sha
        run: echo "sha=$(git -C attestation-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache attestation-api binary
        # Keyed on the attestation-rs commit plus this workflow (libnvat pin).
        id: attest-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: attestation-rs/target/release/attestation-api
          key: ${{ runner.os }}-attest-bin-${{ steps.attest-sha.outputs.sha }}-${{ hashFiles('c8s/.github/workflows/c8s-image.yml') }}

      # attest-gpu: the build runs confos-fetch-attest-gpu, which needs a
      # prebuilt ATTEST_GPU_BIN + LIBNVAT. Vendor libnvat (Apache-2.0, digest-
      # pinned) and build the binary with NVAT_USE_SYSTEM_LIB=1.
      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login "$REGISTRY" \
            -u "${{ github.actor }}" --password-stdin

      - name: Fetch vendored libnvat (Apache-2.0)
        env:
          # Digest-pinned; oras verifies layers. Plus independent sha256s.
          LIBNVAT_REF: ghcr.io/confidential-dot-ai/libnvat@sha256:4b3c396dbe906b2f60042558ed0f2dc4791a96f840ba0970a6d358027c572819
          LIBNVAT_SO_SHA256: 1dd6c5429632c8c9ae59aa687cf96593f01c5597afe342f72ec3d8d5ddb0bbae
          NVAT_H_SHA256: c6c9f32538611c5dfca2a103bfba5a258156a5e7b035ef9f0b7e21f20151314b
        run: |
          set -euo pipefail
          mkdir -p vendor/libnvat
          oras pull "$LIBNVAT_REF" -o vendor/libnvat
          echo "$LIBNVAT_SO_SHA256  vendor/libnvat/libnvat.so.1.2.0" | sha256sum -c -
          echo "$NVAT_H_SHA256  vendor/libnvat/nvat.h" | sha256sum -c -
          sudo install -m0755 vendor/libnvat/libnvat.so.1.2.0 \
            /usr/lib/x86_64-linux-gnu/libnvat.so.1.2.0
          sudo ln -sf libnvat.so.1.2.0 /usr/lib/x86_64-linux-gnu/libnvat.so.1
          sudo ln -sf libnvat.so.1     /usr/lib/x86_64-linux-gnu/libnvat.so
          sudo install -m0644 vendor/libnvat/nvat.h /usr/include/nvat.h
          sudo ldconfig

      - name: Build attestation-api (nvidia-gpu-attest)
        env:
          NVAT_USE_SYSTEM_LIB: "1"
        working-directory: attestation-rs
        run: |
          if [ "${{ steps.attest-bin.outputs.cache-hit }}" != "true" ]; then
            cargo build -p attestation-api --release \
              --features nvidia-gpu-attest --bin attestation-api
          fi
          # Must actually link libnvat (not a silent fallback).
          ldd target/release/attestation-api | grep -q libnvat

      - name: Build c8s image
        # Warm builds take 2 minutes; a cold pkgcache or driver download
        # took 20 in the last 40 runs. Bounded so a wedged mirror fails
        # here rather than at the job's 3h limit, which exists for the
        # kernel rebuild step above.
        timeout-minutes: 60
        working-directory: confidential-os-builder
        env:
          ATTEST_GPU_BIN: ${{ github.workspace }}/attestation-rs/target/release/attestation-api
          LIBNVAT: /usr/lib/x86_64-linux-gnu/libnvat.so.1.2.0
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          C8S_REF_INPUT: ${{ inputs.c8s_ref }}
          C8S_BINARY: ${{ inputs.gate == true && format('{0}/c8s/build/c8s', github.workspace) || '' }}
          # Private half of the module signing certificate (org secret) — the
          # fetch script signs the NVIDIA modules with it and fails closed
          # without it. Signatures are deterministic (sign-file uses no
          # authenticated attributes), so identical inputs sign identically.
          # Repro-gate callers instead supply one throwaway keypair to both
          # legs. It is never used by a published image.
          MODULE_SIG_KEY_PEM: ${{ inputs.gate_signing_artifact == '' && secrets.MODULE_SIG_KEY_PEM || '' }}
          MODULE_SIG_KEY: ${{ inputs.gate_signing_artifact != '' && format('{0}/gate-signing/module-signing.key', github.workspace) || '' }}
        run: |
          set -euo pipefail
          # Short SHA matches docker.yml's component tags. The build script
          # hands C8S_REF to mkosi.sync via confos --sync-input (can't cross
          # mkosi's sudo sandbox as an env var). The c8s_ref input overrides
          # it to rebuild a published release. Definition lives in this repo:
          # the script stages ../c8s/node-guest-image/c8s via --profile-dir.
          export C8S_REF="${C8S_REF_INPUT:-${HEAD_SHA::7}}"
          # The build script requires an explicit platform (no default). The
          # matrix publishes both measured platform variants.
          C8S_PLATFORM="${{ matrix.platform }}" C8S_NAME="$VARIANT" ../c8s/node-guest-image/build

      - name: Make the tools trees cache-safe
        # The post-job cache tar runs unprivileged; mkosi builds these trees as
        # root, so their saves fail without this. Runs after all use.
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            confidential-os-builder/mkosi/kernel-builder/mkosi.output \
            confidential-os-builder/mkosi/base/mkosi.tools \
            confidential-os-builder/mkosi/base/mkosi.tools.manifest \
            confidential-os-builder/mkosi/base/mkosi.pkgcache || true

      # Inline saves run only after every prior step succeeded, and only when
      # the tree actually exists — a kernel-cache-hit build never creates it.
      - name: Check tools tree presence
        id: tools-built
        run: echo "built=$([ -d confidential-os-builder/mkosi/kernel-builder/mkosi.output/image ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save kernel-builder tools tree
        if: steps.tools-tree.outputs.cache-hit != 'true' && steps.tools-built.outputs.built == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: confidential-os-builder/mkosi/kernel-builder/mkosi.output
          key: ${{ runner.os }}-tools-v2-mkosi-${{ steps.pins.outputs.mkosi }}-${{ hashFiles('confidential-os-builder/mkosi/kernel-builder/mkosi.conf','confidential-os-builder/mkosi/kernel-builder/mkosi.sandbox/**') }}

      - name: Save staged GPU tree
        if: steps.gpu-staged.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            confidential-os-builder/output/gpu/staged
            confidential-os-builder/output/gpu/stage.stamp
          key: ${{ runner.os }}-gpu-staged-${{ env.KERNEL_FLAVOR }}-mkosi-${{ steps.pins.outputs.mkosi }}-${{ hashFiles('confidential-os-builder/mkosi/kernel-builder/mkosi.conf','confidential-os-builder/mkosi/kernel-builder/mkosi.sandbox/**','c8s/node-guest-image/kernel/c8s.config','c8s/node-guest-image/kernel/c8s-dev.config','confidential-os-builder/kernel/required.config','confidential-os-builder/kernel/hardening.config','confidential-os-builder/kernel/confidential.config','c8s/node-guest-image/kernel/config-x86_64-*.snapshot','confidential-os-builder/kernel/randstruct.seed','confidential-os-builder/kernel/version','c8s/node-guest-image/build','c8s/node-guest-image/module-signing.crt','confidential-os-builder/bin/confos-fetch-gpu') }}

      - name: Upload measurement evidence (gate)
        # Gate mode ends here: evidence out, nothing published.
        if: inputs.gate == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-${{ env.VARIANT }}-${{ github.run_id }}${{ inputs.leg && format('-{0}', inputs.leg) || '' }}
          path: |
            confidential-os-builder/output/${{ env.VARIANT }}/manifest.json
            confidential-os-builder/output/${{ env.VARIANT }}/roothash
          if-no-files-found: error

      - name: Upload resolved kernel snapshot (gate)
        # The lineage lockfile these inputs resolve to, so a fragment PR can
        # commit it without a local Linux builder (confos#66). One cell —
        # the snapshot is per-KERNEL_FLAVOR, not per-platform or per-leg. A
        # cache-restored copy is equally valid: the exact key hashes the
        # fragments, so the cached snapshot was resolved from these same
        # inputs (by a sibling leg or an earlier run of them).
        if: inputs.gate == true && matrix.platform == 'tdx' && inputs.leg != 'b'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-snapshot-${{ github.run_id }}
          path: c8s/node-guest-image/kernel/config-x86_64-${{ inputs.dev && 'c8s-dev' || 'c8s' }}.snapshot
          if-no-files-found: error
          retention-days: 7

      - name: Check whether the rootfs changed
        if: inputs.gate != true
        # An unchanged roothash leaves the floating tags where they are. The
        # commit-suffixed tags are always pushed from this build's own output:
        # a floating tag can be repointed by a concurrent build between a
        # check and an alias, and the CDI image carries no provenance to
        # verify against (#648's neighbour 4007fb7 got 29dbf4d's rke2-snp).
        id: changed
        working-directory: confidential-os-builder
        env:
          C8S_REF_INPUT: ${{ inputs.c8s_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # A stable release always publishes both exact formats from this
          # build. A matching rootfs alone cannot prove that a prior CDI/ORAS
          # pair was completed from the same inputs.
          if [ -n "$RELEASE_TAG" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
              echo "::error::invalid stable release tag: $RELEASE_TAG"
              exit 1
            fi
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "stable release $RELEASE_TAG requires exact node artifacts"
            exit 0
          fi

          # A c8s_ref rebuild compares against that release's own tag, not the
          # floating one it never repoints.
          tag="${VARIANT}${C8S_REF_INPUT:+-$C8S_REF_INPUT}"
          new=$(cat "output/${VARIANT}/roothash" 2>/dev/null || echo new)
          digest=$(oras manifest fetch "${IMAGE}:${tag}" 2>/dev/null \
                     | jq -r '.layers[] | select(.annotations["org.opencontainers.image.title"] == "roothash") | .digest' \
                     || true)
          pub=none
          if [ -n "$digest" ]; then
            pub=$(oras blob fetch --output - "${IMAGE}@${digest}" 2>/dev/null || echo none)
          fi
          echo "new=$new published=$pub"
          if [ "$new" = "$pub" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "rootfs roothash unchanged ($new) — skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to GHCR
        if: inputs.gate != true
        working-directory: confidential-os-builder
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          C8S_REF_INPUT: ${{ inputs.c8s_ref }}
          ROOTFS_UNCHANGED: ${{ steps.changed.outputs.skip }}
        run: |
          set -eux
          SHORT_SHA="${C8S_REF_INPUT:-${HEAD_SHA::7}}"
          # A c8s_ref rebuild repoints only that release's suffixed tags; the
          # floating tags keep tracking main builds, and only move when the
          # rootfs changed.
          CDI_TAGS="${VARIANT}-cdi,${VARIANT}-cdi-${SHORT_SHA}"
          ORAS_TAGS="${VARIANT},${VARIANT}-${SHORT_SHA}"
          if [ -n "$C8S_REF_INPUT" ] || [ "$ROOTFS_UNCHANGED" = true ]; then
            CDI_TAGS="${VARIANT}-cdi-${SHORT_SHA}"
            ORAS_TAGS="${VARIANT}-${SHORT_SHA}"
          fi
          # CDI first, oras artifact last: the change-check reads the oras tag,
          # so a partial failure re-publishes everything next run.
          bin/confos push "output/${VARIANT}" --cdi \
            --registry "$IMAGE" \
            --tag "$CDI_TAGS"
          bin/confos push "output/${VARIANT}" \
            --registry "$IMAGE" \
            --tag "$ORAS_TAGS"

      - name: Capture exact TDX image acceptance evidence
        if: >-
          inputs.gate != true && inputs.dev != true && inputs.c8s_ref == '' &&
          matrix.platform == 'tdx' && github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C c8s rev-parse HEAD)" = "$HEAD_SHA"
          short="${HEAD_SHA:0:7}"
          cdi_digest=$(oras resolve "$IMAGE:$VARIANT-cdi-$short")
          artifact_digest=$(oras resolve "$IMAGE:$VARIANT-$short")
          evidence="$RUNNER_TEMP/tdx-image-acceptance"
          mkdir -p "$evidence"
          # An unchanged rootfs is not enough: compare the complete disk, UKI
          # and TDX tuple. BuildConfig.timestamp is not measured and changes
          # on rebuilds, so retain the actual published manifest as evidence.
          published_sha=$(oras manifest fetch "$IMAGE@$artifact_digest" | jq -er '
            [.layers[] | select(.annotations["org.opencontainers.image.title"] == "manifest.json")]
            | if length == 1 then .[0].digest else error("expected one manifest.json layer") end')
          [[ "$published_sha" =~ ^sha256:[0-9a-f]{64}$ ]]
          oras blob fetch "$IMAGE@$published_sha" --output "$evidence/manifest.json"
          jq -e -s '
            map({disk: .outputs.disk_image.sha256, uki: .outputs.uki.sha256,
              mrtd: .tdx.mrtd, rtmr1: .tdx.rtmr1, rtmr2: .tdx.rtmr2}) |
            .[0] == .[1] and
            (.[0] | [.disk, .uki] | all(.[]; type == "string" and test("^[0-9a-f]{64}$"))) and
            (.[0] | [.mrtd, .rtmr1, .rtmr2] | all(.[]; type == "string" and test("^[0-9a-f]{96}$")))
          ' "confidential-os-builder/output/$VARIANT/manifest.json" "$evidence/manifest.json" >/dev/null
          manifest_sha=$(sha256sum "$evidence/manifest.json" | cut -d ' ' -f1)
          test "$published_sha" = "sha256:$manifest_sha"
          jq -n --arg source "$HEAD_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg c8s_ref "$short" --arg image "$IMAGE@$cdi_digest" \
            --arg artifact "$IMAGE@$artifact_digest" --arg manifest "$manifest_sha" \
            '{schema: 1, source_sha: $source, run_id: $run, build_attempt: $attempt, c8s_ref: $c8s_ref,
              variant: "rke2-tdx", launch_config_version: "c8s-launch/v2", image: $image, artifact: $artifact,
              manifest_sha256: $manifest}' > "$evidence/acceptance.json"
          bash c8s/.github/scripts/tdx-image-acceptance.sh validate \
            "$evidence" "$HEAD_SHA" "$GITHUB_RUN_ID" >/dev/null

      - name: Upload exact TDX image acceptance evidence
        if: >-
          inputs.gate != true && inputs.dev != true && inputs.c8s_ref == '' &&
          matrix.platform == 'tdx' && github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-image-acceptance-rke2-tdx-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tdx-image-acceptance/
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        env:
          C8S_REF_INPUT: ${{ inputs.c8s_ref }}
        run: |
          {
            echo "### ${VARIANT} confidential node image"
            echo "- CDI image: \`${IMAGE}:${VARIANT}-cdi${C8S_REF_INPUT:+-$C8S_REF_INPUT}\`"
            echo "- artifact: \`${IMAGE}:${VARIANT}${C8S_REF_INPUT:+-$C8S_REF_INPUT}\`"
            echo "- confos ref: \`${CONFOS_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
