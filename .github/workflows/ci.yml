name: CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
    paths: &go-paths
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "Makefile"
      - ".golangci.yml"
      - "internal/helmchart/c8s/**"
      # The integration harness (test/integration) and its mocks
      # (test/mock-*) gate PRs via the Integration job below.
      - "test/**"
      - "scripts/coverage-gate.sh"
      - "scripts/mutation-check.sh"
      - ".gremlins.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, "feat/**"]
    paths: *go-paths

concurrency:
  group: ci-${{ github.ref }}-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - name: Check formatting
        run: make fmt

      - name: Install controller-gen
        run: make install-controller-gen

      - name: Check chart CRDs
        run: make check-crd-chart

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # A full major.minor.patch is resolved in-process; anything less is
          # looked up over the network before the linter runs.
          version: v2.13.2

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Cache pruning (the step after the save) deletes this job's own
      # superseded go-ci-* entries so they cannot LRU-evict the image caches.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s
        with:
          cache: "false"

      # Module cache: immutable per go.sum, so save-on-miss keying is correct
      # for it (what setup-go does; managed here because its cache cannot be
      # split from the build cache below).
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-

      # Build/test-result cache: NOT immutable per go.sum — every commit adds
      # artifacts — so save-on-miss goes stale and cached test results never
      # materialize. Restore the freshest entry; a new one is saved per main
      # push and superseded entries are pruned.
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-ci-${{ github.sha }}
          restore-keys: |
            go-ci-

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4

      - name: Build
        run: go build ./...

      - name: Build macOS CLI
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/c8s-darwin ./cmd/c8s

      # testing and test-helper packages must stay out of the measured binaries.
      # CGO_ENABLED=0 matches the shipped builds; c8s_node changes the graph, so
      # it is listed separately.
      - name: Guard testing out of shipped binaries
        run: |
          forbidden='^(testing|github.com/confidential-dot-ai/c8s/internal/testattest)$'
          deps=$(CGO_ENABLED=0 go list -deps ./cmd/...)
          if grep -qE "$forbidden" <<<"$deps"; then
            echo "testing code is in the dep graph of a shipped binary" >&2
            exit 1
          fi
          node_deps=$(CGO_ENABLED=0 go list -tags c8s_node -deps ./cmd/c8s)
          if grep -qE "$forbidden" <<<"$node_deps"; then
            echo "testing code is in the dep graph of the c8s_node binary" >&2
            exit 1
          fi

      # The cw-guard rule assertions resolve through iptables-translate;
      # C8S_REQUIRE_IPTABLES_TRANSLATE fails the job if it is missing.
      - name: Install iptables
        run: sudo apt-get update && sudo apt-get install -y iptables

      - name: Test
        env:
          C8S_REQUIRE_IPTABLES_TRANSLATE: "1"
        # C8S_TEST_COUNT= : unchanged packages reuse cached results from the
        # restored GOCACHE; Go invalidates by content, so edits still rerun.
        # External binaries the tests exec (iptables-translate) are covered
        # via the testlog's stat of the LookPath'd path: an apt bump changes
        # its mtime and invalidates the cached pass.
        run: make test C8S_TEST_COUNT=

      # The advisory mutation job only exercises the 0-mutant path on
      # script-only diffs; this guards the summary paths it skips.
      - name: mutation-check selftest
        run: ./scripts/mutation-check.sh selftest

      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-ci-${{ github.sha }}

      - name: Prune superseded Go caches
        # Only the Go cache families this job writes (go-ci-*, go-mod-*)
        # and the setup-go-* entries setup-go-c8s used to write; never
        # touches other caches. Cache entries are scoped per ref, so a
        # go-mod-* saved on a PR branch is a duplicate of main's: keep one
        # entry per family, the current key on main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CI: go-ci-${{ github.sha }}
          CURRENT_MOD: go-mod-${{ hashFiles('go.sum') }}
          REPO: ${{ github.repository }}
        run: |
          for prefix in go-ci- go-mod- setup-go-; do
            gh api --paginate "repos/$REPO/actions/caches?key=$prefix&per_page=100" \
              --jq '.actions_caches[]|"\(.id) \(.key) \(.ref)"'
          done |
            awk -v ci="$CURRENT_CI" -v mod="$CURRENT_MOD" \
              '!(($2 == ci || $2 == mod) && $3 == "refs/heads/main") {print $1}' |
            while read -r id; do
              gh api -X DELETE "repos/$REPO/actions/caches/$id" || true
            done

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - name: Run the integration harness
        run: make test-integration

  integration-cluster:
    name: Integration (cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - uses: ./.github/actions/setup-kind-harness

      - name: Run the cluster integration harness
        run: make test-integration-cluster

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4

      - name: Measure coverage
        run: ./scripts/coverage-gate.sh run head.out

      # On pushes to main, cache the total so PRs against this commit can
      # compare without re-running the whole suite on the base branch.
      - name: Record baseline total
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/coverage-gate.sh total head.out | tee base-total.txt

      - name: Cache baseline total
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base-total.txt
          # v3 measures Go execution separately from the shell/YAML workflow
          # harness, matching the same head-script selection used for the base.
          key: coverage-total-v3-${{ github.sha }}

      - name: Restore baseline total
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base-total.txt
          key: coverage-total-v3-${{ github.event.pull_request.base.sha }}

      # Fallback when the base commit's total is not cached (e.g. cache
      # evicted, or main's coverage run predates this workflow).
      - name: Checkout base branch
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Measure base coverage
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-hit != 'true'
        working-directory: base
        run: |
          ../scripts/coverage-gate.sh run base.out
          ../scripts/coverage-gate.sh total base.out > ../base-total.txt

      - name: Enforce non-decreasing total coverage
        if: github.event_name == 'pull_request'
        run: |
          head=$(./scripts/coverage-gate.sh total head.out)
          base=$(cat base-total.txt)
          echo "total coverage: base=${base}% head=${head}%"
          # Tests exercising retries, timeouts and concurrent paths cover
          # slightly different statements run to run, so the total wanders.
          # Across 18 consecutive PR runs it moved within a ~0.2pp band, in
          # both directions, including on PRs touching no Go at all: below
          # that, the gate fails on noise. 0.25 is the smallest value clearing
          # the band, and it is a real blind spot, roughly 80 statements on
          # this tree. Shrinking it means making the measurement deterministic
          # (fake clocks, seeded RNG in the offending packages), not lowering
          # the number, which only restores the false failures.
          awk -v h="$head" -v b="$base" 'BEGIN {
            if (h + 0.25 < b) {
              printf "coverage gate: total coverage decreased (%.2f%% -> %.2f%%)\n", b, h
              exit 1
            }
          }'

  mutation:
    name: Mutation (advisory)
    runs-on: ubuntu-latest
    # Diff-based vs the PR base; no meaningful base ref on push.
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    # Advisory: never blocks the PR, even if the tool itself breaks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gremlins --diff needs the base ref's history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go-c8s

      # The initial coverage pass runs the full suite, incl. helmchart tests.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4

      - name: Mutation testing vs base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Leave time for reporting and cleanup before the 20-minute job limit.
          if timeout --kill-after=30s 12m ./scripts/mutation-check.sh run "origin/$BASE_REF"; then
            :
          else
            status=$?
            echo "::notice::Mutation testing stopped (exit $status; advisory)."
            echo "Mutation testing incomplete (exit $status; advisory)." >> "$GITHUB_STEP_SUMMARY"
          fi
          ./scripts/mutation-check.sh summary >> "$GITHUB_STEP_SUMMARY"
