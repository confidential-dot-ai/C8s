name: CI

on:
  push:
    branches: [main, beta, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, beta, "feat/**"]
  merge_group:
    types: [checks_requested]
    branches: [main, beta, "feat/**"]

concurrency:
  group: ci-${{ github.ref }}-tests
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The commit coverage is compared against; empty on push.
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/relevant-changes
        with:
          filters: |
            relevant:
              - ".github/actions/relevant-changes/**"
              - "**.go"
              - "go.mod"
              - "go.sum"
              - "go.work"
              - "go.work.sum"
              - "Makefile"
              - ".golangci.yml"
              - "charts/**"
              # The integration harness (test/integration) and its mocks
              # (test/mock-*) gate merges via the Integration job below.
              - "test/**"
              - "scripts/coverage-gate.sh"
              - "scripts/mutation-check.sh"
              - ".gremlins.yaml"
              - ".github/workflows/ci.yml"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - name: Check formatting
        run: make fmt

      - name: Install controller-gen
        run: make install-controller-gen

      - name: Check chart CRDs
        run: make check-crd-chart

      # Installed here rather than by the action, whose release download (3
      # tries, no cache) still fails on the 504s GitHub returns under burst load.
      - name: Install golangci-lint (checksum-pinned)
        env:
          VERSION: 2.14.0
          # SHA256 from the release's checksums.txt (linux-amd64).
          SHA256: ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/golangci-lint.tar.gz"
          .github/scripts/fetch-release.sh golangci/golangci-lint "v$VERSION" "golangci-lint-$VERSION-linux-amd64.tar.gz" "$archive"
          echo "$SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/golangci-lint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/golangci-lint" --strip-components=1 "golangci-lint-$VERSION-linux-amd64/golangci-lint"
          echo "$RUNNER_TEMP/golangci-lint" >>"$GITHUB_PATH"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    permissions:
      contents: read
      # Cache pruning (the step after the save) deletes this job's own
      # superseded go-ci-* entries so they cannot LRU-evict the image caches.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-c8s
        with:
          cache: "false"

      # Module cache: immutable per go.sum, so save-on-miss keying is correct
      # for it (what setup-go does; managed here because its cache cannot be
      # split from the build cache below).
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-mod-

      # Build/test-result cache: NOT immutable per go.sum — every commit adds
      # artifacts — so save-on-miss goes stale and cached test results never
      # materialize. Restore the freshest entry; a new one is saved per main
      # push and superseded entries are pruned.
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-ci-${{ github.sha }}
          restore-keys: |
            go-ci-

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.4

      - name: Build
        run: go build ./...

      - name: Build macOS CLI
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/c8s-darwin ./cmd/c8s

      # go list does not type-check the node build.
      - name: Build node CLI
        run: CGO_ENABLED=0 go build -tags c8s_node -o /dev/null ./cmd/c8s

      # testing and test-helper packages must stay out of the measured binaries.
      # CGO_ENABLED=0 matches the shipped builds; c8s_node changes the graph, so
      # it is listed separately.
      - name: Guard testing out of shipped binaries
        run: |
          forbidden='^(testing|github.com/confidential-dot-ai/confidential-kubernetes/internal/testutil)$'
          deps=$(CGO_ENABLED=0 go list -deps ./cmd/...)
          if grep -qE "$forbidden" <<<"$deps"; then
            echo "testing code is in the dep graph of a shipped binary" >&2
            exit 1
          fi
          node_deps=$(CGO_ENABLED=0 go list -tags c8s_node -deps ./cmd/c8s)
          if grep -qE "$forbidden" <<<"$node_deps"; then
            echo "testing code is in the dep graph of the c8s_node binary" >&2
            exit 1
          fi

      # The cw-guard rule assertions resolve through iptables-translate;
      # C8S_REQUIRE_IPTABLES_TRANSLATE fails the job if it is missing. The pod
      # ruleset golden is checked with nft.
      - name: Install iptables and nftables
        run: sudo apt-get update && sudo apt-get install -y iptables nftables

      - name: Test
        env:
          C8S_REQUIRE_IPTABLES_TRANSLATE: "1"
        # C8S_TEST_COUNT= : unchanged packages reuse cached results from the
        # restored GOCACHE; Go invalidates by content, so edits still rerun.
        # External binaries the tests exec (iptables-translate) are covered
        # via the testlog's stat of the LookPath'd path: an apt bump changes
        # its mtime and invalidates the cached pass.
        run: make test C8S_TEST_COUNT=

      - name: Test the pod ruleset in a network namespace
        run: make test-podmesh-netns

      # The advisory mutation job only exercises the 0-mutant path on
      # script-only diffs; this guards the summary paths it skips.
      - name: mutation-check selftest
        run: ./scripts/mutation-check.sh selftest

      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-ci-${{ github.sha }}

      - name: Prune superseded Go caches
        # Only the Go cache families this job writes (go-ci-*, go-mod-*)
        # and the setup-go-* entries setup-go-c8s used to write; never
        # touches other caches. Cache entries are scoped per ref, so a
        # go-mod-* saved on a PR branch is a duplicate of main's: keep one
        # entry per family, the current key on main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CI: go-ci-${{ github.sha }}
          CURRENT_MOD: go-mod-${{ hashFiles('**/go.sum') }}
          REPO: ${{ github.repository }}
        run: |
          for prefix in go-ci- go-mod- setup-go-; do
            gh api --paginate "repos/$REPO/actions/caches?key=$prefix&per_page=100" \
              --jq '.actions_caches[]|"\(.id) \(.key) \(.ref)"'
          done |
            awk -v ci="$CURRENT_CI" -v mod="$CURRENT_MOD" \
              '!(($2 == ci || $2 == mod) && $3 == "refs/heads/main") {print $1}' |
            while read -r id; do
              gh api -X DELETE "repos/$REPO/actions/caches/$id" || true
            done

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: changes
    # Main's merge queue runs it instead of PRs into main: it still blocks the
    # merge, without slowing every PR push.
    if: needs.changes.outputs.relevant == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'main')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - name: Run the integration harness
        run: make test-integration

  integration-cluster:
    name: Integration (cluster)
    runs-on: ubuntu-latest
    needs: changes
    # Main's merge queue runs it instead of PRs into main: it still blocks the
    # merge, without slowing every PR push.
    if: needs.changes.outputs.relevant == 'true' && (github.event_name != 'pull_request' || github.base_ref != 'main')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - uses: ./.github/actions/setup-kind-harness

      - name: Run the cluster integration harness
        run: make test-integration-cluster

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.4

      - name: Measure coverage
        run: ./scripts/coverage-gate.sh run head.out

      # Node-root provenance depends on a real kernel dm-verity table. Include
      # that test in the measured profile rather than skipping its successful
      # path on the runner's ordinary writable root filesystem.
      - name: Install kernel verity test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cryptsetup-bin e2fsprogs

      - name: Measure kernel verity coverage
        run: ./scripts/coverage-gate.sh kernel head.out

      # On pushes to main, cache the total so PRs against this commit can
      # compare without re-running the whole suite on the base branch.
      - name: Record baseline total
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/coverage-gate.sh total head.out | tee base-total.txt

      - name: Cache baseline total
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base-total.txt
          # v4 includes real kernel dm-verity execution as well as ordinary Go
          # execution, with the same head-script procedure used for the base.
          key: coverage-total-v4-${{ github.sha }}

      - name: Restore baseline total
        if: env.BASE_SHA != ''
        id: baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: base-total.txt
          key: coverage-total-v4-${{ env.BASE_SHA }}

      # Fallback when the base commit's total is not cached (e.g. cache
      # evicted, or main's coverage run predates this workflow).
      - name: Checkout base branch
        if: env.BASE_SHA != '' && steps.baseline.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base

      - name: Measure base coverage
        if: env.BASE_SHA != '' && steps.baseline.outputs.cache-hit != 'true'
        working-directory: base
        run: |
          ../scripts/coverage-gate.sh run base.out
          ../scripts/coverage-gate.sh kernel base.out
          ../scripts/coverage-gate.sh total base.out > ../base-total.txt

      - name: Enforce non-decreasing total coverage
        if: env.BASE_SHA != ''
        run: |
          head=$(./scripts/coverage-gate.sh total head.out)
          base=$(cat base-total.txt)
          echo "total coverage: base=${base}% head=${head}%"
          # Tests exercising retries, timeouts and concurrent paths cover
          # slightly different statements run to run, so the total wanders.
          # Across 18 consecutive PR runs it moved within a ~0.2pp band, in
          # both directions, including on PRs touching no Go at all: below
          # that, the gate fails on noise. 0.25 is the smallest value clearing
          # the band, and it is a real blind spot, roughly 80 statements on
          # this tree. Shrinking it means making the measurement deterministic
          # (fake clocks, seeded RNG in the offending packages), not lowering
          # the number, which only restores the false failures.
          awk -v h="$head" -v b="$base" 'BEGIN {
            if (h + 0.25 < b) {
              printf "coverage gate: total coverage decreased (%.2f%% -> %.2f%%)\n", b, h
              exit 1
            }
          }'

  mutation:
    name: Mutation (advisory)
    runs-on: ubuntu-latest
    # Starts only when the tests pass, and is skipped when they fail, time out
    # or are cancelled: gremlins runs the whole suite before it mutates, so
    # without a passing suite it reports nothing the test job has not.
    needs: [changes, test]
    # Diff-based vs the base branch, reported on the PR; the queue gains nothing from it.
    if: needs.changes.outputs.relevant == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 20
    # Advisory: never blocks the PR, even if the tool itself breaks.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gremlins --diff needs the base ref's history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go-c8s

      # The initial coverage pass runs the full suite, incl. helmchart tests.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.14.4

      - name: Mutation testing vs base
        id: mutation
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Leave time for reporting and cleanup before the 20-minute job limit.
          status=0
          timeout --kill-after=30s 12m ./scripts/mutation-check.sh run "origin/$BASE_REF" || status=$?
          {
            if [ "$status" -ne 0 ]; then
              echo "::notice::Mutation testing stopped (exit $status; advisory)." >&2
              echo "Mutation testing incomplete (exit $status; advisory)."
              echo
            fi
            ./scripts/mutation-check.sh summary
          } > mutation-summary.md
          cat mutation-summary.md >> "$GITHUB_STEP_SUMMARY"
          # Only a finished run is reported on the PR, and only its lived
          # mutants: a NOT COVERED one was never run against the tests.
          lived=$(jq '[.files[]?.mutations[]? | select(.status == "LIVED")] | length' mutation.json 2>/dev/null || echo error)
          report=none
          if [ "$status" -eq 0 ] && [ "$lived" = 0 ]; then report=clean; fi
          if [ "$status" -eq 0 ] && [ "$lived" -gt 0 ] 2>/dev/null; then report=lived; fi
          echo "report=$report" >> "$GITHUB_OUTPUT"

      # Fork PRs get a read-only token; their results stay in the step summary.
      - name: Comment mutation results on the PR
        # An unfinished run says nothing, and leaves an earlier report as it is.
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.mutation.outputs.report != 'none'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT: ${{ steps.mutation.outputs.report }}
          ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- c8s-mutation-report -->';
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.includes(marker));
            // A clean run only refreshes an earlier report, so a fixed PR does not keep stale mutants.
            // A report left in place by an unfinished run is as old as the commit and run it names.
            if (process.env.REPORT === 'clean' && !prev) return;
            // A comment holds 65536 characters; cut a longer report before a mutant and say so.
            let summary = fs.readFileSync('mutation-summary.md', 'utf8');
            if (summary.length > 60000) {
              summary = summary.slice(0, summary.lastIndexOf('\n- `', 60000)) + `\n\nCut short here; the run linked below has every lived mutant, in its summary and its mutation-report-${process.env.ATTEMPT} artifact.`;
            }
            const body = [
              marker,
              summary,
              '',
              `<sub>On ${pr.head.sha.slice(0, 7)}, [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})</sub>`,
            ].join('\n');
            if (prev) {
              await github.rest.issues.updateComment({...context.repo, comment_id: prev.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }

      # The whole report, whatever the step summary and the comment can hold.
      - name: Keep the mutation report
        # After the comment, and whether or not it was written: neither depends on the other.
        if: ${{ !cancelled() && (steps.mutation.outputs.report == 'clean' || steps.mutation.outputs.report == 'lived') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One per attempt: a rerun cannot upload under a name the run already holds.
          name: mutation-report-${{ github.run_attempt }}
          path: |
            mutation-summary.md
            mutation.json
          retention-days: 14

  result:
    name: CI result
    runs-on: ubuntu-latest
    needs: [changes, lint, test, integration, integration-cluster, coverage]
    if: always()
    steps:
      # A job skipped by a failed dependency also reports skipped, so the changes job is read on its own.
      - name: Require every job to have succeeded or skipped
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
