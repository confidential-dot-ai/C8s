# Manual builds have no path to exact-image acceptance or stable promotion.
# Automatic production publication remains in c8s-image-publish.yml.
name: c8s-image manual
run-name: c8s-image (manual dispatch)
on:
  workflow_dispatch:
    inputs:
      pod_recovery_fixture:
        description: "Build the isolated measured recovery fixture over fixed production 052 components; no production publication or catalog change. Other inputs must be empty/default."
        required: false
        type: boolean
        default: false
      dev:
        description: "Build the rke2-dev variant (serial root autologin, different measurement). Never ship."
        required: false
        type: boolean
        default: false
      ssh:
        description: "With dev, also bake an OpenSSH server (confos ssh profile, no keys baked). Pushes :rke2-<platform>-dev-ssh-* tags. Never ship."
        required: false
        type: boolean
        default: false
      c8s_ref:
        description: "Published component SHA (7–40 hex characters), matching the selected workflow branch/tag commit. Dispatch with --ref for that source. A nonempty ref publishes only :<variant>[-cdi]-<ref> tags; confos_ref can override the builder pin."
        required: false
        type: string
        default: ""
      confos_ref:
        description: "Build with this confos commit instead of the pinned CONFOS_REF. For A/B measurement checks (pair with gate=true); a different confos can mean a different measurement."
        required: false
        type: string
        default: ""
      gate:
        description: "Build only — skip the publish and upload manifest.json + roothash as a run artifact, for measurement comparison against a published build."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: c8s-image-entrypoint-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  build-and-push:
    if: ${{ !inputs.pod_recovery_fixture }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/c8s-image.yml
    with:
      dev: ${{ inputs.dev }}
      ssh: ${{ inputs.ssh }}
      c8s_ref: ${{ inputs.c8s_ref }}
      confos_ref: ${{ inputs.confos_ref }}
      gate: ${{ inputs.gate }}
    secrets:
      MODULE_SIG_KEY_PEM: ${{ secrets.MODULE_SIG_KEY_PEM }}

  validate-recovery-mode:
    if: ${{ inputs.pod_recovery_fixture }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require exclusive recovery fixture mode
        env:
          DEV: ${{ inputs.dev }}
          SSH: ${{ inputs.ssh }}
          GATE: ${{ inputs.gate }}
          REF: ${{ inputs.c8s_ref }}
          CONFOS: ${{ inputs.confos_ref }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$DEV" = false
          test "$SSH" = false
          test "$GATE" = false
          test -z "$REF"
          test -z "$CONFOS"

  recovery-fixture:
    if: ${{ inputs.pod_recovery_fixture }}
    needs: validate-recovery-mode
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/pod-recovery-fixture.yml
    secrets:
      MODULE_SIG_KEY_PEM: ${{ secrets.MODULE_SIG_KEY_PEM }}
