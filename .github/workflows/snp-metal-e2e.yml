# C8s product lane on AMD SEV-SNP metal. This C8s-owned integration boots the
# node image published for the commit under test with signed launch
# configuration, staging that image's CDI disk and IGVM on the launcher itself
# (.github/scripts/snp-node-image.sh). Core services are baked systemd units;
# Kubernetes receives only pre-rendered integration. confidential-ci's older
# vendored lane must adopt this launch contract before copying this file back.
# No runtime chart installation or console transport.
name: snp-metal-e2e

on:
  workflow_call:
    inputs:
      c8s_ref:
        description: 'CLI/test ref; its published node image rke2-snp-cdi-<sha> boots. Empty tests this checkout.'
        required: false
        type: string
        default: ''
      keep_cvm:
        description: 'leave the CVM running for debugging instead of tearing it down'
        required: false
        type: boolean
        default: false
      suite_artifact:
        description: 'optional extra suite: an artifact of the calling run, see .github/actions/extra-suite'
        required: false
        type: string
        default: ''
      suite_run:
        description: 'command that runs the extra suite; empty skips it'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      c8s_ref:
        description: 'CLI/test ref; its published node image rke2-snp-cdi-<sha> boots. Empty tests this checkout.'
        required: false
        default: ''
      keep_cvm:
        description: 'Skip teardown to debug a failure. The reaper still clears it after 3h.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # The reaper needs the owning run status; without this it falls back to age.
  actions: read

concurrency:
  # Runs of one image share its digest-named root and IGVM claims, and the
  # first import of a new image must not race a second.
  group: snp-metal-e2e
  cancel-in-progress: false

env:
  NS: confai-images
  VM: c8s-snp-${{ github.run_id }}-${{ github.run_attempt }}
  IMAGE_REPO: ghcr.io/confidential-dot-ai/node-guest-base
  # The vCPU count selects the measured IGVM variant; the launch digest
  # differs per count.
  SMP: "4"
  # KubeVirt hook sidecar that boots the IGVM and sets HOST_DATA from the
  # launch public key (confidential-metal images/igvm-hook-sidecar,
  # :snp-hostdata). Pinned here: the measured guest does not depend on it,
  # the attestation assert below does.
  IGVM_HOOK_IMAGE: ghcr.io/confidential-dot-ai/igvm-hook-sidecar@sha256:9bb4a027bb1b800b2af01625bf5525f45d6953cd088fb9f7526fb58521e5bf98

jobs:
  e2e:
    name: cvm (snp-metal/rke2-node)
    # Host-side launcher with namespace-scoped KubeVirt permissions; the
    # outer cluster uses its in-cluster service account credentials.
    runs-on: cvm-launcher
    # boot ~1m + guest first boot ~3m + c8s CLI build ~3m + services/convergence
    # ~3m + asserts, with headroom for a cold go cache. The first run of a new
    # image also imports its disk (~2.4 GiB) and IGVM, up to 10 more; an extra
    # suite gets 20 more.
    timeout-minutes: ${{ inputs.suite_run != '' && 75 || 55 }}
    steps:
      # This repository even when another one calls the lane, so .github/scripts
      # and .github/actions are the lane's: the run's own commit here, the
      # default branch for a caller elsewhere.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: confidential-dot-ai/c8s
          persist-credentials: false

      - name: tools (kubectl, go, crane)
        run: |
          set -euo pipefail
          # Every fetch here crosses the public internet from an ephemeral ARC
          # pod, and one hiccup fails the lane before it reaches a CVM.
          if ! command -v openssl >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends openssl
          fi
          mkdir -p "$PWD/bin"
          # A file because each run block starts a fresh shell. Arguments are
          # executed directly, including refs, without evaluating shell text.
          cat > bin/retry.sh <<'RETRY'
          retry() {
            local attempt delay=2
            for attempt in 1 2 3 4; do
              if "$@"; then return 0; fi
              [ "$attempt" -eq 4 ] && break
              echo "attempt $attempt failed; retrying in ${delay}s" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
            return 1
          }
          RETRY
          . bin/retry.sh
          kube_version=$(retry curl -fsSL https://dl.k8s.io/release/stable.txt)
          retry curl -fsSL "https://dl.k8s.io/release/$kube_version/bin/linux/amd64/kubectl" -o bin/kubectl
          chmod +x bin/kubectl
          echo "$PWD/bin" >> "$GITHUB_PATH"
          if ! command -v go >/dev/null; then
            # `|| true`: under `set -e` a failed substitution exits before the
            # pinned fallback on the next line can be reached.
            GOVER="$(curl -fsSL https://go.dev/VERSION?m=text 2>/dev/null | head -1 | sed 's/^go//' || true)"
            [ -n "$GOVER" ] || GOVER=1.27.1
            retry curl -fsSL "https://go.dev/dl/go${GOVER}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          fi
          # $GITHUB_PATH only affects LATER steps, so `go` is still not on PATH
          # inside THIS one. `go install crane` below needs it here and now.
          export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          # crane: the image-tag lookups below use it. Pinned rather than
          # fetched through the GitHub releases API, which rate-limits by IP
          # on a shared self-hosted host. The ephemeral ARC pod has no crane,
          # unlike the host, so install rather than assume.
          command -v crane >/dev/null || retry go install github.com/google/go-containerregistry/cmd/crane@v0.21.6
          # Avoid apt's intermittent IPv6 mirror failures on the launcher.
          if ! command -v jq >/dev/null; then
            retry curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o bin/jq
            chmod +x bin/jq
          fi

      # reap-before-provision: a killed run leaks a CVM (and its scratch PVC).
      # Fail SAFE: only reap on a positive "completed", or on age. An unknown
      # status (403/404/no token) KEEPS the CVM rather than killing a live run.
      - name: reap leaked CVMs from finished runs
        run: |
          set +e +o pipefail
          NOW=$(date -u +%s)
          for vm in $(kubectl -n "$NS" get vm -l ci.confidential.ai/managed=true -o name 2>/dev/null); do
            rid=$(kubectl -n "$NS" get "$vm" -o jsonpath='{.metadata.labels.ci\.confidential\.ai/run-id}' 2>/dev/null)
            standing=$(kubectl -n "$NS" get "$vm" -o jsonpath='{.metadata.labels.ci\.confidential\.ai/standing}' 2>/dev/null)
            [ "$standing" = "true" ] && { echo "keeping $vm (standing runner)"; continue; }
            [ -z "$rid" ] && continue
            [ "$rid" = "${{ github.run_id }}" ] && continue
            ct=$(kubectl -n "$NS" get "$vm" -o jsonpath='{.metadata.creationTimestamp}' 2>/dev/null)
            age=$(( NOW - $(date -u -d "$ct" +%s 2>/dev/null || echo "$NOW") ))
            # Ask GitHub whether the owning run is actually finished, rather than
            # waiting out the 3h age fallback while a CVM squats a finite host.
            # ANY org repo can invoke this lane, so the owning repo is read from
            # the annotation (a label value cannot hold the '/' in owner/repo).
            # Ported from cvm-e2e.yml, which has had this since the SNP lane
            # started leaking CVMs on cancelled runs.
            # NOTE: this needs `actions: read`. Without it the call 403s, $st is
            # empty, and we degrade to exactly the age-only behaviour this
            # replaces, which is safe but slow.
            orepo=$(kubectl -n "$NS" get "$vm" -o jsonpath='{.metadata.annotations.ci\.confidential\.ai/repo}' 2>/dev/null)
            st=$(gh api "repos/${orepo:-${{ github.repository }}}/actions/runs/$rid" -q .status 2>/dev/null)
            if [ "$st" = "completed" ]; then
              echo "reaping $vm (run ${orepo:-${{ github.repository }}}#$rid completed)"
              kubectl -n "$NS" delete "$vm" --ignore-not-found --wait=false
              kubectl -n "$NS" delete pvc "${vm#virtualmachine.kubevirt.io/}-scratch" --ignore-not-found --wait=false
              kubectl -n "$NS" delete secret "${vm#virtualmachine.kubevirt.io/}-opkey" "${vm#virtualmachine.kubevirt.io/}-cloudinit" --ignore-not-found
              kubectl -n "$NS" delete pod "${vm#virtualmachine.kubevirt.io/}-igvm" --ignore-not-found --wait=false
            elif [ -z "$st" ] && [ "$age" -gt 10800 ]; then
              echo "reaping $vm (status unknown, age ${age}s > 3h -> orphaned)"
              kubectl -n "$NS" delete "$vm" --ignore-not-found --wait=false
              kubectl -n "$NS" delete pvc "${vm#virtualmachine.kubevirt.io/}-scratch" --ignore-not-found --wait=false
              kubectl -n "$NS" delete secret "${vm#virtualmachine.kubevirt.io/}-opkey" "${vm#virtualmachine.kubevirt.io/}-cloudinit" --ignore-not-found
              kubectl -n "$NS" delete pod "${vm#virtualmachine.kubevirt.io/}-igvm" --ignore-not-found --wait=false
            else
              echo "keeping $vm (run ${orepo:-${{ github.repository }}}#$rid status=${st:-unknown} age=${age}s)"
            fi
          done
          # Shared root and IGVM claims outlive a run. Preserve VM references
          # too, including stopped VMs; a failed inventory lookup never
          # authorizes deletion.
          if vmis=$(kubectl -n "$NS" get vmi -o json) &&
             vms=$(kubectl -n "$NS" get vm -o json) &&
             inuse=$(jq -nr --argjson vmis "$vmis" --argjson vms "$vms" '
               [$vmis.items[].spec.volumes[]?, $vms.items[].spec.template.spec.volumes[]?]
               | .[] | (.persistentVolumeClaim.claimName // .dataVolume.name // empty)'); then
            for pvc in $(kubectl -n "$NS" get pvc -l 'ci.confidential.ai/managed=true,ci.confidential.ai/resource in (snp-node-root, snp-node-igvm)' -o name); do
              name=${pvc#persistentvolumeclaim/}
              [[ "$name" =~ ^c8s-snp-(root|igvm)-[0-9a-f]{12}$ ]] || continue
              grep -qx "$name" <<<"$inuse" && continue
              ct=$(kubectl -n "$NS" get "$pvc" -o jsonpath='{.metadata.creationTimestamp}')
              age=$(( NOW - $(date -u -d "$ct" +%s 2>/dev/null || echo "$NOW") ))
              [ "$age" -gt 604800 ] && { echo "reaping $name (unused, ${age}s old)"; kubectl -n "$NS" delete "$pvc" --ignore-not-found --wait=false; }
            done
          else
            echo "keeping shared claims: VM inventory is unavailable"
          fi
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: build the c8s CLI at the paired ref
        env:
          C8S_REF_INPUT: ${{ inputs.c8s_ref }}
        run: |
          set -euo pipefail
          # Same exposure as the tools step: this clone and the module fetches
          # behind `go install` cross the public internet under `set -e`.
          . "$GITHUB_WORKSPACE/bin/retry.sh"
          # This clone reproduces fine anonymously from a pod in arc-runners and
          # from this runner image, so when it fails HERE the cause is something
          # in the job's own context, and the bare error says nothing useful:
          #   fatal: could not read Username for 'https://github.com'
          # Capture the config git actually reads and the exchange it actually
          # gets, redacting any credential the trace would otherwise print.
          clone_diag() {
            echo "::group::c8s clone diagnostics"
            git config --list --show-origin 2>&1 \
              | sed -E 's/(extraheader|authorization|helper|password|token)=.*/\1=<redacted>/I' \
              | sed 's/^/cfg  /' | head -40
            env | grep -iE '^(GIT_|GH_|GITHUB_TOKEN|https?_proxy|HTTPS?_PROXY)' \
              | sed -E 's/=.*/=<set>/' | sed 's/^/env  /'
            GIT_TERMINAL_PROMPT=0 GIT_CURL_VERBOSE=1 \
              git ls-remote https://github.com/confidential-dot-ai/c8s.git HEAD 2>&1 \
              | sed -E 's/(authorization|Authorization|AUTHORIZATION):.*/\1: <redacted>/' \
              | tail -40 | sed 's/^/wire /'
            echo "::endgroup::"
          }
          if [ -z "${C8S_REF_INPUT:-}" ]; then
            # The checkout above: this run's commit here; for a caller elsewhere
            # the default branch, whose image may not be published yet (the
            # caller resolves one that is, or passes it).
            C8S_SOURCE_DIR=$GITHUB_WORKSPACE
          else
            [[ "$C8S_REF_INPUT" =~ ^[a-zA-Z0-9_./][a-zA-Z0-9_./-]*$ ]] || { echo "::error::invalid c8s_ref"; exit 1; }
            clone_c8s_source() {
              rm -rf /tmp/c8s-src && git clone -q https://github.com/confidential-dot-ai/c8s.git /tmp/c8s-src
            }
            retry clone_c8s_source || { clone_diag; exit 1; }
            git -C /tmp/c8s-src checkout -q "$C8S_REF_INPUT" || { echo "::error::bad c8s ref '$C8S_REF_INPUT': refusing to silently test main"; exit 1; }
            C8S_SOURCE_DIR=/tmp/c8s-src
          fi
          echo "C8S_SOURCE_DIR=$C8S_SOURCE_DIR" >> "$GITHUB_ENV"
          # The actual commit, not another ref lookup: a tag can shadow the
          # short hexadecimal image revision.
          C8S_SHA=$(git -C "$C8S_SOURCE_DIR" rev-parse HEAD)
          [[ "$C8S_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid source commit"; exit 1; }
          echo "C8S_SHA=$C8S_SHA" >> "$GITHUB_ENV"
          echo "c8sRef=${C8S_SHA:0:7}" >> "$GITHUB_ENV"
          echo "c8s ref sha: $C8S_SHA"
          pushd "$C8S_SOURCE_DIR" >/dev/null
          retry go install ./cmd/c8s
          popd >/dev/null
          # The CLI comes from the paired source; baked services stay in the image.
          c8s --version || true

      - name: resolve the node image built from the commit under test
        run: |
          set -euo pipefail
          # Only the pair built from one commit works: the image's measured base
          # pins its own build's CDS digest. c8s-image publishes rke2-snp-cdi-<sha>
          # (the CDI disk) and rke2-snp-<sha> (an ORAS artifact: the IGVMs and
          # manifest.json, whose variant for this vCPU count pairs a launch
          # digest with the IGVM that measures to it).
          . "$GITHUB_WORKSPACE/bin/retry.sh"
          [[ "$c8sRef" =~ ^[0-9a-f]{7}$ ]] || { echo "::error::invalid image source ref"; exit 1; }
          oci=${IMAGE_REPO#ghcr.io/}
          tok=$(retry curl -fsSL --max-time 20 "https://ghcr.io/token?scope=repository:${oci}:pull" | jq -er .token)
          accept='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json'
          IMG_DIGEST=""; code=""
          for attempt in 1 2 3 4; do
            hdr=$(curl -sI --max-time 20 -H "Authorization: Bearer $tok" -H "Accept: $accept" \
              "https://ghcr.io/v2/${oci}/manifests/rke2-snp-cdi-${c8sRef}" | tr -d '\r')
            code=$(awk 'NR==1{print $2}' <<<"$hdr")
            case "$code" in
              200) IMG_DIGEST=$(awk 'tolower($1)=="docker-content-digest:"{print $2}' <<<"$hdr"); break ;;
              404) echo "::error::no node image for the commit under test: ${IMAGE_REPO}:rke2-snp-cdi-${c8sRef} is not published. The lane needs the exact pair; wait for this commit's c8s-image run, or dispatch with a c8s_ref whose image exists"; exit 1 ;;
              *)   sleep $((attempt * 3)) ;;
            esac
          done
          [[ "$IMG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::ghcr answered ${code:-none} for rke2-snp-cdi-${c8sRef} on 4 attempts"; exit 1; }
          retry curl -fsSL --max-time 60 -H "Authorization: Bearer $tok" -H "Accept: $accept" \
            "https://ghcr.io/v2/${oci}/manifests/rke2-snp-${c8sRef}" -o /tmp/image-oras.json
          mlayer=$(jq -er '[.layers[] | select(.annotations["org.opencontainers.image.title"]=="manifest.json")] | if length == 1 then .[0].digest else error("expected one manifest.json layer") end' /tmp/image-oras.json)
          [[ "$mlayer" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid manifest layer digest"; exit 1; }
          retry curl -fsSL --max-time 60 -H "Authorization: Bearer $tok" "https://ghcr.io/v2/${oci}/blobs/$mlayer" -o /tmp/image-manifest.json
          # Refuses anything but one smp=$SMP variant whose IGVM is a layer of
          # the artifact; names the digest-keyed claims the stages below share.
          bash .github/scripts/snp-node-image.sh env /tmp/image-oras.json /tmp/image-manifest.json "$IMG_DIGEST" "$SMP" >> "$GITHUB_ENV"
          echo "c8s under test ${c8sRef} on its own node image rke2-snp-cdi-${c8sRef} (${IMG_DIGEST:0:19}...), launch digest $(jq -r --argjson smp "$SMP" '.snp_variants[] | select(.smp == $smp) | .measurement.snp_launch_digest[0:16]' /tmp/image-manifest.json)..."

      - name: stage the root disk on the launcher (no-op when already staged)
        run: |
          set -euo pipefail
          # A CDI registry import into a claim named by image digest, shared
          # read-only by every run of this image; immediate binding, so no
          # binder pod is needed on this single-node host. API errors abort,
          # and an existing claim must have imported this exact image.
          existing=$(kubectl -n "$NS" get pvc "$rootPvc" --ignore-not-found -o json)
          if [ -n "$existing" ]; then
            bash .github/scripts/snp-node-image.sh check-root-pvc "$image" <<<"$existing"
          else
            bash .github/scripts/snp-node-image.sh root-pvc "$rootPvc" "$image" "$NS" | kubectl create -f -
          fi
          for i in $(seq 1 120); do
            phase=$(kubectl -n "$NS" get pvc "$rootPvc" -o jsonpath='{.metadata.annotations.cdi\.kubevirt\.io/storage\.pod\.phase}' 2>/dev/null || true)
            case "$phase" in
              Succeeded) echo "root disk $rootPvc ready"; break ;;
              Failed) kubectl -n "$NS" describe pvc "$rootPvc" | tail -15; echo "::error::CDI import of $image failed"; exit 1 ;;
            esac
            [ "$i" -lt 120 ] || { kubectl -n "$NS" describe pvc "$rootPvc" | tail -15; echo "::error::CDI import of $image did not finish in 20 min (phase ${phase:-none})"; exit 1; }
            sleep 10
          done

      - name: stage the IGVM on the launcher (no-op when already staged)
        run: |
          set -euo pipefail
          # The hook sidecar mounts a claim into the compute container and
          # boots the IGVM from it, so the file lives in one named by its
          # digest, filled once by a run-owned pod that verifies the hash
          # against the published manifest before naming the file.
          existing=$(kubectl -n "$NS" get pvc "$igvmPvc" --ignore-not-found -o json)
          if [ -n "$existing" ]; then
            bash .github/scripts/snp-node-image.sh check-igvm-pvc "$igvmDigest" <<<"$existing"
          else
            bash .github/scripts/snp-node-image.sh igvm-pvc "$igvmPvc" "$NS" "$igvmDigest" | kubectl create -f -
          fi
          kubectl -n "$NS" delete pod "$VM-igvm" --ignore-not-found --wait=true --timeout=60s
          bash .github/scripts/snp-node-image.sh igvm-pod "$VM-igvm" "$NS" "$igvmPvc" "$igvmFile" "$igvmDigest" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" | kubectl create -f -
          for i in $(seq 1 90); do
            phase=$(kubectl -n "$NS" get pod "$VM-igvm" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$phase" in
              Succeeded) kubectl -n "$NS" logs "$VM-igvm" | tail -2; break ;;
              Failed) kubectl -n "$NS" logs "$VM-igvm" | tail -10; echo "::error::fetching $igvmFile ($igvmDigest) into $igvmPvc failed"; exit 1 ;;
            esac
            [ "$i" -lt 90 ] || { kubectl -n "$NS" describe pod "$VM-igvm" | tail -15; echo "::error::fetching $igvmFile did not finish in 15 min (phase ${phase:-none})"; exit 1; }
            sleep 10
          done
          # Release the claim before the VM mounts it.
          kubectl -n "$NS" delete pod "$VM-igvm" --ignore-not-found --wait=true --timeout=60s

      - name: preflight, SEV-SNP device capacity
        run: |
          set -uo pipefail
          # The launcher's bm-e2e SA is namespace-scoped; node reads are a
          # nicety it may not have, so the check is skipped without them.
          if kubectl auth can-i get nodes >/dev/null 2>&1; then
            N=$(kubectl get node -l confidential.ai/sev-snp=true -o jsonpath='{.items[0].status.allocatable.devices\.kubevirt\.io/sev}' 2>/dev/null)
            echo "devices.kubevirt.io/sev = ${N:-unknown}"
            [ "${N:-0}" != "0" ] || { echo "::error::the SNP node advertises no devices.kubevirt.io/sev: the VMI would sit Scheduling forever"; exit 1; }
          else
            echo "no node read permission; skipping the SEV device capacity preflight"
          fi

      - name: sign the server launch and attach opkeydata
        # The same exact public PEM is signed into launch.yaml, bound by the
        # measured initrd against HOSTDATA, and pinned by external clients.
        run: |
          set -euo pipefail
          # The published manifest pins this vCPU count's launch digest; the
          # bundle's server.key doubles as the run's operator key.
          c8s launch-config new --out /tmp/launch-data --cluster-id "$VM" --server-name c8s-node \
            --image-manifest /tmp/image-manifest.json --vcpus "$SMP"
          echo "SNP_HOST_DATA=$(openssl dgst -sha256 -binary /tmp/launch-data/server/pubkey | base64 -w0)" >> "$GITHUB_ENV"
          kubectl -n "$NS" create secret generic "$VM-opkey" \
            --from-file=pubkey=/tmp/launch-data/server/pubkey \
            --from-file=launch.yaml=/tmp/launch-data/server/launch.yaml \
            --from-file=launch.yaml.sig=/tmp/launch-data/server/launch.yaml.sig \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: boot the SNP CVM
        run: |
          set -euo pipefail
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: $VM-scratch
            namespace: $NS
            labels: {ci.confidential.ai/managed: "true"}
          spec:
            accessModes: [ReadWriteOnce]
            resources: {requests: {storage: 80Gi}}
            storageClassName: local-path
          ---
          apiVersion: v1
          kind: Secret
          metadata: {name: $VM-cloudinit, namespace: $NS}
          type: Opaque
          # Bait, not configuration: the node image disables cloud-init, so
          # this host disk must be inert (asserted by the tripwire step
          # below). c8s-local patch — mirror to confidential-ci before
          # re-vendoring.
          stringData:
            userdata: |
              #cloud-config
              hostname: cidata-bait
          ---
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: $VM
            namespace: $NS
            labels:
              ci.confidential.ai/managed: "true"
              ci.confidential.ai/standing: "false"
              ci.confidential.ai/run-id: "${{ github.run_id }}"
              ci.confidential.ai/run-attempt: "${{ github.run_attempt }}"
              ci.confidential.ai/platform: "snp-metal"
              ci.confidential.ai/flavor: "rke2-node"
            annotations:
              ci.confidential.ai/repo: "${{ github.repository }}"
              ci.confidential.ai/run-url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          spec:
            runStrategy: Always
            template:
              metadata:
                labels: {kubevirt.io/domain: $VM}
                annotations:
                  igvm.confidential.ai/file: "$igvmFile"
                  snp.confidential.ai/host-data: "$SNP_HOST_DATA"
                  hooks.kubevirt.io/hookSidecars: '[{"image":"$IGVM_HOOK_IMAGE","imagePullPolicy":"IfNotPresent","args":["--version","v1alpha3"],"pvc":{"name":"$igvmPvc","volumePath":"/igvm","sharedComputePath":"/var/run/igvm"}}]'
              spec:
                nodeSelector:
                  confidential.ai/sev-snp: "true"
                domain:
                  cpu:
                    model: EPYC-Genoa
                    cores: $SMP
                  devices:
                    # No vsock: the TDX guest fetches quotes over it, the SNP
                    # guest attests through /dev/sev-guest, and the SNP
                    # launcher's KubeVirt has no VSOCK feature gate.
                    disks:
                      - name: rootdisk
                        # dm-verity rootfs: never written. readonly takes a
                        # SHARED qemu lock so concurrent CVMs coexist; a
                        # writable open takes an EXCLUSIVE one and starves every
                        # other guest on the same PVC (cost the SNP lane a day).
                        # NB: readonly is a field of disk, not a sibling of it;
                        # KubeVirt's strict decoder rejects the sibling form.
                        disk: {bus: virtio, readonly: true}
                      - name: scratch
                        disk: {bus: virtio}
                        # HARD requirement: the initrd keys the encrypted
                        # overlay off this exact serial. Without it the guest
                        # falls back to a 2G tmpfs and rke2 wedges when full.
                        serial: confai-scratch
                      - name: opkey
                        disk: {bus: virtio}
                      - name: cloudinit
                        disk: {bus: virtio}
                    interfaces: [{name: default, bridge: {}}]
                    rng: {}
                  firmware: {bootloader: {efi: {secureBoot: false}}}
                  launchSecurity: {snp: {}}
                  memory: {guest: 16Gi}
                  resources: {requests: {memory: 16Gi}}
                networks: [{name: default, pod: {}}]
                volumes:
                  - name: rootdisk
                    persistentVolumeClaim: {claimName: $rootPvc}
                  - name: scratch
                    persistentVolumeClaim: {claimName: $VM-scratch}
                  - name: opkey
                    secret: {secretName: $VM-opkey, volumeLabel: opkeydata}
                  - name: cloudinit
                    cloudInitNoCloud: {secretRef: {name: $VM-cloudinit}}
          EOF
          for _ in $(seq 1 60); do
            PHASE=$(kubectl -n "$NS" get vmi "$VM" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$PHASE" = Running ] && break
            sleep 5
          done
          if [ "${PHASE:-}" != Running ]; then
            kubectl -n "$NS" describe vmi "$VM" | tail -25
            echo "::error::VMI not Running (phase=${PHASE:-none}). check SNP host capacity, the measured IGVM, and the host-data hook"
            exit 1
          fi
          for _ in $(seq 1 60); do
            IP=$(kubectl -n "$NS" get vmi "$VM" -o jsonpath='{.status.interfaces[0].ipAddress}' 2>/dev/null || true)
            [ -n "$IP" ] && break
            sleep 5
          done
          [ -n "${IP:-}" ] || { echo "::error::the VMI never reported an IP"; kubectl -n "$NS" describe vmi "$VM" | tail -20; exit 1; }
          echo "GUEST_IP=$IP" >> "$GITHUB_ENV"
          echo "VMI Running at $IP"

      - name: assert genuine SEV-SNP launch with the bound HOSTDATA
        run: |
          set -euo pipefail
          POD=$(kubectl -n "$NS" get pods -l kubevirt.io/domain="$VM" -o name | head -1)
          kubectl -n "$NS" exec "$POD" -c compute -- \
            sh -c 'tr "\0" "\n" < /proc/$(pgrep -f qemu-system | head -1)/cmdline' > /tmp/qemu.cmdline
          # libvirt renders the object either as key=value or as JSON
          # ("host-data":"..."), so match the object and the value, not a syntax.
          OBJ=$(grep -A1 -x -- '-object' /tmp/qemu.cmdline | grep 'sev-snp-guest' | head -1 || true)
          echo "sev-snp-guest object: ${OBJ:-<none>}"
          [ -n "$OBJ" ] || { echo "::error::qemu has no sev-snp-guest object: not a genuine SNP guest"; exit 1; }
          case "$OBJ" in *"$SNP_HOST_DATA"*) ;; *) echo "::error::the sev-snp-guest object carries no host-data equal to this run's operator-key hash; the binding is missing"; exit 1 ;; esac
          echo "OK: qemu launched with -object sev-snp-guest and host-data bound to this run's operator key"

      - name: wait for the credential-release listener
        # HTTP reachability only; the next step verifies hardware evidence,
        # the full image tuple and our operator key before accepting credentials.
        # The raw attestation API is loopback-only in the measured image.
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 120); do
            code=$(curl -sk --connect-timeout 2 --max-time 4 -o /dev/null -w '%{http_code}' "https://$GUEST_IP:8443/" 2>/dev/null || true)
            if [ -n "$code" ] && [ "$code" != 000 ]; then ready=1; break; fi
            sleep 5
          done
          [ "$ready" = 1 ] || { echo "::error::credential release did not start; signed launch or measured service startup failed"; exit 1; }

      - name: get an attested, operator-key-bound kubeconfig (armTLS)
        run: |
          set -euo pipefail
          # The immutable published manifest was checked before launch. The
          # credential gate verifies SNP hardware evidence, launch digest and
          # HOSTDATA=SHA256(our exact operator public PEM); no TOFU fallback.
          # cred-release opens :8443 a little before its release handler can
          # serve (first armTLS quote, client CA); that window answers a POST
          # with EOF. Retry a bounded number of times and print each failure.
          ok=""
          for attempt in 1 2 3 4 5 6; do
            if c8s get-kubeconfig --node "$GUEST_IP" --operator-key /tmp/launch-data/server.key --image-manifest /tmp/image-manifest.json --out /tmp/guest.kubeconfig --timeout 180s; then ok=1; break; fi
            echo "get-kubeconfig attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          [ -n "$ok" ] && [ -s /tmp/guest.kubeconfig ] || { echo "::error::no attested kubeconfig after 6 attempts"; exit 1; }
          WHO=$(KUBECONFIG=/tmp/guest.kubeconfig kubectl auth whoami -o jsonpath='{.status.userInfo.username}')
          [ "$WHO" = operator ] || { echo "::error::unexpected identity '$WHO'"; exit 1; }
          echo "OK: attested kubeconfig, identity=$WHO"
          KUBECONFIG=/tmp/guest.kubeconfig kubectl get nodes

      - name: assert the host cidata disk is inert
        run: .github/scripts/cidata-tripwire.sh

      - name: assert measured services and Kubernetes integration converged
        # components-ready checks every baked workload and its policy mounts,
        # then verifies the CDS front door against the full server policy.
        run: |
          set -euo pipefail
          export KUBECONFIG=/tmp/guest.kubeconfig
          export C8S_NODE_IMAGE=1
          export C8S_ALLOWLIST_URL="https://$GUEST_IP:443"
          export C8S_MEASUREMENTS_CONFIG=/tmp/launch-data/server.json
          bash "$C8S_SOURCE_DIR"/test/e2e/components-ready.sh

      - name: assert the image floor denies, then opens to a signed write
        # Baked nginx fronts /allowlist on 443; discovery pins the whole
        # measured image tuple and the server operator key.
        run: |
          set -euo pipefail
          export KUBECONFIG=/tmp/guest.kubeconfig
          export C8S_ALLOWLIST_URL="https://$GUEST_IP:443"
          export C8S_MEASUREMENTS_CONFIG=/tmp/launch-data/server.json
          export C8S_OPERATOR_KEY=/tmp/launch-data/server.key
          bash "$C8S_SOURCE_DIR"/test/e2e/allowlist-enforcement.sh

      - name: assert a confidential workload runs with an injected cert
        run: |
          set -euo pipefail
          export KUBECONFIG=/tmp/guest.kubeconfig
          export C8S_ALLOWLIST_URL="https://$GUEST_IP:443"
          export C8S_MEASUREMENTS_CONFIG=/tmp/launch-data/server.json
          export C8S_OPERATOR_KEY=/tmp/launch-data/server.key
          bash "$C8S_SOURCE_DIR"/test/e2e/cw-workload.sh

      - name: assert confidential workload label integrity
        run: |
          set -euo pipefail
          export KUBECONFIG=/tmp/guest.kubeconfig
          bash "$C8S_SOURCE_DIR"/test/e2e/cw-label-policy.sh

      - name: extra suite
        if: inputs.suite_run != ''
        uses: ./.github/actions/extra-suite
        with:
          artifact: ${{ inputs.suite_artifact }}
          run: ${{ inputs.suite_run }}
          platform: snp-metal

      - name: diagnostics (on failure)
        if: failure() || cancelled()
        run: |
          set +e
          echo "::group::host-side VMI and launcher"
          kubectl -n "$NS" describe vmi "$VM" 2>&1 | tail -30
          POD=$(kubectl -n "$NS" get pods -l kubevirt.io/domain="$VM" -o name 2>/dev/null | head -1)
          [ -n "$POD" ] && kubectl -n "$NS" logs "$POD" --all-containers --tail=40 2>&1 | grep -iE 'igvm|host-data|hostData|sev|error' | tail -20
          echo "::endgroup::"
          # The guest's serial console is read-only here (no autologin), but its
          # boot log names the unit that did not come up.
          echo "::group::guest console (systemd units, cred-release, psa-ready, initrd)"
          [ -n "$POD" ] && kubectl -n "$NS" logs "$POD" -c guest-console-log --tail=400 2>/dev/null \
            | tr -cd '[:print:]\n' | sed -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' \
            | grep -iE 'initrd|opkey|HOSTDATA|cred-release|psa-ready|rke2|Failed|failed|error' | tail -40
          echo "::endgroup::"
          # Guest-side state exists only once the attested kubeconfig was issued.
          [ -s /tmp/guest.kubeconfig ] || exit 0
          export KUBECONFIG=/tmp/guest.kubeconfig
          echo "::group::c8s-system pods and events"
          kubectl -n c8s-system get pods -o wide 2>&1
          kubectl -n c8s-system get events --sort-by=.lastTimestamp 2>&1 | tail -25
          echo "::endgroup::"
          # The node image's kubelet serves no debugging handlers, so pods/log
          # is refused; exit codes and termination messages are still in status.
          for p in $(kubectl -n c8s-system get pods -o name 2>/dev/null); do
            echo "::group::$p"
            kubectl -n c8s-system describe "$p" 2>&1 | sed -n '/^Events:/,$p' | tail -12
            kubectl -n c8s-system get "$p" -o json 2>/dev/null | jq -r '
              (.status.initContainerStatuses // []) + (.status.containerStatuses // []) | .[]
              | "\(.name): restarts=\(.restartCount) state=\(.state | keys[0]) last=\(.lastState.terminated // {} | "exit=\(.exitCode // "-") reason=\(.reason // "-") message=\(.message // "-" | tostring | .[0:600])")"'
            echo "::endgroup::"
          done
          exit 0

      - name: summary
        if: always()
        run: |
          {
            echo "### c8s on SNP metal"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${image:-?}\` |"
            echo "| rootPvc | \`${rootPvc:-?}\` |"
            echo "| igvmPvc | \`${igvmPvc:-?}\` |"
            echo "| c8s ref | \`${c8sRef:-?}\` |"
            echo "| SNP launch digest | \`${snpLaunchDigest:0:32}...\` |"
            echo "| guest | \`${GUEST_IP:-?}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: teardown
        if: always() && inputs.keep_cvm != true
        run: |
          set +e
          cleanup_failed=0
          kubectl -n "$NS" delete vm "$VM" --ignore-not-found --wait=true --timeout=120s || cleanup_failed=1
          kubectl -n "$NS" delete secret "$VM-opkey" "$VM-cloudinit" --ignore-not-found || cleanup_failed=1
          kubectl -n "$NS" delete pvc "$VM-scratch" --ignore-not-found --wait=false || cleanup_failed=1
          kubectl -n "$NS" delete pod "$VM-igvm" --ignore-not-found --wait=false || cleanup_failed=1
          [ "$cleanup_failed" = 0 ] || echo "::error::SNP cleanup incomplete; owned resources may need orphan reaping"
          exit "$cleanup_failed"
