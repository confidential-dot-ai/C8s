name: confidential-inference compatibility

# Judges each change on main against confidential-inference's main: would it
# have to change to move its c8s pin onto this commit? An INCOMPATIBLE verdict
# is a red run; it blocks nothing. The judge is
# .github/scripts/confidential-inference-compat.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      before:
        description: Judge the dispatched ref's head against this commit
        required: true

permissions:
  contents: read

jobs:
  judge:
    name: Judge the change
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: confidential-dot-ai/confidential-inference
          path: confidential-inference
          persist-credentials: false

      - name: Judge the change
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEFORE: ${{ github.event.before || inputs.before }}
        run: |
          bash .github/scripts/confidential-inference-compat.sh \
            --c8s . --confidential-inference confidential-inference \
            --before "$BEFORE" --after "$GITHUB_SHA" | tee "$GITHUB_STEP_SUMMARY"
