name: docs install parity

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main, "feat/**"]

concurrency:
  group: docs-install-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/relevant-changes
        with:
          filters: |
            relevant:
              - ".github/actions/relevant-changes/**"
              - "docs/DEMO.md"
              # The flag validation and preflights the gate exercises live here.
              - "cmd/c8s/**"
              - "charts/**"
              - "internal/helmchart/**"
              - "scripts/check-doc-install-commands.sh"
              - ".github/workflows/docs-install-parity.yml"

  doc-commands:
    name: Doc install commands
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-c8s

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4

      - name: Build the c8s CLI
        run: go build -o "$GITHUB_WORKSPACE/bin/c8s" ./cmd/c8s

      - name: Run the documented c8s commands to the cluster boundary
        run: PATH="$GITHUB_WORKSPACE/bin:$PATH" scripts/check-doc-install-commands.sh

  result:
    name: docs install parity result
    runs-on: ubuntu-latest
    needs: [changes, doc-commands]
    if: always()
    steps:
      # A job skipped by a failed dependency also reports skipped, so the changes job is read on its own.
      - name: Require every job to have succeeded or skipped
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          exit 1
