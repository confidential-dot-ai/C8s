# Automatic-only entrypoint. Manual builds use c8s-image-manual.yml.
# Trusted production entrypoint for the reusable C8s image builder. Keeping the
# write grant and production secrets here lets pull-request callers use the same
# builder with a read-only token and no inherited secrets.
name: c8s-image

# Every Docker run spawns one of these, PR runs included, and only the
# main-push (or protected beta-push) one builds — so a single merge produces one building run plus
# several correctly-skipped siblings that are otherwise indistinguishable in
# the UI and `gh run list` (same name, branch and SHA). Saying which is which
# in the run name is what stops "my guest-image merge produced no image"
# being the obvious-but-wrong reading of that list.
run-name: >-
  ${{ (github.event.workflow_run.event == 'push' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'beta'))
      && format('c8s-image BUILDS ({0} push)', github.event.workflow_run.head_branch)
   || format('c8s-image skipped ({0} on {1}, not a main or beta push)', github.event.workflow_run.event, github.event.workflow_run.head_branch) }}

on:
  # build-c8s resolves ta:<sha> / nri-image-policy:<sha>, which Docker
  # publishes first. Gate on it so those digests exist.
  workflow_run:
    workflows: ["Docker"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # A rerun of the same parent completion must not race its own alias repair.
  # The distinct prefix avoids sharing a group with the called builder.
  group: c8s-image-entrypoint-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  # A release tag is created inside the successful parent Docker run. Resolve it
  # from that run's exact revision only for the trusted automatic main and beta
  # paths; manual guest-image rebuilds must never mint or move release aliases.
  # main resolves only stable tags and beta only -beta.N tags.
  release-context:
    name: Resolve release context
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'beta')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Checkout the parent Docker revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Find its canonical release tag
        id: release-tag
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || \
             [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::parent Docker revision is not the checked-out full commit SHA"
            exit 1
          fi
          case "$HEAD_BRANCH" in
            main) pattern='^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$' ;;
            beta) pattern='^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)-beta[.][1-9][0-9]*$' ;;
            *)
              echo "::error::no release channel for branch $HEAD_BRANCH"
              exit 1
              ;;
          esac
          mapfile -t release_tags < <(
            git tag --points-at "$HEAD_SHA" --list 'v*' \
              | grep -E "$pattern" \
              | sort -V
          )
          if [ "${#release_tags[@]}" -gt 1 ]; then
            echo "::error::multiple $HEAD_BRANCH release tags name $HEAD_SHA"
            printf '%s\n' "${release_tags[@]}"
            exit 1
          fi
          echo "tag=${release_tags[0]:-}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: release-context
    permissions:
      contents: read
      packages: write # Publish trusted floating and commit-scoped artifacts.
    uses: ./.github/workflows/c8s-image.yml
    with:
      release_tag: ${{ needs.release-context.outputs.tag }}
    secrets:
      MODULE_SIG_KEY_PEM: ${{ secrets.MODULE_SIG_KEY_PEM }}

  # Wait for every guest-image build, then preflight every exact alias before
  # creating any of them, from the digests the build legs recorded. Registry
  # publication is not transactional, so a network failure may leave a subset;
  # re-running the failed jobs repairs missing aliases and rejects any existing
  # alias whose digest differs. Both protected jobs run the scripts of this
  # workflow's own commit, never the built one.
  promote-release:
    name: Publish exact guest-image release aliases
    needs: [release-context, build-and-push]
    if: |
      always() &&
      needs.release-context.result == 'success' &&
      needs.build-and-push.result == 'success' &&
      needs.release-context.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write # Promote aliases only from this protected job.
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts

      - name: Download the pushed digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guest-push-*-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/guest-push
          merge-multiple: true

      - name: Setup ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: "1.2.3"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish or verify exact release aliases
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: .github/scripts/release-guests.sh promote "$RELEASE_TAG" "$RUNNER_TEMP/guest-push"

  # The only job of this workflow with an OIDC token. Its identity,
  # c8s-image-publish.yml on main, signs stable and beta releases alike.
  sign-guests:
    name: Sign the guest-image statement
    needs: [release-context, promote-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # Upload the statement to the GitHub release.
      id-token: write # Sign the statement keyless.
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts

      - name: Download the pushed digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guest-push-*-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/guest-push
          merge-multiple: true

      - name: Setup ORAS
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          version: "1.2.3"

      - name: Install pinned cosign
        env:
          # Bump together with COSIGN_VERSION and COSIGN_SHA256 in semver-tag.yml.
          COSIGN_VERSION: "3.1.3"
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          binary="$RUNNER_TEMP/bin/cosign"
          .github/scripts/fetch-release.sh sigstore/cosign "v$COSIGN_VERSION" cosign-linux-amd64 "$binary"
          printf '%s  %s\n' "$COSIGN_SHA256" "$binary" | sha256sum --check --status
          chmod +x "$binary"
          "$binary" version --json | jq -e --arg v "v$COSIGN_VERSION" '.gitVersion == $v' > /dev/null
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Write, sign and publish the guest statement
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          .github/scripts/release-guests.sh statement "$RELEASE_TAG" "$HEAD_SHA" "$RUNNER_TEMP/guest-push" "$RUNNER_TEMP/guest-statement"
          .github/scripts/release-guests.sh publish "$RELEASE_TAG" "$RUNNER_TEMP/guest-statement"
