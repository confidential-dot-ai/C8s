name: release version tests

on:
  push:
    branches: [main, beta]
    paths: &release-paths
      - .github/scripts/calculate-release-version.sh
      - .github/scripts/tests/test-calculate-release-version.sh
      - .github/workflows/release-version-tests.yml
  pull_request:
    branches: [main, beta]
    paths: *release-paths

permissions:
  contents: read

jobs:
  publication-policy:
    name: release publication policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/tests/test-calculate-release-version.sh
