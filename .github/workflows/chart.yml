name: Helm Chart

on:
  push:
    branches: [main, beta, "feat/**"]
    paths: &chart-paths
      - "internal/helmchart/**"
      - ".github/workflows/chart.yml"
  pull_request:
    branches: [main, beta, "feat/**"]
    paths: *chart-paths

env:
  REGISTRY: ghcr.io
  CHART_REPO: ghcr.io/confidential-dot-ai/charts
  CHART_DIR: internal/helmchart/c8s

jobs:
  package:
    name: Lint, package & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.4

      - name: Determine chart version
        id: ver
        run: .github/scripts/chart-version.sh

      - name: Lint & template chart
        run: .github/scripts/chart-verify.sh

      - name: Helm package
        env:
          CHART_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          helm package "$CHART_DIR" \
            --version "$CHART_VERSION" \
            --app-version "$CHART_VERSION" \
            -d dist/

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            helm registry login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin

      - name: Helm push
        if: github.event_name == 'push'
        env:
          CHART_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          helm push "dist/c8s-$CHART_VERSION.tgz" \
            "oci://$CHART_REPO"
