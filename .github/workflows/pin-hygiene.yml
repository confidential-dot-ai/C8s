# Build pins must stay immutable refs (c8s#264): a branch name or short sha
# here silently changes what a "pinned" build means.
name: pin hygiene
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/build-pins.json"
      - ".github/scripts/pin-manifest.sh"
      - "node-guest-image/c8s/mkosi.sync"
      - "**/Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          fail=0
          bash .github/scripts/pin-manifest.sh validate \
            --manifest .github/build-pins.json
          # mkosi.sync must not carry a C8S_REF default (see the comment there).
          if grep -nE '^C8S_REF="\$\{C8S_REF:-' node-guest-image/c8s/mkosi.sync; then
            echo "::error file=node-guest-image/c8s/mkosi.sync::C8S_REF must have no default; the c8s-ref sync-input is required"; fail=1
          fi
          # Every third-party action is a 40-hex commit. A tag or branch is
          # whatever its owner repoints it at, on a runner holding GHCR push
          # credentials.
          unpinned=$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' \
                       .github/workflows .github/actions \
                     | grep -vE 'uses:[[:space:]]*\./' \
                     | grep -vE 'uses:[[:space:]]*[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned" | while IFS= read -r line; do
              echo "::error file=${line%%:*}::action is not pinned to a 40-hex commit: ${line#*:*:}"
            done
            fail=1
          fi

          # Every base is content-addressed; the tag beside it is for readers
          # and for Dependabot to compare against.
          undigested=$(grep -rn '^FROM ' --include=Dockerfile . \
                       | grep -vE '@sha256:[0-9a-f]{64}' || true)
          if [ -n "$undigested" ]; then
            echo "$undigested" | while IFS= read -r line; do
              echo "::error file=${line%%:*}::base image is not digest-pinned: ${line#*:*:}"
            done
            fail=1
          fi
          exit $fail
