# kube-proxy at the worker's Kubernetes version, from registry.k8s.io.
apiVersion: v1
kind: Pod
metadata:
  name: kube-proxy
  namespace: kube-system
  labels: {k8s-app: kube-proxy}
spec:
  hostNetwork: true
  dnsPolicy: Default
  enableServiceLinks: false
  priorityClassName: system-node-critical
  containers:
  - name: kube-proxy
    image: registry.k8s.io/kube-proxy:v1.36.6@sha256:70871b645aecbca013bfb8254ce29f49143822054b743b78485db1f5f0d5de2c
    command: [/usr/local/bin/kube-proxy]
    args: ['--cluster-cidr=${POD_CIDR}', --conntrack-max-per-core=0, --conntrack-tcp-timeout-close-wait=0s, --conntrack-tcp-timeout-established=0s, --healthz-bind-address=127.0.0.1, '--hostname-override=${NODE_NAME}',
      --iptables-localhost-nodeports=false, --kubeconfig=/var/lib/kubelet/kubeconfig, --proxy-mode=iptables]
    env:
    - {name: PATH, value: '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'}
    securityContext: {privileged: true}
    volumeMounts:
    - {name: kubeconfig, mountPath: /var/lib/kubelet/kubeconfig, readOnly: true}
    - {name: kubelet-pki, mountPath: /var/lib/kubelet/pki, readOnly: true}
    - {name: xtables-lock, mountPath: /run/xtables.lock}
    - {name: lib-modules, mountPath: /lib/modules, readOnly: true}
  volumes:
  - name: kubeconfig
    hostPath: {path: /var/lib/kubelet/kubeconfig, type: File}
  - name: kubelet-pki
    hostPath: {path: /var/lib/kubelet/pki, type: Directory}
  - name: xtables-lock
    hostPath: {path: /run/xtables.lock, type: FileOrCreate}
  - name: lib-modules
    hostPath: {path: /lib/modules}
