{{- /* nginx's public ports from anywhere; the loopback sidecars stay unreachable. */ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "router.fullname" . }}-ingress
  namespace: {{ include "c8s.routerMeshNamespace" . }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress-policy
spec:
  podSelector:
    matchLabels:
      {{- include "router.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        {{- range include "router.publicPorts" . | fromJsonArray }}
        - protocol: TCP
          port: {{ .containerPort }}
        {{- end }}
