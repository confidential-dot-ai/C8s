# What a cluster of workers holds for its nodes: the static pods' grants,
# which their node's kubelet credentials carry, so every node holds them
# (CoreDNS needs nothing c8s-worker-cilium does not grant); the grants a
# kubelet's bootstrap token and client-certificate rotation rest on, which a
# control plane other than kubeadm's leaves unbound; the Cilium operator's,
# which runs beside the control plane as the user c8s-cilium-operator, since
# NodeRestriction keeps node credentials from its leader lease; and the
# kube-dns Service in front of the workers' CoreDNS, at clusterDNS. Every
# worker runs CoreDNS, so a lookup stays on its node. Last, the store account
# of a CDS replica set.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c8s-worker-cilium
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
