  - ciliumidentities
  - ciliumnodes
  verbs:
  - create
- apiGroups:
  - cilium.io
  resources:
  - ciliumidentities
  verbs:
  - update
- apiGroups:
  - cilium.io
  resources:
  - ciliumendpoints
  verbs:
  - delete
  - get
- apiGroups:
  - cilium.io
  resources:
  - ciliumnodes
  - ciliumnodes/status
  verbs:
  - get
  - update
- apiGroups:
  - cilium.io
  resources:
  - ciliumbgpnodeconfigs/status
  - ciliumendpoints
  - ciliumendpoints/status
  - ciliuml2announcementpolicies/status
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-worker-cilium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c8s-worker-cilium
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: 'system:nodes'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-worker-kube-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:node-proxier'
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: 'system:nodes'
---
# A worker's kubelet asks for its client certificate with the bootstrap token.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-worker-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:node-bootstrapper'
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: 'system:bootstrappers'
---
# The signer issues that first certificate without an admin approving it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-worker-bootstrap-client-cert
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:certificates.k8s.io:certificatesigningrequests:nodeclient'
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: 'system:bootstrappers'
---
# The kubelet rotates that certificate, each renewal approved the same way.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-worker-client-cert-renewal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:certificates.k8s.io:certificatesigningrequests:selfnodeclient'
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: 'system:nodes'
---
