{{- define "router.podSpec" -}}
# Keeps the env names fixed for the allowlist's env match (c8s.componentEnv).
enableServiceLinks: false
serviceAccountName: {{ include "router.fullname" . }}
{{- include "c8s.imagePullSecrets" . | nindent 0 }}
nodeSelector:
  {{- include "c8s.confidentialNodeLabels" . | nindent 2 }}
{{- /* Every container of this pod holds a platform role the measured base
       grants it, and runs as that role's reserved identity: c8s.meshUID for
       the endpoint, c8s.credentialsUID for get-cert, the probe-file gate and
       the allowlist proxy, c8s.routerUID for nginx, c8s.upstreamUID for
       cds-attest. The volume group (c8s.certFsGroup) is what lets a role
       read what another role wrote. */}}
initContainers:
  {{- /* The endpoint leads: the enforcer gates the rest of the pod on its
         start, and every other container's traffic is captured into it. */}}
  {{- include "c8s.meshEndpointContainer" . | nindent 2 }}
  {{- include "c8s.getCertContainers" (dict
    "root" .
    "attestationApiURL" (include "router.attestationApiURL" .)
    "extraArgs" (include "router.getCertArgs" . | fromJsonArray)
    "extraMounts" (include "router.getCertMounts" .)
    "renewInterval" "1h"
    "san" (include "router.san" .)
  ) | nindent 2 }}
containers:
  {{- include "c8s.routerContainers" (dict
    "root" .
    "allowlistProxyMounts" (include "router.inventoryMount" .)
    "attestationApiMounts" (include "c8s.attestationApiSocketMount" .)
    "attestationApiURL" (include "router.attestationApiURL" .)
    "cdsAttestArgs" (include "router.cdsAttestArgs" . | fromJsonArray)
    "cdsAttestMounts" (include "router.cdsAttestMounts" . | fromYamlArray)
    "config" (include "router.configDir" .)
    "ports" (include "router.publicPorts" . | fromJsonArray)
  ) | nindent 2 }}
volumes:
  - name: c8s-certs
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
  - name: measurements-config
    projected:
      sources:
        - configMap:
            name: {{ include "c8s.fullname" . }}-measurements
  {{- if .Values.cds.operatorKeys }}
  - name: operator-keys
    projected:
      sources:
        - configMap:
            name: {{ include "c8s.fullname" . }}-operator-keys
  {{- end }}
  - name: discovery
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
  - name: nginx-cache
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: nginx-tmp
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: nginx-tunnel-body
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi
  - name: nginx-config
    projected:
      sources:
        - configMap:
            name: {{ include "router.fullname" . }}-nginx
  # Read-only: get-cert and the allowlist proxy only connect.
  - name: workload-claims
    hostPath:
      path: {{ include "nri-image-policy.runtimeDir" . }}
      type: Directory
  {{- include "c8s.attestationApiSocketVolume" . | nindent 2 }}
securityContext:
  runAsNonRoot: true
  fsGroup: {{ include "c8s.certFsGroup" "" }}
  # workloadclaims.InventorySocketGID: the inventory and attest-proxy
  # chgrp their sockets to this group so the non-root get-cert sidecar
  # can connect.
  supplementalGroups: [65532]
  seccompProfile:
    type: RuntimeDefault
{{- end -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "router.fullname" . }}
  namespace: {{ include "c8s.routerMeshNamespace" . }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    {{- /* Two pods on a node would collide on the host port; on a single-node
    cluster a surge pod could never schedule, deadlocking the roll. */}}
    type: Recreate
  selector:
    matchLabels:
      {{- include "router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "router.selectorLabels" . | nindent 8 }}
      annotations:
        {{- /* A ConfigMap edit alone leaves the pod template unchanged. */}}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/router-configmap.yaml") . | sha256sum }}
        checksum/measurements-config: {{ .Values.cds.measurementsConfig | sha256sum }}
        {{- with .Values.cds.operatorKeys }}
        checksum/operator-keys: {{ . | sha256sum }}
        {{- end }}
    spec:
{{- include "router.podSpec" . | nindent 6 }}
