{{- define "c8s.volumedPodSpec" -}}
# Keeps the env names fixed for the allowlist's env match (c8s.componentEnv).
enableServiceLinks: false
# SO_PEERCRED reports a peer's PID in the reader's PID namespace, so a
# caller in another pod resolves to 0 without this.
hostPID: true
# It reaches no API server: everything it acts on is node-local.
automountServiceAccountToken: false
{{ include "c8s.volumedNodePlacement" . }}
containers:
  - name: volumed
    image: {{ include "volumed.image" . }}
    imagePullPolicy: IfNotPresent
    securityContext:
      privileged: true
      # The image is nonroot (USER 65532) and privileged grants no
      # effective caps to a non-root process; the daemon must be root.
      runAsUser: 0
      runAsGroup: 0
    command: {{ include "c8s.entrypoint" (dict "root" . "valuePath" "volumed.image") }}
    args:
      - --socket-dir
      - {{ include "nri-image-policy.runtimeDir" . | quote }}
      - --kubelet-root
      - "/var/lib/kubelet"
      - --cgroup-root
      - "/sys/fs/cgroup"
      - --reap-interval
      - "15s"
      # Each volume holds two device-mapper devices and a mount, and every
      # confidential pod on the node can reach the socket.
      - --max-mounts
      - "64"
    volumeMounts:
      # Bidirectional: the mount is made here and has to reach the
      # workload's pod directory on the node.
      - name: kubelet-root
        mountPath: /var/lib/kubelet
        mountPropagation: Bidirectional
      - name: dev
        mountPath: /dev
      # /sys whole, not /sys/block: the block entries are symlinks into
      # /sys/devices, and the serial is read through them.
      - name: sys
        mountPath: /sys
        readOnly: true
      - name: cgroup
        mountPath: /sys/fs/cgroup
        readOnly: true
      # The daemon's socket must live in the inventory's socket directory:
      # that is the one directory nri-image-policy NRI-mounts into cw-pod
      # sidecars.
      - name: inventory-socket-dir
        mountPath: {{ include "nri-image-policy.runtimeDir" . }}
    resources:
      {{- include "c8s.volumedResources" . | nindent 6 }}
volumes:
  - name: kubelet-root
    hostPath:
      path: /var/lib/kubelet
      type: Directory
  - name: dev
    hostPath:
      path: /dev
      type: Directory
  - name: sys
    hostPath:
      path: /sys
      type: Directory
  - name: cgroup
    hostPath:
      path: /sys/fs/cgroup
      type: Directory
  - name: inventory-socket-dir
    hostPath:
      path: {{ include "nri-image-policy.runtimeDir" . }}
      type: DirectoryOrCreate
{{- end -}}

{{/* The pod spec volumed and its teardown hook share beside their
     containers: the confidential nodes, whatever their taints. */}}
{{- define "c8s.volumedNodePlacement" -}}
priorityClassName: system-node-critical
{{- include "c8s.imagePullSecrets" . }}
nodeSelector:
  {{- include "c8s.confidentialNodeLabels" . | nindent 2 }}
tolerations:
  - operator: "Exists"
    effect: "NoExecute"
  - operator: "Exists"
    effect: "NoSchedule"
affinity:
  {{- include "c8s.hostDaemonAffinity" dict | nindent 2 }}
{{- end -}}

{{- define "c8s.volumedResources" -}}
requests:
  cpu: 10m
  memory: 32Mi
limits:
  cpu: 200m
  memory: 128Mi
{{- end -}}

{{- if .Values.volumed.enabled }}
{{- /*
  Node agent that opens encrypted volumes for the pods on it (docs/volumes.md).

  It lands in the release namespace, which is labelled pod-security=privileged;
  tenant namespaces are PSA restricted and cannot host it.

  THREAT MODEL: privileged, hostPID, and a writable bind of the kubelet
  directory. That is inherent to opening a device and mounting into another
  pod's directory. The agent runs inside the node CVM's trust boundary.
  Which pod a mount lands in comes from the caller's kernel peer
  credentials, never from the request.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "c8s.volumedName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: volumed
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: volumed
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: volumed
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
{{- include "c8s.volumedPodSpec" . | nindent 6 }}
{{- end }}
