{{- define "c8s.attestationApiPodSpec" -}}
# Keeps the env names fixed for the allowlist's env match (c8s.componentEnv).
enableServiceLinks: false
serviceAccountName: {{ include "c8s.attestationApiName" . }}
nodeSelector:
  {{- include "c8s.confidentialNodeLabels" . | nindent 2 }}
tolerations:
  - operator: Exists
affinity:
  {{- include "c8s.hostDaemonAffinity" dict | nindent 2 }}
containers:
  - name: attestation-api
    image: {{ include "c8s.attestationApiImage" . }}
    imagePullPolicy: IfNotPresent
    command: {{ include "c8s.entrypoint" (dict "root" . "valuePath" "attestationApi.image") }}
    args: [--config, /mnt/c8s-data/attestation-api/config.toml]
    securityContext:
      # A hostPath device mount adds no device-cgroup rule, so opening a TEE
      # device is EPERM from an unprivileged container.
      privileged: true
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
    # Kubelet cannot probe a Unix socket: these probes go through the probes
    # sidecar, which GETs /health over it. Both share one failure window:
    # liveness must cover startup (kubernetes/kubernetes#141155), and the
    # window outlasts the kubelet's 300s maximum restart backoff, so one
    # sidecar restart or a slow sidecar image pull does not restart the API; a
    # sidecar crash loop, or a socket that stays gone, still does, once per
    # window.
    {{- $probeWindowSeconds := 360 }}
    startupProbe:
      httpGet:
        path: /api/livez
        port: {{ include "c8s.attestationApiProbePort" . }}
      periodSeconds: 10
      # Above the handler's 3s budget.
      timeoutSeconds: 5
      failureThreshold: {{ div $probeWindowSeconds 10 }}
    livenessProbe:
      httpGet:
        path: /api/livez
        port: {{ include "c8s.attestationApiProbePort" . }}
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: {{ div $probeWindowSeconds 30 }}
    volumeMounts:
      - name: config
        mountPath: /mnt/c8s-data/attestation-api
        readOnly: true
      # Read-write: the API stages its socket in a private directory here
      # before moving it into place.
      - name: socket-dir
        mountPath: {{ include "nri-image-policy.runtimeDir" . }}
      {{- range .Values.attestationApi.devices }}
      - name: {{ base . | replace "_" "-" }}
        mountPath: {{ . }}
      {{- end }}
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # Serves the kubelet's probes for the API's socket; it never binds it.
  - name: probes
    image: {{ include "c8s.image" . }}
    imagePullPolicy: IfNotPresent
    command: {{ include "c8s.entrypoint" (dict "root" . "valuePath" "image") }}
    args:
      - attest-proxy
      - probes
      - --socket={{ include "c8s.attestationApiSocket" . }}
      - --addr=:{{ include "c8s.attestationApiProbePort" . }}
    ports:
      - name: health
        containerPort: {{ include "c8s.attestationApiProbePort" . }}
    # Connects as the socket's group; the read-only mount keeps it from
    # binding or replacing the socket.
    securityContext:
      runAsUser: 65532
      runAsGroup: {{ include "c8s.nodeSocketGID" . }}
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    # HTTP, not exec: a locked node image denies every runc exec it was not
    # granted, so an exec probe can never pass there (c8s
    # internal/cmds/c8srunc). Readiness is the /health round-trip with status
    # ok; liveness checks only that the probe server answers, so a hung API
    # never restarts the sidecar.
    readinessProbe:
      httpGet:
        path: /healthz
        port: health
      initialDelaySeconds: 2
      # Above the handler's 3s budget (kubelet default is 1s).
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /livez
        port: health
      periodSeconds: 30
      timeoutSeconds: 5
    volumeMounts:
      - name: socket-dir
        mountPath: {{ include "nri-image-policy.runtimeDir" . }}
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
volumes:
  - name: config
    projected:
      sources:
        - configMap:
            name: {{ include "c8s.attestationApiName" . }}
  # CharDevice fails the pod on a node that lacks the device, rather than
  # mounting an empty file the API would read bogus evidence from.
  {{- range .Values.attestationApi.devices }}
  - name: {{ base . | replace "_" "-" }}
    hostPath:
      path: {{ . }}
      type: CharDevice
  {{- end }}
  # Shared with the admission inventory — see c8s.attestationApiSocket.
  - name: socket-dir
    hostPath:
      path: {{ include "nri-image-policy.runtimeDir" . }}
      type: DirectoryOrCreate
{{- end -}}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "c8s.attestationApiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: attestation-api
{{ include "c8s.imagePullSecrets" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s.attestationApiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: attestation-api
data:
  config.toml: |
{{ include "c8s.attestationApiConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "c8s.attestationApiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: attestation-api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: attestation-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: attestation-api
      annotations:
        checksum/config: {{ include "c8s.attestationApiConfig" . | sha256sum }}
    spec:
{{- include "c8s.attestationApiPodSpec" . | nindent 6 }}
---
# The API binds only the node-local socket, so nothing on the pod network can
# reach it; this policy is the second line, keeping even an accidental TCP bind
# pod-unreachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "c8s.attestationApiName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: attestation-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: attestation-api
  policyTypes:
    - Ingress
