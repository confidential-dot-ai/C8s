## The NRI host paths are the ones c8s-fleet uses on Container-Optimized OS.
## GKE confidential VMs on AMD SEV-SNP: evidence is the native SNP report.
attestationApi:
  devices:
    - /dev/sev-guest
## GKE marks a Confidential GKE Node with the instance type it booted as.
confidentialNodeSelector:
  cloud.google.com/gke-confidential-nodes-instance-type: SEV_SNP
nriImagePolicy:
  hostPaths:
    ## Container-Optimized OS serves /etc from tmpfs: the config lives in the
    ## plugin directory, which the node keeps across a boot.
    configDir: /home/kubernetes/bin/nri/conf.d
    pluginDir: /home/kubernetes/bin/nri
  platform: snp
router:
  attest:
    platform: snp
    # GKE's SEV-SNP machine family (N2D) runs on AMD Milan.
    generation: milan
