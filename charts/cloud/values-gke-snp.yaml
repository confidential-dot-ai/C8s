## The NRI host paths are the ones c8s-fleet uses on Container-Optimized OS.
## GKE confidential VMs on AMD SEV-SNP: evidence is the native SNP report.
attestationApi:
  devices:
    - /dev/sev-guest
## GKE marks a Confidential GKE Node with the instance type it booted as.
confidentialNodeSelector:
  cloud.google.com/gke-confidential-nodes-instance-type: SEV_SNP
nriImagePolicy:
  hostPaths:
    ## Container-Optimized OS serves /etc from tmpfs: the config lives in the
    ## plugin directory, which the node keeps across a boot.
    configDir: /home/kubernetes/bin/nri/conf.d
    pluginDir: /home/kubernetes/bin/nri
  platform: snp
  policy:
    ## GKE owns kube-system, gmp-system (its managed Prometheus) and
    ## gke-managed-cim (its managed kube-state-metrics); their images are not on
    ## the C8s allowlist, and come from the regional release mirror. An add-on
    ## outside these repositories is denied; `c8s install` names it.
    exemptNamespaces:
      - kube-system
      - gmp-system
      - gke-managed-cim
    exemptRepositories:
      kube-system: &releaseMirror
        - "*-artifactregistry.gcr.io/gke-release/gke-release/"
      gmp-system: *releaseMirror
      gke-managed-cim: *releaseMirror
router:
  attest:
    platform: snp
    # GKE's SEV-SNP machine family (N2D) runs on AMD Milan.
    generation: milan
