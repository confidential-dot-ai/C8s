## The admission webhooks that inject and check the pods of confidential
## workloads.
webhook:
  ## Set false when the parent chart renders the webhook definitions.
  render: true
  ## Annotations on both webhook configurations.
  annotations: {}
  ## Namespaces the webhooks leave alone besides the release's, the router's
  ## and the Kubernetes system namespaces.
  extraExcluded: []
  ## url: https://<host>:<port> of an operator the API server reaches
  ## off-cluster, as a cluster of workers does. Without it both webhooks go to
  ## the operator's Service in the release namespace.
