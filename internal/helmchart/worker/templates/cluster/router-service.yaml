apiVersion: v1
kind: Service
metadata:
  name: {{ include "router.fullname" . }}
  namespace: {{ include "c8s.routerMeshNamespace" . }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    {{- range include "router.publicPorts" . | fromJsonArray }}
    - port: {{ .publicPort }}
      targetPort: {{ .name }}
      protocol: TCP
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "router.selectorLabels" . | nindent 4 }}
