apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "c8s.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
{{ include "c8s.serviceAccountImagePullSecrets" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c8s.operatorName" . }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c8s.operatorName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s.operatorName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.operator.podCVMProvider.enabled }}
---
{{ include "c8s.podCVMProviderGrants" (dict "root" . "subject" (dict "kind" "ServiceAccount" "name" (include "c8s.operatorName" .) "namespace" .Release.Namespace)) }}
{{- end }}
