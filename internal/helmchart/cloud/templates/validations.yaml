{{- if and .Values.node.baked (or (ne .Values.attestationApi.cvmMode "bare-metal") .Values.attestationApi.enabled .Values.nriImagePolicy.enabled .Values.volumed.enabled) -}}
{{- fail "node.baked requires cvmMode=bare-metal and attestationApi, nriImagePolicy and volumed disabled: these services are owned by the measured image" -}}
{{- end -}}
{{- if not (has .Values.attestationApi.cvmMode (list "bare-metal" "gke" "aks")) -}}
{{- fail (printf "attestationApi.cvmMode must be one of bare-metal, gke, aks (got %q)" .Values.attestationApi.cvmMode) -}}
{{- end -}}
{{- /*
  Hardware-TEE mutual exclusion. A single cluster picks one CPU TEE at install
  time (--hardware-platform sev-snp or tdx). teeDevices.sevGuest and
  teeDevices.tdxGuest select what the attestation-api DaemonSet mounts:
  /dev/sev-guest, or ConfigFS TSM at /sys/kernel/config for TDX.
  Install CLI's --hardware-platform flag makes them mutually exclusive by
  construction; this guard catches raw -f overrides that bypass the CLI.
  aks (tpm) is orthogonal: it's the vTPM path and does not interact with these
  two flags.
*/ -}}
{{- if and .Values.attestationApi.teeDevices.sevGuest .Values.attestationApi.teeDevices.tdxGuest -}}
{{- fail "VALIDATION_ERROR kind=tee_mutually_exclusive: attestationApi.teeDevices.sevGuest=true and .tdxGuest=true both set. A cluster picks one CPU TEE at install time (--hardware-platform sev-snp OR tdx). Use `c8s install --hardware-platform=<sev-snp|tdx>` or set exactly one of the two flags via -f." -}}
{{- end -}}

{{- /*
  Where no measured image carries the plugin, host nri-image-policy is the ONLY
  image-admission enforcement — the attested allowlist gate. Disabling it there
  runs confidential workloads with no image admission at all, a silent security
  downgrade. A cvmMode=bare-metal node runs the fail-closed plugin its measured
  image carries, so host nri is mandatory in exactly the remaining shapes.
*/ -}}
{{- if and (not .Values.nriImagePolicy.enabled) (ne .Values.attestationApi.cvmMode "bare-metal") -}}
{{- fail "VALIDATION_ERROR kind=require_host_image_policy: nriImagePolicy.enabled=false requires attestationApi.cvmMode=bare-metal. On a non-bare-metal cluster host nri-image-policy is the only image-admission enforcement; disabling it leaves confidential workloads with no attested allowlist gate. Under cvmMode=bare-metal the measured worker image carries the plugin, its containerd registration and its config, which the installer would write over (`c8s install --cvm-mode=bare-metal` sets nriImagePolicy.enabled=false)." -}}
{{- end -}}

{{- /*
  The mirror of require_host_image_policy for evidence: off bare-metal mode,
  the host attestation-api DaemonSet is the only evidence source for
  get-cert and the mesh endpoint. Disabling it there renders a cluster whose
  attestation consumers all point at a socket nothing serves.
*/ -}}
{{- if and (not .Values.attestationApi.enabled) (ne .Values.attestationApi.cvmMode "bare-metal") -}}
{{- fail "VALIDATION_ERROR kind=require_attestation_api: attestationApi.enabled=false requires attestationApi.cvmMode=bare-metal. On a non-bare-metal cluster the host attestation-api DaemonSet is the only evidence source for get-cert/armtls-mesh (`c8s install --cvm-mode=bare-metal` sets attestationApi.enabled=false for you)." -}}
{{- end -}}
{{- /*
  Rate budget for the built-in /allowlist route: each per-client bound must
  fit inside the nginx aggregate. router.allowlistLimits parses and bounds
  each value, so this template and the zone rendering fail alike.
*/ -}}
{{- $allowlist := include "router.allowlistLimits" . | fromJson -}}
{{- if gt $allowlist.writeRate $allowlist.writeTotalRate -}}
{{- fail (printf "VALIDATION_ERROR kind=router_allowlist_rate_budget: router.allowlist.rateLimit.requestsPerSecond must not exceed rateLimit.totalRequestsPerSecond (%d), got: %d" (int $allowlist.writeTotalRate) (int $allowlist.writeRate)) -}}
{{- end -}}
{{- if gt $allowlist.writeBurst $allowlist.writeTotalBurst -}}
{{- fail (printf "VALIDATION_ERROR kind=router_allowlist_rate_budget: router.allowlist.rateLimit.burst must not exceed rateLimit.totalBurst (%d), got: %d" (int $allowlist.writeTotalBurst) (int $allowlist.writeBurst)) -}}
{{- end -}}
{{- /* A baked node takes both from its measured launch file, which the chart
       cannot see. */ -}}
{{- if include "c8s.cdsFromValues" . -}}
{{- $_ := include "c8s.cdsPinDocument" . -}}
{{- end -}}
{{- if include "c8s.installerCopiesCDSAddress" . -}}
{{- include "c8s.checkCDSAddress" .Values.cds.address -}}
{{- end -}}
{{- /* The operator keys the router holds the route manifest to, which it reads
       from its own namespace (templates/cds-operator-keys.yaml). */ -}}
{{- if and (include "c8s.cdsFromValues" .) .Values.cds.operatorKeys (not (contains "BEGIN PUBLIC KEY" .Values.cds.operatorKeys)) -}}
{{- fail "VALIDATION_ERROR kind=cds_operator_keys_content: cds.operatorKeys must be the PEM content of the operator public-key bundle, not a file path — use `c8s install --operator-keys <file>`, `c8s render-values --operator-keys <file>`, or helm --set-file cds.operatorKeys=<file>" -}}
{{- end -}}
{{- /*
  A component expands $(HOST_IP) from its HOST_IP variable, which the
  allowlist leaves open, so a pod could point it at an attestation verifier of
  its choosing. Under a fail-closed policy (c8s.imagePolicyFailClosed, which
  counts the node image's baked plugin) the chart writes $(NODE_IP), read
  from the pinned node-ip file, instead. The operator is exempt: it hands its
  URL to the sidecars it injects, whose args are the pod's anyway.
*/ -}}
{{- if include "c8s.imagePolicyFailClosed" . -}}
{{- range $pod := (include "c8s.componentPods" . | fromJsonArray) -}}
{{- if ne (get $pod "name") "operator" -}}
{{- range $c := concat (default list $pod.spec.initContainers) (default list $pod.spec.containers) -}}
{{- range $token := concat (default list $c.command) (default list $c.args) -}}
{{- /* An unescaped reference fails in c8s.kubeletExpand. */ -}}
{{- if contains "$$(HOST_IP)" (toString $token) -}}
{{- fail (printf "VALIDATION_ERROR kind=host_ip_argv: %s container %s names $(HOST_IP) in %q under a fail-closed image policy. The binary would read the node address from the HOST_IP variable, which the allowlist does not pin, so the pod would choose its attestation verifier. Write the node address as $$(NODE_IP): the binary reads it from the node-ip file the image policy plugin writes." (get $pod "name") $c.name (toString $token)) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /*
  On a baked node the mesh's exempt namespaces come from the measured floor,
  not from chart values: kube-system and c8s-system host no member pods. The webhooks' scope is this release's namespaceSelector, so a
  release namespace the measured set does not name, or an extra exclusion it
  does not know, would inject pods the node refuses to protect — or leave a
  namespace uninjected that the node would have.
*/ -}}
{{- if .Values.node.baked -}}
{{- if ne .Release.Namespace "c8s-system" -}}
{{- fail (printf "VALIDATION_ERROR kind=baked_release_namespace: node.baked=true requires the release namespace c8s-system (got %q). The node image measures that name into the mesh policy's exempt set, so another namespace would put this release's own components inside the mesh." .Release.Namespace) -}}
{{- end -}}
{{- if .Values.webhook.extraExcluded -}}
{{- fail (printf "VALIDATION_ERROR kind=baked_webhook_exclusions: node.baked=true leaves webhook.extraExcluded empty (got %v). The measured mesh policy names the namespaces that host no member pods; an exclusion only the webhooks know would leave a pod uninjected in a namespace the node protects." .Values.webhook.extraExcluded) -}}
{{- end -}}
{{- end -}}
