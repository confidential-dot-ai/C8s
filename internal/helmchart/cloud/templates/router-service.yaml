apiVersion: v1
kind: Service
metadata:
  name: {{ include "router.fullname" . }}
  namespace: {{ include "c8s.routerMeshNamespace" . }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
    {{- if eq (include "router.acmeSidecar" .) "true" }}
    {{- /* HTTP-01 validators dial :80. */}}
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
  selector:
    {{- include "router.selectorLabels" . | nindent 4 }}
