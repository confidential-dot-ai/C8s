{{- if and .Values.node.baked .Values.cds.ha.enabled }}
{{/* HA CDS: one replica per cds-role node. The baked image carries both this
     DaemonSet and the singleton Deployment; the signed launch document decides which
     one runs (cds-role nodes exist only when it declares cdsHA, and the
     singleton yields when it does). */}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "c8s.cdsName" . }}-ha
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  # One replica per cds-role node: replicas come and go with the nodes. A
  # replica is Ready only once it holds the mesh CA key, so a rolling update
  # (one node at a time) never removes a key holder before the others serve.
  minReadySeconds: 5
  updateStrategy:
    rollingUpdate: {maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cds
      c8s.confidential.ai/cds-ha: "true"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cds
        c8s.confidential.ai/cds-ha: "true"
      annotations:
        confidential.ai/trust-root-mode: "inMemory"
    spec:
{{- include "c8s.cdsPodSpec" (merge (dict "ha" true) .) | nindent 6 }}
---
# The CDS ingress policy admits only the API port. Replicas also need the
# peer port, from each other only: no other pod or host reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "c8s.cdsName" . }}-ha-peers
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cds
      c8s.confidential.ai/cds-ha: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cds
              c8s.confidential.ai/cds-ha: "true"
      ports:
        - port: {{ .Values.cds.ha.peerPort }}
          protocol: TCP
---
# Peer discovery (L2): every replica, Ready or not.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s.cdsName" . }}-peers
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cds
    c8s.confidential.ai/cds-ha: "true"
  ports:
    - name: peer
      port: {{ .Values.cds.ha.peerPort }}
---
# The Lease and the CDSEpoch ConfigMap (untrusted hints) live in the CDS
# namespace, written by the CDS ServiceAccount only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "c8s.cdsName" . }}-ha
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "c8s.cdsName" . }}-ha
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "c8s.cdsName" . }}-ha
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s.cdsName" . }}
    namespace: {{ .Release.Namespace }}
---
# Decrees: operators write them here (the baked operator credential may
# write any non-privileged namespace); CDS reads them and records status.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.cds.ha.decreeNamespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "c8s.cdsName" . }}-decrees
  namespace: {{ .Values.cds.ha.decreeNamespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "c8s.cdsName" . }}-decrees
  namespace: {{ .Values.cds.ha.decreeNamespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "c8s.cdsName" . }}-decrees
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s.cdsName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
