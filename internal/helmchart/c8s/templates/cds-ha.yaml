{{- if and .Values.node.baked .Values.cds.ha.enabled }}
{{/* HA CDS: one replica per cds-role node. The baked image carries both this
     DaemonSet and the singleton Deployment; the signed launch document decides which
     one runs (cds-role nodes exist only when it declares cdsHA, and the
     singleton yields when it does). */}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "c8s.cdsName" . }}-ha
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  # One replica per cds-role node: replicas come and go with the nodes.
  # OnDelete: a changed template restarts no replica. A rolling update would
  # replace every replica that is not Ready at once, and replicas that are
  # stuck, fenced or without a leader are not Ready while they may hold the
  # only copy of the in-memory log. A replica restarts only when its node is
  # replaced, one at a time behind the readiness gate (runbook 3).
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cds
      c8s.confidential.ai/cds-ha: "true"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cds
        c8s.confidential.ai/cds-ha: "true"
      annotations:
        confidential.ai/trust-root-mode: "inMemory"
    spec:
{{- include "c8s.cdsPodSpec" (merge (dict "ha" true) .) | nindent 6 }}
---
# The CDS ingress policy admits only the API port. Replicas also need the
# peer port, from each other only: no other pod or host reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "c8s.cdsName" . }}-ha-peers
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cds
      c8s.confidential.ai/cds-ha: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cds
              c8s.confidential.ai/cds-ha: "true"
      ports:
        - port: {{ .Values.cds.ha.peerPort }}
          protocol: TCP
---
# Peer discovery: every replica, Ready or not.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s.cdsName" . }}-peers
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cds
    c8s.confidential.ai/cds-ha: "true"
  ports:
    - name: peer
      port: {{ .Values.cds.ha.peerPort }}
---
# The operator's way to one node's replica, Ready or not: a replica that has
# not joined (a fresh one awaiting a Restore) or does not serve (a Recover
# survivor) is never Ready, so the c8s-cds Service, which carries only
# serving replicas, does not reach it. Local: https://<node>:<replicaNodePort>
# answers from that node's replica only. Same port and armTLS as c8s-cds.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s.cdsName" . }}-replicas
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  type: NodePort
  externalTrafficPolicy: Local
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cds
    c8s.confidential.ai/cds-ha: "true"
  ports:
    - name: https
      port: {{ .Values.cds.port }}
      targetPort: https
      nodePort: {{ .Values.cds.ha.replicaNodePort }}
---
# Decrees: operators write them here (the baked operator credential may
# write any non-privileged namespace); CDS reads them and records status, and
# the leader stores sealed backups here for `c8s cds ha recover`.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.cds.ha.decreeNamespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "c8s.cdsName" . }}-decrees
  namespace: {{ .Values.cds.ha.decreeNamespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
rules:
  # Decrees (read, status update) and the sealed state backups, which only
  # the operator's offline recovery key opens. delete: each backup is written
  # under new part names, then the parts of the one it replaced are removed.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "c8s.cdsName" . }}-decrees
  namespace: {{ .Values.cds.ha.decreeNamespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "c8s.cdsName" . }}-decrees
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s.cdsName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
