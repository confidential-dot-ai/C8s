{{- if and (include "c8s.cdsInCluster" .) (empty .Values.cds.sandboxInventoryCIDRs) }}
# CDS derives the sandbox-digests dial bound from the live node list unless
# cds.sandboxInventoryCIDRs pins it statically — only the derived mode needs
# the node read.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c8s.cdsName" . }}-node-reader
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c8s.cdsName" . }}-node-reader
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c8s.cdsName" . }}-node-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s.cdsName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
