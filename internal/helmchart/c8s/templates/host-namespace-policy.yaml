kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "c8s.fullname" . }}-deny-host-namespaces-ephemeral
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: host-namespace-policy
spec:
  policyName: {{ include "c8s.fullname" . }}-deny-host-namespaces-ephemeral
  validationActions:
    - Deny
{{- end }}
