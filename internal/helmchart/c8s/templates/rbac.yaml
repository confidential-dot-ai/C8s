apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "c8s.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
{{ include "c8s.serviceAccountImagePullSecrets" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "c8s.operatorName" . }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
rules:
  - apiGroups: [confidential.ai]
    resources: [confidentialworkloads]
    verbs: [get, list, watch]
  - apiGroups: [confidential.ai]
    resources: [confidentialworkloads/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods]
    # delete: the startup reinject sweep deletes un-injected cw pods so their
    # controllers recreate them through the webhook.
    verbs: [get, list, watch, delete{{ if .Values.operator.podCVMProvider.enabled }}, update, patch{{ end }}]
  {{- if .Values.operator.podCVMProvider.enabled }}
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [nodes, nodes/status]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    # Each pod CVM's Service points at its Cloud endpoints through one
    # EndpointSlice the provider owns. Read uncached, so no list or watch.
    verbs: [get, create, update, delete]
  {{- end }}

  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    # The workload-service reconciler watches these for the confidential.ai/cw
    # pod-template annotation.
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    # The operator provisions one headless Service per annotated workload in
    # the workload's namespace.
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    # The controller-runtime manager's event recorders (leader election,
    # reconcile events, Pod CVM status transitions) create and
    # patch-aggregate events across the namespaces they watch, through both
    # the core and the events.k8s.io APIs; without this they log "events is
    # forbidden".
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "c8s.operatorName" . }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "c8s.operatorName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s.operatorName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.operator.podCVMProvider.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "c8s.operatorName" . }}-pod-cvm
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "c8s.operatorName" . }}-pod-cvm
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "c8s.operatorName" . }}-pod-cvm
subjects:
  - kind: ServiceAccount
    name: {{ include "c8s.operatorName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
