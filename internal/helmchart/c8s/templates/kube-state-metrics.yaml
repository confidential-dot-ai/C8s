{{- /* kube-state-metrics: a platform add-on of the measured node image. It
       runs in kube-system, which the measured mesh policy exempts, so it reads
       the API like any other system component, and every member pod reaches
       its Service through the one exit that policy names (mesh.exits in
       node-guest-image/c8s/image-policy.yaml.in). The seed pins its argv,
       mounts and env (c8s.imageAllowlist). */ -}}
{{- define "kube-state-metrics.podSpec" -}}
# Keeps the env names fixed for the allowlist's env match (c8s.componentEnv).
enableServiceLinks: false
serviceAccountName: kube-state-metrics
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
containers:
  - name: kube-state-metrics
    image: {{ include "c8s-common.image" .Values.kubeStateMetrics.image }}
    imagePullPolicy: {{ .Values.kubeStateMetrics.image.pullPolicy }}
    command: {{ .Values.kubeStateMetrics.entrypoint | toJson }}
    args:
      - --port={{ .Values.kubeStateMetrics.port }}
      - --telemetry-port=8081
      {{- /* The objects its RBAC lists. Labels and annotations stay off, as
             by default: only names, ownership, status and resource figures
             are exported. */}}
      - --resources={{ include "kube-state-metrics.resources" . | fromJsonArray | join "," }}
    ports:
      - name: http-metrics
        containerPort: {{ .Values.kubeStateMetrics.port }}
      - name: telemetry
        containerPort: 8081
    livenessProbe:
      httpGet:
        path: /livez
        port: http-metrics
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /readyz
        port: telemetry
      timeoutSeconds: 5
    resources:
      {{- toYaml .Values.kubeStateMetrics.resources | nindent 6 }}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
{{- end -}}

{{- /* The resources kube-state-metrics exports, as their plural names. No
       Secrets and no ConfigMaps. */ -}}
{{- define "kube-state-metrics.resources" -}}
{{- list "cronjobs" "daemonsets" "deployments" "jobs" "namespaces" "nodes" "persistentvolumeclaims" "persistentvolumes" "poddisruptionbudgets" "pods" "replicasets" "services" "statefulsets" | toJson -}}
{{- end -}}

{{- if .Values.kubeStateMetrics.enabled }}
{{- if not .Values.node.baked }}
{{- fail "VALIDATION_ERROR kind=kube_state_metrics_unbaked: kubeStateMetrics.enabled requires node.baked: member pods reach it through an exit the measured node image's mesh policy names" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: c8s-node-image
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c8s-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: c8s-node-image
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "persistentvolumeclaims", "persistentvolumes", "pods", "services"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: c8s-node-image
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c8s-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: c8s-node-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      {{- include "kube-state-metrics.podSpec" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: c8s-node-image
spec:
  type: ClusterIP
  clusterIP: {{ .Values.kubeStateMetrics.clusterIP }}
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: {{ .Values.kubeStateMetrics.port }}
      targetPort: http-metrics
      protocol: TCP
---
# RKE2's kube-system/default-network-policy admits ingress from kube-system
# alone, so the member pods' exit needs this allowance: the metrics port,
# from every namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: c8s-node-image
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: http-metrics
{{- end }}
