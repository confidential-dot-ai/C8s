{{- /*
The measurements config: the VM images this cluster runs, each pinned as a
whole image. Shared by every component that verifies one — cds and the
router's allowlist-proxy — so it lives in its own ConfigMap rather than beside
a single component's own material.

Public policy, not secret: these are the digests a verifier compares evidence
against.
*/ -}}
{{- $cds := .Values.cds.measurementsConfig | default "" }}
{{- if $cds }}
{{- if not (hasPrefix "{" (trim $cds)) }}
{{- fail "cds.measurementsConfig must be the JSON content of the measurements config, not a file path — use `c8s install --image-policy-file <file>`, `c8s render-values --image-policy-file <file>`, or helm --set-file cds.measurementsConfig=<file>" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s.fullname" . }}-measurements
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
data:
  cds.json: {{ $cds | quote }}
---
{{- end }}
