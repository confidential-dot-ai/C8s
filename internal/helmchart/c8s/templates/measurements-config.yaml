{{- /*
The measurements config: the VM images this cluster runs, each pinned as a
whole image. Shared by every component that verifies one — cds, armtls-mesh,
router's allowlist-proxy and the operator — so it lives in its own ConfigMap
rather than beside a single component's own material.

Public policy, not secret: these are the digests a verifier compares evidence
against.
*/ -}}
{{- $cds := .Values.cds.measurementsConfig | default "" }}
{{- $mesh := .Values.armtlsMesh.measurementsConfig | default "" }}
{{- if or $cds $mesh }}
{{- range $name, $doc := dict "cds.measurementsConfig" $cds "armtlsMesh.measurementsConfig" $mesh }}
{{- if $doc }}
{{- if not (hasPrefix "{" (trim $doc)) }}
{{- fail (printf "%s must be the JSON content of the measurements config, not a file path — use `c8s install --image-policy-file <file>`, `c8s render-values --image-policy-file <file>`, or helm --set-file %s=<file>" $name $name) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s.fullname" . }}-measurements
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
data:
  {{- if $cds }}
  cds.json: {{ $cds | quote }}
  {{- end }}
  {{- if $mesh }}
  armtls-mesh.json: {{ $mesh | quote }}
  {{- end }}
---
{{- end }}
