{{- if .Values.router.enabled }}
{{- if not (kindIs "bool" .Values.router.hostPort.enabled) -}}
{{- /* A string "false" is truthy and would both bind the node port and force
Recreate, silently defeating the operator's opt-out. */ -}}
{{- fail (printf "router.hostPort.enabled must be a boolean; do not set it via --set-string, got: %v" .Values.router.hostPort.enabled) -}}
{{- end -}}

{{- if .Values.router.attest.expectedWorkload -}}
{{- if not .Values.router.attest.enabled -}}
{{- /* The gate *is* the cds-attest sidecar's /readyz. Without the sidecar
nothing renders it, yet the claims wiring it pulls in (the inventory hostPath,
the mount, the supplemental group) still would — cost and hostPath surface for
a gate that does not exist. */ -}}
{{- fail "router.attest.expectedWorkload gates the cds-attest sidecar's /readyz endpoint: set router.attest.enabled=true or clear expectedWorkload" -}}
{{- end -}}
{{- if .Values.router.hostPort.enabled -}}
{{- /* Readiness only withdraws Service endpoints. The hostPort is published by
the CNI portmap plugin, wired at sandbox creation and independent of pod
readiness, so an unnamed front door would keep serving external traffic on the
node port while the operator watched a NotReady pod and believed traffic was
withheld. */ -}}
{{- fail "router.attest.expectedWorkload cannot gate ingress while router.hostPort.enabled=true: the node port is published by CNI portmap regardless of pod readiness. Set router.hostPort.enabled=false and route through the Service, or clear expectedWorkload" -}}
{{- end -}}
{{- end -}}
{{- $publicTLSMode := include "router.publicTLSMode" . -}}
{{- $attestUsesHTTPSUpstream := and .Values.router.attest.enabled (eq .Values.router.upstream.protocol "https") -}}
{{- $upstreamAddress := .Values.router.upstream.address -}}
{{- $attestUpstreamServerName := default (include "router.serverNameFromAddress" $upstreamAddress) .Values.router.upstream.serverName -}}
{{- $renderAllowlistProxy := eq (include "router.renderAllowlistRoute" .) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "router.fullname" . }}
  namespace: {{ include "c8s.routerMeshNamespace" . }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary 1 .Values.router.nginx.replicas .Values.node.baked }}
  strategy:
    {{- if .Values.node.baked }}
    type: Recreate
    {{- else if .Values.router.strategy }}
    {{- toYaml .Values.router.strategy | nindent 4 }}
    {{- else if .Values.router.hostPort.enabled }}
    {{- /* Two pods on a node would collide on the host port; on a single-node
    cluster a surge pod could never schedule, deadlocking the roll. */}}
    type: Recreate
    {{- else }}
    {{- /* Surge so the new (cert-holding) pod is Ready before the old one is
    retired: the front door keeps serving across a roll. */}}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "router.selectorLabels" . | nindent 8 }}
    spec:
      {{- /* Same control-plane pin as CDS: a baked image boots one server,
             and only servers carry this RKE2 role label. */}}
      {{- if .Values.node.baked }}
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      {{- end }}

      {{- include "c8s.imagePullSecrets" (dict "root" $ "local" .Values.router.imagePullSecrets) | nindent 6 }}
      {{- /* Every container of this pod holds a platform role the measured
             base grants it, and runs as that role's reserved identity:
             c8s.meshUID for the endpoint, c8s.credentialsUID for get-cert,
             the probe-file gate and the allowlist proxy, c8s.routerUID for
             nginx and cds-attest, c8s.acmeUID for acme — the one identity of
             this pod the node lets out of the cluster in the clear. The
             volume group (c8s.certFsGroup) is what lets a role read what
             another role wrote. */}}
      initContainers:
        {{- /* The endpoint leads: the enforcer gates the rest of the pod on
               its start, and every other container's traffic is captured
               into it. */}}
        {{- include "c8s.meshEndpointContainer" . | nindent 8 }}
        {{- include "router.getCertContainers" . | nindent 8 }}
        {{- if eq $publicTLSMode "acme" }}
        # Native sidecar (restartPolicy: Always): issues one multi-SAN ACME
        # leaf for the sanList domains, answers HTTP-01 on loopback behind the
        # :80 server and renews at 2/3 lifetime. The front door's own
        # entrypoint reloads nginx on the install. Its challenge and :80 ports
        # are the sidecar's defaults, which are the front door image's
        # constants.
        - name: acme
          image: {{ include "c8s.image" . }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          restartPolicy: Always
          args:
            - acme
            - --domains={{ include "router.sanList" . | fromJsonArray | join "," }}
            {{- with .Values.router.acme.email }}
            - --acme-email={{ . }}
            {{- end }}
            {{- with .Values.router.acme.directoryURL }}
            - --acme-directory-url={{ . }}
            {{- end }}
            - --cert-dir={{ include "router.acmeCertDir" . }}
            - --key-dir={{ include "router.acmeKeyDir" . }}
            - --ready-port={{ include "router.acmeReadyPort" . }}
          # nginx's config names the acme cert files, so nginx must not start
          # before the bootstrap placeholder exists; regular containers wait
          # for a native sidecar's startup probe. HTTP, not exec: a locked
          # node image denies every runc exec, so an exec probe can never pass
          # there (internal/cmds/c8srunc). /readyz reports exactly what the
          # probe-file exec reported — both files present and non-empty.
          startupProbe:
            httpGet:
              path: /readyz
              port: acme-ready
            periodSeconds: 1
            failureThreshold: 60
          ports:
            - name: acme-ready
              containerPort: {{ include "router.acmeReadyPort" . | int }}
          volumeMounts:
            - name: acme-tls
              mountPath: {{ include "router.acmeCertDir" . }}
            - name: acme-key
              mountPath: {{ include "router.acmeKeyDir" . }}
          securityContext:
            {{- include "c8s.getCertSecurityContext" (dict
              "runAsUser" (include "c8s.acmeUID" .)
              "runAsGroup" (include "c8s.acmeUID" .)
            ) | nindent 12 }}
        {{- end }}
      containers:
        - name: nginx
          image: {{ include "c8s-common.image" .Values.router.nginx.image }}
          imagePullPolicy: {{ .Values.router.nginx.image.pullPolicy }}
          # The image's entrypoint renders the nginx configuration from these
          # arguments, runs nginx as its child and reloads it when the
          # certificates change (internal/cmds/router).
          command: ["/c8s", "router"]
          args:
            {{- include "router.nginxArgs" . | nindent 12 }}
          ports:
            - name: https
              containerPort: {{ include "router.httpsPort" . }}
              {{- if .Values.router.hostPort.enabled }}
              hostPort: {{ .Values.router.hostPort.https | default 443 }}
              {{- end }}
              protocol: TCP
            {{- if eq $publicTLSMode "acme" }}
            {{- /* HTTP-01 arrives on public :80; hostPort follows the same
            gating as :443. */}}
            - name: http
              containerPort: {{ include "router.httpPort" . }}
              {{- if .Values.router.hostPort.enabled }}
              hostPort: 80
              {{- end }}
              protocol: TCP
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ include "c8s.routerUID" . }}
            runAsGroup: {{ include "c8s.routerUID" . }}
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 30

          volumeMounts:
            - name: c8s-certs
              mountPath: {{ include "c8s.certDir" . }}
              readOnly: true
            {{- if eq $publicTLSMode "webpki" }}
            - name: public-tls
              mountPath: {{ include "router.publicTLSDir" . }}
              readOnly: true
            {{- end }}
            {{- if eq $publicTLSMode "acme" }}
            - name: acme-tls
              mountPath: {{ include "router.acmeCertDir" . }}
              readOnly: true
            {{- /* The front door is the only reader of the serving key. */}}
            - name: acme-key
              mountPath: {{ include "router.acmeKeyDir" . }}
              readOnly: true
            {{- end }}
            {{- /* Mounted whichever way router.discovery.enabled is set, so
            one measured mount set covers both; the flag is what publishes the
            discovery locations. */}}
            - name: discovery
              mountPath: {{ include "router.discoveryDir" . }}
              readOnly: true
            {{- /* Mounted on both lanes, so one measured mount set covers
            them; --routes-file is what makes the front door read it. */}}
            - name: router-routes
              mountPath: {{ include "router.routesDir" . }}
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            {{- /* The entrypoint renders the configuration here, and nginx
            keeps its pid and temporary files beside it. */}}
            - name: nginx-tmp
              mountPath: /tmp
          {{- with .Values.router.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.router.attest.enabled }}
        - name: cds-attest
          image: {{ include "c8s.image" . }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          args:
            - cds-attest
            {{- /* Loopback only: every endpoint this sidecar registers
            (/healthz, /readyz, both attest routes, /tunnel) sits on
            one listener, so binding the pod IP would publish the whole surface
            with no NetworkPolicy in front of it. The readiness probe reaches
            /readyz through nginx instead (location = /readyz). */}}
            - --host=127.0.0.1
            - --port={{ .Values.router.attest.port }}
            - --platform={{ .Values.router.attest.platform }}
            - --generation={{ .Values.router.attest.generation }}
            - --attestation-api-url={{ default (include "c8s.attestationApiURL" .) .Values.router.attest.attestationApiURL }}
            # attest-lb needs a TEE-held serving key (cds, acme); webpki's
            # host-visible Secret key stays attest-pq-only.
            - --front-door-mode={{ $publicTLSMode }}
            # Bind the *exact* leaf nginx presents on the wire (ssl_certificate =
            # publicCertPath), so the attest-lb binding (GET
            # /.well-known/c8s/attest-lb) commits report_data to the leaf DER a
            # direct-TLS client actually sees: the mesh leaf (cds), the Secret
            # cert (webpki), or the ACME leaf (acme). Re-read per request, so
            # renewals are picked up.
            - --serving-cert-file={{ include "router.publicCertPath" . }}
            {{- if .Values.router.attest.expectedWorkload }}
            - --expected-workload={{ .Values.router.attest.expectedWorkload }}
            {{- end }}
            # The identity-bound PQ flow must use the TEE-held mesh
            # credential, never the optional publicTLS Secret: report_data
            # commits the X-Wing key exchange to this leaf and the sidecar
            # proves possession with its matching private key.
            - --mesh-identity-cert-file={{ include "c8s.certFile" . }}
            - --mesh-identity-key-file={{ include "c8s.keyFile" . }}
            - --mesh-identity-ca-file={{ include "c8s.caFile" . }}
            # Terminate over-encryption here and forward to the same workload
            # backend nginx proxies to. An http upstream is plaintext at the
            # app layer; pointed at a headless Service (an adopted workload),
            # the node mesh wraps the pod-IP hop in attested mTLS. An https
            # upstream terminates TLS itself and gets the mTLS args below.
            # No adopted workload (empty upstream address) -> omit --upstream
            # entirely; the sidecar then serves attestation with its echo
            # backend instead of crashing on a scheme-only URL.
            {{- if $upstreamAddress }}
            - --upstream={{ .Values.router.upstream.protocol }}://{{ $upstreamAddress }}
            {{- if $attestUsesHTTPSUpstream }}
            - --upstream-ca={{ include "c8s.caFile" . }}
            - --upstream-cert={{ include "c8s.certFile" . }}
            - --upstream-key={{ include "c8s.keyFile" . }}
            - --upstream-server-name={{ $attestUpstreamServerName }}
            {{- end }}
            {{- end }}
          {{- with (include "c8s.attestationApiHostIPEnv" .) }}
          # cvmMode=bare-metal: expands $(HOST_IP) in --attestation-api-url to the node
          # IP so this pod-netns pod reaches the node-baked host attestation-api.
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if .Values.router.attest.expectedWorkload }}
          # Workload-verified ingress gate (docs/getcert-workload-binding.md):
          # ready only while the installed mesh identity leaf is a usable
          # credential carrying a matched-workload stamp naming
          # expectedWorkload, so ingress withholds traffic while the committed
          # identity is unnamed (initial deploy, or after a foreign admission
          # unnames the next renewal).
          #
          # Probed through nginx (location = /readyz), not the sidecar's own
          # port: the sidecar listens on loopback. Scheme
          # HTTPS on the nginx port works — nginx sets no
          # ssl_verify_client and kubelet skips certificate verification on
          # HTTPS probes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: c8s-certs
              mountPath: {{ include "c8s.certDir" . }}
              readOnly: true
            {{- include "c8s.attestationApiSocketMount" . | nindent 12 }}
            {{- if eq $publicTLSMode "webpki" }}
            # cds-attest reads the same public leaf nginx serves
            # (--serving-cert-file).
            - name: public-tls
              mountPath: {{ include "router.publicTLSDir" . }}
              readOnly: true
            {{- end }}
            {{- if eq $publicTLSMode "acme" }}
            - name: acme-tls
              mountPath: {{ include "router.acmeCertDir" . }}
              readOnly: true
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ include "c8s.routerUID" . }}
            runAsGroup: {{ include "c8s.routerUID" . }}
            capabilities:
              drop:
                - ALL
          {{- with .Values.router.attest.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if $renderAllowlistProxy }}
        # nginx terminates the public, router-attested connection and forwards
        # /allowlist over pod loopback. This sidecar establishes the second
        # trust hop: it verifies CDS's armTLS evidence before proxying.
        - name: allowlist-proxy
          image: {{ include "c8s.image" . }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          {{- /* It holds the credentials role, so the node hands it the CDS
                 endpoint and the pins, and refuses an argument naming either
                 (cmdsutil.ResolveCDSEndpoint, cmdsutil.ResolveCDSPins). */}}
          args:
            - allowlist-proxy
            - --host=127.0.0.1
            - --port={{ include "c8s.int" .Values.router.allowlist.proxyPort }}
            - --attestation-api-url={{ include "router.credentialsVerifierURL" . }}
          {{- with (include "c8s.attestationApiHostIPEnv" .) }}
          # cvmMode=bare-metal: the proxy verifies CDS through the node-baked
          # attestation-api, reached from this pod via its node IP.
          env:
            {{- . | nindent 12 }}
          {{- end }}
          {{- if or (eq (include "router.mountInventorySocket" .) "true") (include "c8s.attestationApiSocketPresent" .) }}
          volumeMounts:
            {{- if eq (include "router.mountInventorySocket" .) "true" }}
            # The inventory socket directory at the compiled path get-cert
            # mounts it on, so this sidecar names the node's own verifier.
            - name: workload-claims
              mountPath: /run/c8s/workload-claims
              readOnly: true
            {{- else }}
            {{- include "c8s.attestationApiSocketMount" . | nindent 12 }}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            {{- /* It dials CDS, so it holds the credentials role. */}}
            runAsUser: {{ include "c8s.credentialsUID" . }}
            runAsGroup: {{ include "c8s.credentialsUID" . }}
            capabilities:
              drop:
                - ALL
          {{- with .Values.router.allowlist.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        {{- include "c8s.nodeConfigVolume" . | nindent 8 }}
        - name: c8s-certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if eq $publicTLSMode "webpki" }}
        - name: public-tls
          secret:
            secretName: {{ .Values.router.publicTLS.secretName }}
            items:
              - key: {{ .Values.router.publicTLS.certKey }}
                path: {{ .Values.router.publicTLS.certKey }}
              - key: {{ .Values.router.publicTLS.keyKey }}
                path: {{ .Values.router.publicTLS.keyKey }}
        {{- end }}
        {{- if eq $publicTLSMode "acme" }}
        # The issued chain, and separately the serving key with the ACME
        # account state. Memory-medium: TEE-protected and lost on pod
        # recreation, so the sidecar re-issues (LE duplicate-cert limits
        # apply; use the staging directoryURL for tests).
        - name: acme-tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: acme-key
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
        - name: discovery
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- /* Projected, so the kubelet stages it on tmpfs: the memory-backed
        storage the measured base requires of a data mount. */}}
        - name: router-routes
          projected:
            sources:
              - configMap:
                  name: {{ include "router.fullname" . }}-routes
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- if eq (include "router.mountInventorySocket" .) "true" }}
        # The readiness gate needs a stamped mesh leaf, so get-cert redeems a
        # sandbox token over the node inventory's Unix socket (see
        # router.getCertContainers). Read-only: the sidecar only connects.
        - name: workload-claims
          hostPath:
            path: {{ .Values.nriImagePolicy.hostPaths.runtimeDir }}
            type: Directory
        {{- end }}
        {{- /* Shares the admission inventory's socket directory — see c8s.attestationApiSocket. */}}
        {{- include "c8s.attestationApiSocketVolume" . | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        fsGroup: {{ include "c8s.certFsGroup" . }}
        {{- if or (eq (include "router.mountInventorySocket" .) "true") (include "c8s.attestationApiSocketPresent" .) }}
        # workloadclaims.InventorySocketGID: the inventory and attest-proxy
        # chgrp their sockets to this group so the non-root get-cert sidecar
        # can connect.
        supplementalGroups: [65532]
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
{{- end }}
