{{- define "router.podSpec" -}}
{{- $publicTLSMode := include "router.publicTLSMode" . -}}
{{- $launchDriven := eq (include "router.launchDriven" .) "true" -}}
{{- $acmeSidecar := eq (include "router.acmeSidecar" .) "true" -}}
{{- $expectedWorkload := include "router.expectedWorkload" . -}}
{{- $renderAllowlistProxy := eq (include "router.renderAllowlistRoute" .) "true" -}}
{{- /* Same control-plane pin as CDS: a baked image boots one server,
       and only servers carry this RKE2 role label. */}}
{{- if .Values.node.baked }}
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
{{- end }}

{{- include "c8s.imagePullSecrets" (dict "root" $ "local" .Values.router.imagePullSecrets) | nindent 0 }}
shareProcessNamespace: true
initContainers:
  {{- include "router.getCertContainers" . | nindent 2 }}
  {{- if $acmeSidecar }}
  # Native sidecar (restartPolicy: Always): issues one multi-SAN ACME
  # leaf for the sanList domains, answers HTTP-01 on loopback behind the
  # :80 server, renews at 2/3 lifetime, and SIGHUPs nginx on install —
  # which needs the shared PID namespace and the nginx uid, same as
  # c8s-cert.
  - name: acme
    image: {{ include "c8s.image" . }}
    imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
    restartPolicy: Always
    command: {{ include "c8s.entrypoint" (dict "root" . "valuePath" "image") }}
    args:
      {{- include "router.acmeArgs" . | fromJsonArray | toYaml | nindent 6 }}
    # nginx's config names the acme cert files, so nginx must not start
    # before the bootstrap placeholder exists; regular containers wait
    # for a native sidecar's startup probe. HTTP, not exec: a locked
    # node image denies every runc exec, so an exec probe can never pass
    # there (internal/cmds/c8srunc). /readyz reports exactly what the
    # probe-file exec reported — both files present and non-empty.
    startupProbe:
      httpGet:
        path: /readyz
        port: acme-ready
      periodSeconds: 1
      failureThreshold: 60
    ports:
      - name: acme-ready
        containerPort: {{ include "router.acmeReadyPort" . | int }}
    volumeMounts:
      - name: acme-tls
        mountPath: {{ include "router.acmeCertDir" . }}
      {{- if $launchDriven }}
      - name: tls-certs
        mountPath: {{ .Values.router.tlsMountPath }}
        readOnly: true
      {{- include "c8s.nodeConfigMount" . | trim | nindent 6 }}
      {{- end }}
    securityContext:
      {{- include "c8s.getCertSecurityContext" (dict
        "runAsUser" .Values.router.nginx.runAsUser
        "runAsGroup" .Values.router.nginx.runAsGroup
        "runAsNonRoot" .Values.router.nginx.runAsNonRoot
      ) | nindent 6 }}
  {{- end }}
containers:
  - name: nginx
    image: {{ include "c8s-common.image" .Values.router.nginx.image }}
    imagePullPolicy: {{ .Values.router.nginx.image.pullPolicy }}
    {{- /* The image's entrypoint and CMD spelled out, with the config file
           named: the allowlist pins this argv exactly, so nothing a pod adds
           (-g load_module, another -c) runs under the nginx entry. */}}
    command: [{{ first .Values.router.nginx.entrypoint | quote }}]
    args:
      {{- range rest .Values.router.nginx.entrypoint }}
      - {{ . | quote }}
      {{- end }}
      - -c
      - {{ include "router.configDir" . }}/nginx.conf
      - -g
      - daemon off;
    ports:
      - name: https
        containerPort: {{ .Values.router.nginx.httpsPort }}
        {{- if .Values.router.hostPort.enabled }}
        hostPort: {{ .Values.router.hostPort.https | default 443 }}
        {{- end }}
        protocol: TCP
      {{- if $acmeSidecar }}
      {{- /* HTTP-01 arrives on public :80; hostPort follows the same
      gating as :443. */}}
      - name: http
        containerPort: {{ include "router.acmeHTTPPort" . }}
        {{- if .Values.router.hostPort.enabled }}
        hostPort: 80
        {{- end }}
        protocol: TCP
      {{- end }}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: {{ .Values.router.nginx.runAsNonRoot }}
      runAsUser: {{ include "c8s.int" .Values.router.nginx.runAsUser }}
      runAsGroup: {{ include "c8s.int" .Values.router.nginx.runAsGroup }}
      capabilities:
        drop:
          - ALL

    readinessProbe:
      httpGet:
        path: /healthz
        port: https
        scheme: HTTPS
      initialDelaySeconds: 5
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /healthz
        port: https
        scheme: HTTPS
      initialDelaySeconds: 10
      periodSeconds: 30

    volumeMounts:
      - name: tls-certs
        mountPath: {{ .Values.router.tlsMountPath }}
        readOnly: true
      {{- if eq $publicTLSMode "webpki" }}
      - name: public-tls
        mountPath: {{ .Values.router.publicTLS.mountPath }}
        readOnly: true
      {{- end }}
      {{- if $acmeSidecar }}
      - name: acme-tls
        mountPath: {{ include "router.acmeCertDir" . }}
        readOnly: true
      {{- end }}
      {{- if .Values.router.discovery.enabled }}
      - name: discovery
        mountPath: {{ .Values.router.discovery.mountPath }}
        readOnly: true
      {{- end }}
      {{- /* The whole ConfigMap, beside the operator data rather than over
             /etc/nginx: a component's ConfigMap mounts sit under
             /mnt/c8s-data, and the args name the file. A baked node mounts
             the image's copy instead; the launch file's tls.conf includes a
             snippet from it. */}}
      - name: nginx-config
        mountPath: {{ include "router.configDir" . }}
        readOnly: true
      {{- if $launchDriven }}
      {{- /* nginx.conf includes router/upstream.conf and router/tls.conf
             from here. */}}
      {{- include "c8s.nodeConfigMount" . | trim | nindent 6 }}
      {{- end }}
      - name: nginx-cache
        mountPath: /var/cache/nginx
      - name: nginx-tmp
        mountPath: /tmp
    {{- with .Values.router.nginx.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if .Values.router.attest.enabled }}
  - name: cds-attest
    image: {{ include "c8s.image" . }}
    imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
    command: {{ include "c8s.entrypoint" (dict "root" . "valuePath" "image") }}
    # Argv and its rationale: router.cdsAttestArgs.
    args:
      {{- include "router.cdsAttestArgs" (dict "root" . "expectedWorkload" $expectedWorkload) | fromJsonArray | toYaml | nindent 6 }}
    {{- with (include "c8s.attestationApiHostIPEnv" .) }}
    # cvmMode=bare-metal: expands $(HOST_IP) in --attestation-api-url to the node
    # IP so this pod-netns pod reaches the node-baked host attestation-api.
    env:
      {{- . | nindent 6 }}
    {{- end }}
    {{- if $expectedWorkload }}
    # Workload-verified ingress gate (docs/getcert-workload-binding.md):
    # ready only while the installed mesh identity leaf is a usable
    # credential carrying a matched-workload stamp naming
    # expectedWorkload, so ingress withholds traffic while the committed
    # identity is unnamed (initial deploy, or after a foreign admission
    # unnames the next renewal).
    #
    # Probed through nginx (location = /readyz), not the sidecar's own
    # port: the sidecar listens on loopback. Scheme
    # HTTPS on the nginx port works — nginx sets no
    # ssl_verify_client and kubelet skips certificate verification on
    # HTTPS probes.
    readinessProbe:
      httpGet:
        path: /readyz
        port: https
        scheme: HTTPS
      initialDelaySeconds: 5
      periodSeconds: 10
    {{- end }}
    volumeMounts:
      - name: tls-certs
        mountPath: {{ .Values.router.tlsMountPath }}
        readOnly: true
      {{- include "c8s.attestationApiSocketMount" . | nindent 6 }}
      {{- if eq $publicTLSMode "webpki" }}
      # cds-attest reads the same public leaf nginx serves
      # (--serving-cert-file).
      - name: public-tls
        mountPath: {{ .Values.router.publicTLS.mountPath }}
        readOnly: true
      {{- end }}
      {{- if $acmeSidecar }}
      - name: acme-tls
        mountPath: {{ include "router.acmeCertDir" . }}
        readOnly: true
      {{- end }}
      {{- if $launchDriven }}
      {{- include "c8s.nodeConfigMount" . | trim | nindent 6 }}
      {{- end }}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    {{- with .Values.router.attest.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- if $renderAllowlistProxy }}
  # nginx terminates the public, router-attested connection and forwards
  # /allowlist over pod loopback. This sidecar establishes the second
  # trust hop: it verifies CDS's armTLS evidence before proxying.
  - name: allowlist-proxy
    image: {{ include "c8s.image" . }}
    imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
    command: {{ include "c8s.entrypoint" (dict "root" . "valuePath" "image") }}
    args:
      {{- include "router.allowlistProxyArgs" . | fromJsonArray | toYaml | nindent 6 }}
    {{- with (include "c8s.attestationApiHostIPEnv" .) }}
    # cvmMode=bare-metal: the proxy verifies CDS through the node-baked
    # attestation-api, reached from this pod via its node IP.
    env:
      {{- . | nindent 6 }}
    {{- end }}
    {{- if or (include "c8s.attestationApiSocketPresent" .) (include "c8s.attestationApiNodeIPFile" .) .Values.cds.measurementsConfig }}
    volumeMounts:
      {{- include "c8s.attestationApiSocketMount" . | nindent 6 }}
      {{- include "c8s.nodeConfigMount" . | nindent 6 }}
      {{- if .Values.cds.measurementsConfig }}
      - name: measurements-config
        mountPath: /mnt/c8s-data/measurements
        readOnly: true
      {{- end }}
    {{- end }}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    {{- with .Values.router.allowlist.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
volumes:
  {{- include "c8s.nodeConfigVolume" . | nindent 2 }}
  - name: tls-certs
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
  {{- if .Values.cds.measurementsConfig }}
  - name: measurements-config
    projected:
      sources:
        - configMap:
            name: {{ include "c8s.fullname" . }}-measurements
  {{- end }}
  {{- if eq $publicTLSMode "webpki" }}
  - name: public-tls
    secret:
      secretName: {{ .Values.router.publicTLS.secretName }}
      items:
        - key: {{ .Values.router.publicTLS.certKey }}
          path: {{ .Values.router.publicTLS.certKey }}
        - key: {{ .Values.router.publicTLS.keyKey }}
          path: {{ .Values.router.publicTLS.keyKey }}
  {{- end }}
  {{- if $acmeSidecar }}
  # ACME key, cert, and account state. Memory-medium: TEE-protected and
  # lost on pod recreation, so the sidecar re-issues (LE duplicate-cert
  # limits apply; use the staging directoryURL for tests).
  - name: acme-tls
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
  {{- end }}
  {{- if .Values.router.discovery.enabled }}
  - name: discovery
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi
  {{- end }}
  - name: nginx-cache
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: nginx-tmp
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: nginx-config
    {{- if .Values.node.baked }}
    hostPath:
      path: {{ include "router.bakedNginxDir" . }}
      type: Directory
    {{- else }}
    projected:
      sources:
        - configMap:
            name: {{ include "router.fullname" . }}-nginx
    {{- end }}
  {{- if eq (include "router.mountInventorySocket" .) "true" }}
  # The baked router and the readiness gate need a stamped mesh leaf.
  # get-cert redeems a
  # sandbox token over the node inventory's Unix socket (see
  # router.getCertContainers). Read-only: the sidecar only connects.
  - name: workload-claims
    hostPath:
      path: {{ .Values.nriImagePolicy.hostPaths.runtimeDir }}
      type: Directory
  {{- end }}
  {{- /* Shares the admission inventory's socket directory — see c8s.attestationApiSocket. */}}
  {{- include "c8s.attestationApiSocketVolume" . | nindent 2 }}
securityContext:
  runAsNonRoot: {{ .Values.router.nginx.runAsNonRoot }}
  fsGroup: {{ include "c8s.int" .Values.router.nginx.runAsGroup }}
  {{- if or (eq (include "router.mountInventorySocket" .) "true") (include "c8s.attestationApiSocketPresent" .) }}
  # workloadclaims.InventorySocketGID: the inventory and attest-proxy
  # chgrp their sockets to this group so the non-root get-cert sidecar
  # (on the nginx uid) can connect. get-cert must stay on the nginx uid —
  # it SIGHUPs nginx on renewal, and a different uid gets "operation not
  # permitted", after which nginx serves a stale leaf that every
  # exact-DER client correctly refuses.
  supplementalGroups: [65532]
  {{- end }}
  seccompProfile:
    type: RuntimeDefault
{{- end -}}

{{- if .Values.router.enabled }}
{{- if not (kindIs "bool" .Values.router.hostPort.enabled) -}}
{{- /* A string "false" is truthy and would both bind the node port and force
Recreate, silently defeating the operator's opt-out. */ -}}
{{- fail (printf "router.hostPort.enabled must be a boolean; do not set it via --set-string, got: %v" .Values.router.hostPort.enabled) -}}
{{- end -}}

{{- $expectedWorkload := include "router.expectedWorkload" . -}}
{{- if $expectedWorkload -}}
{{- if not .Values.router.attest.enabled -}}
{{- /* The gate *is* the cds-attest sidecar's /readyz. Without the sidecar
nothing renders it, yet the claims wiring it pulls in (get-cert's
--workload-claims, the inventory hostPath, the supplemental group) still would
— cost and hostPath surface for a gate that does not exist. */ -}}
{{- fail "router.attest.expectedWorkload gates the cds-attest sidecar's /readyz endpoint: set router.attest.enabled=true or clear expectedWorkload" -}}
{{- end -}}
{{- if .Values.router.hostPort.enabled -}}
{{- /* Readiness only withdraws Service endpoints. The hostPort is published by
the CNI portmap plugin, wired at sandbox creation and independent of pod
readiness, so an unnamed front door would keep serving external traffic on the
node port while the operator watched a NotReady pod and believed traffic was
withheld. */ -}}
{{- fail "router.attest.expectedWorkload cannot gate ingress while router.hostPort.enabled=true: the node port is published by CNI portmap regardless of pod readiness. Set router.hostPort.enabled=false and route through the Service, or clear expectedWorkload" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "router.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
spec:
  replicas: {{ ternary 1 .Values.router.nginx.replicas .Values.node.baked }}
  strategy:
    {{- if .Values.node.baked }}
    type: Recreate
    {{- else if .Values.router.strategy }}
    {{- toYaml .Values.router.strategy | nindent 4 }}
    {{- else if .Values.router.hostPort.enabled }}
    {{- /* Two pods on a node would collide on the host port; on a single-node
    cluster a surge pod could never schedule, deadlocking the roll. */}}
    type: Recreate
    {{- else }}
    {{- /* Surge so the new (cert-holding) pod is Ready before the old one is
    retired: the front door keeps serving across a roll. */}}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "router.selectorLabels" . | nindent 8 }}
      annotations:
        {{- /* On a baked node this tracks the image's copy of the config. */}}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/router-configmap.yaml") . | sha256sum }}
        {{- if .Values.cds.measurementsConfig }}
        # A ConfigMap edit alone does not change the pod template, so without
        # this a tightened pin would not roll the router.
        checksum/measurements-config: {{ .Values.cds.measurementsConfig | sha256sum }}
        {{- end }}
    spec:
{{- include "router.podSpec" . | nindent 6 }}
{{- end }}
