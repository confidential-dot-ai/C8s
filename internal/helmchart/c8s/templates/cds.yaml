apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "c8s.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
{{ include "c8s.serviceAccountImagePullSecrets" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s.cdsName" . }}-allowlist-seed
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
data:
  allowlist-seed.json: {{ include "c8s.allowlistSeedJSON" . | trim | quote }}
---
{{- if .Values.cds.operatorKeys }}
{{- if not (contains "BEGIN PUBLIC KEY" .Values.cds.operatorKeys) }}
{{- fail "cds.operatorKeys must be the PEM content of the operator public-key bundle, not a file path — use `c8s install --operator-keys <file>`, `c8s render-values --operator-keys <file>`, or helm --set-file cds.operatorKeys=<file>" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s.cdsName" . }}-operator-keys
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
data:
  # PEM bundle of operator EC public keys that authorize allowlist writes.
  # Public key material — not a secret.
  keys.pem: {{ .Values.cds.operatorKeys | quote }}
---
{{- end }}
{{- if .Values.cds.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "c8s.cdsName" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.cds.persistence.size }}
  {{- if .Values.cds.persistence.storageClassName }}
  storageClassName: {{ .Values.cds.persistence.storageClassName | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c8s.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
  annotations:
    confidential.ai/trust-root-mode: "inMemory"
spec:
  {{/* Fixed at 1: mesh CA keys are per pod, so a second Ready endpoint
       would issue leaves from a different trust root. */}}
  replicas: 1
  # Recreate: two pods would mint divergent roots and can't co-mount the RWO
  # data PVC. Dependents ride out the gap via get-cert retry.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: cds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: cds
      annotations:
        confidential.ai/trust-root-mode: "inMemory"
        {{- if .Values.cds.measurementsConfig }}
        # Pins live in a ConfigMap, which no longer changes the pod template on
        # its own: without this a tightened pin would not roll the pod.
        checksum/measurements-config: {{ .Values.cds.measurementsConfig | sha256sum }}
        {{- end }}
    spec:

      serviceAccountName: {{ include "c8s.cdsName" . }}
      # The live node-list bound needs the API token; static CIDRs do not.
      automountServiceAccountToken: {{ empty .Values.cds.sandboxInventoryCIDRs }}
      {{- /* CDS is a singleton trust root reached over a node-local NodePort
             and (with persistence) an RWO volume, so pin it to a known node.
             The CDS digest is always in the NRI floor (c8s.imageAllowlist),
             so image policy admits CDS on whichever node it lands. */}}
      {{- /* Baked nodes render this chart at build time, before any node
             exists, so there is no per-cluster selector to set. RKE2 gives
             node-role.kubernetes.io/control-plane to servers only, never to
             agents, so this pins CDS to the server. It assumes the single
             server a baked image boots; promoting a second one would let
             the singleton move between them. */}}
      {{- if .Values.node.baked }}
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      {{- else }}
      {{- with .Values.cds.node.selector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.cds.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:

{{ toYaml .Values.podSecurityContext | indent 8 }}

      containers:
        - name: cds
          image: {{ include "c8s.cdsImage" . }}
          imagePullPolicy: {{ .Values.cds.image.pullPolicy }}
          args:
            - --port={{ .Values.cds.port }}
            - --log-level={{ .Values.cds.logLevel }}
            # Per-mode resolution: see c8s.attestationApiURL.
            - --attestation-api-url={{ include "c8s.attestationApiURL" . }}
            - --allowlist-db={{ .Values.cds.allowlistDB }}
            - --allowlist-persistent={{ .Values.cds.persistence.enabled }}
            - --allowlist-activation-lease={{ .Values.cds.allowlistActivationLease }}
            {{- if .Values.node.baked }}
            - --allowlist-seed=/run/c8s-node/allowlist-seed.json
            - --operator-keys=/run/c8s-node/operator-pubkey
            - --dns-san-file=/run/c8s-node/tls-san
            {{- else }}
            - --allowlist-seed=/etc/cds/allowlist-seed.json
            {{- end }}
            - --jwt-clock-skew={{ .Values.cds.jwtClockSkew }}
            - --ca-common-name={{ .Values.cds.ca.commonName }}
            - --ca-cert-validity={{ .Values.cds.ca.certValidity }}
            - --min-ca-validity={{ .Values.cds.ca.minValidity }}
            - --cert-ttl={{ .Values.cds.certTTL }}
            - --named-cert-ttl={{ .Values.cds.namedCertTTL }}
            - --challenge-ttl={{ .Values.cds.challengeTTL }}
            - --request-timeout={{ .Values.cds.requestTimeout }}
            - --max-request-size={{ .Values.cds.maxRequestSize }}
            - --secrets-max-paths={{ include "c8s.positiveInt" (dict "value" .Values.cds.secretsMaxPaths "label" "cds.secretsMaxPaths") }}
            - --secrets-max-paths-per-workload={{ include "c8s.positiveInt" (dict "value" .Values.cds.secretsMaxPathsPerWorkload "label" "cds.secretsMaxPathsPerWorkload") }}
            - --readiness-interval={{ .Values.cds.readinessInterval }}
            - --san-validation={{ .Values.cds.sanValidation }}
            {{- /* Always allow in-cluster Service SANs so the mesh's own
                   get-cert/ratls-mesh CSRs validate; operators append public
                   hostnames via cds.dnsSanPatterns without restating this. */}}
            - --dns-san-pattern={{ include "c8s.cdsDnsSanPattern" . }}
            {{- range .Values.cds.dnsSanPatterns }}
            - --dns-san-pattern={{ . }}
            {{- end }}
            {{- if .Values.cds.cnPattern }}
            - --allowed-cn-pattern={{ .Values.cds.cnPattern }}
            {{- end }}
            {{- if .Values.node.baked }}
            - --image-policy-file=/run/c8s-node/peers.json
            {{- else if .Values.cds.measurementsConfig }}
            - --image-policy-file=/etc/c8s-measurements/cds.json
            {{- else }}
            {{- with .Values.cds.measurements }}
            - --measurements={{ join "," . }}
            {{- end }}
            {{- with .Values.cds.rtmrs }}
            - --rtmrs={{ join "," . }}
            {{- end }}
            {{- end }}
            {{- with .Values.cds.sandboxInventoryCIDRs }}
            - --sandbox-inventory-cidr={{ join "," . }}
            {{- end }}
            {{- if and (not .Values.node.baked) .Values.cds.operatorKeys }}
            - --operator-keys=/etc/cds-operator-keys/keys.pem
            {{- end }}
            - --rate-limit={{ .Values.cds.rateLimit }}
            - --rate-burst={{ .Values.cds.rateBurst }}
            - --rate-limiter-max-entries={{ .Values.cds.rateLimiterMaxEntries }}
            - --rate-limiter-evict-interval={{ .Values.cds.rateLimiterEvictInterval }}
            - --rate-limiter-idle-timeout={{ .Values.cds.rateLimiterIdleTimeout }}
            - --ratls-platform={{ .Values.cds.ratlsPlatform }}
            - --ratls-cert-ttl={{ .Values.cds.ratlsCertTTL }}
          {{- with (include "c8s.attestationApiHostIPEnv" .) }}
          # cvmMode=bare-metal: expands $(HOST_IP) in --attestation-api-url to the node
          # IP so this pod-netns pod reaches the node-baked host attestation-api.
          env:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.cds.port }}

          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 30

          resources:
{{ toYaml .Values.cds.resources | indent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- include "c8s.attestationApiSocketMount" . | nindent 12 }}
            {{- include "c8s.nodeConfigMount" . | nindent 12 }}
            {{- if not .Values.node.baked }}
            - name: allowlist-seed
              mountPath: /etc/cds
              readOnly: true
            {{- if .Values.cds.operatorKeys }}
            - name: operator-keys
              mountPath: /etc/cds-operator-keys
              readOnly: true
            {{- end }}
            {{- if .Values.cds.measurementsConfig }}
            - name: measurements-config
              mountPath: /etc/c8s-measurements
              readOnly: true
            {{- end }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            runAsNonRoot: true
            runAsUser: 65532

            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          {{- if .Values.cds.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "c8s.cdsName" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "c8s.attestationApiSocketVolume" . | nindent 8 }}
        {{- include "c8s.nodeConfigVolume" . | nindent 8 }}
        {{- if not .Values.node.baked }}
        - name: allowlist-seed
          configMap:
            name: {{ include "c8s.cdsName" . }}-allowlist-seed
        {{- if .Values.cds.operatorKeys }}
        - name: operator-keys
          configMap:
            name: {{ include "c8s.cdsName" . }}-operator-keys
        {{- end }}
        {{- if .Values.cds.measurementsConfig }}
        - name: measurements-config
          configMap:
            name: {{ include "c8s.fullname" . }}-measurements
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s.cdsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
spec:

  type: {{ .Values.cds.service.type }}

  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: cds
  ports:
    - name: http
      port: {{ .Values.cds.port }}
      targetPort: https
      {{- if and (eq .Values.cds.service.type "NodePort") .Values.cds.service.nodePort }}
      nodePort: {{ .Values.cds.service.nodePort }}
      {{- end }}
