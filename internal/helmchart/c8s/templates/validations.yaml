{{- if and .Values.node.baked (or (ne .Values.attestationApi.cvmMode "bare-metal") .Values.attestationApi.enabled .Values.nriImagePolicy.enabled .Values.volumed.enabled) -}}
{{- fail "node.baked requires cvmMode=bare-metal and attestationApi, nriImagePolicy and volumed disabled: these services are owned by the measured image" -}}
{{- end -}}
{{- if not (has .Values.attestationApi.cvmMode (list "bare-metal" "gke" "aks")) -}}
{{- fail (printf "attestationApi.cvmMode must be one of bare-metal, gke, aks (got %q)" .Values.attestationApi.cvmMode) -}}
{{- end -}}
{{- $router := .Values.router -}}
{{- $nri := .Values.nriImagePolicy -}}
{{- $nriCDSURL := tpl (include "c8s.nriCDSURL" .) . -}}
{{- /*
  Helm silently ignores values keys the chart no longer reads, so a values
  file carried over from a release that still had tee-proxy would drop its
  settings (hostPort opt-out, upstream) without a trace. Fail loud instead.
*/ -}}
{{- if hasKey .Values "teeProxy" -}}
{{- fail "VALIDATION_ERROR kind=removed_component: teeProxy.* values are set, but the tee-proxy component was removed; router dials the workload directly. Migrate teeProxy.hostPort to router.hostPort and write teeProxy.upstream as a route manifest with `c8s routes add`, then drop the teeProxy block." -}}
{{- end -}}
{{- /*
  The same for the router's own backend configuration: the operator-signed
  route manifest replaced it, and a carried-over value would otherwise leave
  the front door answering 503 with no hint why.
*/ -}}
{{- $removedRouterKeys := list -}}
{{- range $key := list "upstream" "routes" -}}
{{- if hasKey $router $key -}}{{- $removedRouterKeys = append $removedRouterKeys (printf "router.%s" $key) -}}{{- end -}}
{{- end -}}
{{- if hasKey (default dict $router.nginx) "resolver" -}}{{- $removedRouterKeys = append $removedRouterKeys "router.nginx.resolver" -}}{{- end -}}
{{- if $removedRouterKeys -}}
{{- fail (printf "VALIDATION_ERROR kind=removed_router_routes: the router no longer reads backends from Helm values (%s): it routes only by the operator-signed route manifest on CDS. Write the routes with `c8s routes add --host <host> --path / --address <host:port> --workload <allowlist name>` (or `c8s routes put <file>`), move router.upstream.readTimeout to router.routing.readTimeout, and drop these keys. Backends must serve TLS; see docs/operator.md, \"Route manifest\"." (join ", " $removedRouterKeys)) -}}
{{- end -}}
{{- if and $router.enabled (dig "routePublication" "enabled" false $router) (not $router.attest.enabled) -}}
{{- fail "VALIDATION_ERROR kind=router_route_publication: router.routePublication.enabled requires router.attest.enabled: cds-attest serves the route publication beside the attestation endpoints whose evidence binds its route digest. Set router.attest.enabled: true, or set router.routePublication.enabled: false." -}}
{{- end -}}

{{- /*
  Hardware-TEE mutual exclusion. A single cluster picks one CPU TEE at install
  time (--hardware-platform sev-snp or tdx). teeDevices.sevGuest and
  teeDevices.tdxGuest select which /dev/{sev,tdx}-guest node is mounted on the
  attestation-api DaemonSet.
  Install CLI's --hardware-platform flag makes them mutually exclusive by
  construction; this guard catches raw -f overrides that bypass the CLI.
  aks (tpm) is orthogonal: it's the vTPM path and does not interact with these
  two flags.
*/ -}}
{{- if and .Values.attestationApi.teeDevices.sevGuest .Values.attestationApi.teeDevices.tdxGuest -}}
{{- fail "VALIDATION_ERROR kind=tee_mutually_exclusive: attestationApi.teeDevices.sevGuest=true and .tdxGuest=true both set. A cluster picks one CPU TEE at install time (--hardware-platform sev-snp OR tdx). Use `c8s install --hardware-platform=<sev-snp|tdx>` or set exactly one of the two flags via -f." -}}
{{- end -}}

{{- /*
  Where the node-baked plugin does not run, host nri-image-policy is the ONLY
  image-admission enforcement — the attested allowlist gate. Disabling it there
  runs confidential workloads with no image admission at all, a silent security
  downgrade. cvmMode=bare-metal carries its own fail-closed nri-image-policy, so host
  nri is mandatory in exactly the remaining shapes.
*/ -}}
{{- if and (not .Values.nriImagePolicy.enabled) (ne .Values.attestationApi.cvmMode "bare-metal") -}}
{{- fail "VALIDATION_ERROR kind=require_host_image_policy: nriImagePolicy.enabled=false requires attestationApi.cvmMode=bare-metal. On a non-bare-metal cluster host nri-image-policy is the only image-admission enforcement; disabling it leaves confidential workloads with no attested allowlist gate. Under cvmMode=bare-metal the node image bakes the plugin — but leaving the installer off there also leaves the baked plugin without this release's CDS pins, so prefer nriImagePolicy.enabled=true with nriImagePolicy.baked=true (`c8s install --cvm-mode=bare-metal` sets both)." -}}
{{- end -}}
{{- /*
  nriImagePolicy.baked says the plugin, its containerd registration and its boot
  config come from the node image. Only a node-as-CVM ships those, so anywhere
  else it would skip the install and leave the node with no plugin at all.
*/ -}}
{{- if and .Values.nriImagePolicy.baked (ne .Values.attestationApi.cvmMode "bare-metal") -}}
{{- fail (printf "VALIDATION_ERROR kind=nri_baked_requires_node: nriImagePolicy.baked=true requires attestationApi.cvmMode=bare-metal (got %q). Only the node-as-CVM image bakes the plugin and its containerd registration; anywhere else the installer must install them, so baked would leave the node with no image admission at all." .Values.attestationApi.cvmMode) -}}
{{- end -}}

{{- if and .Values.nriImagePolicy.enabled (not .Values.cds.image.digest) -}}
{{- /* Structured marker (kind=...) lets tests discriminate this fail without substring-matching the prose. */ -}}
{{- fail "VALIDATION_ERROR kind=cds_image_digest: nriImagePolicy.enabled requires cds.image.digest to be set. The CDS digest is pinned in every plugin's base allowlist so image policy admits CDS on its own node. A floating tag cannot be admitted by digest. Pass --resolve-digests to c8s install, or set cds.image.digest via -f." -}}
{{- end -}}
{{- /*
  In fail-closed mode with deriveComponents off, every enabled C8s component
  that is digest-pinned must be admitted with open args, env and mounts — under
  any command, or pinned to its entrypoint — by a bootstrapAllowlist.workloads
  entry (c8s.openArgsEntries), the shapes that reach the base; otherwise the
  NRI plugin would deny that component's pod on its own node. cds.image is exempt: it is always in
  the base via the seed self-entry, independent of derivation. argvPinned
  components are exempt too: the chart seeds them argv-pinned
  (c8s.argvPinnedEntries). This guard only applies in fail-closed mode (the
  default); audit mode creates every container, but with workloadClaims on a
  would-be denial still reaches /digests and costs its sandbox a certificate.
*/ -}}
{{- if and .Values.nriImagePolicy.enabled (eq .Values.nriImagePolicy.policy.mode "fail-closed") (not .Values.nriImagePolicy.bootstrapAllowlist.deriveComponents) -}}
{{- $covered := include "c8s.openArgsEntries" . | fromJson -}}
{{- range $c := (include "c8s.components" . | fromJsonArray) -}}
{{- $img := get $c "image" -}}
{{- if and (get $c "enabled") (not (get $c "cdsExempt")) (not (get $c "argvPinned")) (get $img "digest") -}}
{{- /* Covered by an open-args entry whose pin, if any, is a prefix of the
       component's entrypoint: a pin on another executable would reach the
       base and still deny the component on its own node. */ -}}
{{- $ok := false -}}
{{- if hasKey $covered (get $img "digest") -}}
{{- $pin := get (get $covered (get $img "digest")) "entrypoint" -}}
{{- $entrypoint := get $c "entrypoint" -}}
{{- if le (len $pin) (len $entrypoint) -}}
{{- $ok = true -}}
{{- range $i, $tok := $pin -}}{{- if ne $tok (index $entrypoint $i) -}}{{- $ok = false -}}{{- end -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $ok -}}
{{- fail (printf "VALIDATION_ERROR kind=uncovered_component_digest: nriImagePolicy.policy.mode=fail-closed with deriveComponents=false, but %s is digest-pinned (%s) and no nriImagePolicy.bootstrapAllowlist.workloads entry leaves args, env and mounts unconstrained for that digest with its command any or pinned to the image's entrypoint %s. The plugin would deny it on its own node. Add such an entry (c8s allowlist add writes the any-command shape), set deriveComponents=true, or use c8s install --resolve-digests." (get $c "name") (get $img "digest") (get $c "entrypoint" | toJson)) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if and $nri.enabled (not (hasPrefix "https://" $nriCDSURL)) -}}
{{- fail (printf "nriImagePolicy.cds.url must start with https:// when nriImagePolicy.enabled=true (got %q): the host plugin must fetch the allowlist over armTLS" $nriCDSURL) -}}
{{- end -}}
{{- /*
  The derived form is a node-local NodePort address, so there has to be one.
*/ -}}
{{- if and $nri.enabled (not $nri.cds.url) -}}
{{- if or (ne .Values.cds.service.type "NodePort") (not .Values.cds.service.nodePort) -}}
{{- fail (printf "VALIDATION_ERROR kind=nri_cds_url_underivable: nriImagePolicy.cds.url is empty, so it derives https://127.0.0.1:<cds.service.nodePort>, but cds.service.type is %q and cds.service.nodePort is %v. Set cds.service.type=NodePort with a nodePort, or set nriImagePolicy.cds.url to the address the plugin should pull from." .Values.cds.service.type .Values.cds.service.nodePort) -}}
{{- end -}}
{{- end -}}

{{- /*
  The mirror of require_host_image_policy for evidence: off bare-metal mode,
  the host attestation-api DaemonSet is the only evidence source for
  get-cert, armtls-mesh, and CDS. Disabling it there renders a cluster whose
  attestation consumers all point at a socket nothing serves.
*/ -}}
{{- if and (not .Values.attestationApi.enabled) (ne .Values.attestationApi.cvmMode "bare-metal") -}}
{{- fail "VALIDATION_ERROR kind=require_attestation_api: attestationApi.enabled=false requires attestationApi.cvmMode=bare-metal. On a non-bare-metal cluster the host attestation-api DaemonSet is the only evidence source for get-cert/armtls-mesh/CDS (`c8s install --cvm-mode=bare-metal` sets attestationApi.enabled=false for you)." -}}
{{- end -}}
{{- /*
  Rate budget for the built-in /allowlist route. CDS rate-limits per source
  IP and sees every front-door request as the one router pod IP, so the nginx
  aggregate write bound must undercut the CDS bucket signed operator writes
  share, and each per-client bound must fit inside the aggregate. Positivity
  parsing lives with the zone rendering in router-configmap.yaml (same
  c8s.positiveInt, so either template failing first reports the same message).
*/ -}}
{{- if and $router.enabled (eq (include "router.renderAllowlistRoute" .) "true") -}}
{{- $writeRate := int (include "c8s.positiveInt" (dict "value" $router.allowlist.rateLimit.requestsPerSecond "label" "router.allowlist.rateLimit.requestsPerSecond")) -}}
{{- $writeBurst := int (include "c8s.positiveInt" (dict "value" $router.allowlist.rateLimit.burst "label" "router.allowlist.rateLimit.burst")) -}}
{{- $writeTotalRate := int (include "c8s.positiveInt" (dict "value" $router.allowlist.rateLimit.totalRequestsPerSecond "label" "router.allowlist.rateLimit.totalRequestsPerSecond")) -}}
{{- $writeTotalBurst := int (include "c8s.positiveInt" (dict "value" $router.allowlist.rateLimit.totalBurst "label" "router.allowlist.rateLimit.totalBurst")) -}}
{{- if gt $writeRate $writeTotalRate -}}
{{- fail (printf "VALIDATION_ERROR kind=router_allowlist_rate_budget: router.allowlist.rateLimit.requestsPerSecond must not exceed rateLimit.totalRequestsPerSecond (%d), got: %d" $writeTotalRate $writeRate) -}}
{{- end -}}
{{- if gt $writeBurst $writeTotalBurst -}}
{{- fail (printf "VALIDATION_ERROR kind=router_allowlist_rate_budget: router.allowlist.rateLimit.burst must not exceed rateLimit.totalBurst (%d), got: %d" $writeTotalBurst $writeBurst) -}}
{{- end -}}
{{- if ge (float64 $writeTotalRate) (float64 .Values.cds.rateLimit) -}}
{{- fail (printf "VALIDATION_ERROR kind=router_allowlist_rate_budget: router.allowlist.rateLimit.totalRequestsPerSecond must be less than cds.rateLimit (%v), got: %d" .Values.cds.rateLimit $writeTotalRate) -}}
{{- end -}}
{{- if ge $writeTotalBurst (int .Values.cds.rateBurst) -}}
{{- fail (printf "VALIDATION_ERROR kind=router_allowlist_rate_budget: router.allowlist.rateLimit.totalBurst must be less than cds.rateBurst (%v), got: %d" .Values.cds.rateBurst $writeTotalBurst) -}}
{{- end -}}
{{- end -}}
{{- /*
  CDS refuses to start unless the per-workload secret quota is strictly below
  the store ceiling, so the pair is refused here instead.
*/ -}}
{{- $secretsCeiling := int (include "c8s.positiveInt" (dict "value" .Values.cds.secretsMaxPaths "label" "cds.secretsMaxPaths")) -}}
{{- $secretsQuota := int (include "c8s.positiveInt" (dict "value" .Values.cds.secretsMaxPathsPerWorkload "label" "cds.secretsMaxPathsPerWorkload")) -}}
{{- if ge $secretsQuota $secretsCeiling -}}
{{- fail (printf "VALIDATION_ERROR kind=cds_secrets_path_budget: cds.secretsMaxPathsPerWorkload must be below cds.secretsMaxPaths (%d), got: %d" $secretsCeiling $secretsQuota) -}}
{{- end -}}
{{- /*
  Per-container `paths` was replaced by an entry-level `secrets` grant. CDS
  parses its seed with unknown fields rejected and fails closed on a parse
  error, so a values file carried over from a release that used `paths` would
  not misconfigure CDS — it would stop it booting, taking the mesh CA with it.
  Catch it at upgrade time instead. See docs/secrets.md.
*/ -}}
{{- range $name, $entry := .Values.nriImagePolicy.bootstrapAllowlist.workloads -}}
{{- range $field := (list "initContainers" "containers") -}}
{{- range $ctr := (index $entry $field) -}}
{{- if hasKey $ctr "paths" -}}
{{- fail (printf "VALIDATION_ERROR kind=allowlist_container_paths: nriImagePolicy.bootstrapAllowlist.workloads.%s.%s has a container with a `paths` policy, which was replaced by an entry-level `secrets` grant. CDS rejects unknown fields in its seed and would fail to start. Move the grant up to the entry as `secrets: {policy: allow, read: [...], write: [...]}` (a deny grant is just omitted). See docs/secrets.md." $name $field) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
