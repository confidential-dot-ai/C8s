{{- define "c8s.operatorPodSpec" -}}
# Keeps the env names fixed for the allowlist's env match (c8s.componentEnv).
enableServiceLinks: false
serviceAccountName: {{ include "c8s.operatorName" . }}
securityContext:
{{ toYaml .Values.podSecurityContext | indent 2 }}
containers:
  - name: operator
    image: {{ include "c8s.image" . }}
    imagePullPolicy: {{ .Values.image.pullPolicy }}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65532
      capabilities:
        drop: [ALL]
    command: {{ include "c8s.entrypoint" (dict "root" . "valuePath" "image") }}
    args:
      - operator
      - --leader-election-namespace={{ .Release.Namespace }}
      - --status-mirror-enabled={{ .Values.statusMirror.enabled }}
      {{- if .Values.operator.podCVMProvider.enabled }}
      - --pod-cvm-provider-config=/mnt/c8s-data/pod-cvm/config.json
      {{- end }}
      - --get-cert-image={{ include "c8s.image" . }}
      - --mesh-image={{ include "c8s-common.image" .Values.armtlsMesh.image }}
      - --webhook-config-name={{ include "c8s.fullname" . }}-pod-injector
      - --webhook-service-name={{ include "c8s.operatorName" . }}
      - --webhook-service-namespace={{ .Release.Namespace }}
      - --attestation-api-url={{ include "c8s.sidecarAttestationApiURL" . }}
      {{- range .Values.webhook.extraExcluded }}
      - --exclude-namespaces={{ . }}
      {{- end }}
      - --cert-fs-group={{ include "c8s.int" .Values.webhook.certVolume.fsGroup }}
      - --get-cert-renew-interval={{ .Values.webhook.getCert.renewInterval }}

      {{- /* Workload-digest claims (docs/armtls.md): get-cert
             redeems a sandbox token from the node's inventory over a
             compiled endpoint: the nri-image-policy socket that plugin
             NRI-mounts into c8s-cert on node-CVM. */}}
      {{- /* cvmMode=bare-metal bakes the plugin into the node image instead of
             installing it from the chart, so the socket exists even when
             nriImagePolicy.enabled is false. */}}
      - --workload-claims-host-dir={{ .Values.nriImagePolicy.hostPaths.runtimeDir }}
      {{- range .Values.operator.extraArgs }}
      - {{ . | quote }}
      {{- end }}
    env:
      # The webhook CA carries the pod name as its identity in the
      # caBundle; the hostname is truncated past 63 characters.
      - name: POD_NAME
        valueFrom:
          fieldRef: { fieldPath: metadata.name }
    ports:
      - name: metrics
        containerPort: 8080
      - name: health
        containerPort: 8081
    # setupManager (CRD discovery + webhook PKI bootstrap) runs before the
    # health server serves, with :8081 already bound by NewManager, so
    # probes hang rather than refuse. 30x10s covers that window.
    startupProbe:
      httpGet: { path: /healthz, port: health }
      periodSeconds: 10
      failureThreshold: 30
    readinessProbe:
      httpGet: { path: /readyz, port: health }
      initialDelaySeconds: 3
    livenessProbe:
      httpGet: { path: /healthz, port: health }
      periodSeconds: 30
    resources:
{{ toYaml .Values.operator.resources | indent 6 }}
    volumeMounts:
      # readOnlyRootFilesystem: true forces any transient files
      # (controller-runtime cache tempfiles, etc.) to land in
      # this emptyDir rather than the immutable image. Memory-backed, like
      # every component volume (see cds.yaml).
      - name: tmp
        mountPath: /tmp
      {{- if .Values.operator.podCVMProvider.enabled }}
      - name: pod-cvm-provider
        mountPath: /mnt/c8s-data/pod-cvm
        readOnly: true
      {{- end }}
volumes:
  - name: tmp
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  {{- if .Values.operator.podCVMProvider.enabled }}
  - name: pod-cvm-provider
    secret:
      secretName: {{ required "operator.podCVMProvider.existingSecret is required when the provider is enabled" .Values.operator.podCVMProvider.existingSecret | quote }}
      defaultMode: 0440
  {{- end }}
{{- end -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "c8s.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: operator
spec:
  # The webhook serving CA is minted inside this pod and patched into one
  # MutatingWebhookConfiguration. Running multiple replicas can race CA bundles
  # and break admission TLS for requests routed to the wrong pod.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: operator
      {{- with .Values.operator.podAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    spec:
{{- include "c8s.operatorPodSpec" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "c8s.operatorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: operator
spec:
  selector:
    app.kubernetes.io/name: c8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    # Webhook service port. The API server dials this Service:port; the
    # MutatingWebhookConfiguration's clientConfig.service.port matches.
    # controller-runtime's webhook server listens on 9443 by default.
    - name: webhook
      port: {{ .Values.webhook.service.port }}
      targetPort: 9443
