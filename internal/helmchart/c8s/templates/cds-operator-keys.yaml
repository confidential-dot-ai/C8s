{{- /*
The keys the route manifest is signed under, in the router's own namespace,
which a projected volume cannot leave. Public key material — not a secret, and
checked for content in validations.yaml. A baked node's router reads the same
keys from its measured launch staging instead.
*/ -}}
{{- if and (include "c8s.cdsFromValues" .) .Values.router.enabled .Values.cds.operatorKeys }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "c8s.fullname" . }}-operator-keys
  namespace: {{ include "c8s.routerMeshNamespace" . }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: cds
data:
  keys.pem: {{ .Values.cds.operatorKeys | quote }}
{{- end }}
