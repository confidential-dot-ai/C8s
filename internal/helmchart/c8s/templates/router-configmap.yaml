{{- if .Values.router.enabled }}
{{- $tunnelConnsPerClient := include "c8s.positiveInt" (dict "value" .Values.router.nginx.tunnelConnectionsPerClient "label" "router.nginx.tunnelConnectionsPerClient") | int -}}
{{- $sans := include "router.sanList" . | fromJsonArray -}}
{{- range $s := $sans -}}{{- include "router.validateSan" $s -}}{{- end -}}
{{- $serverNames := join " " $sans -}}
{{- if .Values.node.baked -}}
{{- /* The sole virtual host accepts the launch-signed SAN. Certificate
       issuance reads that SAN from the verified host file at runtime. */ -}}
{{- $serverNames = "_" -}}
{{- end -}}
{{- $publicTLSMode := include "router.publicTLSMode" . -}}
{{- $launchDriven := eq (include "router.launchDriven" .) "true" -}}
{{- $acmeSidecar := eq (include "router.acmeSidecar" .) "true" -}}
{{- $defaultMeshCAPath := include "c8s.caFile" . -}}
{{- $routingPort := include "router.routingPort" . -}}
{{- $maxRequestBodyBytes := include "c8s.int" .Values.router.routing.maxRequestBodyBytes | int64 -}}
{{- if lt $maxRequestBodyBytes 1 -}}
{{- fail (printf "router.routing.maxRequestBodyBytes must be a positive number of bytes, got: %d" $maxRequestBodyBytes) -}}
{{- end -}}
{{- $readTimeout := toString .Values.router.routing.readTimeout -}}
{{- if or (not (regexMatch `^[0-9]+(ms|s|m|h)$` $readTimeout)) (regexMatch `^0+(ms|s|m|h)$` $readTimeout) -}}
{{- fail (printf "router.routing.readTimeout must be a positive whole number of ms, s, m or h, such as 3600s, got: %s" $readTimeout) -}}
{{- end -}}
{{- /* nginx's proxy_read_timeout derives from backendTimeout and rejects multi-unit values. */ -}}
{{- range $key := list "pollInterval" "backendTimeout" -}}
{{- $d := toString (index $.Values.router.routing $key) -}}
{{- if or (not (regexMatch `^[0-9]+(ms|s|m|h)$` $d)) (regexMatch `^0+(ms|s|m|h)$` $d) -}}
{{- fail (printf "router.routing.%s must be a positive whole number of ms, s, m or h, such as 30s or 90m, got: %v" $key (index $.Values.router.routing $key)) -}}
{{- end -}}
{{- end -}}
{{- /* nginx waits 30s past cds-attest's --backend-timeout, so the sidecar's own timeout reply reaches the client. */ -}}
{{- $backendTimeout := toString .Values.router.routing.backendTimeout -}}
{{- $backendUnit := regexFind `(ms|s|m|h)$` $backendTimeout -}}
{{- $backendCount := regexReplaceAll `^0*([0-9])` (trimSuffix $backendUnit $backendTimeout) "${1}" | int64 -}}
{{- $tunnelReadTimeoutMs := add (mul $backendCount (get (dict "ms" 1 "s" 1000 "m" 60000 "h" 3600000) $backendUnit)) 30000 -}}
{{- $tunnelReadTimeout := printf "%dms" $tunnelReadTimeoutMs -}}
{{- if eq (mod $tunnelReadTimeoutMs 1000) 0 -}}
{{- $tunnelReadTimeout = printf "%ds" (div $tunnelReadTimeoutMs 1000) -}}
{{- end -}}
{{- $renderAllowlistRoute := eq (include "router.renderAllowlistRoute" .) "true" -}}
{{- $allowlistProxyPort := 0 -}}
{{- $allowlistWriteRate := 0 -}}
{{- $allowlistWriteBurst := 0 -}}
{{- $allowlistWriteTotalRate := 0 -}}
{{- $allowlistWriteTotalBurst := 0 -}}
{{- $allowlistReadRate := 0 -}}
{{- $allowlistReadBurst := 0 -}}
{{- if $renderAllowlistRoute -}}
{{- $allowlistProxyPort = include "c8s.int" .Values.router.allowlist.proxyPort | int -}}
{{- if or (lt $allowlistProxyPort 1) (gt $allowlistProxyPort 65535) -}}
{{- fail (printf "router.allowlist.proxyPort must be between 1 and 65535, got: %d" $allowlistProxyPort) -}}
{{- end -}}
{{- if eq $allowlistProxyPort (int .Values.router.attest.port) -}}
{{- fail (printf "router.allowlist.proxyPort must differ from router.attest.port, got: %d" $allowlistProxyPort) -}}
{{- end -}}
{{- if eq $allowlistProxyPort (int .Values.router.nginx.httpsPort) -}}
{{- fail (printf "router.allowlist.proxyPort must differ from router.nginx.httpsPort, got: %d" $allowlistProxyPort) -}}
{{- end -}}
{{- $allowlistWriteRate = int (include "c8s.positiveInt" (dict "value" .Values.router.allowlist.rateLimit.requestsPerSecond "label" "router.allowlist.rateLimit.requestsPerSecond")) -}}
{{- $allowlistWriteBurst = int (include "c8s.positiveInt" (dict "value" .Values.router.allowlist.rateLimit.burst "label" "router.allowlist.rateLimit.burst")) -}}
{{- $allowlistWriteTotalRate = int (include "c8s.positiveInt" (dict "value" .Values.router.allowlist.rateLimit.totalRequestsPerSecond "label" "router.allowlist.rateLimit.totalRequestsPerSecond")) -}}
{{- $allowlistWriteTotalBurst = int (include "c8s.positiveInt" (dict "value" .Values.router.allowlist.rateLimit.totalBurst "label" "router.allowlist.rateLimit.totalBurst")) -}}
{{- $allowlistReadRate = int (include "c8s.positiveInt" (dict "value" .Values.router.allowlist.readRateLimit.requestsPerSecond "label" "router.allowlist.readRateLimit.requestsPerSecond")) -}}
{{- $allowlistReadBurst = int (include "c8s.positiveInt" (dict "value" .Values.router.allowlist.readRateLimit.burst "label" "router.allowlist.readRateLimit.burst")) -}}
{{- /* Cross-value budget invariants (per-client <= total < cds bucket) live
   in validations.yaml, kind=router_allowlist_rate_budget. */ -}}
{{- end -}}
{{- include "router.validateCORS" .Values.router.cors }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "router.fullname" . }}-nginx
  namespace: {{ include "c8s.routerMeshNamespace" . }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
data:
  # INVARIANT: nginx is this script's child, so no process namespace is shared.
  reload.sh: |
    #!/bin/sh
    set -eu
    # Fixed: the front door serves the previous certificate for at most this
    # long after a renewal.
    interval=5
    watched="{{ include "router.filesNginxLoads" . }}"

    # A publication relinks the leaf and its key one file at a time, so a tick
    # can land on a leaf whose key has not arrived yet. nginx tests what it
    # would load, and nothing is signalled until that test passes.
    load_attempts=5
    load_delay=1

    # Exit 2 says a file nginx loads is gone: the generation was withdrawn, and
    # serving on would serve a certificate C8s took back. Any other failure is
    # a read straddling a publication, which the next tick sees whole.
    fingerprint() {
        for file in $watched; do
            if [ ! -r "$file" ]; then
                echo "router: $file is not readable" >&2
                return 2
            fi
            md5sum "$file" || return 1
        done
    }

    # loadable waits out a publication in progress: a leaf and a key that do
    # not belong together are the one state that passes the fingerprint and
    # fails the load.
    loadable() {
        attempt=1
        while [ "$attempt" -le "$load_attempts" ]; do
            if nginx -c {{ include "router.configDir" . }}/nginx.conf -t; then
                return 0
            fi
            echo "router: nginx will not load the watched files; retrying" >&2
            sleep "$load_delay"
            attempt=$((attempt + 1))
        done
        return 1
    }

    previous="$(fingerprint)"
    nginx -c {{ include "router.configDir" . }}/nginx.conf -g 'daemon off;' &
    nginx_pid=$!
    trap 'kill -TERM "$nginx_pid" 2>/dev/null; exit 0' TERM INT
    trap 'kill -QUIT "$nginx_pid" 2>/dev/null; exit 0' QUIT

    nginx_alive() { kill -0 "$nginx_pid" 2>/dev/null; }

    while nginx_alive; do
        sleep "$interval"
        current="$(fingerprint)" && status=0 || status=$?
        case "$status" in
            0)
                if [ "$current" != "$previous" ]; then
                    if loadable; then
                        kill -HUP "$nginx_pid"
                        previous="$current"
                    else
                        echo "router: keeping the running configuration; retrying next tick" >&2
                    fi
                fi
                ;;
            2) exit 1 ;;
            *) echo "router: certificates unread this tick; retrying" >&2 ;;
        esac
    done
    wait "$nginx_pid"
  nginx.conf: |
    worker_processes auto;
    # Each connection may hold a client socket, an upstream socket and a
    # request body temp file.
    worker_rlimit_nofile 65536;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 16384;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';
        access_log /var/log/nginx/access.log main;

        sendfile on;
        # cds-attest keeps a lapsed attest-lb binding until a connection can
        # no longer be open under these three timeouts (E7); change them
        # together with its lifetime.
        keepalive_timeout 65;
        client_header_timeout 60s;
        send_timeout 60s;

        # Pass a client's WebSocket upgrade (e.g. socket.io) through location /;
        # other requests keep Connection: close to the routing listener.
        map $http_upgrade $connection_upgrade {
            default upgrade;
            "" close;
        }
{{- if default false .Values.router.cors.enabled }}
        {{- include "router.corsMap" . | nindent 8 }}
{{- end }}
{{- if $renderAllowlistRoute }}

        # Rate-limit /allowlist while nginx still has the public client IP;
        # empty map keys are not accounted by limit_req. Mutations count per
        # client and in aggregate (the constant-key zone guards the shared
        # per-pod-IP CDS bucket; see docs/operator.md), reads per client;
        # OPTIONS (CORS preflight) is exempt. The total key chains off the
        # write key so the exempt-method list exists once.
        map $request_method $allowlist_write_rate_key {
            default $binary_remote_addr;
            GET "";
            HEAD "";
            OPTIONS "";
        }
        map $allowlist_write_rate_key $allowlist_write_total_key {
            "" "";
            default "all";
        }
        map $request_method $allowlist_read_rate_key {
            default "";
            GET $binary_remote_addr;
            HEAD $binary_remote_addr;
        }
        limit_req_zone $allowlist_write_rate_key zone=allowlist_write_per_client:10m rate={{ $allowlistWriteRate }}r/s;
        limit_req_zone $allowlist_write_total_key zone=allowlist_write_total:1m rate={{ $allowlistWriteTotalRate }}r/s;
        limit_req_zone $allowlist_read_rate_key zone=allowlist_read_per_client:10m rate={{ $allowlistReadRate }}r/s;
{{- end }}
{{- if .Values.router.attest.enabled }}

        # Bounds what one client address holds of the tunnel body spool.
        limit_conn_zone $binary_remote_addr zone=c8s_tunnel_per_client:10m;
{{- end }}

        server {
            listen {{ .Values.router.nginx.httpsPort }} ssl;
            server_name {{ $serverNames }};
            {{- if $launchDriven }}

            # The launch file's front-door mode selects the certificate:
            # tls.conf includes tls-cds.conf (the mesh leaf) or tls-acme.conf.
            include {{ include "router.launchDir" . }}/tls.conf;
            {{- else }}

            ssl_certificate     {{ include "router.publicCertPath" . }};
            ssl_certificate_key {{ include "router.publicKeyPath" . }};
            {{- end }}

            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers on;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 1d;

            # Headroom for upstream responses with large headers.
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;

            {{- if $renderAllowlistRoute }}
            # Built-in control-plane route. The exact + slash-prefix pair
            # exposes only /allowlist and its API subtree, not lookalike paths.
            {{- $allowlistLocationArgs := dict "root" $ "proxyPort" $allowlistProxyPort "writeBurst" $allowlistWriteBurst "writeTotalBurst" $allowlistWriteTotalBurst "readBurst" $allowlistReadBurst }}
            {{- include "router.allowlistLocation" (merge (dict "exact" true "path" "/allowlist") $allowlistLocationArgs) | nindent 12 }}
            {{- include "router.allowlistLocation" (merge (dict "exact" false "path" "/allowlist/") $allowlistLocationArgs) | nindent 12 }}

            {{- end }}
            {{- if .Values.router.discovery.enabled }}
            location = {{ .Values.router.discovery.path }} {
                {{- if default false .Values.router.cors.enabled }}
                {{- include "router.corsLocationDirectives" .Values.router.cors | nindent 16 }}
                {{- else if eq (include "router.protocolCorsEnabled" .) "true" }}
                {{- include "router.protocolCorsLocationDirectives" . | nindent 16 }}
                {{- end }}
                # A request here holds no attest-lb binding; the connection closes after
                # it so a binding cannot lapse under a connection kept open this way (E7).
                keepalive_timeout 0;
                access_log off;
                default_type application/json;
                add_header Cache-Control "no-store" always;
                alias {{ include "router.discoveryFilePath" . }};
            }

            location = {{ .Values.router.discovery.cdsCertPath }} {
                {{- if default false .Values.router.cors.enabled }}
                {{- include "router.corsLocationDirectives" .Values.router.cors | nindent 16 }}
                {{- else if eq (include "router.protocolCorsEnabled" .) "true" }}
                {{- include "router.protocolCorsLocationDirectives" . | nindent 16 }}
                {{- end }}
                # A request here holds no attest-lb binding; the connection closes after
                # it so a binding cannot lapse under a connection kept open this way (E7).
                keepalive_timeout 0;
                access_log off;
                default_type application/x-pem-file;
                add_header Cache-Control "no-store" always;
                alias {{ include "c8s.certFile" . }};
            }

            {{- if .Values.router.meshCA.expose }}
            location = {{ .Values.router.discovery.meshCAPath }} {
                {{- if default false .Values.router.cors.enabled }}
                {{- include "router.corsLocationDirectives" .Values.router.cors | nindent 16 }}
                {{- else if eq (include "router.protocolCorsEnabled" .) "true" }}
                {{- include "router.protocolCorsLocationDirectives" . | nindent 16 }}
                {{- end }}
                # A request here holds no attest-lb binding; the connection closes after
                # it so a binding cannot lapse under a connection kept open this way (E7).
                keepalive_timeout 0;
                access_log off;
                default_type application/x-pem-file;
                add_header Cache-Control "no-store" always;
                alias {{ $defaultMeshCAPath }};
            }
            {{- end }}

            {{- end }}
            # The sidecar's readiness gate, proxied so kubelet can reach it.
            # cds-attest listens on loopback (its one listener also carries the
            # attestation and tunnel routes, which must not be
            # published on the pod IP). So the probe rides the front door:
            # exact-match, ahead of location /.
            location = /readyz {
                # A request here holds no attest-lb binding; the connection closes after
                # it so a binding cannot lapse under a connection kept open this way (E7).
                keepalive_timeout 0;
                access_log off;
                proxy_pass http://127.0.0.1:{{ .Values.router.attest.port }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            {{- if .Values.router.attest.enabled }}

            # c8s-verify attestation + over-encryption sidecar (loopback).
            # nginx serves the static cert(s) via discovery above; the dynamic
            # per-session endpoints — the attest-pq attestation + key exchange,
            # the attest-lb challenge, and the over-encrypted tunnel — are
            # proxied to the in-pod `cds-attest` sidecar.
            # X-Real-IP is the address the sidecar meters each client by.
            # nginx reads each request body whole before proxying it, so a slow
            # upload holds no sidecar budget; replies past proxy_buffers stream
            # instead of spilling.
            location /.well-known/c8s/ {
                {{- include "router.wellKnownProxyDirectives" (dict "root" . "readTimeout" $tunnelReadTimeout) | nindent 16 }}
                client_max_body_size 16k;
                client_body_buffer_size 16k;
            }

            # Tunnel records go up to 8 MiB. Past 16k they spill to a sized
            # tmpfs that holds only the bytes received, where an 8m buffer
            # would be allocated whole once a client declared the size. A full
            # volume fails the upload with 500. The per-address cap stops one
            # client filling it before cds-attest sees a session.
            location = /.well-known/c8s/tunnel {
                {{- include "router.wellKnownProxyDirectives" (dict "root" . "readTimeout" $tunnelReadTimeout) | nindent 16 }}
                client_max_body_size 8m;
                client_body_buffer_size 16k;
                client_body_temp_path {{ include "router.tunnelBodyDir" . }};
                client_body_timeout 10s;
                limit_conn c8s_tunnel_per_client {{ $tunnelConnsPerClient }};
                limit_conn_status 503;
                # Only nginx's own 503 lands here: proxy_intercept_errors is
                # off, so a 503 from cds-attest passes through as sent.
                error_page 503 @tunnel_busy;
            }

            # The per-address cap answers like the cds-attest bounds (A7).
            location @tunnel_busy {
                {{- include "router.wellKnownCorsDirectives" . | nindent 16 }}
                # A request here holds no attest-lb binding; the connection closes after
                # it so a binding cannot lapse under a connection kept open this way (E7).
                keepalive_timeout 0;
                default_type application/json;
                return 503 '{"error":"tunnel_busy","message":"too many tunnelled requests from this client"}';
            }

            {{- end }}

            # Application routing (route policy A7): every request no location
            # above claims goes to the cds-attest routing listener, which routes
            # it by the applied route manifest and dials the backend itself. No
            # URI on proxy_pass, so the listener sees the request target as the
            # client sent it, which path matching needs (M4).
            location / {
                {{- if default false .Values.router.cors.enabled }}
                {{- include "router.corsLocationDirectives" .Values.router.cors | nindent 16 }}
                {{- end }}
                # $host would drop a trailing dot and fall back to
                # server_name; the listener matches the client's Host (M1).
                if ($http_host = "") {
                    return 400;
                }
                proxy_pass http://127.0.0.1:{{ $routingPort }};
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Pairs the request with an attest-lb handshake on the same
                # connection; replaces any client value (route policy E8).
                proxy_set_header X-C8s-Connection $pid.$connection;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                {{- if $launchDriven }}
                # The signed launch file's router.maxRequestBodyBytes.
                include {{ include "router.launchDir" . }}/request-body.conf;
                {{- else }}
                client_max_body_size {{ $maxRequestBodyBytes }};
                {{- end }}
                # Stream request bodies to the routing listener: a body held
                # whole would spool to the nginx-cache volume, which a few
                # large uploads would fill. client_max_body_size still applies.
                proxy_request_buffering off;
                # A non-streaming completion sends nothing until it is done, so
                # nginx's 60s default read timeout would 504 long generations.
                # A dead routing listener must fail fast instead.
                proxy_connect_timeout 5s;
                proxy_read_timeout {{ $readTimeout }};
                proxy_send_timeout {{ $readTimeout }};
                {{- /*
                  Stream responses through instead of accumulating them.

                  nginx defaults to proxy_buffering on and HTTP/1.0 upstream, so
                  a Server-Sent Events body is buffered and released in clumps.
                  For token streaming that turns a smooth generation into
                  bursts: measured on an 8xB300 TDX node-as-CVM, TTFT p50 rose
                  22.4ms -> 287.2ms through this proxy while inter-token latency
                  *fell* 5.49ms -> 1.58ms. ITL improving across an extra hop is
                  the tell -- chunks arriving together compress measured ITL
                  while first-token latency rises.

                  proxy_http_version 1.1 is required alongside it: HTTP/1.0
                  upstream has no chunked transfer-encoding, so nginx must read
                  to EOF to know the body length, which re-buffers regardless of
                  proxy_buffering.

                  Both are safe for non-streaming responses -- they change when
                  bytes are forwarded, not what is sent.
                */}}
                proxy_buffering off;
                proxy_http_version 1.1;
            }

            # Exact: a prefix match would also claim manifest paths such as
            # /healthz-ui.
            location = /healthz {
                # A request here holds no attest-lb binding; the connection closes after
                # it so a binding cannot lapse under a connection kept open this way (E7).
                keepalive_timeout 0;
                access_log off;
                return 200 "ok\n";
                add_header Content-Type text/plain;
            }
        }
        {{- if $acmeSidecar }}

        # Public :80 (hostPort/Service -> acmeHTTPPort): HTTP-01 challenges
        # reach the acme sidecar on loopback; everything else upgrades.
        server {
            listen {{ include "router.acmeHTTPPort" . }};
            server_name {{ $serverNames }};

            location /.well-known/acme-challenge/ {
                access_log off;
                proxy_pass http://127.0.0.1:{{ include "router.acmeChallengePort" . }};
                proxy_set_header Host $host;
            }

            location / {
                return 301 https://$host$request_uri;
            }
        }
        {{- end }}
    }
  {{- if $launchDriven }}
  tls-cds.conf: |-
    ssl_certificate     {{ include "c8s.certFile" . }};
    ssl_certificate_key {{ include "c8s.keyFile" . }};
  tls-acme.conf: |-
    ssl_certificate     {{ include "router.acmeCertDir" . }}/cert.pem;
    ssl_certificate_key {{ include "router.acmeKeyDir" . }}/key.pem;
  {{- end }}
{{- end }}
