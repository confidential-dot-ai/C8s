{{- if .Values.armtlsMesh.enabled }}
{{- if .Values.armtlsMesh.tcpEgressPolicy.enabled }}
{{- $ns := .Values.armtlsMesh.tcpEgressPolicy.namespaces }}
{{- /* Empty namespaces falls back to the release namespace: a NetworkPolicy
      is namespaced, so the chart cannot enumerate every non-excluded
      namespace at template time. The mesh's iptables egress guard
      (ARMTLS-MESH-CW-EGRESS) is the primary enforcement that covers all
      managed namespaces; this policy is the defence-in-depth layer. */}}
{{- $targets := $ns }}
{{- if not (kindIs "slice" $ns) }}{{ fail "armtlsMesh.tcpEgressPolicy.namespaces must be a list of namespace names ([] falls back to the release namespace)" }}{{ end }}
{{- if not $targets }}{{ $targets = list .Release.Namespace }}{{ end }}
{{- range $targets }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: armtls-mesh-tcp-only-egress
  namespace: {{ . }}
  labels:
    {{- include "armtls-mesh.labels" $ | nindent 4 }}
    app.kubernetes.io/component: egress-policy
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow all TCP egress (intercepted by armtls-mesh); non-TCP egress is
    # dropped by the mesh's fail-closed guard. DNS/53 (UDP) to kube-system is
    # the sanctioned plaintext exception.
    - ports:
        - protocol: TCP
    - ports:
        - protocol: UDP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
{{- end }}
{{- end }}
{{- end }}
