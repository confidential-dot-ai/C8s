{{/*
One pull-mode installer DaemonSet on every node. Each plugin polls the CDS it
can reach (node-local NodePort), so operator `c8s allowlist add` writes reach
admission. CDS itself is pinned separately (cds.node.selector, in cds.yaml).
The name keeps the historical `-worker` suffix to preserve DaemonSet identity
across upgrade; there is no longer a `-cds` counterpart.

Under nriImagePolicy.baked (node-as-CVM) the node image already carries the
plugin, its containerd registration and the boot config, so the same DaemonSet
runs the pins script instead: it writes this release's CDS pins into that config
and restarts containerd when they change.
*/}}
{{- if .Values.nriImagePolicy.enabled }}
{{- include "nri-image-policy.validateCDSPolicy" . }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nri-image-policy.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nri-image-policy.labels" . | nindent 4 }}
    app.kubernetes.io/component: nri-installer-worker
spec:
  selector:
    matchLabels:
      {{- include "nri-image-policy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nri-installer-worker
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        {{- include "nri-image-policy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nri-installer-worker
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      hostPID: true
      {{- with .Values.nriImagePolicy.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "c8s.imagePullSecrets" (dict "root" . "local" .Values.nriImagePolicy.imagePullSecrets) | nindent 6 }}
      tolerations:
        - operator: "Exists"
          effect: "NoExecute"
        - operator: "Exists"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                  {{- range .Values.nriImagePolicy.nodeAffinity.excludeLabels }}
                  - key: {{ .key }}
                    operator: NotIn
                    values:
                      {{- toYaml .values | nindent 22 }}
                  {{- end }}
      initContainers:
        {{- if and (eq .Values.nriImagePolicy.distro "rke2") (not .Values.nriImagePolicy.baked) }}
        - name: containerd-prep
          image: {{ include "c8s-common.image" .Values.nriImagePolicy.containerdPrep.image }}
          imagePullPolicy: {{ .Values.nriImagePolicy.containerdPrep.image.pullPolicy }}
          securityContext:
            privileged: true
          env:
            - name: HOST_CONTAINERD_DIR
              value: {{ include "nri-image-policy.containerdConfigDir" . | quote }}
            # The literal RKE2 base-config include, written verbatim into a
            # freshly created config template. Escaped so Helm emits it as-is.
            - name: BASE_DIRECTIVE
              value: '{{ "{{ template \"base\" . }}" }}'
          command: ["/bin/sh", "-c"]
          args:
            - |
{{ .Files.Get "files/scripts/containerd-prep.sh" | indent 14 }}
          volumeMounts:
            - name: host-containerd-config
              mountPath: /host{{ include "nri-image-policy.containerdConfigDir" . }}
          resources:
            {{- toYaml .Values.nriImagePolicy.resources | nindent 12 }}
        {{- end }}
        - name: install
          image: {{ include "nri-image-policy.image" . }}
          imagePullPolicy: {{ .Values.nriImagePolicy.image.pullPolicy }}
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
{{- if .Values.nriImagePolicy.baked }}
{{ include "nri-image-policy.pinsScript" (dict "root" .) | indent 14 }}
          volumeMounts:
            {{- include "nri-image-policy.pinsVolumeMounts" . | nindent 12 }}
{{- else }}
{{ include "nri-image-policy.installScript" (dict "root" . "bootConfig" (include "nri-image-policy.bootConfig" (dict "root" .))) | indent 14 }}
          volumeMounts:
            {{- include "nri-image-policy.hostVolumeMounts" . | nindent 12 }}
{{- end }}
          resources:
            {{- toYaml .Values.nriImagePolicy.resources | nindent 12 }}
      containers:
        # Holds the pod, and its readiness follows the host plugin: the plugin
        # exits when its NRI connection drops and NRI does not respawn it, so a
        # bare sleep here left the DaemonSet Ready over a node admitting without
        # it. See runPluginReady for why it checks the process (visible through
        # hostPID) rather than the health socket, and why HTTP, not exec.
        #
        # Readiness only: a restart of this container reruns neither the
        # install nor containerd, and the plugin comes back only when
        # containerd restarts.
        - name: plugin-ready
          image: {{ include "nri-image-policy.image" . }}
          imagePullPolicy: {{ .Values.nriImagePolicy.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - {{ include "nri-image-policy.pluginReadyScript" . | quote }}
          ports:
            - name: plugin-ready
              containerPort: {{ include "nri-image-policy.pluginReadyPort" . }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: plugin-ready
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Measured at about 47Mi resident, most of it the c8s binary's file
          # pages, which the cgroup charges like any other memory.
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        {{- if .Values.nriImagePolicy.baked }}
        {{- include "nri-image-policy.pinsVolumes" . | nindent 8 }}
        {{- else }}
        {{- include "nri-image-policy.hostVolumes" . | nindent 8 }}
        {{- end }}
{{- end }}
