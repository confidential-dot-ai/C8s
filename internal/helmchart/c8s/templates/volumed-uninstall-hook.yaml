{{- define "c8s.volumedTeardownPodSpec" -}}
{{- $kubeletRoot := required "volumed.hostPaths.kubeletRoot is required" .Values.volumed.hostPaths.kubeletRoot }}
automountServiceAccountToken: false
{{- with .Values.volumed.priorityClassName }}
priorityClassName: {{ . }}
{{- end }}
{{- include "c8s.imagePullSecrets" (dict "root" $ "local" .Values.volumed.imagePullSecrets) | nindent 0 }}
nodeSelector:
  kubernetes.io/os: linux
  {{- with .Values.volumed.nodeSelector }}
{{ toYaml . | indent 2 }}
  {{- end }}
tolerations:
  {{- toYaml .Values.volumed.tolerations | nindent 2 }}
initContainers:
  - name: teardown
    image: {{ include "volumed.image" . }}
    imagePullPolicy: {{ .Values.image.pullPolicy }}
    securityContext:
      privileged: true
      # The image is nonroot (USER 65532) and privileged grants no
      # effective caps to a non-root process.
      runAsUser: 0
      runAsGroup: 0
    # The image entrypoint is ["/app/c8s", "volumed"]; this hook runs a
    # shell script instead, so it overrides both.
    command: ["/bin/sh", "-c"]
    args:
      - |
{{ .Files.Get "files/scripts/volumed-teardown.sh" | indent 8 }}
    volumeMounts:
      # Bidirectional: the mounts live in the host namespace, so the
      # unmount has to propagate back out of this pod.
      - name: kubelet-root
        mountPath: {{ $kubeletRoot }}
        mountPropagation: Bidirectional
      - name: dev
        mountPath: /dev
    resources:
      {{- toYaml .Values.volumed.resources | nindent 6 }}
containers:
  - name: pause
    image: {{ include "volumed.image" . }}
    imagePullPolicy: {{ .Values.image.pullPolicy }}
    command: ["/bin/sh", "-c", "sleep infinity"]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi
volumes:
  - name: kubelet-root
    hostPath:
      path: {{ $kubeletRoot }}
      type: Directory
  - name: dev
    hostPath:
      path: /dev
      type: Directory
{{- end -}}

{{- if .Values.volumed.enabled }}
{{- $kubeletRoot := required "volumed.hostPaths.kubeletRoot is required" .Values.volumed.hostPaths.kubeletRoot }}
{{- /*
  Pre-delete DaemonSet that reaps the device-mapper stack volumed opened on
  each node (files/scripts/volumed-teardown.sh). It runs before the release is
  deleted, so the reap happens while the mounts are still reachable — and it
  runs for any chart consumer, not only `c8s uninstall`.

  The script exits non-zero when a mapping will not close, which helm 4 waits
  for and turns into a failed uninstall. Helm 3 waits only until the DaemonSet
  object exists, so there the failure is in the hook pod rather than in helm's
  exit code; `c8s uninstall` names the pods that cause it before it starts.
  hook-delete-policy keeps a failed hook's pods for exactly that reason.

  Same privilege shape as the volumed DaemonSet it cleans up after: unmounting
  another pod's directory and closing a dm target needs it.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "c8s.volumedName" . }}-teardown
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "c8s.commonLabels" . | indent 4 }}
    app.kubernetes.io/component: volumed-teardown
  annotations:
    helm.sh/hook: pre-delete
    # Ahead of the nri-image-policy uninstaller (weight 0): helm runs pre-delete
    # hooks in weight order and waits for each, and that one restarts containerd,
    # which would kill this pod mid-sweep.
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: c8s-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: volumed-teardown
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8s-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: volumed-teardown
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
{{- include "c8s.volumedTeardownPodSpec" . | nindent 6 }}
{{- end }}
