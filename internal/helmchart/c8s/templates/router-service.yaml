{{- if .Values.router.enabled }}
{{- $svc := .Values.router.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "router.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  {{- if or (eq $svc.type "LoadBalancer") (eq $svc.type "NodePort") }}
  {{- $renderAllowlistRoute := eq (include "router.renderAllowlistRoute" .) "true" }}
  {{- $perClientLimits := or $renderAllowlistRoute .Values.router.attest.enabled }}
  {{- $policy := default (ternary "Local" "Cluster" $perClientLimits) $svc.externalTrafficPolicy }}
  {{- if not (or (eq $policy "Local") (eq $policy "Cluster")) }}
  {{- fail (printf "router.service.externalTrafficPolicy must be Local or Cluster, got: %s" $policy) }}
  {{- end }}
  # Local (the default while the /allowlist route or the attestation sidecar
  # renders) preserves the public source IP their per-client limiters key on;
  # see values.yaml.
  externalTrafficPolicy: {{ $policy }}
  {{- end }}
  ports:
    - port: {{ $svc.port }}
      targetPort: https
      protocol: TCP
      name: https
    {{- if eq (include "router.acmeSidecar" .) "true" }}
    {{- /* HTTP-01 validators dial :80. */}}
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
  selector:
    {{- include "router.selectorLabels" . | nindent 4 }}
{{- end }}
