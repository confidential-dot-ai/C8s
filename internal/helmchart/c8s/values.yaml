## Render Kubernetes core services into the measured node image at build time.
## Signed launch policies are staged on each node at /run/c8s-node; the host
## owns attestation, RKE2 and NRI. Ordinary Helm installs leave this off.
node:
  baked: false

## The c8s component image set: the single source the chart and `c8s install`
## both enumerate from, so adding a component is one edit here.
##   - valuePath:   dotted path to the component's image object (repository/
##                  tag/digest live there).
##   - enabledPath: dotted path to its deploy toggle ("" = always deployed); a
##                  disabled component is neither derived into the NRI allowlist
##                  nor coverage-checked.
##   - cdsExempt:   cds is always seeded via its self-entry (independent of
##                  deriveComponents), so the fail-closed coverage guard skips it.
##   - pinnedDigest: the digest `c8s install` pins for this component instead of
##                  resolving its repository at --image-tag, for a component
##                  released on another repository's cadence and therefore
##                  absent at a c8s release tag. Only `c8s install` reads it, so
##                  a chart consumer that sets the component's image.tag or
##                  image.digest itself is unaffected.
## Consumed by the c8s.components helper (NRI allowlist derivation + render
## guard) and by `c8s install` (digest resolution, via `helm show values`).
c8sComponents:
  - valuePath: image
    enabledPath: ""
    cdsExempt: false
  - valuePath: cds.image
    enabledPath: ""
    cdsExempt: true
  - valuePath: attestationApi.image
    enabledPath: attestationApi.enabled
    cdsExempt: false
    ## Released by attestation-rs: the image built from .github/build-pins.json's
    ## attestation_rs_ref. Bump together with that pin, to
    ##   crane digest ghcr.io/confidential-dot-ai/attestation-api:sha-<first 7 of the ref>
    pinnedDigest: sha256:fb0d98a3f248f6d0f0a8feb8d497fba58d40d775b2db3e9e33d25d3fb283815f
  - valuePath: ratlsMesh.image
    enabledPath: ratlsMesh.enabled
    cdsExempt: false
  - valuePath: nriImagePolicy.image
    enabledPath: nriImagePolicy.enabled
    cdsExempt: false
    ## Seeded argv-pinned by the chart (the installer runs pinned shell
    ## scripts), never as an any-argv entry. Exempt from
    ## deriveComponents derivation and the uncovered_component_digest guard.
    argvPinned: true
  - valuePath: volumed.image
    enabledPath: volumed.enabled
    cdsExempt: false

## Operator container image. The same image runs every c8s mode that
## doesn't need extra OS bins: controller manager and injected get-cert.
## `tag` and `digest` are consumer-supplied — the chart fails to render if
## neither is set. TEE measurements depend on the exact binary running,
## so floating tags break attestation semantics; prefer `digest`.
image:
  repository: ghcr.io/confidential-dot-ai/c8s-operator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

## Operator Deployment. The operator is intentionally singleton because the
## webhook path mints pod-local serving PKI and patches one shared
## MutatingWebhookConfiguration caBundle.
operator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  podAnnotations: {}
  extraArgs: []

## Chart-wide image pull secrets, used by every component unless that component
## sets its own .imagePullSecrets. One entry here covers all c8s images.
imagePullSecrets: []

## Name of a pre-existing registry-credential Secret
## (kubernetes.io/dockerconfigjson) in the release namespace, appended to
## every component's imagePullSecrets — both the chart-wide list above and any
## component-local override — so all pods pull from an authenticated registry
## (e.g. a private mirror of the c8s images) from first start, with no
## manually wired Secret references and no pod restart. Unlike
## the imagePullSecrets list, a component-local override does not shed it.
## The chart never creates or adopts the Secret itself: create it with
## kubectl/external-secrets and pass `c8s install --image-pull-secret <name>`,
## which fails fast when the Secret is missing.
imagePullSecret: ""

## Chart-wide get-cert behavior for the injected mesh-cert init containers.
certProvisioning:
  ## How long an init get-cert container retries CDS in-process before failing.
  ## During a full-stack roll CDS and the mesh are briefly unavailable; retrying
  ## here keeps a transient outage from crashing the init container into
  ## kubelet's minutes-long CrashLoopBackOff. Set comfortably above CDS's
  ## startup-to-serving time. It still fails closed once elapsed: the pod does
  ## not start without a real mesh cert.
  initialRetryTimeout: "2m"

## Common ServiceAccount settings for the chart-managed top-level c8s
## workloads: operator, attestation-api, and CDS. Leave empty to inherit
## the chart-wide imagePullSecrets above; set to override for these workloads.
serviceAccount:
  imagePullSecrets: []

## CRD-backed status mirror for `kubectl get cwl` UX. Disable this when CRDs
## are intentionally not installed; pod injection does not depend on it.
statusMirror:
  enabled: true

## Enforces Restricted-equivalent security for workload pods, including
## denial of host namespaces, host privilege, and every hostPath volume.
## NRI mounts the inventory socket below the Pod spec for credential sidecars.
## The sandbox-identity flow rests on this — see the template and
## docs/getcert-workload-binding.md, Corner 7. Disable only if another
## admission policy already enforces these controls.
hostNamespacePolicy:
  enabled: true
  ## Namespaces exempt in addition to the release namespace, kube-system, and
  ## the node image's trusted local-path-storage platform namespace.
  exemptNamespaces: []

## Mutating admission webhook that injects get-cert containers into pods
## annotated with confidential.ai/cw.
webhook:
  caBundle: ""
  ## -- Extra annotations for the MutatingWebhookConfiguration. When
  ## attestationApi.cvmMode=aks (i.e. `c8s install --cvm-mode aks`) the chart
  ## also adds `admissions.enforcer/disabled: "true"` automatically, so AKS's
  ## Admissions Enforcer stops rewriting the webhook's namespaceSelector and
  ## conflicting with `helm upgrade` re-applies. A value set here for the same
  ## key takes precedence over that automatic default.
  annotations: {}
  service:
    port: 443
  failurePolicy: Fail
  extraExcluded: []
  ## ValidatingAdmissionPolicy guarding the confidential.ai/cw pod label
  ## (workload Service membership): at CREATE it must match the opt-in
  ## annotation, and both keys are immutable on UPDATE. Enforced in the API
  ## server, so it holds even when the injection webhook is down.
  cwLabelPolicy:
    enabled: true
  certVolume:
    fsGroup: 65532
  getCert:
    ## Must be strictly shorter than cds.namedCertTTL, which is the shortest
    ## TTL CDS issues (a named leaf's, 6h) and therefore the binding one — a
    ## renewal interval at or above it would only fire once the installed leaf
    ## had already expired. The default is a third of it. get-cert additionally
    ## paces off the installed leaf's own NotAfter, so a mis-set value here
    ## degrades to more frequent renewals rather than an expired certificate.
    renewInterval: 2h
    ## Defaults match distroless nonroot.
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true

## Certificate Distribution Service (cds): the c8s trust root. One binary, one Service,
## one ServiceAccount, and one measurement allowlist serve attestation,
## allowlist, and mesh-CA leaf signing.
##
## The mesh CA key is generated inside the cds process and stays in memory
## only — it is never rendered into a Kubernetes Secret or volume.
cds:
  ## Pin the deployed image by digest in production to decouple it from a
  ## floating tag's movement. This applies to every c8s .image.digest field.
  image:
    repository: ghcr.io/confidential-dot-ai/cds
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 8443
  ## CIDR(s) holding this cluster's node addresses. CDS dials a node's admission
  ## inventory inside them and nowhere else, which is what stops a workload
  ## pointing the sandbox-digests callback at its own pod IP and answering as
  ## the inventory.
  ##
  ## Unset (default), CDS derives the bound live from the cluster's node list —
  ## one host route per node, kept current as nodes come and go — and the chart
  ## grants its ServiceAccount read-only node access for that. Set a range only
  ## when the node network is separate from the pod network; on CNIs that assign
  ## pod IPs from the node subnet a range admits pods too (docs/operator.md).
  sandboxInventoryCIDRs: []
  service:
    type: NodePort
    nodePort: 30808
  ## CDS is a singleton, in-memory trust root reached over a node-local
  ## NodePort and (with persistence) an RWO volume, so it must land on a
  ## known node. node.selector pins it there; the default expects a node
  ## labelled `role=cds`; override to match your cluster.
  ##
  ## Set selector: {} for a single-node / single-CVM cluster with no dedicated
  ## CDS node: CDS schedules on any node (`c8s install --single-node` sets this
  ## for you). The NRI installer is one pull-mode DaemonSet on every node
  ## regardless, so each plugin pulls from whichever node hosts CDS.
  ##
  ## tolerations let CDS land on a node dedicated to it. The default tolerates
  ## `dedicated=cds:NoSchedule`, the conventional dedicated-CDS-node taint (the
  ## counterpart of the role=cds label); override for a different taint, or set
  ## [] for an untainted node (e.g. a single-node cluster).
  node:
    selector:
      role: cds
    tolerations:
      - key: dedicated
        value: cds
        effect: NoSchedule
  ## CDS is a singleton in-memory trust root: any voluntary eviction (node
  ## drain, autoscaler) destroys the CA key and forces every workload
  ## to re-bootstrap. The default PDB (maxUnavailable: 0) blocks voluntary
  ## disruptions so a drain cannot silently take CDS down — the operator must
  ## delete the pod deliberately (a planned re-bootstrap). Set maxUnavailable: 1
  ## to allow drains if you accept the re-bootstrap, or enabled: false to remove
  ## the PDB.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 0
  logLevel: info
  allowlistDB: /data/allowlist.db
  # -- Delay between publishing an allowlist change and enforcing it. Routers
  # fence their attest-pq sessions on the same lease; 0s applies writes at once
  # and disables pinned-allowlist verification.
  allowlistActivationLease: 0s
  jwtClockSkew: 30
  certTTL: 24h
  # -- Upper bound on the TTL of a leaf carrying a matched-workload stamp
  # (OID …1.5). A named leaf can outlive its match by at most its remaining
  # lifetime, so this is the documented stale-identity bound; it never applies
  # to membership-only (unnamed) leaves. See docs/ratls.md, "Matched workload".
  # It may only shorten the 6h built-in ceiling — CDS refuses to start on a
  # larger value, or on 0, which is not a disable switch here.
  namedCertTTL: 6h
  challengeTTL: 60s
  requestTimeout: 5s
  # -- Max HTTP request body CDS accepts on /authenticate and /attest.
  # Sized for the largest evidence envelope we serve today: an Intel
  # TDX quote + full cc_eventlog is ~90 KB uncompressed (the eventlog alone
  # runs 40-85 KB on real TDX hosts). The stock 64 KiB limit is fine for SEV-SNP
  # (evidence ~2 KiB) but rejects every TDX request with HTTP 422
  # `http: request body too large`.
  maxRequestSize: 262144
  # -- Max secret paths one allowlist entry may hold. Must stay below
  # cds.secretsMaxPaths; the chart refuses to render otherwise.
  secretsMaxPathsPerWorkload: 64
  # -- Max secret paths CDS holds in memory across every workload. Raise this
  # alongside secretsMaxPathsPerWorkload.
  secretsMaxPaths: 1024
  readinessInterval: 10s
  ## /attest CSRs arrive without a matching TCP source IP under chart routing,
  ## so leave sanValidation off and pin DNS SAN / CN patterns instead.
  sanValidation: false
  ## Extra full-match regexes a CSR's DNS SANs may match, on top of the chart's
  ## always-present in-cluster Service DNS pattern (c8s.cdsDnsSanPattern:
  ## <name>.<namespace>.svc). A SAN passes if it matches any allowed pattern.
  ##
  ## The mesh's own CSRs (router.<ns>.svc, ratls-mesh.<ns>.svc)
  ## always validate against the built-in Service pattern, so leave this empty
  ## for purely in-cluster deployments. When router fronts a routed domain, make
  ## that hostname the first router.san entry and add it here so CDS signs it onto
  ## the router leaf — appending here never shadows the in-cluster pattern. Only
  ## the first router.san is the mesh-cert identity; extra entries widen nginx
  ## server_name only and need no pattern here.
  dnsSanPatterns: []
  cnPattern: ""
  ## The single flat allowlist of SHA-384 hex launch digests, used two ways:
  ##   1. CDS admits these to call /attest.
  ##   2. The ratls-mesh daemonset and nri-image-policy plugin pin CDS's RA-TLS
  ##      serving cert against it when they dial CDS.
  ## Empty = no pinning (UNSAFE outside dev).
  measurements: []
  ## TDX RTMR pins, each "<index>=<sha384-hex>", completing `measurements` on
  ## TDX: the launch digest (MRTD) covers TDVF firmware only, while RTMR[1]
  ## pins the guest kernel and RTMR[2] the command line carrying the dm-verity
  ## root hash. Used the same two ways as `measurements`: CDS requires them of
  ## TDX callers on /attest, and every component dialing CDS
  ## pins CDS's RA-TLS cert against them. Ignored for SNP evidence. Empty = no
  ## RTMR pinning (on TDX the measurement pin then confers no guest-code
  ## identity, UNSAFE).
  rtmrs: []
  ## PEM bundle of operator EC public keys (public material, not a secret).
  ## When set, CDS accepts POST/PUT/DELETE /allowlist from a client presenting a
  ## short-lived token signed by one of the matching operator private keys (see
  ## `c8s allowlist` and the README "Operator allowlist credentials").
  ## Empty = allowlist writes are rejected (reads are still served). Prefer
  ## `c8s install --operator-keys <file>` over hand-editing this multi-line value.
  ## Measurements config: the JSON document listing the VM images this cluster
  ## runs, each pinned as a whole image. Content, not a path — set it with
  ## `c8s install --image-policy-file <file>` or `helm --set-file`. Empty
  ## disables whole-image matching; `measurements` above still pins.
  measurementsConfig: ""
  operatorKeys: ""
  rateLimit: 10
  rateBurst: 20
  rateLimiterMaxEntries: 10000
  rateLimiterEvictInterval: 1m
  rateLimiterIdleTimeout: 5m
  ## RA-TLS settings for the cds serving cert. Without this, clients talk to
  ## cds over plaintext HTTP and an on-path attacker can forge responses.
  ## Empty platform disables TLS — UNSAFE outside tests.
  ratlsPlatform: snp
  ratlsCertTTL: 24h
  ca:
    ## The mesh CA key is generated inside cds memory and is not rendered into
    ## a Kubernetes Secret or persistent volume.
    commonName: c8s Mesh CA
    certValidity: 8760h
    minValidity: 1h
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

## DaemonSet running the attestation-api image from github.com/confidential-dot-ai/attestation-rs.
attestationApi:
  ## Render the host-side attestation-api DaemonSet.
  enabled: true
  image:
    repository: ghcr.io/confidential-dot-ai/attestation-api
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  port: 8400
  ## Evidence generation is node-local only: the API binds pod loopback and
  ## the attest-proxy sidecar serves it on a hostPath Unix socket in
  ## nriImagePolicy.hostPaths.runtimeDir (0660, root:65532).
  proxy:
    ## Port the proxy serves GET /healthz on for the kubelet's probes. The
    ## body is "ok" or an error — never evidence — but it is reachable from
    ## other pods, so keep it off the ports other components use.
    healthPort: 8401
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
  ## Per-device hostPath mounts. hostPath.type=CharDevice fails the pod if
  ## the device node doesn't exist on the host, so disable for nodes that
  ## lack the corresponding hardware.
  ##
  ## Default is the native /dev/sev-guest ioctl, which covers bare-metal SNP
  ## and GKE SNP. Azure (AKS) attests through the vTPM at /dev/tpm0 instead, so
  ## an AKS install flips to tpm (the `c8s install --cvm-mode aks` path sets
  ## this automatically). tdxGuest is opt-in for TDX hosts via -f.
  teeDevices:
    sevGuest: true
    tdxGuest: false
    tpm: false
  platforms:
    - snp
    - tdx
    - az-snp
    - az-tdx
    - gcp-snp
    - gcp-tdx
  ## CVM platform shape — selects (via the install CLI) the TEE device:
  ##
  ## bare-metal (default): generalized node-as-CVM — our own nodes (self-managed
  ##   TDX/SNP) are themselves confidential VMs exposing a native TEE device
  ##   (/dev/sev-guest, or /dev/tdx-guest with --hardware-platform tdx); pods run
  ##   as ordinary processes attested via the node's own quote. Cloud-agnostic.
  ## gke: GKE managed confidential VM — also native /dev/sev-guest.
  ## aks: Azure confidential VM — SEV-SNP via the vTPM at /dev/tpm0.
  ##
  ## All modes render privileged: true. A hostPath device mount does not add a
  ## device-cgroup rule, so open() on the TEE device is EPERM from an unprivileged
  ## container regardless of SYS_RAWIO. TODO: drop privileged by routing SNP attest
  ## through the TSM configfs report interface (/sys/kernel/config/tsm/report).
  ##
  ## The install CLI requires --cvm-mode explicitly (no default there); this
  ## chart default serves GitOps/HelmRelease consumers that set values directly.
  cvmMode: bare-metal
  ## Unused while all modes render privileged: true (see cvmMode above). Retained
  ## for the planned least-privilege configfs path.
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
      add: [SYS_RAWIO]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

## RA-TLS service mesh: transparent L4 proxy with hardware-attested mTLS.
##
## --- CRITICAL OPERATIONAL REQUIREMENT ---
## The ratls-mesh DaemonSet hardcodes hostNetwork: true and
## dnsPolicy: ClusterFirstWithHostNet (see templates/ratls-mesh-daemonset.yaml).
## Both are non-toggleable: iptables-sync must run in the host network namespace
## to intercept pre-DNAT pod traffic at the node level, and the paired
## dnsPolicy keeps in-cluster service DNS working from that netns. Removing
## either breaks the routing model — there is no values knob because there
## is no supported configuration without them. Confirm your cluster CNI and
## any node-level NetworkPolicy/firewall posture is compatible before
## deploying.
ratlsMesh:
  ## Host-side mesh routing.
  enabled: true

  image:
    repository: ghcr.io/confidential-dot-ai/ratls-mesh
    # -- Image tag. Required: the chart does not pin a default; the consumer
    #    (HelmRelease values or cluster overlay) must set tag or digest.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # -- RA-TLS TEE type embedded in and verified on mesh certs: sev-snp or tdx.
  #    This is the wire-level platform identifier, not the attestation-api
  #    detection vocab (az-snp and bare-metal snp both verify as sev-snp here);
  #    attestation-api still auto-detects how to gather the evidence.
  platform: sev-snp

  # Host path for iptables lock (k3s: /run/k3s/agent/xtables.lock)
  xtablesLockPath: /run/xtables.lock

  # Mesh ports
  ports:
    outbound: 15001
    inbound: 15006
    health: 15021
    ## iptables-sync's readiness endpoint, bound to node loopback only (the
    ## DaemonSet is hostNetwork). The mesh proxy's start is gated on it.
    iptablesReady: 15022

  # UID for the ratls-mesh process (iptables excludes this UID)
  uid: 1337

  # UIDs excluded from iptables redirect (comma-separated)
  excludeUids: "0"

  # Always-on fail-closed inbound guard for confidential workloads: drop
  # FORWARD-path traffic to pods labeled confidential.ai/cw (Service-VIP DNAT,
  # excluded-namespace dials, cross-node direct-to-pod-IP), which the mesh
  # cannot intercept. passthrough is the reply allowlist: proto:source-port
  # entries RETURNed before the drop for dataplanes whose conntrack does not
  # mark a reply ESTABLISHED (e.g. GKE Dataplane V2 / Cilium breaks the DNS
  # reply, so without udp/tcp:53 get-cert can never resolve). Entries are
  # bounded to the stock ephemeral destination-port window (32768-60999), and
  # TCP entries additionally to the handshake reply and segments with SYN
  # clear, so no TCP entry can open a connection to a cw pod's service ports.
  # A UDP entry admits any datagram from that source port into the window.
  # Empty list = strict drop-all.
  cwInboundEnforcement:
    passthrough:
      - protocol: udp
        sourcePort: 53
      - protocol: tcp
        sourcePort: 53

  # Certificate settings
  certMode: cds  # self-signed | cds
  certTtl: "4h"
  rotationTimeout: "30s"

  # CDS integration (used when certMode=cds). The launch-measurement allowlist
  # for CDS's RA-TLS peer cert comes from the parent's cds.measurements, not
  # a per-component mirror.
  cds:
    caPollInterval: "5m"

  # Expected launch digests for measurement pinning (empty = accept any)
  measurements: []

  # TDX RTMR pins for mesh peers, each "<index>=<sha384-hex>" (see cds.rtmrs).
  # Ignored for SNP peers; empty = no RTMR pinning.
  rtmrs: []

  # Measurements config for mesh peers and the CDS the proxy dials: the JSON
  # document's content, not a path (see cds.measurementsConfig).
  measurementsConfig: ""

  # Pod shutdown budget. The iptables-cleanup preStop hook fires last in the
  # native-sidecar reverse-init order, so its sleep upper bound must leave room
  # for the main proxy to drain first:
  #   preStopSleepSeconds ≤ terminationGracePeriod - drainTimeout
  # Durations use the Go single-unit form (Ns / Nm / Nh) and are parsed via
  # the ratls-mesh.durationSeconds helper for chart-bound arithmetic.
  terminationGracePeriod: "45s"
  drainTimeout: "30s"

  # Connection limits
  maxConns: 10000
  maxConnsPerSource: 0
  idleTimeout: ""

  # TLS session cache
  sessionCacheSize: 64

  # Logging
  logLevel: info

  # Node placement
  nodeSelector: {}

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  # Iptables sync sidecar resources
  iptablesSync:
    # Local source namespaces excluded from transparent mesh interception.
    # The release namespace is intentionally NOT excluded: router's egress
    # to workload pod IPs must be intercepted to get attested mTLS, and
    # control-plane traffic dials Service VIPs the mesh never intercepts.
    # With cwInboundEnforcement, excluded sources are blocked from reaching
    # confidential-workload pods entirely, not left plaintext.
    excludeSourceNamespaces:
      - kube-system
    resyncPeriod: 30s
    watchdogPeriod: 2s
    ipsetMaxElem: 262144
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

  iptablesCleanup:
    # --keep-guard keeps the fail-closed filter guard while removing
    # interception; the sleep lets kube-endpoints drop this node first.
    preStopSleepSeconds: 5
    resources:
      requests:
        cpu: 1m
        memory: 8Mi
      limits:
        cpu: 10m
        memory: 16Mi

  # Probe timings
  probes:
    startup:
      periodSeconds: 2
      failureThreshold: 60
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 3
      failureThreshold: 3

  # --- Policies ---

  # TCP-only egress policy. On by default: the NP allows all TCP (intercepted
  # by the mesh) and DNS/53 to kube-system, and default-denies everything
  # else. The mesh's iptables egress guard is the primary non-TCP enforcement
  # (drop); this NetworkPolicy is the defence-in-depth layer. namespaces is a
  # per-namespace opt-in list; when empty the policy renders into the release
  # namespace only, and the guard covers every managed namespace regardless.
  tcpEgressPolicy:
    enabled: true
    namespaces: []

  # ValidatingAdmissionPolicy to prevent pods from running as mesh UID
  uidAdmissionPolicy:
    enabled: true

  # PrometheusRule for threat model alerting
  prometheusRules:
    enabled: false

  # Priority class for pod scheduling
  priorityClassName: system-node-critical

  networkPolicy:
    enabled: false
    monitoringNamespace: monitoring

## rke2 system workloads the seed admits argv-pinned rather than by digest
## alone. Only meaningful on cvmMode=bare-metal, where the node image bakes RKE2 and
## its local-path provisioner; other lanes do not run these pods.
rke2:
  # local-path-provisioner helper pods: the node image's baked manifest runs
  # busybox as `/bin/sh /script/{setup,teardown}` with per-PVC flags. The seed
  # pins exactly those two command prefixes — a busybox floor entry would
  # admit any command line on any pod. The digest must match the node image's
  # baked local-path-storage.yaml (a repo test pins the pair in lockstep).
  localPathHelper:
    image:
      repository: busybox
      digest: "sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d"

nriImagePolicy:
  ## Host-side NRI image admission: the installer DaemonSet. Its enabled state is
  ## bound to the cvmMode shape, not free: it MUST be true on gke/aks, where host NRI is the only allowlist gate
  ## (require_host_image_policy). On cvmMode=bare-metal it runs in its baked form
  ## (below) — the plugin comes from the node image, but only this installer
  ## carries the release's CDS pins to it. `c8s install` sets both from
  ## --cvm-mode. The bootstrapAllowlist below still feeds CDS's served seed
  ## for host NRI or the node-baked plugin.
  enabled: true
  ## Node-as-CVM (`c8s install --cvm-mode=bare-metal`, which sets this): the node image
  ## bakes the plugin binary, its containerd registration and the boot config —
  ## floor included, whose RKE2 system-image digests only the image build
  ## resolves. The installer then writes this release's cds.measurements /
  ## cds.rtmrs into that config and restarts containerd when they change,
  ## touching nothing else. Requires attestationApi.cvmMode=bare-metal
  ## (nri_baked_requires_node).
  baked: false
  ## Host Kubernetes distro for the nri-image-policy installer: k8s | rke2.
  ## Selects the containerd config layout it targets — see the subchart's
  ## values.yaml. `c8s install` sets this to the distro detected from the
  ## cluster's kubelet versions (an install with -f values owns it instead).
  distro: k8s
  image:
    repository: ghcr.io/confidential-dot-ai/nri-image-policy
    # -- Image tag. Required: the chart does not pin a default; the consumer
    #    (HelmRelease values or cluster overlay) must set tag or digest. The
    #    image must contain both the host plugin binary at
    #    /usr/local/bin/nri-image-policy and the install scripts the
    #    DaemonSet executes (install-host-plugin.sh, patch-containerd.sh).
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

  # RKE2-only containerd-prep initContainer. Runs privileged with the host
  # containerd config directory mounted to wire up the drop-in import before
  # the installer writes its NRI drop-in. The seed admits it argv-pinned
  # (the prep script verbatim), never by digest alone — a busybox floor
  # entry would admit any command line on any pod. Digest-pin this image
  # because it runs as root on every selected node.
  containerdPrep:
    image:
      repository: busybox
      tag: ""
      digest: "sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
      pullPolicy: IfNotPresent

  imagePullSecrets: []

  # Plugin name. Must match the name the binary registers with at the NRI
  # socket and the entry written to containerd's default_validator.required_plugins.
  pluginName: nri-image-policy
  # Plugin filename inside hostPaths.pluginDir. The "10-" prefix sets sort order
  # relative to other NRI plugins.
  pluginFilename: 10-nri-image-policy

  # CDS coordinates. Every plugin pulls the allowlist from the node-local CDS
  # NodePort below. The CDS image the floor self-admits comes from the top-level
  # cds.image (digest required when image policy is on), so there is no separate
  # CDS image to pin here.
  cds:
    ## Host-process NRI pulls through the chart-managed CDS NodePort and
    ## verifies CDS RA-TLS instead of trusting cluster DNS or ClusterIP routing.
    ## Empty derives https://127.0.0.1:<cds.service.nodePort>; set a full URL
    ## only to point the plugin somewhere else entirely.
    url: ""
  policy:
    # Secure by default: match the plugin binary's own default and reject images
    # not on the allowlist. Set to `audit` only for bring-up — it logs would-be
    # denials to journald and creates the container anyway, so you can populate
    # the allowlist and review the audit log before enforcing. Its effect on the
    # pod's certificate: docs/getcert-workload-binding.md, Corner 4.
    # Don't ship `audit` to production: a permissive default that only docs tell
    # you to harden leaks.
    mode: fail-closed  # fail-closed | audit
    enforceExisting: true
    denyMissingAnnotation: true
    # exemptNamespaces: on the hosted lanes (gke/aks), admit each listed
    # namespace's provider platform pods — which are not on the c8s allowlist —
    # by the image digests captured running in it, frozen at first admission and
    # scoped to that namespace. `c8s install --cvm-mode=gke|aks` sets
    # [kube-system] unless a -f file writes this key. Empty (the chart default)
    # keeps digest-only admission; leave it empty on cvmMode=bare-metal, whose baked
    # floor already carries the system digests. See
    # docs/getcert-workload-binding.md, Corner 8.
    exemptNamespaces: []
    # labelRules: Kubernetes-style label selectors evaluated against pod
    # labels at container creation time. With the host-process model there
    # is one plugin per node, so these rules apply globally on each node;
    # multi-tenant isolation needs node-level (not pod-label) partitioning
    # plus per-node values. Leaving empty disables label-based filtering.
    labelRules: []

  # Logging
  logLevel: info

  # Host paths the installer DaemonSet writes to.
  hostPaths:
    pluginDir: /opt/nri/plugins
    configDir: /etc/nri/conf.d
    cacheDir: /var/lib/nri-image-policy
    runtimeDir: /var/run/nri-image-policy

  ## The CDS-facing sandbox-digests endpoint (docs/ratls.md, "Sandbox
  ## identity"). Its port is a compiled constant, not a value: it is privileged
  ## so that binding it requires the node's network namespace, which is what
  ## distinguishes this inventory from a workload sharing the node measurement.
  ## CDS must be able to reach every node on it.
  ##
  ## The advertised host defaults to the installer's own status.hostIP, handed
  ## to the host process through a file. Override only when that is not the
  ## address CDS reaches the node on.
  sandboxDigests:
    advertiseHost: ""

  # Containerd configuration the installer targets. The config directory,
  # socket, and restart command default from distro; set the fields below only
  # for a distro the built-in values do not cover.
  containerd:
    # Empty derives from distro (k8s -> /etc/containerd,
    # rke2 -> /var/lib/rancher/rke2/agent/etc/containerd).
    configDir: ""
    # Empty derives from distro (k8s -> /run/containerd/containerd.sock,
    # rke2 -> /run/k3s/containerd/containerd.sock).
    socket: ""
    namespace: k8s.io
    # Empty derives from distro (k8s -> "systemctl restart containerd",
    # rke2 -> restart whichever of rke2-server/rke2-agent is active on the
    # node, so server/control-plane and worker nodes are both handled).
    restartCommand: ""

  refresh:
    # How often the worker plugin pulls the current allowlist from CDS. A
    # written entry keeps its previous admission verdict at container start —
    # an added entry refused, a narrowed one still admitted — for up to one
    # interval after CDS commits the write. Under `baked` the plugin runs the
    # equal value measured into the node image, which an override cannot reach.
    interval: 5s

  # --- Bootstrap allowlist ---
  # The entries the cluster needs before an operator writes anything, rendered
  # into CDS's --allowlist-seed (templates/cds.yaml) beside the chart's own
  # component entries, so CDS's served /allowlist is non-empty on the first
  # worker pull. An entry admitting a digest under any command and args also
  # lands in every plugin's base allowlist (nri-image-policy.bootConfig), so the
  # cluster can bring itself up before CDS is reachable; an entry that pins a
  # command line is seed-only.
  #
  # Everything needed to reach a Ready CDS on the CDS node and a working kubelet
  # on every node goes here as any-argv entries — the c8s component images plus
  # kube-proxy, coredns, pause/sandbox, CNI — supplied via values or `-f`
  # (resolve digests with crane/skopeo; `c8s allowlist add` writes the same
  # shape). In production you pin the full set here; deriveComponents below is
  # a demo convenience for the c8s images only.
  bootstrapAllowlist:
    # deriveComponents: a demo convenience (off by default, like
    # `c8s install --resolve-digests`, which turns it on). When true, the c8s
    # component images this chart installs (operator, cds, attestation-api,
    # ratls-mesh) are seeded and admitted whenever their image.digest is set,
    # so a digest-pinned install self-allows the c8s images without an entry
    # for each. It never covers the non-c8s system images, so production
    # installs pin the full set in `workloads` instead. nri-image-policy is
    # not derived: the chart seeds it argv-pinned, and a same-named entry
    # under `workloads` is the way to replace the pin whole.
    deriveComponents: false
    # workloads: named entries; keys are the pkg/allowlist Workload JSON fields
    # (label, initContainers, containers, digest, image, command, args, mounts,
    # env, secrets). A chart-derived component entry is named
    # "<image basename>-<first 12 hex of digest>"; an entry of the same name
    # here replaces it. Default empty.
    workloads: {}
    #   coredns:
    #     containers:
    #       - digest: sha256:...
    #         image: registry.k8s.io/coredns/coredns:v1.11.1
    #         command: {policy: any}
    #         args: {policy: any}
    #   infer:
    #     containers:
    #       - digest: sha256:...
    #         command: {policy: exact, argv: ["/bin/vllm"]}
    #         args: {policy: any}

  # --- Uninstall hook ---
  # Pre-delete DaemonSet that reverts the containerd config patch and removes
  # host artifacts. Helm waits for the DS to be Ready before continuing the
  # uninstall, so cleanup is observable. Disable to leave host artifacts in
  # place (rare; mostly forensic use).
  uninstall:
    enabled: true

  # Node affinity — exclude edge nodes by default
  nodeAffinity:
    excludeLabels: []

  # Resources for the install-DaemonSet pod itself (init container that
  # copies files and patches containerd, then sleeps idle). Not the host
  # plugin process, which runs outside K8s and has no resource limits.
  # The install init enters all host namespaces (nsenter -t 1) and spawns a
  # transient systemd unit (systemd-run) to restart containerd; that init peak
  # OOM-kills under a 64Mi limit on confidential nodes, so the limit is
  # generous. The request tracks the idle footprint the pod holds for its whole
  # life after init, not that one-time peak.
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Priority class for the install-DaemonSet pod.
  priorityClassName: system-node-critical

  # Health probe socket on the host. The host plugin listens on this unix
  # domain socket inside hostPaths.runtimeDir; the install-DaemonSet probes
  # it after install to verify the plugin came up. Unix socket avoids
  # hostNetwork and the port-conflict surface that comes with it.
  #
  # The plugin source must support binding to a unix socket via the
  # plugin.health_addr config field (rendered as "unix://<path>").
  healthSocketName: health.sock

## Node agent that opens encrypted volumes for the pods on a node
## (docs/volumes.md). Off by default: it runs privileged with hostPID and a
## writable bind of the kubelet directory, and nothing needs it until a
## workload consumes a volume.
volumed:
  enabled: false

  ## Container image. Its own debian-slim image (cmd/volumed/Dockerfile) carries
  ## cryptsetup/veritysetup, which the distroless operator image cannot. `tag`
  ## and `digest` are consumer-supplied (like every component image); `c8s
  ## install` resolves and pins the digest, which also derives it into the NRI
  ## floor so the daemon's own image is admitted.
  image:
    repository: ghcr.io/confidential-dot-ai/volumed
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

  ## Host paths the daemon works through. The socket lives in the inventory's
  ## socket directory (nriImagePolicy.hostPaths.runtimeDir), which
  ## nri-image-policy NRI-mounts into the cw pod's fetcher sidecars.
  hostPaths:
    ## Kubelet's root dir; override only when the kubelet runs a custom --root-dir.
    kubeletRoot: /var/lib/kubelet
    cgroupRoot: /sys/fs/cgroup

  ## Volumes open on one node at once. Each costs two device-mapper devices and
  ## a mount, and every confidential pod on the node can reach the socket.
  maxMounts: 64

  ## How often teardown checks which pods have gone.
  reapInterval: 15s

  imagePullSecrets: []
  priorityClassName: system-node-critical
  nodeSelector: {}
  tolerations:
    - operator: "Exists"
      effect: "NoExecute"
    - operator: "Exists"
      effect: "NoSchedule"

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

router:
  enabled: true

  ## Rollout strategy. Empty resolves by hostPort.enabled: Recreate when the
  ## node port is bound (two concurrent pods on a node would collide on the
  ## host port, and on a single-node cluster a surge pod could never schedule,
  ## deadlocking the roll; get-cert's in-process retry covers the brief
  ## restart gap), otherwise RollingUpdate with maxSurge=1/maxUnavailable=0 so
  ## the new (cert-holding) pod is Ready before the old one is retired. Any
  ## non-empty value here renders verbatim; in particular a surge strategy
  ## carried over from an older values file (the previous shipped default)
  ## deadlocks a single-node roll while hostPort is enabled, so leave this
  ## empty unless hostPort is off.
  strategy: {}

  # Host-network edge binding. When enabled, nginx's TLS listener is published
  # on the node's host port so external clients reach the front door directly
  # on the node IP (kubelet/CNI portmap DNATs the host port to the in-pod
  # unprivileged listener, so nginx needs no privileged bind). This grabs the
  # node's 443: on clusters whose ingress already owns it (notably RKE2, which
  # bundles an ingress on hostPort 80/443 — rke2-ingress-nginx through v1.35,
  # rke2-traefik from v1.36) the router pod stays
  # Pending ("didn't have free ports for the requested pod ports"); set
  # enabled: false there (reach router through its Service or your own
  # ingress) or point https at a free host port. https is the host port to
  # bind; empty derives 443.
  #
  # Availability trade-off: with the port bound the strategy auto-resolves to
  # Recreate, so every router roll drops the node-IP front door for the pod
  # restart window. For gapless rolls set
  # enabled: false and expose router through its Service instead.
  hostPort:
    enabled: true
    https: ""

  # -- Public hostnames for the front door, as a list. Empty defaults to the
  # chart-managed Service DNS name: <release>-router.<namespace>.svc. Every entry
  # becomes an nginx server_name, so one router can answer on several hostnames
  # the serving cert (publicTLS) covers. The FIRST entry is the single identity
  # on the CDS-issued mesh cert — pin it in cds.dnsSanPatterns; the rest widen
  # only server_name and need no dnsSanPatterns entry.
  san: []

  # -- Upstream backend the front door proxies to. No default, and exactly two
  # safe shapes: an adopted confidential workload's headless Service
  # (c8s-<id>.<ns>.svc.cluster.local:<port>, which `c8s install --upstream <id>`
  # fills in here from the ref's :<port>) so the pod-IP hop is wrapped in the
  # node mesh's attested mTLS (this is how a confidential workload like vllm is
  # reached, over plaintext http the mesh secures); otherwise a manual address
  # must be https with tls.verify=true, an upstream that terminates and
  # authenticates TLS itself (app-TLS). A plaintext http or unverified-https
  # manual address fails the render (kind=router_unsecured_upstream): the chart
  # cannot confirm it resolves to pod IPs the mesh intercepts and there is no
  # acknowledgment to override that.
  upstream:
    # -- Host and port of the upstream service. A c8s-<id>.<ns>.svc.cluster.local
    # headless-Service address (what `c8s install --upstream` derives) is
    # recognized as mesh-wrapped and may be plaintext http; any other address
    # must be https + verify. See validations.yaml.
    address: ""
    # -- Protocol for the upstream connection (http or https).
    protocol: http
    tls:
      # -- Present the CDS-issued certificate to HTTPS upstreams.
      useCDSClientCert: true
      # -- Verify the HTTPS upstream's certificate chain against trustedCAPath.
      verify: true
      # -- Maximum upstream server certificate chain depth nginx will verify when
      # upstream.tls.verify=true. Increase for private PKI chains with more
      # intermediates between the upstream leaf and trusted CA bundle.
      verifyDepth: 2
      # -- SNI/verification name for the HTTPS upstream. Must match the upstream
      # cert SAN. Empty defaults to the address host.
      serverName: ""
      # -- CA file nginx verifies the upstream against. Defaults to the get-cert
      # output at <tlsMountPath>/cert.pem, which CDS returns as leaf+CA chain, so
      # CDS-issued upstream certs verify out of the box. Set to
      # <meshCA.mountPath>/<meshCA.key> (and provide that ConfigMap) or another
      # path for a different upstream.
      trustedCAPath: /tls/cert.pem

  # -- Publish CDS's complete /allowlist API through the router front door.
  # The built-in route uses an in-pod loopback proxy that verifies the
  # chart-managed CDS Service's RA-TLS evidence; nginx forwards the original
  # method, URI, body, and Authorization header unchanged. Reads remain
  # unauthenticated at CDS.
  # Writes still require the short-lived, body-bound operator token minted by
  # `c8s allowlist --operator-key`; the private key never enters the cluster.
  #
  # An explicit router.routes entry at /allowlist or /allowlist/ takes precedence
  # for backwards compatibility. Set enabled: false to remove the built-in
  # public route entirely.
  allowlist:
    enabled: true
    # -- Loopback port for the RA-TLS-verifying allowlist proxy. This is not a
    # pod or Service port and is reachable only inside the router pod.
    proxyPort: 8801
    # -- nginx write limiting, per public client and in aggregate across all
    # clients. The aggregate bound protects the single per-source-IP CDS
    # bucket the whole front door shares (see docs/operator.md, "Built-in
    # allowlist route"). The chart requires requestsPerSecond/burst <=
    # totalRequestsPerSecond/totalBurst < cds.rateLimit/rateBurst. GET, HEAD,
    # and OPTIONS are exempt here (see readRateLimit).
    rateLimit:
      requestsPerSecond: 1
      burst: 5
      totalRequestsPerSecond: 8
      totalBurst: 15
    # -- Per-public-client read (GET/HEAD) limiting; generous by default to
    # bound unauthenticated read pressure on CDS. OPTIONS is exempt.
    readRateLimit:
      requestsPerSecond: 20
      burst: 40
    # -- Container resources for the allowlist proxy.
    resources: {}

  # -- Additional path routes proxied before the default upstream backend.
  # Useful for preserving control-plane endpoints while the catch-all route
  # points at an inference backend.
  routes: []
    # - path: /allowlist
    #   match: exact  # exact | prefix (default)
    #   backend:
    #     # A route backend must be https with tls.verify: true (app-TLS): the
    #     # chart cannot confirm a plaintext http or unverified-https address
    #     # resolves to pod IPs the node mesh wraps, so it fails the render
    #     # (kind=router_unsecured_route). A confidential workload is reached via
    #     # router.upstream (the --upstream flow), not a route.
    #     address: cds.default.svc.cluster.local:8443
    #     protocol: https
    #     tls:
    #       useCDSClientCert: true
    #       verify: true
    #       verifyDepth: 2
    #       serverName: cds.default.svc.cluster.local
    #       trustedCAPath: ""
    #   cors:
    #     enabled: false  # opt this route out of the global CORS block

  # -- CORS headers added to every proxied location (the catch-all upstream and
  # each entry in `routes`) and to the discovery endpoints (`discovery.path`,
  # `discovery.cdsCertPath`, `discovery.meshCAPath`) so browser clients can
  # bootstrap the attested TLS handshake. The internal /healthz endpoint is
  # never affected. Upstream pass-through: if the upstream emits
  # Access-Control-Allow-Origin on a non-preflight response, router forwards
  # the upstream's CORS header set verbatim and suppresses its own — browsers
  # never see duplicate headers. If the upstream emits no CORS headers,
  # router injects the configured ones below. Preflight `OPTIONS` requests
  # are short-circuited at nginx with a 204 response using router's policy
  # (they never reach the upstream). Per-route opt-out: set
  # `routes[i].cors.enabled: false` to disable CORS on that route while
  # leaving the global block enabled. Only the `enabled` key is honored on a
  # per-route cors block.
  #
  # Independent of this block, the c8s protocol-owned endpoints
  # (/.well-known/c8s/*, the discovery document and certificate endpoints,
  # and the built-in /allowlist route) serve wide-open CORS by default —
  # see `protocolEndpoints` below.
  cors:
    enabled: false
    # -- Wide-open CORS (Access-Control-Allow-Origin "*", no credentials) on
    # the c8s protocol-owned endpoints only: /.well-known/c8s/*, the
    # discovery document and certificate endpoints, and the built-in
    # /allowlist route. On by default because those endpoints exist to be
    # verified by any browser anywhere: responses are self-authenticating
    # (hardware evidence, CDS-signed certificates, sealed tunnel records) or
    # public by design, and no request relies on ambient browser credentials
    # (allowlist mutations are operator-signed). An origin allowlist there
    # cannot protect anything and only breaks third-party verifiers. Workload
    # locations (`routes` and the catch-all upstream) are never affected by
    # this flag. Ignored while `enabled` is true — the operator policy below
    # then covers every location, protocol endpoints included.
    protocolEndpoints: true
    # -- Allowed Origin values. Use ["*"] to allow any origin (cannot be
    # combined with allowCredentials: true; browsers reject that pairing).
    # Otherwise list exact origins; the request Origin header is echoed back
    # only when it matches an entry in this list.
    allowOrigins: []
    # -- Methods advertised in Access-Control-Allow-Methods.
    allowMethods: ["GET", "POST", "OPTIONS"]
    # -- Headers advertised in Access-Control-Allow-Headers. X-C8s-Session is
    # sent by browser clients on the /tunnel request, so it must be allowed for
    # the over-encrypted channel to work cross-origin.
    allowHeaders: ["Authorization", "Content-Type", "X-C8s-Session"]
    # -- Headers advertised in Access-Control-Expose-Headers. Always emitted
    # by router (and merged in front of the upstream's value in pass-through
    # mode) so browsers can read these headers from JS regardless of what
    # the upstream advertises.
    exposeHeaders: []
    # -- Sets Access-Control-Allow-Credentials: true when enabled.
    allowCredentials: false
    # -- Seconds browsers may cache the preflight response.
    maxAge: 600

  # -- Public TLS credential presented to internet clients. mode selects it:
  # cds (default) serves the CDS-issued mesh leaf at tlsMountPath; webpki
  # serves the operator Secret named by secretName (host-visible key, so the
  # front door is attest-pq only); acme has the in-pod `c8s acme` sidecar
  # issue a multi-SAN leaf for the san list (TEE-held key — requires
  # attestationApi.cvmMode=bare-metal).
  # secretName/certKey/keyKey/mountPath apply to webpki only.
  publicTLS:
    mode: cds
    secretName: ""
    certKey: tls.crt
    keyKey: tls.key
    mountPath: "/public-tls"

  # -- ACME issuance (publicTLS.mode=acme). The sidecar answers HTTP-01 behind
  # nginx's :80 server and SIGHUPs nginx on install. Empty directoryURL is
  # Let's Encrypt production; point it at the staging URL for tests — key and
  # state live on a Memory emptyDir, so every pod recreation re-issues and
  # counts against LE duplicate-certificate limits.
  # Reachability: the CA must reach :80/:443 at the sanList names, so DNS
  # points at either service.type=LoadBalancer (any implementation: cloud
  # controller, MetalLB, kube-vip, ...) or, without one, the node via
  # hostPort. ClusterIP-only fails render.
  acme:
    email: ""
    directoryURL: ""

  # -- Discovery/preflight metadata (the issued cert + attestation evidence
  # with the VCEK chain) served by nginx at `path`. The chart-rendered get-cert
  # containers write it with the matching --discovery-* args. nginx serves it
  # over the public serving port with no client cert, so an unattested client
  # (`c8s verify <lb>`, c8s-verify-js) can fetch it — reach it on the public
  # LoadBalancer/host address, not the meshed in-cluster ClusterIP.
  discovery:
    enabled: true
    path: "/v1/discovery"
    mountPath: "/discovery"
    fileName: "discovery.json"
    cdsCertPath: "/.well-known/cds-cert.pem"
    meshCAPath: "/.well-known/mesh-ca.pem"

  # -- Mesh CA bundle exposed for demo preflight clients. Defaults match the
  # chart-managed c8s CDS ConfigMap name.
  meshCA:
    # -- Serve and advertise the mesh CA PEM at the discovery meshCAPath when
    # discovery is enabled. The bundle is written by the injected get-cert
    # (--ca-out) into the shared cert volume alongside the leaf, so no separate
    # ConfigMap or mount is required.
    expose: true

  imagePullSecrets: []

  certProvisioning:
    # -- Enable verbose (debug) logging for the chart-rendered c8s-cert sidecar.
    verbose: false
    # -- How often the c8s-cert sidecar renews the TLS certificate and SIGHUPs
    #    nginx. Must be shorter than the cert TTL issued by CDS.
    renewInterval: "1h"
    # -- How often the c8s-cert sidecar checks that the mesh CA it serves at
    #    the discovery endpoints still matches the CA CDS currently holds,
    #    renewing immediately when it does not. A CDS restart regenerates the
    #    mesh CA in-memory, so without this the pod serves the dead CA (and a
    #    discovery document chained to it) until the next scheduled renewal.
    #    "0" disables the check.
    caWatchInterval: "1m"

  # -- Attestation + over-encryption sidecar (the c8s-verify protocol). When
  # enabled, an in-pod `c8s cds-attest` container serves the *dynamic*
  # client-facing endpoints (the attest-pq attestation + X-Wing key exchange,
  # the attest-lb per-session challenge, and the over-encrypted tunnel) and nginx
  # reverse-proxies `/.well-known/c8s/` to it on loopback. The static CDS/mesh-CA certs are still served by nginx via
  # `discovery`. The browser client is lunal-dev/c8s-verify-js (wire contract:
  # c8s-verify-js/PROTOCOL.md).
  #
  # On by default: the sidecar only publishes a signed quote of its own TEE, so
  # exposing it does not weaken the server. Trust is established on the CLIENT,
  # which must pin expected launch measurements (`c8s verify --measurements`,
  # c8s-verify-js config) — an unpinned verifier accepting any TEE is a client
  # misconfiguration, not a server exposure. `platform`/`generation` below default
  # to AMD; `c8s install` overrides them from --hardware-platform (tdx blanks the
  # AMD-only generation), so both TEEs advertise correctly out of the box.
  attest:
    enabled: true
    # -- Loopback port the sidecar listens on; nginx proxies `/.well-known/c8s/`
    # to 127.0.0.1 on this port.
    port: 8800
    # -- TEE platform and AMD processor generation advertised to the browser
    # WASM verifier.
    platform: snp
    generation: genoa
    # -- Attestation-api URL the sidecar binds each session's key exchange
    # against. Empty defaults to this chart's attestation-api.
    attestationApiURL: ""
    # -- Workload-verified ingress gate: when set to an allowlist entry name,
    # the sidecar serves /readyz as 200 only while the installed mesh identity
    # leaf is a usable credential carrying a matched-workload stamp with
    # exactly this name, and the chart wires a readinessProbe on the cds-attest
    # container (an HTTPS httpGet through nginx, which proxies /readyz to the
    # sidecar's loopback port), so ingress withholds traffic while the front
    # door's committed mesh identity is unnamed. Setting it also switches the
    # router get-cert onto the workload-claims flow (inventory socket mount +
    # supplemental group on node-CVM) — without that
    # no stamp could ever arrive and the gate would hold the front door at 503
    # forever. The named entry must match the router pod's own non-injected
    # container set (nginx).
    #
    # Requires attest.enabled and hostPort.enabled: false — readiness only
    # withdraws Service endpoints, while a hostPort is published by the CNI
    # portmap plugin independently of pod readiness, so the gate would withhold
    # nothing. The chart fails the render on either mistake. Empty keeps
    # today's always-ready behavior.
    expectedWorkload: ""
    # -- Container resource requests/limits for the sidecar.
    resources: {}

  nginx:
    image:
      repository: nginxinc/nginx-unprivileged
      # Resolve nginxinc/nginx-unprivileged:1.30.5-alpine-slim to bump this digest.
      digest: "sha256:c2c3905bda3dc8de80023e19bed0a45745279d26e5586cdee64370c8f9b12348"
      tag: ""
      pullPolicy: IfNotPresent
    # -- Number of nginx replicas.
    replicas: 1
    # -- HTTPS port nginx listens on. Unprivileged (>=1024) because nginx runs
    #    non-root with a dropped-capability securityContext and cannot bind a
    #    privileged port. The Service presents 443 and forwards to this port
    #    (targetPort references the named `https` port), so public 443 is
    #    unaffected; front it with a LoadBalancer for external ingress.
    httpsPort: 8443
    # -- DNS server nginx queries to re-resolve a mesh-wrapped catch-all
    #    upstream at request time (per record TTL). Only the adopted-workload
    #    headless Service is dialed that way: its pod IPs change on pod churn,
    #    so a static upstream block would pin the IPs seen at startup and 502
    #    until the next config reload. Every other upstream address is static
    #    and this value is unused (no resolver directive is rendered at all).
    #    The name itself is resolved once at nginx startup through the pod's
    #    /etc/resolv.conf, and nginx exits (crash-loops) if it does not
    #    resolve. Empty derives from the distro values
    #    (nriImagePolicy.distro): rke2 ->
    #    rke2-coredns-rke2-coredns.kube-system, else kube-dns.kube-system.
    #    Set explicitly on clusters whose DNS Service is named differently.
    resolver: ""
    # -- UID/GID used by nginx and the get-cert containers so both can access
    #    the in-memory CDS key material on the shared tls-certs volume.
    runAsUser: 101
    runAsGroup: 101
    runAsNonRoot: true
    resources: {}

  service:
    # -- Service type. Set to LoadBalancer to expose the listener publicly
    # (e.g. on AKS/GKE), with annotations below for cloud-LB specifics.
    type: ClusterIP
    port: 443
    # -- externalTrafficPolicy for LoadBalancer/NodePort Services. Empty picks
    # Local while the built-in /allowlist route or the attestation sidecar
    # renders (their limiters key on nginx's public peer address, which Cluster
    # would SNAT away) and Cluster otherwise. Local delivers traffic only
    # through nodes running the router pod; set Cluster explicitly if your LB
    # cannot health-check nodes, and every client behind a node then shares one
    # budget and one per-client bound: 512 concurrent attestation sessions for
    # that whole node, past which any one client's traffic refuses new sessions
    # for every other client behind it.
    externalTrafficPolicy: ""
    # -- Optional annotations on the Service. Use the provider's LB annotation to
    # pin a static IP (e.g. networking.gke.io/load-balancer-ip-addresses on GKE,
    # service.beta.kubernetes.io/azure-pip-name on AKS); the deprecated
    # spec.loadBalancerIP field is intentionally not exposed.
    annotations: {}

  # -- Volume mount path for the CDS-issued TLS certificate and key shared
  # between get-cert and nginx.
  tlsMountPath: "/tls"

## Common pod-level security knobs.
podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
