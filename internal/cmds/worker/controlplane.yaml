# What a cluster of workers holds for them beyond c8s's chart (c8s worker
# control-plane render): the static pods' grants, which their node's kubelet
# credentials carry, so every node holds them (CoreDNS needs nothing
# c8s-worker-cilium does not grant); the Cilium operator's, which runs beside
# the control plane as the user c8s-cilium-operator, since NodeRestriction
# keeps node credentials from its leader lease; and the kube-dns Service in
# front of the workers' CoreDNS, at the document's clusterDNS. Every worker
# runs CoreDNS, so a lookup stays on its node.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c8s-worker-cilium
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - endpoints
  - namespaces
  - nodes
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cilium.io
  resources:
  - ciliumbgpadvertisements
  - ciliumbgpnodeconfigs
  - ciliumbgppeerconfigs
  - ciliumbgppeeringpolicies
  - ciliumcidrgroups
  - ciliumclusterwideenvoyconfigs
  - ciliumclusterwidenetworkpolicies
  - ciliumegressgatewaypolicies
  - ciliumendpoints
  - ciliumendpointslices
  - ciliumenvoyconfigs
  - ciliumidentities
  - ciliuml2announcementpolicies
  - ciliumloadbalancerippools
  - ciliumlocalredirectpolicies
  - ciliumnetworkpolicies
  - ciliumnodeconfigs
  - ciliumnodes
  - ciliumpodippools
  verbs:
  - list
  - watch
- apiGroups:
  - cilium.io
  resources:
  - ciliumendpoints
  - ciliumidentities
  - ciliumnodes
  verbs:
  - create
- apiGroups:
  - cilium.io
  resources:
  - ciliumidentities
  verbs:
  - update
- apiGroups:
  - cilium.io
  resources:
  - ciliumendpoints
  verbs:
  - delete
  - get
- apiGroups:
  - cilium.io
  resources:
  - ciliumnodes
  - ciliumnodes/status
  verbs:
  - get
  - update
- apiGroups:
  - cilium.io
  resources:
  - ciliumbgpnodeconfigs/status
  - ciliumendpoints
  - ciliumendpoints/status
  - ciliuml2announcementpolicies/status
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-worker-cilium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c8s-worker-cilium
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: 'system:nodes'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c8s-worker-kube-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:node-proxier'
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: 'system:nodes'
---
