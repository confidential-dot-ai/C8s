                              source: /run/c8s-node
                              readOnly: true
                            - destination: /tmp
                              kind: emptyDir
                            - destination: /usr/lib/c8s/router-nginx
                              kind: host
                              source: /usr/lib/c8s/router-nginx
                              readOnly: true
                            - destination: /var/cache/nginx
                              kind: emptyDir
                            - destination: /var/lib/c8s-tunnel-body
                              kind: emptyDir
                      env:
                        policy: match
                        variables:
                            DYNPKG_RELEASE:
                                exact: "1"
                            HOSTNAME:
                                present: true
                            KUBERNETES_PORT:
                                present: true
                            KUBERNETES_PORT_443_TCP:
                                present: true
                            KUBERNETES_PORT_443_TCP_ADDR:
