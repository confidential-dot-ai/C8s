                                exact: "443"
                            KUBERNETES_SERVICE_PORT_HTTPS:
                                exact: "443"
                            NGINX_VERSION:
                                exact: 1.30.6
                            PATH:
                                exact: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                            PKG_RELEASE:
                                exact: "1"
