                containers:
                    - digest: sha256:5d8bb9437d74a600ec5dbf90c035451c724dc33eac8d3a71078f6f8612c345f6
                      image: nginxinc/nginx-unprivileged@sha256:5d8bb9437d74a600ec5dbf90c035451c724dc33eac8d3a71078f6f8612c345f6
                      command:
                        policy: exact
                        argv:
                            - /bin/sh
                            - /usr/lib/c8s/router-nginx/reload.sh
                      args:
                        policy: deny
                      mounts:
                        policy: exact
                        rules:
                            - destination: /discovery
                              kind: emptyDir
                            - destination: /etc/c8s-acme-key
                              kind: emptyDir
                            - destination: /etc/c8s-acme-tls
                              kind: emptyDir
                            - destination: /etc/c8s/certs
                              kind: emptyDir
