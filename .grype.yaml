# For the C8s router configuration, also pass --vex .grype/c8s-router-openssl.openvex.json.
ignore:
  # CVE-2026-4738 affects optional Deflate64 code in contrib/infback9/inftree9.c.
  # Alpine's shared-libz build excludes it; the pinned amd64/arm64 libz exports
  # neither inflateBack9* nor inflate_table9.
  # Upstream: https://github.com/madler/zlib/releases/tag/v1.4
  # Remove when the router image ships zlib >= 1.4-r0.
  - vulnerability: CVE-2026-4738
    reason: The affected contrib/infback9 code is absent from this zlib package.
    package:
      name: zlib
      version: 1.3.2-r1
      type: apk
  # Alpine 3.24 still ships OpenSSL 3.5.9-r0, which the advisories below
  # affect. Nothing in the image that links OpenSSL (nginx, nginx-debug,
  # ssl_client, libapk) imports a CMS or PKCS#7 function, looks a cipher up by
  # name, resolves DANE TLSA records, reads PEM into an existing X509_INFO
  # stack or uses OpenSSL's QUIC stack. nginx has its own QUIC code, takes only
  # the TLS handshake from OpenSSL, and the router configuration listens on no
  # QUIC port. Remove when the router image includes a patched openssl package.
  - vulnerability: CVE-2026-88823
    reason: AES-GCM-SIV is not a TLS cipher and nothing in the image selects it.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
  - vulnerability: CVE-2026-95692
    reason: AES-GCM-SIV is not a TLS cipher and nothing in the image selects it.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
  - vulnerability: CVE-2026-95691
    reason: Affects OpenSSL's QUIC client only, which nothing in the image uses.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
  - vulnerability: CVE-2026-107496
    reason: Affects CMS encryption only, which TLS does not use and nothing in the image calls.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
  - vulnerability: CVE-2026-124709
    reason: Affects OpenSSL's QUIC server, which nothing in the image uses.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
  - vulnerability: CVE-2026-107494
    reason: Affects OpenSSL's QUIC stack, which nothing in the image uses.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
  - vulnerability: CVE-2026-121482
    reason: Affects CMS and PKCS#7 SignedData verification, which nothing in the image calls.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
  - vulnerability: CVE-2026-84786
    reason: Affects DANE-enabled TLS clients; nginx and ssl_client resolve no TLSA records.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
  - vulnerability: CVE-2026-107493
    reason: Affects callers that pass an existing stack to PEM_X509_INFO_read_bio_ex; nginx does not, and OpenSSL's own loaders do not.
    package:
      upstream-name: openssl
      version: 3.5.9-r0
      type: apk
