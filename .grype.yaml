ignore:
  # Remove when the router image includes a patched zlib package.
  - vulnerability: CVE-2026-85091
    reason: Router nginx uses only zlib's deflate/inflate APIs.
    package:
      name: zlib
      version: 1.3.2-r0
      type: apk
  # Remove when the router image includes pcre2 >= 10.49 (no nginx-unprivileged
  # alpine-slim tag carries it as of 2026-10-02).
  - vulnerability: CVE-2026-103111
    reason: Needs an attacker-controlled regex pattern. Router nginx compiles only patterns from its chart-rendered, image-measured config; request data is a subject, never a pattern.
    package:
      name: pcre2
      version: 10.48-r0
      type: apk
